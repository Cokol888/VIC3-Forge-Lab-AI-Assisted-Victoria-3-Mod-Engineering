SKY_1_1_SP_GUIDE_BTN1: "$SKY_DEFAULT_TITLE$!\nBevor du beginnst, erklärt Xier dir die Klicklogik der Buttons. #P Linksklick#! auf einen Button fügt einen Effekt hinzu. Fahre mit der Maus über einen Button, um Details zu sehen. Wenn der hinzugefügte Effekt ein $concept_modifier$ ist, kannst du ihn mit #N Rechtsklick#! entfernen. Die meisten Buttons unterstützen Tastenkombinationen. Halte eine Taste gedrückt und klicke dann mit links auf den Button.\N@innovation!Normalerweise nutzt #p Linksklick#! einen Wert, den $xier$ für nützlich und vernünftig hält. #BLUE Shift#! liefert einen hundertfachen oder noch höheren Wert. #COLOR:{0.3686,0.3961,0.7216} Alt#! liefert einen kleineren Wert für präzise Anpassungen. #GOLD Strg#! wendet meist den gegenteiligen Effekt an."
SKY_1_1_SP_GUIDE_BTN2: "Die meisten Markierungsfunktionen unterstützen #BOLD nur ein Ziel gleichzeitig#!. Das gilt auch für Waren- und Firmenmarkierungen auf dieser Seite. Der Regler auf der ersten Seite kann Einkommen anpassen. #I Klicke#! auf den Regler, um den gewünschten Wert zu wählen, und klicke danach unten auf den Bestätigungsbutton. Um einen Modifikator zu entfernen, #N klicke mit rechts#! darauf oder setze den Regler auf #n 0#!."
SKY_1_1_SP_GUIDE_BTN3: "Für einheimische oder im Exil befindliche Charaktere klicke mit rechts auf den Charakter und wähle im Pop-up-Menü #yellow $sakuya_mark_character$#!, um ihn zu markieren. Für ausländische Charaktere musst du zuerst das Zielland markieren, dann auf dieser Seite #YELLOW $SKY_B3_CHAR_MARK_OPEN$#! finden und im Pop-up-Ereignis den Charakter auswählen, den du markieren möchtest."
SKY_1_1_SP_GUIDE_BTN4: "#yellow $SKY_B4_TAKE_MARKED_NAVY_SHIPS$#! und #yellow $SKY_1_1_B4_BTN_DESTROY_SHIPS$#! erfordern zuerst eine markierte Flotte. Halte #BLUE Shift#! und klicke auf #yellow $SKY_R4_MARK_ARMY$#!, um über das Pop-up-Ereignis eine Flotte zum Markieren auszuwählen.\NBeim Starten eines Diplomatenspiels oder Krieges musst du bestätigen, dass das Kriegsziel gültig ist. Wenn die Bedingungen nicht erfüllt sind, kann die Aktion fehlschlagen. Ähnliche Fälle gibt es auch bei anderen Funktionen von $CMP$."
SKY_1_1_SP_GUIDE_BTN5: "Wie andere Markierungssysteme in $CMP$ wird die in $SKY_B5_SUBSEC_1$ markierte $concept_interest_group$ von anderen Änderungsoptionen referenziert. Die gewählte Interessengruppe hebt einige Funktionen hervor, die zuerst eine markierte Interessengruppe erfordern, zum Beispiel das Ändern der Interessengruppe von $sakuya_mark_character$. In den meisten Fällen wird empfohlen, nur eine $concept_interest_group$ auszuwählen."
SKY_1_1_SP_GUIDE_BTN6: "Klicke mit rechts auf einen Staat, den du besitzt, und wähle im Menü #yellow $decree_sakuya_mark_state$#!, um den $state$ zu markieren, den du anpassen möchtest. Du kannst auch unten unter #i $concept_political_lens$#! und $mm_issue_decree_interaction$ #yellow $decree_sakuya_mark_state$#! wählen, um auf der Karte leichter zu markieren. Um einen fremden Staat zu markieren, klicke mit rechts auf das Zielland und wähle #yellow $sakuya_mark_foreign_state$#!.\N#T #N Es wird dringend empfohlen, immer nur einen Ort gleichzeitig zu markieren!#!#!"
SKY_1_1_SP_GUIDE_BTN6_tab4: "Nachdem du im Gebäudewähler die Gebäudekategorie ausgewählt hast, die du anpassen möchtest, wird unten links im Menü das aktuell gewählte Gebäude angezeigt. Wähle zuerst mit $decree_sakuya_mark_state$ den Ziel-$state$, klicke dann auf den Regler, um den gewünschten Wert einzustellen, und klicke danach auf #yellow $SKY_B6_BUILD_ADD_BUILDING$#!. Die Stufe #n 0#! entfernt dieses Gebäude oder Ressourcenpotenzial. Ob Gebäude und Ressourcenpotenzial erfolgreich hinzugefügt werden können, hängt von #N Technologie#! und anderen Bedingungen des Spielers oder Ziellandes ab.\NGebäude der Kategorien $SKY_B6_BUILD_CAT_RESOURCE$ und $SKY_B6_BUILD_CAT_AGRICULTURE$ unterstützen außerdem #yellow $SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL$#!."
SKY_1_1_SP_GUIDE_BTN6_tab5: "\NAuf dieser Seite zielen alle Modifikatoren auf $concept_buildings$, außer #yellow $SKY_B6_RESERVED_BUILD_R2_C1$#! und #yellow $SKY_B6_RESERVED_BUILD_R2_C2$#!, deren Modifikatoren auf den $state$ zielen. Du musst auf die geänderten $concept_buildings$ klicken, bevor du den entsprechenden $concept_modifier$ sehen kannst."
SKY_1_1_SP_GUIDE_BTN7: "\NKlicke mit rechts auf das Land, das du markieren möchtest, und wähle #yellow $sakuya_mark_country$#!, um es zu markieren. Du kannst auch unten unter #i $concept_diplomatic_lens$#! und $concept_diplomatic_actions$ #yellow $sakuya_mark_country$#! wählen, um auf der Karte leichter zu markieren."
 SKY_1_1_SP_GUIDE_BTN8: "\N\N#yellow $SKY_BTN8_TAB_TECHNOLOGY$#! sammelt $concept_technology$-bezogene Modifikatoren; nutze die Registerkarten oben, um zwischen $production$, $military$und $society$. Die meisten Schaltflächen entsprechen den Standardregeln für große und kleine Schaltflächen, und ein Rechtsklick löscht die entsprechende $concept_modifier$.\N\Nund #yellow $SKY_BTN8_TAB_CULTURE$#!, klicken Sie auf #yellow $SKY_B8_CULTURE_MARK$#! zum Öffnen $SKY_1_2_CULTURE_INDEX_TITLE$#!. Wählen Sie ein Ziel aus $concept_culture$ in der $concept_culture$ Selektor, und verwende ihn dann für $concept_primary_cultures$, $concept_homelands$sowie weitere Kulturveranstaltungen."
SKY_1_1_SP_GUIDE_BTN9: "\nVersuche, eine Sekunde lang mit der Maus über den großen Titel von $CMP$ zu fahren...?\n@innovation!Verschiedene Hintergrundbilder zeigen verschiedene Inhalte."
SKY_1.1_CLOSE: "Zum Schließen klicken."
