 SKY_B7_TT_AI_STRATEGY_GREAT_REFORMS: "#T $ai_strategy_great_reforms$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ sucht Reformen, die radikal, aber für das Land notwendig sind.#!"
