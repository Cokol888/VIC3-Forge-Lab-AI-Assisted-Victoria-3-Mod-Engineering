SKY_1_1_B7_TT_FORM_CHANGE_TAG: "#BOLD Dein Land zu einem neuen Land ändern#!\n$SKY_line$\n$SKY_LC$ Ändert dein Land zum gewählten TAG und übernimmt dessen Kultur und Staatsreligion.\n$SKY_RC$ Ändert dein Land nur zum gewählten TAG."
