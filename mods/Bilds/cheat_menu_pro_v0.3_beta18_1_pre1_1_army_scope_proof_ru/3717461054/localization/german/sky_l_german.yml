 SKY_B7_TT_TR_SUPPORT_INDEPENDENCE: "#BOLD $support_independence$#!\n#lore $request_support_independence_desc$#!\n$SKY_line$\n$SKY_LC$ $SKY_SELF_COUNTRY$ unterstützt die Unabhängigkeit von $SKY_TARGET_COUNTRY$\n$SKY_RC$ Diesen Vertragstyp entfernen"
