 SKY_UPDATE_LOG_V1_TEXT: "- Erstversion veröffentlicht\n- Navigationsleistensystem aus EU5 portiert\n- 9 Funktionskategorien mit je 12 reservierten Buttons\n- Info-Seite enthält Änderungslog, Personalisierung und Infos\n- Unterstützt chinesische Kurzzeichen"
