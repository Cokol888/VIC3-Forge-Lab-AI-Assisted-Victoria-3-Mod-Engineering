 SKY_B6_POPMIG_TT_NATIONAL: "#BOLD $SKY_B6_POPMIG_NATIONAL$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ 20% der Bevölkerung von $SKY_MARKED_COUNTRY$ in eingegliederte $concept_state$s von $SKY_SELF_COUNTRY$ verschieben.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nEin Land muss zuerst markiert sein.\N#lore Jede Pop versucht, zufällig auf gültige Staaten verteilt zu werden. Gleiches unten.#!"
 SKY_B6_POPMIG_TT_NATIONAL_REV: "#BOLD $SKY_B6_POPMIG_NATIONAL$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ 20% der Bevölkerung von $SKY_SELF_COUNTRY$ in eingegliederte $concept_state$s von $SKY_MARKED_COUNTRY$ verschieben.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nEin Land muss zuerst markiert sein."
 SKY_B6_POPMIG_TT_TO_STATE: "#BOLD $SKY_B6_POPMIG_TO_STATE$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ 20% der Bevölkerung von $SKY_MARKED_COUNTRY$ in markierte $concept_state$s von $SKY_SELF_COUNTRY$ verschieben.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nErfordert zuerst ein markiertes Land und mindestens einen markierten $concept_state$ in $SKY_SELF_COUNTRY$."
 SKY_B6_POPMIG_TT_TO_STATE_REV: "#BOLD $SKY_B6_POPMIG_TO_STATE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ 20% der Bevölkerung von $SKY_SELF_COUNTRY$ in markierte $concept_state$s von $SKY_MARKED_COUNTRY$ verschieben.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nErfordert zuerst ein markiertes Land und mindestens einen markierten $concept_state$ in diesem Land."
 SKY_B6_POPMIG_TT_SAME_CULTURE: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ 20% der Bevölkerung in $SKY_MARKED_COUNTRY$, die zu Primärkulturen von $SKY_SELF_COUNTRY$ gehört, in markierte $concept_state$s von $SKY_SELF_COUNTRY$ verschieben.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_SAME_CULTURE_REV: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nBevölkerung in $SKY_SELF_COUNTRY$, die zu Primärkulturen von $SKY_MARKED_COUNTRY$ gehört, nach $SKY_MARKED_COUNTRY$ verschieben.\n$SKY_LC$ 20%, verteilt auf eingegliederte $concept_state$s des Ziellands.\n$SKY_AL$ 5%, verteilt auf eingegliederte $concept_state$s des Ziellands.\n$SKY_CL$ 50%, verteilt auf eingegliederte $concept_state$s des Ziellands.\n$SKY_SL$ 33%, in markierte $concept_state$s des Ziellands verschoben.\n$SKY_RC$ 100%, verteilt auf eingegliederte $concept_state$s des Ziellands."
 SKY_B6_POPMIG_TT_NON_PRIMARY: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nBevölkerung nicht primärer Kultur von $SKY_SELF_COUNTRY$ nach $SKY_MARKED_COUNTRY$ verschieben.\n$SKY_LC$ 20%, verteilt auf eingegliederte $concept_state$s des Ziellands.\n$SKY_AL$ 5%, verteilt auf eingegliederte $concept_state$s des Ziellands.\n$SKY_CL$ 50%, verteilt auf eingegliederte $concept_state$s des Ziellands.\n$SKY_SL$ 33%, in markierte $concept_state$s des Ziellands verschoben.\n$SKY_RC$ 100%, verteilt auf eingegliederte $concept_state$s des Ziellands."
 SKY_B6_POPMIG_TT_NON_PRIMARY_REV: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ 20% der Bevölkerung nicht primärer Kultur von $SKY_MARKED_COUNTRY$ in markierte $concept_state$s von $SKY_SELF_COUNTRY$ verschieben.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_POINT: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ 20% der Bevölkerung in markierten $concept_state$s von $SKY_MARKED_COUNTRY$ in markierte $concept_state$s von $SKY_SELF_COUNTRY$ verschieben.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n Es wird empfohlen, dass beide Seiten nur einen Staat markieren. Bei mehreren Marken wählt das Skript zufällig ein Ziel aus gültigen Staaten.#!"
 SKY_B6_POPMIG_TT_POINT_REV: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ 20% der Bevölkerung in markierten $concept_state$s von $SKY_SELF_COUNTRY$ in markierte $concept_state$s von $SKY_MARKED_COUNTRY$ verschieben.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n Es wird empfohlen, dass beide Seiten nur einen Staat markieren. Bei mehreren Marken wählt das Skript zufällig ein Ziel aus gültigen Staaten.#!"
 SKY_B6_POPMIG_TT_LOW_ACCEPTANCE: "#BOLD $SKY_B6_POPMIG_LOW_ACCEPTANCE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nBevölkerung der zwei niedrigsten Akzeptanzstufen von $SKY_SELF_COUNTRY$ nach $SKY_MARKED_COUNTRY$ verschieben.\n$SKY_LC$ 20%, verteilt auf eingegliederte $concept_state$s des Ziellands.\n$SKY_AL$ 5%, verteilt auf eingegliederte $concept_state$s des Ziellands.\n$SKY_CL$ 50%, verteilt auf eingegliederte $concept_state$s des Ziellands.\n$SKY_SL$ 33%, in markierte $concept_state$s des Ziellands verschoben.\n$SKY_RC$ 100%, verteilt auf eingegliederte $concept_state$s des Ziellands.\n\nErfordert zuerst ein markiertes Land. $SKY_SL$ erfordert außerdem mindestens einen markierten $concept_state$ in diesem Land."
