 SKY_B7_TT_AI_STRATEGY_MAINTAIN_MANDATE_OF_HEAVEN: "#T $ai_strategy_maintain_mandate_of_heaven$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ versucht seine Herrschaft durch Erhalt des Mandats des Himmels zu sichern.#!"
