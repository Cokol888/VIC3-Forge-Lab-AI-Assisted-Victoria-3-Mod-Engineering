 SKY_B3_INST_TT_SET_LEVEL_1: "#BOLD Institutionenstufe#!\n\n$SKY_LC$ Diese Institution sofort auf Stufe 1 setzen.\n$SKY_SL$ Maximalstufe der aktuellen Institution +1, stapelbar.\n$SKY_CL$ Maximalstufe der aktuellen Institution -1.\n$SKY_RC$ Aktuellen Maximalstufen-Modifikator der Institution löschen.\n\nInstitutionenstufen sind durch die erlaubte Maximalstufe begrenzt. Selbst bei erzwungen höherer Stufe wird jeder Überschuss in den erlaubten Bereich zurückgedrückt."
