 SKY_B3_TRAIT_GROUP_TT_GENERAL: "#BOLD Befehlshaber#!\n$SKY_line$\n$SKY_LC$ Fugt ein vollstandiges Eigenschaftsset fur militärisches Kommando hinzu.\n$SKY_RC$ Entfernt dieses Eigenschaftsset.\n$SKY_line$\nSchwerpunkt auf Heer, Marine, Gelande, Artillerie, Angriff, Verteidigung, Versorgung, Plunderung und Flottenkommando."
 SKY_B3_TRAIT_GROUP_TT_EXECUTIVE: "#BOLD $concept_company$-Geschaftsfuhrer#!\n$SKY_line$\n$SKY_LC$ Fugt ein vollstandiges Eigenschaftsset fur $concept_company$-Fuhrung und Industrie hinzu.\n$SKY_RC$ Entfernt dieses Eigenschaftsset.\n$SKY_line$\nSchwerpunkt auf Durchsatz, Verwaltung, Unternehmertum, Ingenieurwesen und Industrieadministration."
 SKY_B3_TRAIT_GROUP_TT_BAD_RULER: "#BOLD Schlechter Herrscher#!\n$SKY_line$\n$SKY_LC$ Fugt ein vollstandiges Eigenschaftsset fur einen verheerenden Herrscher hinzu.\n$SKY_RC$ Entfernt dieses Eigenschaftsset.\n$SKY_line$\nEnthalt Arroganz, Zorn, Grausamkeit, Luxus, Betrug, Sucht, Unfahigkeit und andere schadliche Herrschaftsgewohnheiten."
 SKY_B3_TRAIT_GROUP_TT_AGITATOR: "#BOLD Agitator#!\n$SKY_line$\n$SKY_LC$ Fugt ein vollstandiges Eigenschaftsset fur politische Agitation hinzu.\n$SKY_RC$ Entfernt dieses Eigenschaftsset.\n$SKY_line$\nSchwerpunkt auf Charisma, Anziehungskraft, politischer Organisation, Reden, Agitation und sozialen Bewegungen."
 SKY_B3_TRAIT_GROUP_TT_RULER: "#BOLD Herrscher#!\n$SKY_line$\n$SKY_LC$ Fugt ein vollstandiges Eigenschaftsset zum Regieren eines Landes hinzu.\n$SKY_RC$ Entfernt dieses Eigenschaftsset.\n$SKY_line$\nSchwerpunkt auf Diplomatie, Verwaltung, Kolonien, politischer Organisation, Prestige und Staatsfuhrung."
 SKY_B3_TRAIT_GROUP_TT_ALL_ROUNDER: "#BOLD Allrounder#!\n$SKY_line$\n$SKY_LC$ Fugt ein vollstandiges Set allgemein nutzlicher Eigenschaften hinzu.\n$SKY_RC$ Entfernt dieses Eigenschaftsset.\n$SKY_line$\nKombiniert haufig nutzliche Starken fur Herrschaft, Unternehmen, Politik, Diplomatie, Heer und Marine."

