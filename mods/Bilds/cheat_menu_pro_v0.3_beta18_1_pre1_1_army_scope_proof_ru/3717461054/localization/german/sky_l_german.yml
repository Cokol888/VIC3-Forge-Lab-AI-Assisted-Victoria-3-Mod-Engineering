 SKY_B8_TT_TECH_ERA_BUTTON: "#BOLD Das Zeitalter der Technologie#!\n$SKY_line$\n$SKY_LC$ Schalte diese Kategorie von Technologien aus dieser und allen früheren Epochen frei.\n$SKY_AL$ Schalte nur diese Kategorie von Technologien aus dieser Epoche frei.\n$SKY_RC$ Schalte für das markierte Land diese Technologiekategorie aus dieser und allen vorherigen Epochen frei.\n$SKY_CL$ Für das markierte Land soll nur diese Technologiekategorie aus dieser Epoche freigeschaltet werden."
