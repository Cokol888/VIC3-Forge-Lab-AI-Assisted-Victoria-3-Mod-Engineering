 SKY_B8_TT_RECOGNIZED: "#BOLD Anerkannt#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$ zu anerkanntem Land machen\n$SKY_RC$ $SKY_SELF_COUNTRY$ zu nicht anerkanntem Land machen\n$SKY_SL$ $SKY_MARKED_COUNTRY$ zu anerkanntem Land machen\n$SKY_CL$ $SKY_MARKED_COUNTRY$ zu nicht anerkanntem Land machen\n$SKY_line$\n#italic Wenn kein Land markiert ist, haben Shift/Ctrl keine Wirkung.#!"
 SKY_B8_TT_REGENCY: "#BOLD Regentschaft#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$ Regentschaft hinzufügen\n$SKY_RC$ Regentschaft von $SKY_SELF_COUNTRY$ entfernen\n$SKY_SL$ $SKY_MARKED_COUNTRY$ Regentschaft hinzufügen\n$SKY_CL$ Regentschaft von $SKY_MARKED_COUNTRY$ entfernen\n$SKY_line$\n#italic Gilt nur für Länder mit Monarchiegesetz. Wenn kein Land markiert ist, haben Shift/Ctrl keine Wirkung.#!"
 SKY_B8_TT_COLONIAL: "#BOLD Kolonialstatus#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$ als Kolonialland setzen\n$SKY_SL$ $SKY_MARKED_COUNTRY$ als Kolonialland setzen\n$SKY_line$\n#italic Erzwingt Statusänderung des Lands. Ohne markiertes Land hat Shift keine Wirkung.#!"
 SKY_B8_TT_RETIRE: "#BOLD Zwangsruhestand#!\n\n$SKY_LC$ Aktuell markierten $concept_character$ sofort in den Ruhestand schicken.\n$SKY_line$\n#italic Erfordert zuerst einen markierten Charakter.#!"
 SKY_B8_TT_MARTYR_EXILE: "#BOLD Märtyrerexil#!\n\n$SKY_LC$ Aktuell markierten $concept_character$ als politischen Märtyrer verbannen.\n$SKY_line$\n#italic Zielcharakter wird verbannt und hinterlässt im Inland den Einfluss eines politischen Märtyrers. Stellen Sie sicher, dass ein Charakter gewählt ist.#!"
 SKY_B8_TT_DISINHERIT: "#BOLD Enterben#!\n\n$SKY_LC$ Aktuell markierten $concept_character$ enterben.\n$SKY_line$\n#italic Erfordert zuerst einen markierten Charakter. Meist nur für Ziele mit Nachfolgesystem sinnvoll.#!"
 SKY_B8_TT_LAWSET_LIBERAL: "#BOLD Liberales Land#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$ das komplette liberale Gesetzespaket annehmen lassen\n$SKY_RC$ $SKY_MARKED_COUNTRY$ das komplette liberale Gesetzespaket annehmen lassen\n$SKY_line$\n#italic Ändert sofort alle relevanten Gesetze des Lands. Ohne markiertes Land hat Rechtsklick keine Wirkung.#!"
 SKY_B8_TT_LAWSET_FASCIST: "#BOLD Faschistisches Land#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$ auf komplettes faschistisches Gesetzespaket umstellen\n$SKY_RC$ $SKY_MARKED_COUNTRY$ auf komplettes faschistisches Gesetzespaket umstellen\n$SKY_line$\n#italic Ohne markiertes Land hat Rechtsklick keine Wirkung.#!"
 SKY_B8_TT_LAWSET_GDP: "#BOLD BIP-orientiert#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$ auf komplettes BIP-orientiertes Gesetzespaket umstellen\n$SKY_RC$ $SKY_MARKED_COUNTRY$ auf komplettes BIP-orientiertes Gesetzespaket umstellen\n$SKY_line$\n#italic Ohne markiertes Land hat Rechtsklick keine Wirkung.#!"
 SKY_B8_TT_LAWSET_SOL: "#BOLD SoL-orientiert#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$ auf komplettes SoL-orientiertes Gesetzespaket umstellen\n$SKY_RC$ $SKY_MARKED_COUNTRY$ auf komplettes SoL-orientiertes Gesetzespaket umstellen\n$SKY_line$\n#italic Ohne markiertes Land hat Rechtsklick keine Wirkung.#!"
 SKY_B8_TT_LAWSET_COMMUNIST: "#BOLD Kommunismus#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$ auf komplettes kommunistisches Gesetzespaket umstellen\n$SKY_RC$ $SKY_MARKED_COUNTRY$ auf komplettes kommunistisches Gesetzespaket umstellen\n$SKY_line$\n#italic Ohne markiertes Land hat Rechtsklick keine Wirkung.#!"
 SKY_B8_TT_LAWSET_SHIT: "#BOLD Dystopie#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$ auf komplettes dystopisches Gesetzespaket umstellen\n$SKY_RC$ $SKY_MARKED_COUNTRY$ auf komplettes dystopisches Gesetzespaket umstellen\n$SKY_line$\n#italic Zerrt das Land ins dunkelste Zeitalter zurück und nimmt alle Rechte. Ohne markiertes Land hat Rechtsklick keine Wirkung.#!"
 SKY_B8_TT_HOW_DARE_U: "#BOLD HOW DARE U#!\n\n$SKY_LC$ Extrem starken Militärmodifikator auf $SKY_SELF_COUNTRY$ anwenden\n$SKY_AL$ Extrem starken Militärmodifikator auf $SKY_MARKED_COUNTRY$ anwenden\n$SKY_SL$ Negative Version auf $SKY_SELF_COUNTRY$ anwenden\n$SKY_CL$ Negative Version auf $SKY_MARKED_COUNTRY$ anwenden\n$SKY_RC$ Modifikatoren dieses Buttons löschen\n$SKY_line$\n#italic Positive Version enthält 3 Armee-, 3 Marine-, 2 Kampf- und 2 Prestige-Modifikatoren. Tötungsrate 99999. Negative Version setzt Militärwerte einheitlich auf -999 und kehrt Prestige auf +90% um. Ohne markiertes Land haben Alt/Ctrl keine Wirkung.#!"
 SKY_B8_TT_DOOMFALL: "#BOLD Unheilssturz#!\n\n$SKY_LC$ Wirtschafts- und Revolutionsbombe in $SKY_MARKED_COUNTRY$ legen und direkt Geld in Höhe von 1000% seines Schatzlimits abziehen\n$SKY_AL$ Gleichen Effekt auf $SKY_SELF_COUNTRY$ anwenden und direkt Geld in Höhe von 1000% seines Schatzlimits abziehen\n$SKY_RC$ Modifikatoren dieses Buttons löschen\n$SKY_line$\n#italic Fokus auf Radikalismus, Revolution, Chaos und wirtschaftliche Stagnation. Baukapazität direkt auf -99999 gesetzt. Ohne markiertes Land hat Linksklick keine Wirkung.#!"
 SKY_B8_TT_SOCIAL_COLLAPSE: "#BOLD Sozialer Kollaps#!\n\n$SKY_LC$ $SKY_MARKED_COUNTRY$ in institutionellen, demografischen und sozialen Kollaps stürzen\n$SKY_AL$ Gleichen Zustand auf $SKY_SELF_COUNTRY$ anwenden\n$SKY_RC$ Modifikatoren dieses Buttons löschen\n$SKY_line$\n#italic Fokus auf Verfall von Legitimität, Loyalisten, Migration, Unruhe und sozialen Institutionen. Lebensstandard wird direkt auf -19 gesetzt. Ohne markiertes Land hat Linksklick keine Wirkung.#!"
