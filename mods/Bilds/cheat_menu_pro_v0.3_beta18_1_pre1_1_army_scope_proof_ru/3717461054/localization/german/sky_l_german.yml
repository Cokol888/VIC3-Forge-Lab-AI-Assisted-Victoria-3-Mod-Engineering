 SKY_1_2_B7_TT_ACQUIRE_TREATY_PORT_DISABLED: "#BOLD $SKY_B7_ACQUIRE_TREATY_PORT$#!\n$SKY_line$\nSie müssen zunächst entweder einen unserer Bundesstaaten oder einen ausländischen Staat auswählen.\n\neinen unserer Bundesstaaten zu einem fremden Land zu machen $concept_treaty_port$: Wählen Sie einen unserer Bundesstaaten aus und erlassen Sie das #T $decree_sakuya_mark_state$#! Verordnung, dann verwenden Sie die #T $sakuya_mark_country$#! diplomatische Maßnahmen gegenüber dem Zielland.\n\nUm eine $concept_treaty_port$ aus einem anderen Land: Klicken Sie mit der rechten Maustaste auf das Zielland und wählen Sie #T $sakuya_mark_country$#! unter „Diplomatische Maßnahmen“, dann wählen Sie #T $sakuya_mark_foreign_state$#!."
 SKY_1_2_B7_TT_CEDE_HOME_STATE_DISABLED: "#BOLD $SKY_B7_CEDE_HOME_STATE$#!\n$SKY_line$\nWählen Sie einen unserer Bundesstaaten aus und erlassen Sie das #T $decree_sakuya_mark_state$#! Verordnung erlassen, um dies zu regeln; dann die #T $sakuya_mark_country$#! diplomatische Maßnahmen gegenüber dem Zielland."
 SKY_1_2_B7_TT_TAKE_FOREIGN_STATE_DISABLED: "#BOLD $SKY_B7_TAKE_FOREIGN_STATE$#!\n$SKY_line$\nSie müssen sowohl ein Land als auch einen ausländischen Staat in diesem Land angeben.\n\nKlicken Sie mit der rechten Maustaste auf das Land, das Sie markieren möchten, und wählen Sie #T $sakuya_mark_country$#! unter „Diplomatische Maßnahmen“, dann wählen Sie #T $sakuya_mark_foreign_state$#!."
