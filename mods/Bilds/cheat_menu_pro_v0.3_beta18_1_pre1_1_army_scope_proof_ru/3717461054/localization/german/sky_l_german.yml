SKY_1_1_B7_TT_FORM_MARKED_RELEASE_COUNTRY: "#BOLD Neues Land in den markierten Staaten des Ziellandes gründen#!\n$SKY_line$\n$SKY_LC$ Gründet den gewählten TAG in den markierten Staaten des Ziellandes.\n\nDer Spieler wechselt nicht zum neuen Land."
