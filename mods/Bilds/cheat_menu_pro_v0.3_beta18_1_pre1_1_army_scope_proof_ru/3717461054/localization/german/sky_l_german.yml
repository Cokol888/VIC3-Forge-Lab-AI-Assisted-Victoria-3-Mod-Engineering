 sakuya_superdip_beguile_country_01_desc: "Sakuya soll sich persönlich für die Verbesserung unserer diplomatischen Beziehungen zu diesem Land einsetzen."
 notification_sakuya_superdip_annex_country_toast_name: "[SCOPE.sCountry('actor').GetName] vereinheitlicht [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_annex_country_toast_desc: "Nachdem Sakuya sie überredet hatte, [SCOPE.sCountry('target').GetRuler.GetFullName] unterzeichnet hat [SCOPE.sCountry('actor').GetCapital.GetCityHubName] Vertrag in [SCOPE.sCountry('target').GetCapital.GetCityHubName]und [SCOPE.sCountry('target').GetName] und [SCOPE.sCountry('actor').GetName] haben ihre Vereinigung endlich vollendet."
 notification_sakuya_superdip_annex_country_toast_tooltip: "#header $notification_sakuya_superdip_annex_country_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_annex_country_toast_desc$"
 notification_sakuya_superdip_force_join_power_bloc_toast_name: "[SCOPE.sCountry('target').GetName] ist unserem Power Bloc beigetreten"
 notification_sakuya_superdip_force_join_power_bloc_toast_desc: "[SCOPE.sCountry('target').GetRuler.GetFullName] räumte nach dem Treffen ein, dass Sakuyas Darstellung der internationalen Lage klar und schwer zu widerlegen war. [SCOPE.sCountry('target').GetName] trat dann der $concept_power_bloc$ dass [SCOPE.sCountry('actor').GetName] gehört."
 notification_sakuya_superdip_force_join_power_bloc_toast_tooltip: "#header $notification_sakuya_superdip_force_join_power_bloc_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_force_join_power_bloc_toast_desc$"
 sakuya_superdip.3.t: "Sakuya überzeugte [SCOPE.sCountry('sakuya_superdip_target_country').GetName]'s [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]"
 sakuya_superdip.3.d: "Bei einem privaten Treffen überzeugte Sakuya [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] die Beziehungen zu [SCOPE.sCountry('sakuya_superdip_actor_country').GetName]."
 sakuya_superdip.3.f: "Am Ende der Sitzung, [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] hatte den ursprünglich verfassten, schroffen Brief bereits wieder in die Schublade zurückgelegt und darum gebeten, das nächste Treffen zu vereinbaren. Sakuya schloss ihre Taschenuhr einfach ruhig, als wäre alles in bester Ordnung."
 sakuya_superdip.3.a: "Das ist gut."
