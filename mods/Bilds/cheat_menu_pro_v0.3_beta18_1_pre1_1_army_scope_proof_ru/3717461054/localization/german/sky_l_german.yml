 SKY_ABOUT_WELCOME_1: "#BOLD Willkommen!#!\nSchön, Sie kennenzulernen. Ich bin Xier, Entwickler von Victoria 3 Cheat Menu Pro. Es ist mir eine Ehre, Sie in Victoria 3 wiederzutreffen. #BOLD QQ-Gruppe:#! 734267077. Kommen Sie dazu!"
 SKY_ABOUT_WELCOME_2: "#BOLD Wie finden Sie diesen Mod?#!\nIch entwickle ihn ständig weiter. Verglichen mit EU5 wirkt die Engine von Victoria 3 ähnlich wie frühere Titel, ist aber tatsächlich sehr anders. Jedenfalls hoffe ich, dass alle Spaß haben! Euch zu treffen macht mich wirklich glücklich."
