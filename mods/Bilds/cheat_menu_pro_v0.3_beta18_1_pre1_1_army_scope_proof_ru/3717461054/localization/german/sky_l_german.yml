 SKY_B6_POPGEN_TT_BTN_CULTURE: "#BOLD $concept_culture$#!\n\nQuelle der $concept_culture$ der neu erzeugten Pops wählen."
 SKY_B6_POPGEN_TT_START_PLAYER: "#BOLD In $SKY_SELF_COUNTRY$-$concept_state$ erzeugen#!\n\nErzeugt in markierten $concept_state$s von $SKY_SELF_COUNTRY$.\n\nErfordert mindestens einen markierten $concept_state$ in $SKY_SELF_COUNTRY$ sowie abgeschlossene Auswahl für Menge, Erwerbsanteil, $concept_literacy$ und $concept_culture$."
