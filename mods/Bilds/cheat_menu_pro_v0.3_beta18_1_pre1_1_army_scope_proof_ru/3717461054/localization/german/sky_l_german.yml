 sakuya_superdip_humiliate_01: "Sakuya soll dieses Land demütigen."
 sakuya_superdip_humiliate_01_action_name: "Sakuya soll dieses Land demütigen."
 sakuya_superdip_humiliate_01_desc: "Ihr werdet Sakuya schicken, um im Namen unserer Herrscher mit dem Botschafter dieses Landes zu speisen."
 sakuya_superdip_humiliation_pact_01: "$humiliation$"
 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "Sakuya demütigt das Zielland durch ein äußerst unangebrachtes diplomatisches Abendessen und schadet damit dessen Ansehen auf der internationalen Bühne. Dauer: 5 Jahre."
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] wird von Sakuya gedemütigt, die von [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]. Laufzeit: 5 Jahre."
 sakuya_superdip_humiliation_pact_01_effect_desc_global: "Schließe Sakuyas Demütigungspakt"
 sakuya_superdip_humiliation_pact_01_effect_desc_first: "[COUNTRY.GetNameNoFlag] bringt Sakuya in Verlegenheit [TARGET_COUNTRY.GetName] seit 5 Jahren"
 sakuya_superdip_humiliation_pact_01_effect_desc_third: "[COUNTRY.GetName] bringt Sakuya in Verlegenheit [TARGET_COUNTRY.GetName] seit 5 Jahren"
 sakuya_superdip.1.t: "Sakuya äußert sich bei einem diplomatischen Abendessen!"
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName] gerät ins Chaos, als Sakuya sich mit Beamten aus [SCOPE.sCountry('sakuya_superdip_target_country').GetName] während des Abendessens."
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] versuchte, eine Bank auf Sakuya zu werfen, doch sie wich geschickt aus, schnappte sich ein Stück Kuchen vom Tisch und zerschmetterte es auf [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]Kopf. \N\N\"#lore Alter Narr… Du hast versucht, mich in einen Hinterhalt zu locken? #!\""
 sakuya_superdip.1.a: "Gute Schelte!"
 sakuya_superdip.1.b: "Ich werde mich mit ein paar Flüchen einmischen..."
 sakuya_superdip.1.c: "Sakuya-sensei, tun Sie das nicht..."
 sakuya_superdip.1.c_desc: "Nachdem [SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName] Obwohl sie alles versucht hatte, um sie aufzuhalten, steckte Sakuya Izayoi ihre silbernen Messer vorübergehend weg, nahm dann einen Schluck Wein und wirkte dabei so gelassen wie immer."
 notification_sakuya_superdip_humiliation_toast_name: "Sakuya wurde verächtlich gedemütigt [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "Sakuya überreichte dem Herrscher von [SCOPE.sCountry('target').GetName], [SCOPE.sCountry('target').GetRuler.GetFullName], eine diplomatische Note von bemerkenswerter kultureller Raffinesse. Aus irgendeinem Grund deuteten sie sie als #BOLD Beleidigung#!. Ihre Derbheit amüsierte uns; sie wirkten hingegen ziemlich verärgert. Die diplomatischen Beziehungen zwischen [SCOPE.sCountry('actor').GetName] und [SCOPE.sCountry('target').GetName] scheinen sich verschlechtert zu haben."
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "Sakuya sagt:\NDeine Mutter war ein Hamster,\Nund dein Vater riecht nach Holunderbeeren!"
 sakuya_superdip_insult_02: "Sakuya sagt:\NDer Tag des Jüngsten Gerichts steht bevor!\NDie Schergen Luzifers wandeln auf der Erde –\NAch nein, es ist nur der Vertreter Ihres Landes."
 sakuya_superdip_insult_03: "Sakuya sagt:\NAußerdem bin ich der Meinung, dass euer Kapital vernichtet werden muss!"
 sakuya_superdip_insult_04: "Sakuya sagt:\NWenn künftige Generationen die Geschichte unserer Zeit schreiben,\NSie werden dich mit dieser Mischung aus Mitleid und Abscheu ansehen, die man Mitgefühl nennt."
 sakuya_superdip_insult_05: "Sakuya sagt:\NMein letzter Gang zur Toilette war um einiges angenehmer als das Abendessen mit Ihrem Botschafter."
 sakuya_superdip_insult_06: "Sakuya sagt:\NOh, schau mal.\NHier gibt es ein paar richtig geile Sachen."
 sakuya_superdip_insult_07: "Sakuya sagt:\NDein Blut wird den Boden, den ich dir entnehme, noch fruchtbarer machen."
 sakuya_superdip_insult_08: "Sakuya sagt:\NLangweilige diplomatische Anlässe brauchen immer einen Wels, um sie aufzupeppen.\NUnd du, mein Freund, bist der beste Wels von allen!"
 sakuya_superdip_insult_09: "Sakuya sagt:\NWarum läuft in deinem Land immer alles so schrecklich?\NIch vermute, ihr seid alle daran schuld."
 sakuya_superdip_insult_10: "Sakuya sagt:\NIn diesem großartigen Spiel, das wir spielen,\NDu bist nur eine Schachfigur."
 sakuya_superdip_insult_11: "Sakuya sagt:\NVon deinen Missetaten wird von Irland bis nach Cathay berichtet."
 sakuya_superdip_insult_12: "Sakuya sagt:\NDein Herrscher hat die Denkfähigkeit einer reifen Banane,\Naber beweist wahres Genie beim öffentlichen Stuhlgang."
 sakuya_superdip_insult_13: "Sakuya sagt:\NMöge dein Himmel voller Kometen sein."
 sakuya_superdip_insult_14: "Sakuya sagt:\NKeine Karte kann ein Kunstwerk sein\Nsolange dein Land dabei ist."
 sakuya_superdip_insult_15: "Sakuya sagt:\NIch verstehe nicht, warum du es genießt, dich bei diplomatischen Abendessen zum Narren zu machen.\NSuchst du nach einem Sinn,\Noder nur, um das Publikum zu unterhalten?"
