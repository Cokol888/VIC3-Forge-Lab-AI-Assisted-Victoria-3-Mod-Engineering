 SKY_B7_TT_AI_STRATEGY_AGRICULTURAL_EXPANSION: "#T $ai_strategy_agricultural_expansion$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will seine Agrarbasis ausbauen und Nettoexporteur von Getreide werden.#!"
 SKY_B7_TT_AI_STRATEGY_PLANTATION_ECONOMY: "#T $ai_strategy_plantation_economy$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will sich auf Produktion und Export von Cash Crops konzentrieren.#!"
 SKY_B7_TT_AI_STRATEGY_RESOURCE_EXPANSION: "#T $ai_strategy_resource_expansion$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will in die Ausbeutung natürlicher Ressourcen investieren.#!"
 SKY_B7_TT_AI_STRATEGY_INDUSTRIAL_EXPANSION: "#T $ai_strategy_industrial_expansion$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will eine urbane Industriebasis aufbauen.#!"
 SKY_B7_TT_AI_STRATEGY_PLACATE_POPULATION: "#T $ai_strategy_placate_population$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will nationale und soziale Stabilität durch niedrige Steuern und ausreichende Lebensmittelversorgung sichern.#!"
 SKY_B7_TT_AI_STRATEGY_COLONIAL_EXTRACTION: "#T $ai_strategy_colonial_extraction$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore Als Kolonialland versucht $SKY_TARGET_COUNTRY$, auf Befehl seines Kolonialherrn Rohstoffe zu fördern und zu exportieren.#!"
 SKY_B7_TT_AI_STRATEGY_MONTENEGRO_ADMIN: "#T $ai_strategy_montenegro_admin$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will die Versorgung seines Gebiets mit Grundgütern sichern.#!"
 SKY_B7_TT_AI_STRATEGY_CONSERVATIVE_AGENDA: "#T $ai_strategy_conservative_agenda$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ hat vorsichtige konservative politische Ziele und reformiert langsam.#!"
 SKY_B7_TT_AI_STRATEGY_REACTIONARY_AGENDA: "#T $ai_strategy_reactionary_agenda$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will die Macht von Grundbesitzern und Klerus stärken und ihre Reformziele vorantreiben.#!"
