 SKY_B3_TT_GOODS_OBSESSION_SELECTED_CULTURE: "#BOLD Kulturelle Obsession: Markierte Kultur#!\n$SKY_line$\n#lore Es wird genau 1 ausgewähltes Gut und genau 1 markiertes benötigt $concept_culture$.#!\n\n$SKY_LC$ Füge die „Begeisterung für das ausgewählte Produkt“ zur Markierung hinzu $concept_culture$.\n$SKY_RC$ Entferne die Fixierung auf die ausgewählte Ware aus der Markierung $concept_culture$.\N\NSie müssen ein $concept_culture$ zuerst. #LORE Ich bin mir nicht sicher, wie man ein $concept_culture$? Öffnen #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$, dann wähle eine Kultur in $SKY_1_2_CULTURE_INDEX_TITLE$#!."
 SKY_B3_TT_GOODS_TABOO_SELECTED_CULTURE: "#BOLD Kulturelles Tabu: Gezeichnete Kultur#!\n$SKY_line$\n#lore Es wird genau 1 ausgewähltes Gut und genau 1 markiertes benötigt $concept_culture$.#!\n\n$SKY_LC$ Füge ein Tabu für das ausgewählte Produkt zur Markierung hinzu $concept_culture$.\n$SKY_RC$ Das Tabu für das ausgewählte Produkt aus der Markierung entfernen $concept_culture$.\N\NSie müssen ein $concept_culture$ zuerst. #LORE Ich bin mir nicht sicher, wie man ein $concept_culture$? Öffnen #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$, dann wähle eine Kultur in $SKY_1_2_CULTURE_INDEX_TITLE$#!."
