 SKY_B6_BUILD_SELECTED_TITLE: "Gewähltes\nGebäude"
 SKY_B6_BUILD_SELECTED_NONE: "Nichts gewählt"
 SKY_B6_BUILD_TT_CONFIRM: "#BOLD Gebäude platzieren#!\n\n$SKY_LC$ Aktuelle Gebäudestufenänderung auf spielermarkierte Staaten anwenden\n$SKY_RC$ Wenn ein Land markiert ist und fremde markierte Staaten hat, Änderung auf diese fremden Staaten anwenden\n$SKY_line$\n#lore 0 löscht das Gebäude. Positive Werte fügen Stufen hinzu. Wenn der Zielstaat dieses Gebäude nicht hat, wird es direkt mit passender Stufe erstellt.#!"
 SKY_B6_BUILD_APPLY_SEC: "#T #COLOR:{0.7275,0.6333,0.4529,1} Gebäude platzieren#!"
 SKY_B6_BUILD_APPLY_RESOURCE_SEC: "#T #COLOR:{0.7275,0.6333,0.4529,1} Gebäude platzieren und potenzielle Ressourcen hinzufügen#!"
 SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL: "Potenzielle Ressourcen hinzufügen"
 SKY_B6_BUILD_TT_RESOURCE_POTENTIAL: "#BOLD Potenzielle Ressourcen hinzufügen#!\n\n$SKY_LC$ Den spielermarkierten Staaten potenzielle Ressourcen des aktuell gewählten Gebäudes hinzufügen\n$SKY_RC$ Wenn ein Land markiert ist und fremde markierte Staaten hat, auf diese fremden Staaten anwenden\n$SKY_line$\n#lore Stufe 0 entfernt. Positive Stufen fügen hinzu oder erhöhen den aktuellen Wert. Landwirtschaftsgebäude unterstützen derzeit nur Hinzufügen und Entfernen.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1: "#BOLD $concept_throughput$ des gewählten Gebäudes#!\n\n#lore Zuerst ein Gebäude in $SKY_BTN6_SEC$-$SKY_BTN6_TAB3$ wählen und mindestens 1 $concept_state$ markieren.#!\n#lore Wenn das aktuelle Gebäude dies nicht unterstützt, den generischen $concept_throughput$ unten rechts nutzen.#!\n#lore Derzeit unterstützt: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Diese Gruppe löschen, inklusive + Button rechts\n#lore Mit dem großen Schritt rechts stapelbar.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1_PLUS: "#BOLD $concept_throughput$ des gewählten Gebäudes: großer Schritt#!\n\n#lore Eigene Gruppe neben dem normalen Button links, stapelbar. Löschen links löscht auch dies.#!\n#lore Derzeit unterstützt: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
 SKY_B6_RESERVED_BUILD_R1_C2: "Inputbedarf gewähltes Gebäude"
 SKY_B6_TT_RESERVED_BUILD_R1_C2: "#BOLD Inputbedarf gewähltes Gebäude#!\n\n#lore Wirkt auf das aktuell gewählte Gebäude in spielermarkierten Staaten.#!\n#lore Positive Aktionen senken den Wareninputbedarf des Gebäudes.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Diese Gruppe löschen"
 SKY_B6_RESERVED_BUILD_R1_C3: "Mindestlohn gewähltes Gebäude"
 SKY_B6_TT_RESERVED_BUILD_R1_C3: "#BOLD Mindestlohn gewähltes Gebäude#!\n\n#lore Wirkt auf das aktuell gewählte Gebäude in spielermarkierten Staaten.#!\n#lore Positive Aktionen senken das Lohnziel des Gebäudes.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Diese Gruppe löschen"
 SKY_B6_TT_RESERVED_BUILD_R2_C1: "#BOLD Mitarbeitergröße gewähltes Gebäude#!\n\n#lore Wirkt je nach aktuell gewähltem Gebäudetyp auf spielermarkierte Staaten.#!\n#lore Positive Aktionen senken die Standard-Mitarbeitergröße.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Diese Gruppe löschen"
 SKY_B6_TT_RESERVED_BUILD_R2_C2: "#BOLD Arbeitsbedingungen gewähltes Gebäude#!\n\n#lore Wirkt auf das entsprechende Gebäude in spielermarkierten Staaten.#!\n#lore Positive Aktionen senken den Arbeitsbedingungen-Modifikator des Gebäudes.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Diese Gruppe löschen"
 SKY_B6_TT_RESERVED_BUILD_R2_C3: "#BOLD Generischer $concept_throughput$ des gewählten Gebäudes#!\n\n#lore Wirkt direkt auf das aktuell gewählte Gebäude in spielermarkierten Staaten.#!\n#lore Wenn der exklusive $concept_throughput$ oben links das aktuelle Gebäude nicht abdeckt, diesen nutzen.#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Diese Gruppe löschen, inklusive + Button rechts"
 SKY_B6_TT_RESERVED_BUILD_R2_C3_PLUS: "#BOLD Generischer $concept_throughput$ des gewählten Gebäudes: großer Schritt#!\n\n#lore Eigene Gruppe neben dem normalen Button links, stapelbar. Rechtsklick links löscht auch dies.#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
