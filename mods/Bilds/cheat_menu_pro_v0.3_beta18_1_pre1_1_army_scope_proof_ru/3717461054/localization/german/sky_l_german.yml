 SKY_B5_TT_LOBBY_DISBAND: "#BOLD $concept_political_lobby_short$ auflösen#!\n\n$SKY_LC$ Aktuell ausgewählte $concept_political_lobby_short$ auflösen\n$SKY_SL$ Alle $concept_political_lobby_short$s in diesem Land auflösen\n$SKY_AL$ Alle $concept_political_lobby_short$s im markierten Land auflösen\n$SKY_line$\n#italic Diese $concept_political_lobby_short$ verschwindet endgültig. Shift/Alt erfordern keine ausgewählte $concept_political_lobby_short$.#!"
 SKY_B5_TT_LOBBY_IG_JOIN: "#BOLD $concept_political_lobby_short$ beitreten/verlassen#!\n\n$SKY_LC$ Ausgewählte $concept_interest_group$ tritt der ausgewählten $concept_political_lobby_short$ bei\n$SKY_RC$ Ausgewählte $concept_interest_group$ verlässt die ausgewählte $concept_political_lobby_short$\n$SKY_SL$ Alle $concept_interest_group$s in diesem Land treten der ausgewählten $concept_political_lobby_short$ bei\n$SKY_CL$ Alle Mitglieder der ausgewählten $concept_political_lobby_short$ entfernen\n$SKY_line$\n#italic Wenn die $concept_political_lobby_short$ zu einem fremden Land gehört, wird automatisch die passende $concept_interest_group$ dieses Lands genutzt.\nLinks-/Rechtsklick erfordert ausgewählte $concept_interest_group$ und $concept_political_lobby_short$.#!"
 SKY_B5_TT_LOBBY_CREATE: "#BOLD $concept_political_lobby_short$ erstellen#!\n\n$SKY_LC$ Pro-Zielland-$concept_political_lobby_short$ in diesem Land erstellen\n$SKY_RC$ Anti-Zielland-$concept_political_lobby_short$ in diesem Land erstellen\n$SKY_SL$ Pro-Spieler-$concept_political_lobby_short$ im Zielland erstellen\n$SKY_AL$ Anti-Spieler-$concept_political_lobby_short$ im Zielland erstellen\n$SKY_line$\n#italic Erfordert markiertes Zielland. Wenn eine $concept_interest_group$ ausgewählt ist, wird sie Anfangsmitglied.#!"
