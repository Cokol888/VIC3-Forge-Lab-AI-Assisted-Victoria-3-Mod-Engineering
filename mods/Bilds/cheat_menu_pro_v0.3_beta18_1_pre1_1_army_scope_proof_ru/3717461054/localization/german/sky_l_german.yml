 SKY_B7_TT_AI_STRATEGY_TERRITORIAL_EXPANSION: "#T $ai_strategy_territorial_expansion$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will sein Kerngebiet auf Kosten der Nachbarn erweitern.#!"
 SKY_B7_TT_AI_STRATEGY_COLONIAL_EXPANSION: "#T $ai_strategy_colonial_expansion$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will Kolonien und einen Platz an der Sonne mit allen nötigen Mitteln erlangen.#!"
 SKY_B7_TT_AI_STRATEGY_ARMED_ISOLATIONISM: "#T $ai_strategy_armed_isolationism$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will sich durch bewaffnete Isolation von der Welt fernhalten.#!"
 SKY_B7_TT_AI_STRATEGY_ECONOMIC_IMPERIALISM: "#T $ai_strategy_economic_imperialism$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will seinen [concept_market] erweitern und die Türen isolierter [Concept('concept_country', '$concept_countries$')] öffnen.#!"
 SKY_B7_TT_AI_STRATEGY_UNIFY_GERMANY: "#T $ai_strategy_unify_germany$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will die deutschen Staaten unter seiner Flagge vereinen.#!"
 SKY_B7_TT_AI_STRATEGY_UNIFY_ITALY: "#T $ai_strategy_unify_italy$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will die italienischen Staaten unter seiner Flagge vereinen.#!"
 SKY_B7_TT_AI_STRATEGY_UNIFY_ETHIOPIA: "#T $ai_strategy_unify_ethiopia$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will die äthiopischen Reiche unter seiner Flagge vereinen.#!"
 SKY_B7_TT_AI_STRATEGY_UNIFY_CHINA: "#T $ai_strategy_unify_china$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will die chinesischen Kriegsherren unter seiner Flagge vereinen.#!"
 SKY_B7_TT_AI_STRATEGY_SOCIALISM_IN_ONE_COUNTRY: "#T $ai_strategy_socialism_in_one_country$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will eine reife sozialistische Wirtschaft entwickeln und kapitalistische Kräfte eindämmen.#!"
 SKY_B7_TT_AI_STRATEGY_WORLD_REVOLUTION: "#T $ai_strategy_world_revolution$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will die Revolution in die Welt exportieren und andere Länder für seine Sache gewinnen.#!"
 SKY_B7_TT_AI_STRATEGY_ANTI_IMPERIALISM: "#T $ai_strategy_anti_imperialism$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will nicht anerkannte Länder unterstützen und die Expansion imperialistischer Länder eindämmen.#!"
 SKY_B7_TT_AI_STRATEGY_RESTORE_NATURAL_BORDERS: "#T $ai_strategy_restore_natural_borders$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ will sein Kerngebiet bis zu den natürlichen Grenzen des Rheins erweitern.#!"
 SKY_B7_TT_AI_STRATEGY_PRUSSIA_OF_THE_BALKANS: "#T $ai_strategy_prussia_of_the_balkans$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ ändert seine Strategie zur aktuell gewählten Strategie.\N\N#lore $SKY_TARGET_COUNTRY$ wird versuchen, ein bulgarisches Reich vom Schwarzen Meer bis zum Ionischen und Ägäischen Meer wiederaufzubauen und durch Technologie, Gewalt und Zahl eine Armee zu schaffen, die Unabhängigkeit, Interessen und Ambitionen verteidigen kann.#!"
 SKY_B7_TT_SPECIAL_CLAUSE_UNLOCK: "#BOLD Schalter Kooperationsklausel#!\n$SKY_line$\n$SKY_LC$ $sakuya_b7_special_cooperation_clause$ in der Verhandlungsoberfläche aktivieren. \n$SKY_RC$ Diese Variable entfernen und $sakuya_b7_special_cooperation_clause$ wieder verbergen\n$SKY_line$\n#lore $sakuya_b7_special_cooperation_clause$ hat selbst keinen echten Effekt. Sie gibt $SKY_TARGET_COUNTRY$ nur extrem hohe Akzeptanz, um erzwungene Unterzeichnung zu erleichtern.#!"
 sakuya_b7_special_cooperation_clause: "Spezielle Kooperationsklausel"
