 SKY_B5_TT_FX_4: "#BOLD Revolution beitreten/verlassen#!\n$SKY_LC$ Aktuellen einer laufenden Revolution in diesem Land beitreten lassen.\n$SKY_RC$ Aktuellen eine laufende Revolution in diesem Land verlassen lassen.\n#lore Nur klickbar, wenn dieses Land eine revolutionäre oder sezessionistische politische Bewegung hat. Bei mehreren gleichzeitig wird einheitlich nach bestehenden Revolutionen dieses Lands gehandelt.#!"
 SKY_B5_TT_FX_5: "#BOLD Übernahme durch markierten $concept_character$#!\n$SKY_LC$ Markierten $concept_character$ die ausgewählte $concept_interest_group$ übernehmen lassen, der er angehört.\n#lore Erfordert markierten $concept_character$, der bereits zur gewählten IG gehört.#!"
 SKY_B5_TT_FX_8: "#BOLD Neuen Anführer erstellen#!\n$SKY_LC$ Neuen $ideology_moderate$-Anführer erzeugen und direkt die gewählte IG übernehmen lassen.\n$SKY_SL$ Neuen $ideology_radical$-Anführer erzeugen und direkt die gewählte IG übernehmen lassen.\n$SKY_AL$ Neuen $ideology_communist$-Anführer erzeugen und direkt die gewählte IG übernehmen lassen.\n$SKY_CL$ Neuen $ideology_market_liberal$-Anführer erzeugen und direkt die gewählte IG übernehmen lassen."
 SKY_B5_TT_FX_9: "#BOLD Anführer entlassen#!\n$SKY_LC$ Aktuellen Amtsinhaber entfernen."
