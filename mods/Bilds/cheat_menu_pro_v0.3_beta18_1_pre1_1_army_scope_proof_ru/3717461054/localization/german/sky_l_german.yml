 SKY_B7_TT_AUTONOMY_AND_INDEPENDENCE: "#BOLD Autonomie und Unabhängigkeit#!\n$SKY_line$\n$SKY_LC$ Wenn Ziel ein Untertan von $SKY_SELF_COUNTRY$ ist, seine Autonomie senken\n$SKY_RC$ Wenn Ziel ein Untertan von $SKY_SELF_COUNTRY$ ist, seine Autonomie erhöhen\n$SKY_SL$ Wenn $SKY_SELF_COUNTRY$ Untertan ist, sofort unabhängig werden\n$SKY_AL$ Wenn Ziel Untertan ist, sofort unabhängig werden"
 SKY_B7_TT_LIBERTY_DESIRE: "#BOLD $concept_liberty_desire$#!\n$SKY_line$\n$SKY_LC$ $concept_liberty_desire$ von $SKY_TARGET_COUNTRY$ um 20 senken\n$SKY_RC$ $concept_liberty_desire$ von $SKY_TARGET_COUNTRY$ um 20 erhöhen\n$SKY_AL$ $concept_liberty_desire$ von $SKY_TARGET_COUNTRY$ um 5 senken\n$SKY_CR$ Wenn $SKY_SELF_COUNTRY$ Untertan von $SKY_TARGET_COUNTRY$ ist, $concept_liberty_desire$ von $SKY_SELF_COUNTRY$ um 20 erhöhen\n$SKY_SL$ Wenn $SKY_SELF_COUNTRY$ ein $concept_vassal$ von $SKY_TARGET_COUNTRY$ ist, $concept_liberty_desire$ von $SKY_SELF_COUNTRY$ um 20 senken"
 SKY_B7_TT_PLAYER_LIBERTY_MOD: "#BOLD $concept_liberty_desire$ $concept_modifier$#!\n$SKY_line$\n$SKY_LC$ $SKY_SELF_COUNTRY$ +20 $concept_liberty_desire$ $concept_modifier$\n$SKY_RC$ $SKY_SELF_COUNTRY$ -20 $concept_liberty_desire$ $concept_modifier$\n$SKY_SL$ Wenn $SKY_MARKED_COUNTRY$ existiert, $SKY_TARGET_COUNTRY$ +20 $concept_liberty_desire$ $concept_modifier$\n$SKY_CL$ Wenn $SKY_MARKED_COUNTRY$ existiert, $SKY_TARGET_COUNTRY$ -20 $concept_liberty_desire$ $concept_modifier$\n$SKY_AL$ $concept_liberty_desire$-$concept_modifier$s von Spieler und Ziel global entfernen"
 SKY_B7_TT_ACQUIRE_TREATY_PORT: "#BOLD $concept_treaty_port$ erwerben#!\n#lore $concept_treaty_port_desc$#!\n$SKY_line$\n$SKY_LC$ Wenn ein fremder $concept_state$ markiert ist, einen $concept_treaty_port$ in diesem $concept_state$ an $SKY_SELF_COUNTRY$ abtreten\n$SKY_RC$ Wenn ein $SKY_SELF_COUNTRY$-$concept_state$ markiert ist, einen $concept_treaty_port$ in diesem $concept_state$ an $SKY_MARKED_COUNTRY$ abtreten"
 SKY_B7_TT_CEDE_HOME_STATE: "#BOLD Gibt nach $SKY_SELF_COUNTRY$ $concept_state$#!\n$SKY_line$\n$SKY_LC$ Gib das Markierte $SKY_SELF_COUNTRY$ $concept_state$ zu $SKY_MARKED_COUNTRY$.\n$SKY_RC$ Gib es $SKY_MARKED_COUNTRY$ und es sofort zu einem Bundesstaat machen."
 SKY_B7_TT_TAKE_FOREIGN_STATE: "#BOLD Nimm „Foreign“ $concept_state$#!\n$SKY_line$\n$SKY_LC$ Füge die markierten ausländischen $concept_state$ direkt in $SKY_SELF_COUNTRY$.\n$SKY_RC$ als Anhang beifügen $SKY_SELF_COUNTRY$ und es sofort zu einem Bundesstaat machen."
 SKY_B7_TT_TR_ALLIANCE: "#BOLD $concept_alliance$#!\n#lore $concept_alliance_desc$#!\n$SKY_line$\n$SKY_LC$ 99-jährige Allianz erstellen\n$SKY_RC$ Diesen Vertragstyp verlassen"
 SKY_B7_TT_TR_DEFENSIVE_PACT: "#BOLD $concept_defensive_pact$#!\n#lore $concept_defensive_pact_desc$#!\n$SKY_line$\n$SKY_LC$ 99-jährigen Verteidigungspakt erstellen\n$SKY_RC$ Diesen Vertragstyp verlassen"
