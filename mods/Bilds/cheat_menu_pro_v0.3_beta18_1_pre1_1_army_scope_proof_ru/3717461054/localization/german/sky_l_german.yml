 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Ziel: unsere Primärkulturen#!\n\n$SKY_LC$ Wenn ein Land markiert ist: alle Primärkulturen des Ziellands zu unseren Primärkulturen hinzufügen\n$SKY_RC$ Wenn wir einen markierten $concept_state$ haben: Heimatkulturen dieses $concept_state$ zu unseren Primärkulturen hinzufügen\n$SKY_SL$ Wenn ein Land markiert ist und das Zielland einen markierten $concept_state$ hat: Heimatkulturen dieses $concept_state$ zu unseren Primärkulturen hinzufügen\n$SKY_CL$ Wenn ein $concept_character$ markiert ist: Kultur dieses Charakters zu unseren Primärkulturen hinzufügen"
 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Ziel: Primärkulturen des Ziellands#!\n\n$SKY_LC$ Wenn ein Land markiert ist: alle unsere Primärkulturen zu den Primärkulturen des Ziellands hinzufügen\n$SKY_RC$ Wenn wir einen markierten $concept_state$ haben: Heimatkulturen dieses $concept_state$ zu den Primärkulturen des Ziellands hinzufügen\n$SKY_SL$ Wenn das Zielland einen markierten $concept_state$ hat: Heimatkulturen dieses $concept_state$ zu den Primärkulturen des Ziellands hinzufügen\n$SKY_CL$ Wenn ein $concept_character$ markiert ist: Kultur dieses Charakters zu den Primärkulturen des Ziellands hinzufügen"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Ziel: unsere Primärkulturen#!\n\n$SKY_LC$ Wenn ein Land markiert ist: alle Primärkulturen des Ziellands aus unseren Primärkulturen entfernen\n$SKY_RC$ Wenn wir einen markierten $concept_state$ haben: Heimatkulturen dieses $concept_state$ aus unseren Primärkulturen entfernen\n$SKY_SL$ Wenn ein Land markiert ist und das Zielland einen markierten $concept_state$ hat: Heimatkulturen dieses $concept_state$ aus unseren Primärkulturen entfernen\n$SKY_CL$ Wenn ein $concept_character$ markiert ist: Kultur dieses Charakters aus unseren Primärkulturen entfernen\n$SKY_line$\n#n Warnung: Die letzte Primärkultur eines Lands wird nicht entfernt. Lassen Sie kein Land ohne Primärkultur, sonst kann der Spielstand beschädigt werden.#!"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Ziel: Primärkulturen des Ziellands#!\n\n$SKY_LC$ Wenn ein Land markiert ist: alle unsere Primärkulturen aus den Primärkulturen des Ziellands entfernen\n$SKY_RC$ Wenn wir einen markierten $concept_state$ haben: Heimatkulturen dieses $concept_state$ aus den Primärkulturen des Ziellands entfernen\n$SKY_SL$ Wenn das Zielland einen markierten $concept_state$ hat: Heimatkulturen dieses $concept_state$ aus den Primärkulturen des Ziellands entfernen\n$SKY_CL$ Wenn ein $concept_character$ markiert ist: Kultur dieses Charakters aus den Primärkulturen des Ziellands entfernen\n$SKY_line$\n#n Warnung: Die letzte Primärkultur eines Lands wird nicht entfernt. Lassen Sie kein Land ohne Primärkultur, sonst kann der Spielstand beschädigt werden.#!"
