 SKY_SETTINGS_PLACEHOLDER: "Personalisierung ist in Entwicklung. Bitte dranbleiben.\nKünftige Versionen unterstützen Hintergrundanpassung, UI-Themenwechsel und mehr."
 SKY_ABOUT_LINKS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Kontakt#!"
 SKY_ABOUT_TEXT_1: "#BOLD Danke für die Nutzung von $SKY_WINDOW_TITLE$!#!\nSchön, Sie kennenzulernen. Ich bin Xier, ein Entwickler aus Peking, derzeit in Tschechien. Bei Fragen kontaktieren Sie mich über QQ-Gruppe oder Discord-Server. Wenn Sie Xier unterstützen möchten, geben Sie Xier im Steam Workshop ein Like oder spenden Sie über den Sponsor-Link oben.\nDieser Mod ist völlig kostenlos. Wenn Sie ihn über einen kostenpflichtigen Kanal erhalten haben, melden Sie dies bitte sofort. Xier wäre sehr dankbar!"
 SKY_ABOUT_TEXT_2: "#BOLD Kompatibilitätshinweise#!\n$SKY_WINDOW_TITLE$ wurde sorgfältig für maximale Kompatibilität mit anderen Mods entworfen. Wegen Engine-Grenzen muss jedoch eine System-GUI-Datei geändert werden, um die $concept_modifier$-Oberfläche anzuzeigen.\nDamit große Mods möglichst vollständig laden, empfohlene Ladereihenfolge: große Mods zuerst, dann kleine Mods, dann UI-Mods, zuletzt $SKY_WINDOW_TITLE$. Da später geladene Dateien frühere überschreiben, sorgt $SKY_WINDOW_TITLE$ zuletzt dafür, dass seine UI-Änderungen andere UI-Mods überschreiben.\nBei Problemen kontaktieren Sie mich gern über QQ oder Discord. Ich werde mein Bestes tun, um zu helfen."
