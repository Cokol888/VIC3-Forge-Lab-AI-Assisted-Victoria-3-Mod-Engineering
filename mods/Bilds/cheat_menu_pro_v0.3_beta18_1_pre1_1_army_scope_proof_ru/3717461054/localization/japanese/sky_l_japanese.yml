 SKY_B1_TT_INTEGRATE_ALL: "#BOLD 統合州#!\n$SKY_line$\n$SKY_LC$ すべてを含める $SKY_SELF_COUNTRY$ 州。\n$SKY_SL$ 法人化のスピードが100%向上。\n$SKY_AL$ 結晶化速度が5%上昇します。\n$SKY_CL$ 設立のスピード #n -#!100%.\n$SKY_RC$ 法人化速度の修正値をリセットする。\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_CLEAN_POLLUTION: "#BOLD 汚染の浄化#!\n$SKY_line$\n$SKY_LC$ あらゆる分野での汚染を削減する $SKY_SELF_COUNTRY$ 州。\n$SKY_SL$ 汚染の影響 #n -#!100%.\n$SKY_AL$ 汚染の影響 #n -#!5%.\n$SKY_CL$ 汚染の影響が100%増加。\n$SKY_RC$ 汚染の影響修正値をリセットする。\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_THROUGHPUT_ALL: "#BOLD スループット#!\n$SKY_line$\n$SKY_LC$ すべて $SKY_SELF_COUNTRY$ 20％増。\n$SKY_SL$ すべて $SKY_SELF_COUNTRY$ +1000%と表示されます。\n$SKY_AL$ すべて $SKY_SELF_COUNTRY$ +5%と報告されている。\n$SKY_CL$ すべて $SKY_SELF_COUNTRY$ 州 #n -#!20%.\n$SKY_RC$ 了解。\n$SKY_line$\n$SKY_stackable$"
