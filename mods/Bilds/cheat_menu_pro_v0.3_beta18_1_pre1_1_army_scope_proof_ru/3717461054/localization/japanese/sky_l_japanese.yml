 SKY_B1_TT_TREASURY_CAP_QUICK: "#BOLD $concept_gold_reserves$#!\n$SKY_line$\n$SKY_LC$@money! を$concept_gold_reserves$の上限の100%分増やす。\n$SKY_SL$@money! を$concept_gold_reserves$の上限の20%だけ増やす。\n$SKY_AL$$concept_gold_reserves$ の上限の100%分、@money!を減らす。\n$SKY_CL$ $SKY_MARKED_COUNTRY$@money!、$concept_gold_reserves$の上限値の100%だけ減らす。\n$SKY_RC$$concept_gold_reserves$ の上限の99,999%分、@money!を増やす。\n$SKY_line$\nより詳細な調整は、エコノミーのページで行うことができます。"
