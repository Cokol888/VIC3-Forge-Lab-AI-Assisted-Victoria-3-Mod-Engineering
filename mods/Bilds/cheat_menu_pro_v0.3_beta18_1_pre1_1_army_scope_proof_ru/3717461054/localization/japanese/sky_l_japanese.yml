SKY_1_1_B7_TT_FORM_MARKED_CHANGE_TAG: "#BOLD 対象国を新国家へ変更#!\n$SKY_line$\n$SKY_LC$ 対象国を選択TAGへ変更し、対応文化と国教を適用。\n$SKY_RC$ 対象国を選択TAGへ変更のみ。"
SKY_1_1_B7_TT_FORM_MARKED_RELEASE_COUNTRY: "#BOLD 対象国標記州に新国家を建国#!\n$SKY_line$\n$SKY_LC$ 対象国標記州に選択TAGを建国。\n\nプレイヤーは新国家へ切替しない。"
SKY_1_1_B7_TT_FORM_APPLY_IDENTITY: "#BOLD 選択TAGの文化・国教へ#!\n$SKY_line$\n$SKY_LC$ 我国を選択TAGの文化と国教へ変更。\n$SKY_RC$ 対象国を選択TAGの文化と国教へ変更。"
SKY_1_1_SP_GUIDE_BTN1: "$SKY_DEFAULT_TITLE$！\n使用前に、喜児よりボタン操作論理を説明します。#P 左クリック#!で効果を追加。詳細はボタンにカーソルを合わせて確認。追加効果が$concept_modifier$の場合、#N 右クリック#!で当該$concept_modifier$を削除できます。多くのボタンは組合せキー対応。任意のキーを押しながら左クリックしてください。\N@innovation!通常、#p 左クリック#!は$xier$が有益かつ妥当と考える数値。#BLUE Shift#!は百倍以上の数値。#COLOR:{0.3686,0.3961,0.7216} Alt#!は精密調整用の小数値。#GOLD Ctrl#!は通常、逆効果です。"
SKY_1_1_SP_GUIDE_BTN2: "大半の標記機能は#BOLD 同時に一対象のみ#!対応。本頁の商品・企業標記も同様。第一頁の滑杆で収入を調整できます。#I クリック#!で必要値を選び、下方の確認ボタンで実行。修正を削除するには#N 右クリック#!、または滑杆を#n 0#!へ。"
SKY_1_1_SP_GUIDE_BTN3: "国内または亡命中の人物は、人物を右クリックし、出現メニューで#yellow $sakuya_mark_character$#!を選べば標記完了。外国人物は先に対象国を標記し、本頁の#YELLOW $SKY_B3_CHAR_MARK_OPEN$#!から事件内で標記人物を選択。"
SKY_1_1_SP_GUIDE_BTN4: "#yellow $SKY_B4_TAKE_MARKED_NAVY_SHIPS$#!と#yellow $SKY_1_1_B4_BTN_DESTROY_SHIPS$#!は先に艦隊標記が必要。#BLUE Shift#!を押しながら#yellow $SKY_R4_MARK_ARMY$#!をクリックし、事件で標記艦隊を選択できます。\N外交劇や戦争開始時は、戦争目標が合法か確認が必要。条件不満の場合、操作失敗の可能性あり。$CMP$の他機能にも同様の事例があります。"
SKY_1_1_SP_GUIDE_BTN5: "$CMP$の他標記系と同じく、$SKY_B5_SUBSEC_1$で標記した$concept_interest_group$は他の変更項目に参照されます。選択中の利益集団は、利益集団の事前標記が必要な一部機能を点灯させます。例えば$sakuya_mark_character$所属利益集団の変更など。多くの場合、$concept_interest_group$は一つのみ選択を推奨。"
SKY_1_1_SP_GUIDE_BTN6: "所有州を右クリックし、メニューから#yellow $decree_sakuya_mark_state$#!を選択すると、調整したい$state$を標記できます。下方#i $concept_political_lens$#!の$mm_issue_decree_interaction$から#yellow $decree_sakuya_mark_state$#!を選ぶことも可能で、地図上標記が容易になります。外国州を標記する場合、対象国を右クリックし#yellow $sakuya_mark_foreign_state$#!を選択。\N#T #N 一度に一地点のみ標記することを強く推奨！#!#!"
SKY_1_1_SP_GUIDE_BTN6_tab4: "建造物選択器で調整したい建造物分類を選ぶと、メニュー左下に現在選択中の建造物が表示されます。先に$decree_sakuya_mark_state$で対象$state$を選択し、滑杆で必要値を調整後、#yellow $SKY_B6_BUILD_ADD_BUILDING$#!をクリックしてください。#n 0#!段階はこの建造物または資源潜在を消去します。建造物や資源潜在の追加成否は、プレイヤーまたは対象国の#N 技術#!などの条件に依存。\N$SKY_B6_BUILD_CAT_RESOURCE$と$SKY_B6_BUILD_CAT_AGRICULTURE$分類の建造物は、#yellow $SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL$#!にも対応。"
SKY_1_1_SP_GUIDE_BTN6_tab5: "\N本頁の修正は、#yellow $SKY_B6_RESERVED_BUILD_R2_C1$#!と#yellow $SKY_B6_RESERVED_BUILD_R2_C2$#!が$state$対象である以外、すべて$concept_buildings$対象です。対応$concept_modifier$を見るには、変更済みの$concept_buildings$をクリックしてください。"
SKY_1_1_SP_GUIDE_BTN7: "\N標記したい国を右クリックし、#yellow $sakuya_mark_country$#!を選択すれば標記完了。下方#i $concept_diplomatic_lens$#!の$concept_diplomatic_actions$から#yellow $sakuya_mark_country$#!を選ぶことも可能で、地図上標記が容易になります。"
 SKY_1_1_SP_GUIDE_BTN8: "\N\N#yellow $SKY_BTN8_TAB_TECHNOLOGY$#! 集まる $concept_technology$…に関連する修飾子。上のタブを使って切り替えてください $production$, $military$、および $society$. ほとんどのボタンは、標準的な「大ボタン／小ボタン」のルールに従っており、右クリックすると対応する $concept_modifier$.\N\Nそして #yellow $SKY_BTN8_TAB_CULTURE$#!、クリック #yellow $SKY_B8_CULTURE_MARK$#! 開く $SKY_1_2_CULTURE_INDEX_TITLE$#!. 対象を選択してください $concept_culture$ ～の中で $concept_culture$ セレクタを指定し、それを $concept_primary_cultures$, $concept_homelands$、およびその他の文化関連の機能。"
SKY_1_1_SP_GUIDE_BTN9: "\n$CMP$の大標題にカーソルを一秒置いてみて...？\n@innovation!壁紙により異なる内容が見られます。"
SKY_1.1_CLOSE: "クリックで閉じる。"
SKY_B4_TT_JOIN_WAR_INITIATOR_SIDE: "#tooltip_header 参戦#!\n\n選択中戦争の発起側陣営へ国家を加入させる。\n先に戦争を選択する必要あり。\n$SKY_line$\n$SKY_LC$ プレイヤーが発起側へ加入\n$SKY_RC$ 標記国が発起側へ加入\n$SKY_SL$ 可能ならプレイヤー離脱\n$SKY_AL$ 可能なら標記国離脱"
