 SKY_B3_TT_GOODS_OBSESSION_SELECTED_CULTURE: "#BOLD 文化への執着：刻印された文化#!\n$SKY_line$\n#lore 選択したアイテムが1つと、マークされたアイテムが1つ必要です $concept_culture$.#!\n\n$SKY_LC$ 選択した商品への執着をマークに追加する $concept_culture$.\n$SKY_RC$ マークされた項目から、選択された商品への執着を取り除く $concept_culture$.\N\N必ず $concept_culture$ まず。 #LORE どうマークすればいいか分からない $concept_culture$? 開く #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$、次に $SKY_1_2_CULTURE_INDEX_TITLE$#!."
 SKY_B3_TT_GOODS_TABOO_SELECTED_CULTURE: "#BOLD 文化的タブー：烙印を押された文化#!\n$SKY_line$\n#lore 選択したアイテムが1つと、マークされたアイテムが1つ必要です $concept_culture$.#!\n\n$SKY_LC$ 選択した商品に対するタブーをマークに追加する $concept_culture$.\n$SKY_RC$ 選択した商品に対するタブーを、マークされたものから解除する $concept_culture$.\N\N必ず $concept_culture$ まず。 #LORE どうマークすればいいか分からない $concept_culture$? 開く #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$、次に $SKY_1_2_CULTURE_INDEX_TITLE$#!."
