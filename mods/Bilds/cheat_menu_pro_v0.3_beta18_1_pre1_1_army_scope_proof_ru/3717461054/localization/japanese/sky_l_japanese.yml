 sakuya_superdip_beguile_country_01_desc: "この国との外交関係を改善するために、咲夜が自ら介入しよう。"
 notification_sakuya_superdip_annex_country_toast_name: "[SCOPE.sCountry('actor').GetName] 統一された [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_annex_country_toast_desc: "咲夜に説得されて、 [SCOPE.sCountry('target').GetRuler.GetFullName] に署名した [SCOPE.sCountry('actor').GetCapital.GetCityHubName] 条約における [SCOPE.sCountry('target').GetCapital.GetCityHubName]、および [SCOPE.sCountry('target').GetName] そして [SCOPE.sCountry('actor').GetName] ついに統一を果たした。"
 notification_sakuya_superdip_annex_country_toast_tooltip: "#header $notification_sakuya_superdip_annex_country_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_annex_country_toast_desc$"
 notification_sakuya_superdip_force_join_power_bloc_toast_name: "[SCOPE.sCountry('target').GetName] 「パワー・ブロック」に参加しました"
 notification_sakuya_superdip_force_join_power_bloc_toast_desc: "[SCOPE.sCountry('target').GetRuler.GetFullName] 会議の後、彼は作矢による国際情勢の説明が明快で、反論の余地がないと認めた。 [SCOPE.sCountry('target').GetName] その後、～に加入した $concept_power_bloc$ それ [SCOPE.sCountry('actor').GetName] に属する。"
 notification_sakuya_superdip_force_join_power_bloc_toast_tooltip: "#header $notification_sakuya_superdip_force_join_power_bloc_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_force_join_power_bloc_toast_desc$"
 sakuya_superdip.3.t: "サクヤは説得した [SCOPE.sCountry('sakuya_superdip_target_country').GetName]'s [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]"
 sakuya_superdip.3.d: "非公開の会談で、サクヤは説得した [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] ～との関係を再考する [SCOPE.sCountry('sakuya_superdip_actor_country').GetName]."
 sakuya_superdip.3.f: "会議が終わる頃には、 [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] もともと用意していた厳しい内容のメモはすでに引き出しに戻し、次回の打ち合わせの手配を依頼していた。サクヤは、まるでそれが当然のことであるかのように、ただ淡々と懐中時計を閉じた。"
 sakuya_superdip.3.a: "それはいいことだ。"
