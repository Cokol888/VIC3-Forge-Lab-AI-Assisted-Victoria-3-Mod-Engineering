 SKY_B5_TT_FX_3: "#BOLD 政府加入/排除強制#!\n$SKY_LC$ 現在対象を直接政府へ追加。\n$SKY_RC$ 現在対象を直接政府から除外。"
 SKY_B5_TT_FX_4: "#BOLD 革命加入/離脱#!\n$SKY_LC$ 現在対象をこの国の進行中革命へ参加させる。\n$SKY_RC$ 現在対象をこの国の進行中革命から離脱させる。\n#lore この国に革命的政治運動または分離主義政治運動がある場合のみクリック可。複数存在時は、この国の既存革命に一律追随。#!"
 SKY_B5_TT_FX_5: "#BOLD 指定$concept_character$乗取#!\n$SKY_LC$ 指定$concept_character$に、所属する選択済み$concept_interest_group$を乗っ取らせる。\n#lore 指定$concept_character$が必要で、その$concept_character$は既に選択IG所属である必要がある。#!"
 SKY_B5_TT_FX_8: "#BOLD 新指導者作成#!\n$SKY_LC$ 新たな$ideology_moderate$指導者を生成し、選択IGを直接掌握させる。\n$SKY_SL$ 新たな$ideology_radical$指導者を生成し、選択IGを直接掌握させる。\n$SKY_AL$ 新たな$ideology_communist$指導者を生成し、選択IGを直接掌握させる。\n$SKY_CL$ 新たな$ideology_market_liberal$指導者を生成し、選択IGを直接掌握させる。"
