 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold 対象: 自国主要文化#!\n\n$SKY_LC$ 国指定時: 対象国の全主要文化を自国主要文化から除去\n$SKY_RC$ 自国に指定$concept_state$がある場合: その$concept_state$の本土文化を自国主要文化から除去\n$SKY_SL$ 国指定かつ対象国に指定$concept_state$がある場合: その$concept_state$の本土文化を自国主要文化から除去\n$SKY_CL$ $concept_character$指定時: その人物の文化を自国主要文化から除去\n$SKY_line$\n#n 警告: 国の最後の主要文化は除去されない。どの国も主要文化なしにしてはならない。セーブ破損の恐れあり。#!"
