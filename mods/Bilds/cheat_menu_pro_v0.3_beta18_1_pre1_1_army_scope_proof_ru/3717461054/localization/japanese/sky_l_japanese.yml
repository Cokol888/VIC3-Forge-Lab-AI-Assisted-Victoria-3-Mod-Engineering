 SKY_B8_TT_LAWSET_SHIT: "#BOLD 暗黒国家#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$を完全な暗黒法群へ切替\n$SKY_RC$ $SKY_MARKED_COUNTRY$を完全な暗黒法群へ切替\n$SKY_line$\n#italic 国を最暗黒の時代へ引き戻し、全権利を剥奪。国指定がない場合、右クリックは無効。#!"
 SKY_B8_TT_HOW_DARE_U: "#BOLD HOW DARE U#!\n\n$SKY_LC$ 極強力な軍事補正を$SKY_SELF_COUNTRY$へ適用\n$SKY_AL$ 極強力な軍事補正を$SKY_MARKED_COUNTRY$へ適用\n$SKY_SL$ 負版を$SKY_SELF_COUNTRY$へ適用\n$SKY_CL$ 負版を$SKY_MARKED_COUNTRY$へ適用\n$SKY_RC$ このボタン関連補正を消去\n$SKY_line$\n#italic 正版は陸軍3、海軍3、戦闘2、威信2の補正を含む。殺傷率99999。負版は軍事値を一律-999にし、威信を+90%へ反転。国指定がない場合、Alt/Ctrlは無効。#!"
 SKY_B8_TT_DOOMFALL: "#BOLD 破滅#!\n\n$SKY_LC$ $SKY_MARKED_COUNTRY$に経済と革命の爆弾を埋め、国庫上限1000%相当の資金を直接減算\n$SKY_AL$ 同効果を$SKY_SELF_COUNTRY$に適用し、国庫上限1000%相当の資金を直接減算\n$SKY_RC$ このボタン関連補正を消去\n$SKY_line$\n#italic 急進性、革命、混沌、経済停滞に集中。建設力は直接-99999に設定。国指定がない場合、左クリックは無効。#!"
 SKY_B8_TT_SOCIAL_COLLAPSE: "#BOLD 社会崩壊#!\n\n$SKY_LC$ $SKY_MARKED_COUNTRY$を制度、人口、社会秩序の崩壊へ投げ込む\n$SKY_AL$ 同じ状態を$SKY_SELF_COUNTRY$へ適用\n$SKY_RC$ このボタン関連補正を消去\n$SKY_line$\n#italic 正統性、体制派、移住、混乱、各種社会制度上限の全面腐敗に集中。生活水準は直接-19に設定。国指定がない場合、左クリックは無効。#!"
