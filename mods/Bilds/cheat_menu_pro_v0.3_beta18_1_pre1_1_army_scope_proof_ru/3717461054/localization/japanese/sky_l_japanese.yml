 SKY_B8_TT_REGENCY: "#BOLD 摂政#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$に摂政を追加\n$SKY_RC$ $SKY_SELF_COUNTRY$から摂政を除去\n$SKY_SL$ $SKY_MARKED_COUNTRY$に摂政を追加\n$SKY_CL$ $SKY_MARKED_COUNTRY$から摂政を除去\n$SKY_line$\n#italic 君主制法を持つ国にのみ適用。国指定がない場合、Shift/Ctrlは無効。#!"
