 SKY_B8_TT_MARTYR_EXILE: "#BOLD 殉教亡命#!\n\n$SKY_LC$ 現在指定中の$concept_character$を政治的殉教者として亡命させる。\n$SKY_line$\n#italic 対象人物は亡命し、祖国に政治的殉教者の影響を残す。人物が選択されていることを確認せよ。#!"
 SKY_B8_TT_DISINHERIT: "#BOLD 廃嫡#!\n\n$SKY_LC$ 現在指定中の$concept_character$を廃嫡。\n$SKY_line$\n#italic 先に人物指定が必要。通常は継承制度を持つ対象にのみ意味がある。#!"
 SKY_B8_TT_LAWSET_LIBERAL: "#BOLD 自由主義国家#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$に完全な自由主義法群を採用させる\n$SKY_RC$ $SKY_MARKED_COUNTRY$に完全な自由主義法群を採用させる\n$SKY_line$\n#italic この操作は国の関連法を即時変更。国指定がない場合、右クリックは無効。#!"
