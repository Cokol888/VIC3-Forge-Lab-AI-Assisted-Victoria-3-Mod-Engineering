 SKY_B3_TRAIT_GROUP_TT_AGITATOR: "#BOLD 扇動者#!\n$SKY_line$\n$SKY_LC$ 政治扇動に向いた特性一式を追加します。\n$SKY_RC$ この特性一式を削除します。\n$SKY_line$\n魅力、求心力、政治組織、演説、扇動、社会運動を重視します。"
 SKY_B3_TRAIT_GROUP_TT_RULER: "#BOLD 統治者#!\n$SKY_line$\n$SKY_LC$ 国家統治に向いた特性一式を追加します。\n$SKY_RC$ この特性一式を削除します。\n$SKY_line$\n外交、行政、植民地、政治組織、威信、国家運営を重視します。"
 SKY_B3_TRAIT_GROUP_TT_ALL_ROUNDER: "#BOLD 万能型#!\n$SKY_line$\n$SKY_LC$ 幅広く役立つ特性一式を追加します。\n$SKY_RC$ この特性一式を削除します。\n$SKY_line$\n統治、会社、政治、外交、陸軍、海軍で使いやすい強みをまとめます。"

