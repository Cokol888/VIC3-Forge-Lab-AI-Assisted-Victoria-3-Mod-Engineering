 sakuya_superdip_humiliate_01_action_name: "咲夜にこの国を辱めてもらおう。"
 sakuya_superdip_humiliate_01_desc: "我が国の支配者に代わって、咲夜をこの国の大使と会食させるのだ。"
 sakuya_superdip_humiliation_pact_01: "$humiliation$"
 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "サクヤは、極めて不適切な外交晩餐会を通じて対象国を辱め、国際社会におけるその国の評判を傷つける。期間：5年間。"
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] は、から送られたサクヤに屈辱を味わわされる [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]期間：5年。"
 sakuya_superdip_humiliation_pact_01_effect_desc_global: "サクヤの屈辱の契約を結ぶ"
 sakuya_superdip_humiliation_pact_01_effect_desc_first: "[COUNTRY.GetNameNoFlag] 咲夜を恥じ入らせる [TARGET_COUNTRY.GetName] 5年間"
 sakuya_superdip_humiliation_pact_01_effect_desc_third: "[COUNTRY.GetName] 咲夜を恥じ入らせる [TARGET_COUNTRY.GetName] 5年間"
 sakuya_superdip.1.t: "外交晩餐会で咲夜が発言！"
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName] サクヤが当局者たちと乱闘を始めたことで、現場は混乱に陥った [SCOPE.sCountry('sakuya_superdip_target_country').GetName] 夕食の席で。"
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] サクヤにベンチを落としたが、彼女はすっと身をかわし、テーブルからケーキを一つ掴むと、それを [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]の頭。 \N\N\"#lore この老いぼれめ……俺を待ち伏せしようとしたのか？ #!\""
 sakuya_superdip.1.a: "いい叱り方だ！"
 sakuya_superdip.1.b: "私は呪いの言葉をかけることにする...。"
 sakuya_superdip.1.c: "咲夜先生、こんなことしないで...。"
 sakuya_superdip.1.c_desc: "その後 [SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName] 彼女を止めようとあらゆる手を尽くしたが、伊佐野咲夜は銀のナイフを一時的にしまい、ワインを一口含み、相変わらず落ち着き払った様子を見せた。"
 notification_sakuya_superdip_humiliation_toast_name: "咲夜は軽蔑の眼差しで屈辱を与えた [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "咲夜は[SCOPE.sCountry('target').GetName]の統治者[SCOPE.sCountry('target').GetRuler.GetFullName]に、文化的洗練に満ちた外交文書を手渡した。なぜか彼らはそれを#BOLD 侮辱#!と受け取った。我々は彼らの粗野さを面白がったが、彼らはかなり不快そうだった。[SCOPE.sCountry('actor').GetName]と[SCOPE.sCountry('target').GetName]の外交関係は悪化したようだ。"
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "サクヤはこう言います：\Nあなたのお母さんはハムスターだった、\Nそれに、お父さんはニワトコの香りがするよ！"
 sakuya_superdip_insult_02: "サクヤはこう言います：\N審判の日が迫っている！\Nルシファーの手下たちが地上を歩き回っている――\Nああ、いや、ただのあなたの国の代表者ですよ。"
 sakuya_superdip_insult_03: "サクヤはこう言います：\Nさらに、あなたの資本は破壊されなければならないと私は確信している！"
 sakuya_superdip_insult_04: "サクヤはこう言います：\N将来、後世の人々が私たちの時代について記述する時、\N彼らは、同情と嫌悪が入り混じった、いわゆる「憐れみ」の眼差しであなたを見るだろう。"
 sakuya_superdip_insult_05: "サクヤはこう言います：\N先ほどのトイレでの時間は、あなたの大使との夕食よりもはるかに楽しかった。"
 sakuya_superdip_insult_06: "サクヤはこう言います：\Nあら、見て。\Nこっちには、なかなか面白い下ネタがあるよ。"
 sakuya_superdip_insult_07: "サクヤはこう言います：\Nあなたの血が、私があなたから取り出した土を、さらに肥沃なものにするだろう。"
 sakuya_superdip_insult_08: "サクヤはこう言います：\N退屈な外交の場には、いつもナマズのような存在がいて盛り上げてくれるものだ。\Nそして君こそ、友よ、この世で一番のナマズだ！"
 sakuya_superdip_insult_09: "サクヤはこう言います：\Nなぜあなたの国では、いつもこんなにもひどいことばかり起きるのですか？\N原因は皆さん全員にあるんじゃないかな。"
 sakuya_superdip_insult_10: "サクヤはこう言います：\N私たちが繰り広げるこの素晴らしいゲームの中で、\N君はただの駒に過ぎない。"
 sakuya_superdip_insult_11: "サクヤはこう言います：\Nあなたの悪行の噂は、アイルランドからカタイまで広まっている。"
 sakuya_superdip_insult_12: "サクヤはこう言います：\Nお前の支配者は、熟れきったバナナ並みの思考力しか持っていない、\Nしかし、人前で排便することにおいては真の天才ぶりを見せている。"
 sakuya_superdip_insult_13: "サクヤはこう言います：\Nあなたの空が彗星で満たされますように。"
 sakuya_superdip_insult_14: "サクヤはこう言います：\Nどんな地図も芸術作品になり得る\Nあなたの国がリストに含まれている限り。"
 sakuya_superdip_insult_15: "サクヤはこう言います：\Nなぜあなたが外交晩餐会でわざと間抜けなふりをするのが好きなのか、私には理解できません。\Nあなたは人生の意味を探していますか、\Nそれとも、単に観客を楽しませるためだけなのか？"
