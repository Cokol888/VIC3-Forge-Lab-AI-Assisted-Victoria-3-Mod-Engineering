 SKY_B3_TRAIT_GROUP_TT_GENERAL: "#BOLD 指揮官#!\n$SKY_line$\n$SKY_LC$ 戦闘指揮に向いた特性一式を追加します。\n$SKY_RC$ この特性一式を削除します。\n$SKY_line$\n陸軍、海軍、地形、砲兵、攻撃、防御、補給、略奪、艦隊指揮を重視します。"
 SKY_B3_TRAIT_GROUP_TT_EXECUTIVE: "#BOLD $concept_company$役員#!\n$SKY_line$\n$SKY_LC$ $concept_company$経営と産業運営に向いた特性一式を追加します。\n$SKY_RC$ この特性一式を削除します。\n$SKY_line$\n処理量、経営、起業家精神、工学、産業運営を重視します。"
