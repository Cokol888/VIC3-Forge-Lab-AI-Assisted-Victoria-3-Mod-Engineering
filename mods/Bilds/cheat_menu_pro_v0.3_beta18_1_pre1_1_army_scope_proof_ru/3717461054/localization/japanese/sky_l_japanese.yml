 SKY_B8_TT_FAMOUS_CHARACTER: "#BOLD 著名人物召喚#!\n\n$SKY_LC$ プレイヤー国に扇動者として加入\n$SKY_RC$ プレイヤー国の統治者になる\n$SKY_AL$ プレイヤー国に将軍として加入\n$SKY_SL$ プレイヤー国に提督として加入\n$SKY_line$\n#italic 同一人物は何度でも召喚可能。役割はクリック方法に依存。#!"
 SKY_ABOUT_WELCOME_1: "#BOLD ようこそ！#!\nはじめまして。私はVictoria 3 Cheat Menu Proの開発者Xierです。Victoria 3で再び会えて光栄です。#BOLD QQ群:#! 734267077。ぜひ参加してください！"
 SKY_ABOUT_WELCOME_2: "#BOLD このMODをどう思いますか？#!\n私は継続開発中です。EU5と比べると、Victoria 3のエンジンは旧作に似て見えますが、実際はかなり違います。ともあれ、皆さんが楽しめることを願っています！皆さんに会えて本当に嬉しいです。"
 SKY_UPDATE_LOG_V1_TITLE: "#BOLD $SKY_WINDOW_TITLE$ v1.0 更新記録#!"
 SKY_UPDATE_LOG_V1_TEXT: "- 初版公開\n- EU5からナビゲーションバー体系を移植\n- 9機能カテゴリ、各12予約ボタン\n- About頁に更新記録、個人設定、情報を収録\n- 簡体字中国語ローカライズ対応"
 SKY_SETTINGS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} 個人設定#!"
 SKY_SETTINGS_PLACEHOLDER: "個人設定は開発中です。今後にご期待ください。\n将来版では背景カスタム、UIテーマ切替などに対応予定です。"
 SKY_ABOUT_LINKS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} 連絡先#!"
 SKY_ABOUT_TEXT_1: "#BOLD $SKY_WINDOW_TITLE$をご利用いただきありがとうございます！#!\nはじめまして。私はXier、北京出身で現在チェコ在住の開発者です。質問があればQQ群またはDiscordサーバーから連絡してください。Xierを支援したい場合、Steam WorkshopでXierにいいねするか、上の支援リンクから寄付できます。\nこのMODは完全無料です。有料経路で入手した場合は直ちに報告してください。Xierはとても感謝します！"
 SKY_ABOUT_TEXT_2: "#BOLD 互換性メモ#!\n$SKY_WINDOW_TITLE$は他MODとの互換性を最大化するよう慎重に設計されています。ただしゲームエンジンの制限により、$concept_modifier$画面を表示するため、妥協として1つのシステムGUIファイルを変更する必要があります。\n大型MODを可能な限り完全に読み込むため、推奨ロード順は大型MOD、小型MOD、UI MOD、最後に$SKY_WINDOW_TITLE$です。ゲームは後読み込みファイルで先読み込みファイルを上書きするため、$SKY_WINDOW_TITLE$を最後に置けば、そのUI変更が他UI MODを上書きします。\n使用中に問題があれば、QQ群またはDiscordサーバーからお気軽に連絡してください。できる限り支援します。"
