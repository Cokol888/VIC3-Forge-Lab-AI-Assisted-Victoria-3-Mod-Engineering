 SKY_B7_TT_AI_STRATEGY_SUBJECT_MAINTAIN_AUTONOMY: "#T $ai_strategy_subject_maintain_autonomy$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ 現在選択されている戦略に変更されます。\N\N#lore $SKY_TARGET_COUNTRY$ 現状を維持したいと考えている $concept_autonomy$ その下で $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_OVERLORD_COMPLIANCE: "#T $ai_strategy_subject_overlord_compliance$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ 現在選択されている戦略に変更されます。\N\N#lore $SKY_TARGET_COUNTRY$ 自社の……との連携を強化したいと考えている $concept_overlord$ そして、その指示に忠実に従います。#!"
