 SKY_1_2_B4_TT_SHIP_CONSTRUCTION_CAPACITY_DISABLED: "#BOLD Capacité de construction navale#!\n$SKY_line$\nCette option générait un grand nombre de files d'attente de construction de convois qui ne pouvaient pas être annulées ; elle est donc désormais désactivée.\n\n$SKY_LC$ Effacer les modificateurs associés.\n$SKY_RC$ Effacer les modificateurs associés."
 SKY_1_2_B4_TT_SUPPLY_SHIP_RATIO_DISABLED: "#BOLD Taux de convoi#!\n$SKY_line$\nCette option augmentait la charge de la file d'attente de construction des convois ; elle est donc désormais désactivée.\n\n$SKY_LC$ Effacer les modificateurs associés.\n$SKY_RC$ Effacer les modificateurs associés."
 SKY_B6_TT_PRINCIPLE_NAVY: "#BOLD $principle_group_navy$#!\n\n$SKY_LC$ $SKY_R5_ADD_LV3$$principle_group_navy$\n$SKY_SL$ $SKY_R5_ADD_LV2$$principle_group_navy$\n$SKY_AL$ $SKY_R5_ADD_LV1$$principle_group_navy$\n$SKY_RC$ $SKY_R5_REMOVE_ALL_LV$\n\n#lore $principle_group_navy_desc$#!"
 SKY_B7_TT_SUBJECTS_LIBERTY_DESIRE: "#BOLD $concept_liberty_desire$ de tous les sujets#!\n$SKY_line$\n$SKY_LC$ Tous les sujets de $SKY_SELF_COUNTRY$: -20 $concept_liberty_desire$\n$SKY_RC$ Tous les sujets de $SKY_SELF_COUNTRY$: +20 $concept_liberty_desire$\n$SKY_AL$ Tous les sujets de $SKY_SELF_COUNTRY$: -5 $concept_liberty_desire$\n$SKY_CL$ Si $SKY_MARKED_COUNTRY$ existe, tous les sujets de $SKY_TARGET_COUNTRY$: -20 $concept_liberty_desire$\n$SKY_SL$ Si $SKY_MARKED_COUNTRY$ existe, tous les sujets de $SKY_TARGET_COUNTRY$: +20 $concept_liberty_desire$"
 SKY_B7_TT_SUBJECTS_LIBERTY_MOD: "#BOLD $concept_liberty_desire$ $concept_modifier$ des sujets#!\n$SKY_line$\n$SKY_LC$ Ajouter -20 de $concept_liberty_desire$ $concept_modifier$ des sujets à $SKY_SELF_COUNTRY$.\n$SKY_SL$ Ajouter +20 de $concept_liberty_desire$ $concept_modifier$ des sujets à $SKY_SELF_COUNTRY$.\n$SKY_AL$ Ajouter -5 de $concept_liberty_desire$ $concept_modifier$ des sujets à $SKY_SELF_COUNTRY$.\n$SKY_CL$ Si $SKY_MARKED_COUNTRY$ existe, ajouter -20 de $concept_liberty_desire$ $concept_modifier$ des sujets à $SKY_TARGET_COUNTRY$.\n$SKY_RC$ Retirer le $concept_liberty_desire$ $concept_modifier$ des sujets de ce petit bouton."
