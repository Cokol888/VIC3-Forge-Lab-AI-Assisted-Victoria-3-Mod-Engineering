 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Cible : nos cultures principales#!\n\n$SKY_LC$ Si un pays est marqué : ajoute toutes les cultures principales du pays cible aux nôtres\n$SKY_RC$ Si nous avons un $concept_state$ marqué : ajoute les cultures de foyer de ce $concept_state$ à nos cultures principales\n$SKY_SL$ Si un pays est marqué et que le pays cible a un $concept_state$ marqué : ajoute les cultures de foyer de ce $concept_state$ à nos cultures principales\n$SKY_CL$ Si un $concept_character$ est marqué : ajoute sa culture à nos cultures principales"
 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Cible : cultures principales du pays cible#!\n\n$SKY_LC$ Si un pays est marqué : ajoute toutes nos cultures principales aux cultures principales du pays cible\n$SKY_RC$ Si nous avons un $concept_state$ marqué : ajoute les cultures de foyer de ce $concept_state$ aux cultures principales du pays cible\n$SKY_SL$ Si le pays cible a un $concept_state$ marqué : ajoute les cultures de foyer de ce $concept_state$ aux cultures principales du pays cible\n$SKY_CL$ Si un $concept_character$ est marqué : ajoute sa culture aux cultures principales du pays cible"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Cible : nos cultures principales#!\n\n$SKY_LC$ Si un pays est marqué : retire toutes les cultures principales du pays cible de nos cultures principales\n$SKY_RC$ Si nous avons un $concept_state$ marqué : retire les cultures de foyer de ce $concept_state$ de nos cultures principales\n$SKY_SL$ Si un pays est marqué et que le pays cible a un $concept_state$ marqué : retire les cultures de foyer de ce $concept_state$ de nos cultures principales\n$SKY_CL$ Si un $concept_character$ est marqué : retire sa culture de nos cultures principales\n$SKY_line$\n#n Attention : ne retire jamais la dernière culture principale d’un pays. Ne laissez aucun pays sans culture principale, sinon la sauvegarde peut être endommagée.#!"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Cible : cultures principales du pays cible#!\n\n$SKY_LC$ Si un pays est marqué : retire toutes nos cultures principales des cultures principales du pays cible\n$SKY_RC$ Si nous avons un $concept_state$ marqué : retire les cultures de foyer de ce $concept_state$ des cultures principales du pays cible\n$SKY_SL$ Si le pays cible a un $concept_state$ marqué : retire les cultures de foyer de ce $concept_state$ des cultures principales du pays cible\n$SKY_CL$ Si un $concept_character$ est marqué : retire sa culture des cultures principales du pays cible\n$SKY_line$\n#n Attention : ne retire jamais la dernière culture principale d’un pays. Ne laissez aucun pays sans culture principale, sinon la sauvegarde peut être endommagée.#!"
