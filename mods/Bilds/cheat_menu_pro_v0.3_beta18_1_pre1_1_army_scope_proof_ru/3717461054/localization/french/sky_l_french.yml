 SKY_B8_TT_RECOGNIZED: "#BOLD Reconnu#!\n\n$SKY_LC$ Rend $SKY_SELF_COUNTRY$ reconnu\n$SKY_RC$ Rend $SKY_SELF_COUNTRY$ non reconnu\n$SKY_SL$ Rend $SKY_MARKED_COUNTRY$ reconnu\n$SKY_CL$ Rend $SKY_MARKED_COUNTRY$ non reconnu\n$SKY_line$\n#italic Sans pays marqué, Shift/Ctrl n’a aucun effet.#!"
 SKY_B8_TT_REGENCY: "#BOLD Régence#!\n\n$SKY_LC$ Ajoute régence à $SKY_SELF_COUNTRY$\n$SKY_RC$ Retire régence de $SKY_SELF_COUNTRY$\n$SKY_SL$ Ajoute régence à $SKY_MARKED_COUNTRY$\n$SKY_CL$ Retire régence de $SKY_MARKED_COUNTRY$\n$SKY_line$\n#italic Ne vaut que pour les pays avec loi monarchique. Sans pays marqué, Shift/Ctrl n’a aucun effet.#!"
 SKY_B8_TT_COLONIAL: "#BOLD Statut colonial#!\n\n$SKY_LC$ Définit $SKY_SELF_COUNTRY$ comme pays colonial\n$SKY_SL$ Définit $SKY_MARKED_COUNTRY$ comme pays colonial\n$SKY_line$\n#italic Change de force le statut du pays. Sans pays marqué, Shift n’a aucun effet.#!"
 SKY_B8_TT_RETIRE: "#BOLD Retraite forcée#!\n\n$SKY_LC$ Retire aussitôt le $concept_character$ marqué.\n$SKY_line$\n#italic Requiert d’abord un personnage marqué.#!"
 SKY_B8_TT_MARTYR_EXILE: "#BOLD Exil martyr#!\n\n$SKY_LC$ Exile le $concept_character$ marqué comme martyr politique.\n$SKY_line$\n#italic Le personnage cible sera exilé et laissera un effet de martyr politique au pays. Vérifiez qu’un personnage est choisi.#!"
 SKY_B8_TT_DISINHERIT: "#BOLD Déshériter#!\n\n$SKY_LC$ Déshérite le $concept_character$ marqué.\n$SKY_line$\n#italic Requiert d’abord un personnage marqué. Surtout utile pour les cibles avec succession.#!"
 SKY_B8_TT_LAWSET_LIBERAL: "#BOLD Pays libéral#!\n\n$SKY_LC$ Fait adopter à $SKY_SELF_COUNTRY$ l’ensemble de lois libérales\n$SKY_RC$ Fait adopter à $SKY_MARKED_COUNTRY$ l’ensemble de lois libérales\n$SKY_line$\n#italic Change instantanément toutes les lois concernées du pays. Sans pays marqué, clic droit sans effet.#!"
 SKY_B8_TT_LAWSET_FASCIST: "#BOLD Pays fasciste#!\n\n$SKY_LC$ Bascule $SKY_SELF_COUNTRY$ vers l’ensemble de lois fascistes\n$SKY_RC$ Bascule $SKY_MARKED_COUNTRY$ vers l’ensemble de lois fascistes\n$SKY_line$\n#italic Sans pays marqué, clic droit sans effet.#!"
 SKY_B8_TT_LAWSET_GDP: "#BOLD Orienté PIB#!\n\n$SKY_LC$ Bascule $SKY_SELF_COUNTRY$ vers l’ensemble de lois orientées PIB\n$SKY_RC$ Bascule $SKY_MARKED_COUNTRY$ vers l’ensemble de lois orientées PIB\n$SKY_line$\n#italic Sans pays marqué, clic droit sans effet.#!"
 SKY_B8_TT_LAWSET_SOL: "#BOLD Orienté SoL#!\n\n$SKY_LC$ Bascule $SKY_SELF_COUNTRY$ vers l’ensemble de lois orientées SoL\n$SKY_RC$ Bascule $SKY_MARKED_COUNTRY$ vers l’ensemble de lois orientées SoL\n$SKY_line$\n#italic Sans pays marqué, clic droit sans effet.#!"
 SKY_B8_TT_LAWSET_COMMUNIST: "#BOLD Communisme#!\n\n$SKY_LC$ Bascule $SKY_SELF_COUNTRY$ vers l’ensemble de lois communistes\n$SKY_RC$ Bascule $SKY_MARKED_COUNTRY$ vers l’ensemble de lois communistes\n$SKY_line$\n#italic Sans pays marqué, clic droit sans effet.#!"
 SKY_B8_TT_LAWSET_SHIT: "#BOLD Dystopie#!\n\n$SKY_LC$ Bascule $SKY_SELF_COUNTRY$ vers l’ensemble de lois dystopiques\n$SKY_RC$ Bascule $SKY_MARKED_COUNTRY$ vers l’ensemble de lois dystopiques\n$SKY_line$\n#italic Ramène le pays à l’âge le plus sombre et retire tous les droits. Sans pays marqué, clic droit sans effet.#!"
 SKY_B8_TT_HOW_DARE_U: "#BOLD HOW DARE U#!\n\n$SKY_LC$ Applique un modificateur militaire extrême à $SKY_SELF_COUNTRY$\n$SKY_AL$ Applique un modificateur militaire extrême à $SKY_MARKED_COUNTRY$\n$SKY_SL$ Applique la version négative à $SKY_SELF_COUNTRY$\n$SKY_CL$ Applique la version négative à $SKY_MARKED_COUNTRY$\n$SKY_RC$ Efface les modificateurs liés à ce bouton\n$SKY_line$\n#italic Version positive : 3 modifs armée, 3 marine, 2 combat, 2 prestige. Taux de tuerie 99999. Version négative : valeurs militaires à -999, prestige inversé à +90%. Sans pays marqué, Alt/Ctrl sans effet.#!"
 SKY_B8_TT_DOOMFALL: "#BOLD Chute funeste#!\n\n$SKY_LC$ Place une bombe économique et révolutionnaire dans $SKY_MARKED_COUNTRY$ et retire 1000% de sa limite de trésor en argent\n$SKY_AL$ Même effet sur $SKY_SELF_COUNTRY$ et retire 1000% de sa limite de trésor en argent\n$SKY_RC$ Efface les modificateurs liés à ce bouton\n$SKY_line$\n#italic Vise radicalisme, révolution, chaos et stagnation économique. Capacité de construction fixée à -99999. Sans pays marqué, clic gauche sans effet.#!"
 SKY_B8_TT_SOCIAL_COLLAPSE: "#BOLD Effondrement social#!\n\n$SKY_LC$ Plonge $SKY_MARKED_COUNTRY$ dans l’effondrement institutionnel, démographique et social\n$SKY_AL$ Applique le même état à $SKY_SELF_COUNTRY$\n$SKY_RC$ Efface les modificateurs liés à ce bouton\n$SKY_line$\n#italic Vise légitimité, loyalistes, migration, troubles et plafonds d’institutions sociales. SoL fixé directement à -19. Sans pays marqué, clic gauche sans effet.#!"
