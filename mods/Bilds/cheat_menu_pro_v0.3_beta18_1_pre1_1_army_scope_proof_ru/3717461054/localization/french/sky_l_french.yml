 SKY_B3_TT_GOODS_OBSESSION_SELECTED_CULTURE: "#BOLD Obsession culturelle : une culture marquée#!\n$SKY_line$\n#lore Nécessite exactement 1 produit sélectionné et exactement 1 produit marqué $concept_culture$.#!\n\n$SKY_LC$ Ajouter l'obsession pour le produit sélectionné à la liste $concept_culture$.\n$SKY_RC$ Supprimer l'obsession liée au produit sélectionné de la liste $concept_culture$.\N\NVous devez cocher une $concept_culture$ Tout d'abord. #LORE Vous ne savez pas comment marquer un $concept_culture$? Ouvrir #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$, puis sélectionnez une culture dans $SKY_1_2_CULTURE_INDEX_TITLE$#!."
