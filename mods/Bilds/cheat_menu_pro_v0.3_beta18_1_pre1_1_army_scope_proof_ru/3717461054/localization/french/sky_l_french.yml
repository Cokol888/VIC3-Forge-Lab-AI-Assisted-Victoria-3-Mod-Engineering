 SKY_B3_TRAIT_GROUP_TT_GENERAL: "#BOLD Commandant#!\n$SKY_line$\n$SKY_LC$ Ajouter un ensemble complet de traits adaptes au commandement militaire.\n$SKY_RC$ Retirer cet ensemble de traits.\n$SKY_line$\nAxe sur l armee, la marine, le terrain, l artillerie, l attaque, la defense, le ravitaillement, le pillage et le commandement naval."
 SKY_B3_TRAIT_GROUP_TT_EXECUTIVE: "#BOLD Directeur de $concept_company$#!\n$SKY_line$\n$SKY_LC$ Ajouter un ensemble complet de traits adaptes a la gestion de $concept_company$ et de l industrie.\n$SKY_RC$ Retirer cet ensemble de traits.\n$SKY_line$\nAxe sur le rendement, la gestion, l entrepreneuriat, l ingenierie et l administration industrielle."
 SKY_B3_TRAIT_GROUP_TT_BAD_RULER: "#BOLD Mauvais dirigeant#!\n$SKY_line$\n$SKY_LC$ Ajouter un ensemble complet de traits adaptes a un dirigeant desastreux.\n$SKY_RC$ Retirer cet ensemble de traits.\n$SKY_line$\nInclut arrogance, colere, cruaute, luxe, fraude, dependance, incompetence et autres habitudes nuisibles de gouvernement."
 SKY_B3_TRAIT_GROUP_TT_AGITATOR: "#BOLD Agitateur#!\n$SKY_line$\n$SKY_LC$ Ajouter un ensemble complet de traits adaptes a l agitation politique.\n$SKY_RC$ Retirer cet ensemble de traits.\n$SKY_line$\nAxe sur le charisme, l attrait, l organisation politique, les discours, l agitation et les mouvements sociaux."
 SKY_B3_TRAIT_GROUP_TT_RULER: "#BOLD Dirigeant#!\n$SKY_line$\n$SKY_LC$ Ajouter un ensemble complet de traits adaptes au gouvernement d un pays.\n$SKY_RC$ Retirer cet ensemble de traits.\n$SKY_line$\nAxe sur la diplomatie, l administration, les colonies, l organisation politique, le prestige et la gouvernance."
 SKY_B3_TRAIT_GROUP_TT_ALL_ROUNDER: "#BOLD Polyvalent#!\n$SKY_line$\n$SKY_LC$ Ajouter un ensemble complet de traits largement utiles.\n$SKY_RC$ Retirer cet ensemble de traits.\n$SKY_line$\nCombine des atouts courants pour gouverner, les compagnies, la politique, la diplomatie, l armee et la marine."

