 SKY_B7_TT_DOMINION: "#BOLD $concept_dominion$#!\n#lore $concept_dominion_desc$#!\n$SKY_line$\n$SKY_LC$ Fait de $SKY_TARGET_COUNTRY$ un $concept_dominion$ de $SKY_SELF_COUNTRY$\n$SKY_RC$ Fait de $SKY_SELF_COUNTRY$ un $concept_dominion$ de $SKY_TARGET_COUNTRY$"
 SKY_B7_TT_VASSAL: "#BOLD $concept_vassal$#!\n#lore $concept_vassal_desc$#!\n$SKY_line$\n$SKY_LC$ Fait de $SKY_TARGET_COUNTRY$ un $concept_vassal$ de $SKY_SELF_COUNTRY$\n$SKY_RC$ Fait de $SKY_SELF_COUNTRY$ un $concept_vassal$ de $SKY_TARGET_COUNTRY$"
 SKY_B7_TT_TRIBUTARY: "#BOLD $concept_tributary$#!\n#lore $concept_tributary_desc$#!\nSeules les $concept_unrecognized_power$ peuvent avoir des relations de $concept_tributary$.\n$SKY_line$\n$SKY_LC$ Fait de $SKY_TARGET_COUNTRY$ un $concept_tributary$ de $SKY_SELF_COUNTRY$\n$SKY_RC$ Fait de $SKY_SELF_COUNTRY$ un $concept_tributary$ de $SKY_TARGET_COUNTRY$"
 SKY_B7_TT_COLONY: "#BOLD $concept_colony$#!\n#lore $concept_colony_desc$#!\n$SKY_line$\n$SKY_LC$ Fait de $SKY_TARGET_COUNTRY$ une $concept_colony$ de $SKY_SELF_COUNTRY$\n$SKY_RC$ Fait de $SKY_SELF_COUNTRY$ une $concept_colony$ de $SKY_TARGET_COUNTRY$"
 SKY_B7_TT_CHARTERED_COMPANY: "#BOLD $concept_chartered_company$#!\n#lore $concept_chartered_company_desc$#!\n$SKY_line$\n$SKY_LC$ Fait de $SKY_TARGET_COUNTRY$ une $concept_chartered_company$ de $SKY_SELF_COUNTRY$\n$SKY_RC$ Fait de $SKY_SELF_COUNTRY$ une $concept_chartered_company$ de $SKY_TARGET_COUNTRY$"
 SKY_B7_TT_CROWN_LAND: "#BOLD $concept_crown_land$#!\n#lore $concept_crown_land_desc$#!\n$SKY_line$\n$SKY_LC$ Fait de $SKY_TARGET_COUNTRY$ une $concept_crown_land$ de $SKY_SELF_COUNTRY$\n$SKY_RC$ Fait de $SKY_SELF_COUNTRY$ une $concept_crown_land$ de $SKY_TARGET_COUNTRY$"
 SKY_B7_TT_AUTONOMY_AND_INDEPENDENCE: "#BOLD Autonomie et indépendance#!\n$SKY_line$\n$SKY_LC$ Si la cible est sujet de $SKY_SELF_COUNTRY$, réduit son autonomie\n$SKY_RC$ Si la cible est sujet de $SKY_SELF_COUNTRY$, augmente son autonomie\n$SKY_SL$ Si $SKY_SELF_COUNTRY$ est sujet, devient indépendant aussitôt\n$SKY_AL$ Si la cible est sujet, devient indépendante aussitôt"
 SKY_B7_TT_LIBERTY_DESIRE: "#BOLD $concept_liberty_desire$#!\n$SKY_line$\n$SKY_LC$ Réduit de 20 la $concept_liberty_desire$ de $SKY_TARGET_COUNTRY$\n$SKY_RC$ Augmente de 20 la $concept_liberty_desire$ de $SKY_TARGET_COUNTRY$\n$SKY_AL$ Réduit de 5 la $concept_liberty_desire$ de $SKY_TARGET_COUNTRY$\n$SKY_CR$ Si $SKY_SELF_COUNTRY$ est sujet de $SKY_TARGET_COUNTRY$, augmente de 20 la $concept_liberty_desire$ de $SKY_SELF_COUNTRY$\n$SKY_SL$ Si $SKY_SELF_COUNTRY$ est $concept_vassal$ de $SKY_TARGET_COUNTRY$, réduit de 20 la $concept_liberty_desire$ de $SKY_SELF_COUNTRY$"
 SKY_B7_TT_PLAYER_LIBERTY_MOD: "#BOLD $concept_liberty_desire$ $concept_modifier$#!\n$SKY_line$\n$SKY_LC$ $SKY_SELF_COUNTRY$ +20 $concept_liberty_desire$ $concept_modifier$\n$SKY_RC$ $SKY_SELF_COUNTRY$ -20 $concept_liberty_desire$ $concept_modifier$\n$SKY_SL$ Si $SKY_MARKED_COUNTRY$ existe, $SKY_TARGET_COUNTRY$ +20 $concept_liberty_desire$ $concept_modifier$\n$SKY_CL$ Si $SKY_MARKED_COUNTRY$ existe, $SKY_TARGET_COUNTRY$ -20 $concept_liberty_desire$ $concept_modifier$\n$SKY_AL$ Retire globalement les $concept_modifier$s de $concept_liberty_desire$ du joueur et de la cible"
 SKY_B7_TT_ACQUIRE_TREATY_PORT: "#BOLD Acquérir $concept_treaty_port$#!\n#lore $concept_treaty_port_desc$#!\n$SKY_line$\n$SKY_LC$ Si un $concept_state$ étranger est marqué, cède un $concept_treaty_port$ de ce $concept_state$ à $SKY_SELF_COUNTRY$\n$SKY_RC$ Si un $concept_state$ de $SKY_SELF_COUNTRY$ est marqué, cède un $concept_treaty_port$ de ce $concept_state$ à $SKY_MARKED_COUNTRY$"
 SKY_B7_TT_CEDE_HOME_STATE: "#BOLD Cède $SKY_SELF_COUNTRY$ $concept_state$#!\n$SKY_line$\n$SKY_LC$ Donnez ce qui est marqué $SKY_SELF_COUNTRY$ $concept_state$ à $SKY_MARKED_COUNTRY$.\n$SKY_RC$ Donne-le à $SKY_MARKED_COUNTRY$ et en faire immédiatement un État constitué en société."
 SKY_B7_TT_TAKE_FOREIGN_STATE: "#BOLD Choisissez « Étranger » $concept_state$#!\n$SKY_line$\n$SKY_LC$ Joindre le document étranger annoté $concept_state$ directement dans $SKY_SELF_COUNTRY$.\n$SKY_RC$ Joindre en annexe $SKY_SELF_COUNTRY$ et en faire immédiatement un État constitué en société."
 SKY_B7_TT_TR_ALLIANCE: "#BOLD $concept_alliance$#!\n#lore $concept_alliance_desc$#!\n$SKY_line$\n$SKY_LC$ Crée une alliance de 99 ans\n$SKY_RC$ Quitte ce type de traité"
 SKY_B7_TT_TR_DEFENSIVE_PACT: "#BOLD $concept_defensive_pact$#!\n#lore $concept_defensive_pact_desc$#!\n$SKY_line$\n$SKY_LC$ Crée un pacte défensif de 99 ans\n$SKY_RC$ Quitte ce type de traité"
 SKY_B7_TT_TR_GUARANTEE_INDEPENDENCE: "#BOLD $concept_guarantee_independence$#!\n#lore $concept_guarantee_independence_desc$#!\n$SKY_line$\n$SKY_LC$ $SKY_SELF_COUNTRY$ garantit l’indépendance de $SKY_TARGET_COUNTRY$\n$SKY_RC$ Retire ce type de traité"
 SKY_B7_TT_TR_SUPPORT_INDEPENDENCE: "#BOLD $support_independence$#!\n#lore $request_support_independence_desc$#!\n$SKY_line$\n$SKY_LC$ $SKY_SELF_COUNTRY$ soutient l’indépendance de $SKY_TARGET_COUNTRY$\n$SKY_RC$ Retire ce type de traité"
 SKY_B7_TT_EMBASSY: "#BOLD $offer_embassy$#!\n$SKY_line$\n$SKY_LC$ $SKY_SELF_COUNTRY$ établit un article d’ambassade avec $SKY_TARGET_COUNTRY$\n$SKY_RC$ Retire ce type de traité"
 SKY_B7_TT_TR_TREATY_PORT: "#BOLD $concept_treaty_port$#!\n#lore $concept_treaty_port_desc$#!\n$SKY_line$\n$SKY_LC$ Crée pour notre pays un traité de port conventionné via le $concept_state$ étranger marqué\n$SKY_RC$ Crée pour le pays marqué un traité de port conventionné via notre $concept_state$ marqué"
 SKY_B7_TT_TR_COMPANY_MONOPOLY: "#BOLD $concept_company$ $SKY_MONOPOLY$#!\n$SKY_line$\n$SKY_LC$ La $concept_company$ joueur marquée $SKY_MONOPOLY$ les centres de commerce de $SKY_TARGET_COUNTRY$\n$SKY_RC$ La $concept_company$ joueur marquée $SKY_MONOPOLY$ les chemins de fer de $SKY_TARGET_COUNTRY$\n$SKY_AL$ La $concept_company$ joueur marquée $SKY_MONOPOLY$ les industries d’armement de $SKY_TARGET_COUNTRY$\n$SKY_CL$ Retire ces trois types de traités $SKY_MONOPOLY$"
 SKY_B3_LAW_TT_APPLY: "#BOLD Changer loi#!\n$SKY_line$\n$SKY_LC$ Fait adopter cette loi à notre pays\n$SKY_RC$ Si un pays est marqué, fait adopter cette loi au pays marqué"
 SKY_B3_LAWMOD_SUBSEC_PROCESS: "#T #COLOR:{0.7275,0.6333,0.4529,1} Processus d’adoption actuel#!#!"
 SKY_B3_LAWMOD_BTN_FORBID_LAW: "Interdire adoption"
 SKY_B3_LAWMOD_BTN_COMPLETE_CANCEL: "Terminer/annuler adoption"
 SKY_B3_LAWMOD_BTN_ENACTMENT_MOD: "Modif. adoption"
 SKY_B3_LAWMOD_TT_FORBID_LAW: "#BOLD Interdire adoption#!\n\n$SKY_LC$ Ajoute un modificateur interdisant de lancer l’adoption de loi.\n$SKY_CL$ Ajoute un modificateur interdisant d’annuler l’adoption de loi.\n$SKY_RC$ Supprime les deux modificateurs."
 SKY_B3_LAWMOD_TT_NO_CURRENT_LAW: "#BOLD Processus d’adoption actuel#!\n\nAucune loi n’est en cours d’adoption."
 SKY_B3_LAWMOD_TT_COMPLETE_CANCEL: "#BOLD Terminer/annuler adoption#!\n\n$SKY_LC$ Adopte immédiatement la loi en cours.\n$SKY_CL$ Annule la loi en cours."
 SKY_B3_LAWMOD_TT_PHASE_SETBACK: "#BOLD Avancer/recul#!\n\n$SKY_LC$ Avance le processus d’adoption actuel d’une phase.\n$SKY_CL$ Ajoute 1 recul au processus d’adoption actuel."
 SKY_B3_LAWMOD_TT_ENACTMENT_MOD: "#BOLD Modif. adoption#!\n\n$SKY_LC$ Ajoute un modificateur positif au processus d’adoption actuel.\n$SKY_CL$ Ajoute un modificateur négatif au processus d’adoption actuel.\n$SKY_RC$ Efface les modificateurs du processus d’adoption actuel."
 SKY_B3_INST_BTN_COLONY_GROWTH: "Croissance coloniale"
 SKY_B3_INST_TT_SIZE_SPEED: "#BOLD Vitesse changement institution#!\n\n$SKY_LC$ +20% vitesse de changement de niveau d’institution.\n$SKY_SL$ +20000% vitesse de changement de niveau d’institution.\n$SKY_AL$ +5% vitesse de changement de niveau d’institution.\n$SKY_CL$ -20% vitesse de changement de niveau d’institution.\n$SKY_RC$ Supprime ce modificateur."
 SKY_B3_INST_TT_COLONY_GROWTH: "#BOLD Croissance coloniale#!\n\n$SKY_LC$ +20% génération de croissance coloniale.\n$SKY_SL$ +20000% génération de croissance coloniale.\n$SKY_AL$ +5% génération de croissance coloniale.\n$SKY_CL$ -20% génération de croissance coloniale.\n$SKY_RC$ Supprime ce modificateur."
 SKY_B3_INST_TT_WORKING_CONDITIONS: "#BOLD Conditions de travail#!\n\n$SKY_LC$ Améliore les conditions de travail de 20%.\n$SKY_SL$ Améliore les conditions de travail de 20000%.\n$SKY_AL$ Améliore les conditions de travail de 5%.\n$SKY_CL$ Dégrade les conditions de travail de 20%.\n$SKY_RC$ Supprime ce modificateur."
 SKY_B3_INST_TT_SET_LEVEL_1: "#BOLD Niveau institution#!\n\n$SKY_LC$ Fixe immédiatement cette institution au niveau 1.\n$SKY_SL$ Niveau max de l’institution actuelle +1, cumulable.\n$SKY_CL$ Niveau max de l’institution actuelle -1.\n$SKY_RC$ Supprime le modificateur de niveau max actuel.\n\nLe niveau d’institution est limité par le maximum autorisé. Même forcé plus haut, tout excès sera ramené à la plage autorisée."
 SKY_B3_INST_TT_SET_LEVEL_2: "#BOLD Niveau institution#!\n\n$SKY_LC$ Fixe immédiatement cette institution au niveau 2."
 SKY_B3_INST_TT_SET_LEVEL_3: "#BOLD Niveau institution#!\n\n$SKY_LC$ Fixe immédiatement cette institution au niveau 3."
 SKY_B3_INST_TT_SET_LEVEL_4: "#BOLD Niveau institution#!\n\n$SKY_LC$ Fixe immédiatement cette institution au niveau 4."
 SKY_B3_INST_TT_SET_LEVEL_5: "#BOLD Niveau institution#!\n\n$SKY_LC$ Fixe immédiatement cette institution au niveau 5."
 SKY_B6_POPGEN_BTN_START: "Démarrer"
 SKY_B6_POPGEN_BTN_START_PLAYER: "Générer dans notre $concept_state$"
 SKY_B6_POPGEN_BTN_START_MARKED: "Générer dans $concept_state$ cible"
 SKY_B6_POPGEN_TT_BTN_AMOUNT: "#BOLD Quantité#!\n\nChoisit la population totale à générer. Niveau 0 efface le choix de quantité."
 SKY_B6_POPGEN_TT_BTN_WORKFORCE: "#BOLD Part active#!\n\nChoisit la part active des nouvelles pops. Niveau 0 efface le choix de ratio."
 SKY_B6_POPGEN_TT_BTN_LITERACY: "#BOLD $concept_literacy$#!\n\nChoisit le $concept_literacy$ des nouvelles pops. Niveau 0 efface le choix de $concept_literacy$."
 SKY_B6_POPGEN_TT_BTN_CULTURE: "#BOLD $concept_culture$#!\n\nChoisit la source de $concept_culture$ des nouvelles pops."
 SKY_B6_POPGEN_TT_START_PLAYER: "#BOLD Générer dans $concept_state$ de $SKY_SELF_COUNTRY$#!\n\nGénère dans les $concept_state$s marqués de $SKY_SELF_COUNTRY$.\n\nRequiert au moins un $concept_state$ marqué dans $SKY_SELF_COUNTRY$, et les choix quantité, part active, $concept_literacy$ et $concept_culture$."
 SKY_B6_POPGEN_TT_START_MARKED: "#BOLD Générer dans $concept_state$ de $SKY_TARGET_COUNTRY$#!\n\nSi $SKY_MARKED_COUNTRY$ existe et a des $concept_state$s marqués, génère dans ces $concept_state$s étrangers.\n\nRequiert les choix quantité, part active, $concept_literacy$ et $concept_culture$, ainsi que $SKY_TARGET_COUNTRY$ et ses $concept_state$s marqués."
 SKY_B6_POPGEN_CULTURE_PLAYER: "Choisir culture propre"
 SKY_B6_POPGEN_TT_CULTURE_PLAYER: "#BOLD Culture propre#!\n\nUtilise la première culture principale du pays joueur."
 SKY_B6_POPGEN_TT_CULTURE_MARKED: "#BOLD Culture du pays cible#!\n\nUtilise la première culture principale du pays marqué. Impossible sans pays marqué."
 SKY_B6_POPMIG_NATIONAL: "Migration internationale"
 SKY_B6_POPMIG_SAME_CULTURE: "Migration même culture"
 SKY_B6_POPMIG_NON_PRIMARY: "Migration culture non principale"
 SKY_B6_POPMIG_POINT: "Migration point à point"
 SKY_B6_POPMIG_TT_NATIONAL: "#BOLD $SKY_B6_POPMIG_NATIONAL$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Déplace 20% de la population de $SKY_MARKED_COUNTRY$ vers les $concept_state$s incorporés de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nUn pays doit d’abord être marqué.\N#lore Chaque pop tentera d’être répartie aléatoirement vers les États valides. Idem ci-dessous.#!"
 SKY_B6_POPMIG_TT_NATIONAL_REV: "#BOLD $SKY_B6_POPMIG_NATIONAL$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Déplace 20% de la population de $SKY_SELF_COUNTRY$ vers les $concept_state$s incorporés de $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nUn pays doit d’abord être marqué."
 SKY_B6_POPMIG_TT_TO_STATE: "#BOLD $SKY_B6_POPMIG_TO_STATE$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Déplace 20% de la population de $SKY_MARKED_COUNTRY$ vers les $concept_state$s marqués de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nRequiert un pays marqué et au moins un $concept_state$ marqué dans $SKY_SELF_COUNTRY$."
 SKY_B6_POPMIG_TT_TO_STATE_REV: "#BOLD $SKY_B6_POPMIG_TO_STATE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Déplace 20% de la population de $SKY_SELF_COUNTRY$ vers les $concept_state$s marqués de $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nRequiert un pays marqué et au moins un $concept_state$ marqué dans ce pays."
 SKY_B6_POPMIG_TT_SAME_CULTURE: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Déplace 20% de la population de $SKY_MARKED_COUNTRY$ appartenant aux cultures principales de $SKY_SELF_COUNTRY$ vers les $concept_state$s marqués de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_SAME_CULTURE_REV: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nDéplace vers $SKY_MARKED_COUNTRY$ la population de $SKY_SELF_COUNTRY$ appartenant aux cultures principales de $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, répartie vers les $concept_state$s incorporés du pays cible.\n$SKY_AL$ 5%, répartie vers les $concept_state$s incorporés du pays cible.\n$SKY_CL$ 50%, répartie vers les $concept_state$s incorporés du pays cible.\n$SKY_SL$ 33%, vers les $concept_state$s marqués du pays cible.\n$SKY_RC$ 100%, répartie vers les $concept_state$s incorporés du pays cible."
 SKY_B6_POPMIG_TT_NON_PRIMARY: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nDéplace la population de culture non principale de $SKY_SELF_COUNTRY$ vers $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, répartie vers les $concept_state$s incorporés du pays cible.\n$SKY_AL$ 5%, répartie vers les $concept_state$s incorporés du pays cible.\n$SKY_CL$ 50%, répartie vers les $concept_state$s incorporés du pays cible.\n$SKY_SL$ 33%, vers les $concept_state$s marqués du pays cible.\n$SKY_RC$ 100%, répartie vers les $concept_state$s incorporés du pays cible."
 SKY_B6_POPMIG_TT_NON_PRIMARY_REV: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Déplace 20% de la population de culture non principale de $SKY_MARKED_COUNTRY$ vers les $concept_state$s marqués de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_POINT: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Déplace 20% de la population des $concept_state$s marqués de $SKY_MARKED_COUNTRY$ vers les $concept_state$s marqués de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n Il est recommandé de ne marquer qu’un État par camp. Si plusieurs sont marqués, le script choisira aléatoirement une cible valide.#!"
 SKY_B6_POPMIG_TT_POINT_REV: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Déplace 20% de la population des $concept_state$s marqués de $SKY_SELF_COUNTRY$ vers les $concept_state$s marqués de $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n Il est recommandé de ne marquer qu’un État par camp. Si plusieurs sont marqués, le script choisira aléatoirement une cible valide.#!"
 SKY_B6_POPMIG_TT_LOW_ACCEPTANCE: "#BOLD $SKY_B6_POPMIG_LOW_ACCEPTANCE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nDéplace vers $SKY_MARKED_COUNTRY$ la population des deux plus bas niveaux d’acceptation de $SKY_SELF_COUNTRY$.\n$SKY_LC$ 20%, répartie vers les $concept_state$s incorporés du pays cible.\n$SKY_AL$ 5%, répartie vers les $concept_state$s incorporés du pays cible.\n$SKY_CL$ 50%, répartie vers les $concept_state$s incorporés du pays cible.\n$SKY_SL$ 33%, vers les $concept_state$s marqués du pays cible.\n$SKY_RC$ 100%, répartie vers les $concept_state$s incorporés du pays cible.\n\nRequiert un pays marqué. $SKY_SL$ requiert aussi au moins un $concept_state$ marqué dans ce pays."
