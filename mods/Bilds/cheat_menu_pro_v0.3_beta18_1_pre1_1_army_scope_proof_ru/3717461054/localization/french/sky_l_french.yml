SKY_1_1_SP_THANKS_3: "Xier a eu la chance de vous rencontrer, et vous remercie pour votre compagnie tout au long du chemin :\n\nPour Okang, utilisateur Afdian_c9b6a, Fan Jiayuan,\nutilisateur Afdian_79091, Gao Fu Shuai Que Er, utilisateur Afdian_jm3J,\nEl Mono, Xiao Shi, HMS Perseus, AbrahamKafe"
SKY_1_1_SP_THANKS_4: "Les mille cinq cents membres\ndes deux groupes de Xier Modifier\net vous"
SKY_1_1_SP_THANKS_5: "Vous rencontrer fut une vraie chance."
