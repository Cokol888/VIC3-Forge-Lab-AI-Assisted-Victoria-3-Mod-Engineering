 SKY_B7_TT_AI_STRATEGY_AGRICULTURAL_EXPANSION: "#T $ai_strategy_agricultural_expansion$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ adoptera la stratégie actuellement choisie.\N\N#lore $SKY_TARGET_COUNTRY$ cherche à étendre sa base agricole et devenir exportateur net de grain.#!"
 SKY_B7_TT_AI_STRATEGY_PLANTATION_ECONOMY: "#T $ai_strategy_plantation_economy$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ adoptera la stratégie actuellement choisie.\N\N#lore $SKY_TARGET_COUNTRY$ veut se concentrer sur les cultures de rente et leur exportation.#!"
 SKY_B7_TT_AI_STRATEGY_RESOURCE_EXPANSION: "#T $ai_strategy_resource_expansion$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ adoptera la stratégie actuellement choisie.\N\N#lore $SKY_TARGET_COUNTRY$ veut investir dans l’exploitation des ressources naturelles.#!"
 SKY_B7_TT_AI_STRATEGY_INDUSTRIAL_EXPANSION: "#T $ai_strategy_industrial_expansion$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ adoptera la stratégie actuellement choisie.\N\N#lore $SKY_TARGET_COUNTRY$ veut bâtir une base industrielle urbaine.#!"
