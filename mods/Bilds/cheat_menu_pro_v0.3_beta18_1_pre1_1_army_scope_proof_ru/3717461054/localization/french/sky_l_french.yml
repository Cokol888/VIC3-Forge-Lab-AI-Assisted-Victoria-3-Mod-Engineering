 SKY_B7_TT_ATTITUDE_FACTOR: "#BOLD $concept_diplomatic_catalyst$#!\n$SKY_line$\n$SKY_LC$ Définit un $concept_diplomatic_catalyst$ positif de $SKY_TARGET_COUNTRY$ envers $SKY_SELF_COUNTRY$\n$SKY_RC$ Définit un $concept_diplomatic_catalyst$ négatif de $SKY_TARGET_COUNTRY$ envers $SKY_SELF_COUNTRY$\n$SKY_SL$ Définit un $concept_diplomatic_catalyst$ positif de $SKY_SELF_COUNTRY$ envers $SKY_TARGET_COUNTRY$\n$SKY_CL$ Définit un $concept_diplomatic_catalyst$ négatif de $SKY_SELF_COUNTRY$ envers $SKY_TARGET_COUNTRY$\n$SKY_AL$ Définit les deux camps comme $concept_diplomatic_catalyst$s positifs mutuels\n$SKY_line$\n#lore $concept_diplomatic_catalyst_desc$#!"
