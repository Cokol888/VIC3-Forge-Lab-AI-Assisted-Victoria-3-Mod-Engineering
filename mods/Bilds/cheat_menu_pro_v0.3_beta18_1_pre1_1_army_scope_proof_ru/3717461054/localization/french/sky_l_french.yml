 SKY_1_1_B6_STATE_TT_EFF_LITERACY_ALL: "#BOLD Literacy#!\n\n$SKY_LC$ Set to 100%\n$SKY_SL$ Set to 50%\n$SKY_AL$ Set to 1%\n$SKY_CL$ Set to 20%\n$SKY_RC$ Set to 75%\n$SKY_line$\nApplies to all $concept_state$s in your country."
