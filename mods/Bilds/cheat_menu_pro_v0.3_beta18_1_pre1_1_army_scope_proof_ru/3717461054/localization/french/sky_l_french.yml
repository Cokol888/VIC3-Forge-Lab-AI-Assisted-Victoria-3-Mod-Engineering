 SKY_B7_TT_AI_STRATEGY_MONTENEGRO_ADMIN: "#T $ai_strategy_montenegro_admin$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ adoptera la stratégie actuellement choisie.\N\N#lore $SKY_TARGET_COUNTRY$ veut maintenir l’approvisionnement en biens essentiels sur son territoire.#!"
 SKY_B7_TT_AI_STRATEGY_CONSERVATIVE_AGENDA: "#T $ai_strategy_conservative_agenda$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ adoptera la stratégie actuellement choisie.\N\N#lore $SKY_TARGET_COUNTRY$ a des objectifs politiques conservateurs prudents et réforme lentement.#!"
