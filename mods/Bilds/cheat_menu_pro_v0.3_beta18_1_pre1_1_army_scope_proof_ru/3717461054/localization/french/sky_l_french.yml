SKY_1_1_B7_FORM_APPLY_IDENTITY: "Utiliser culture et religion du TAG"
SKY_1_1_B7_TT_FORM_OPEN_TAG_INDEX: "#BOLD Choisir TAG#!\n$SKY_line$\n$SKY_LC$ Ouvre le sélecteur de TAG.\n\nLe TAG sélectionné servira de pays cible pour les boutons ci-dessous."
SKY_1_1_B7_TT_FORM_CLEAR_TAG_SELECTION: "#BOLD Effacer sélection#!\n$SKY_line$\n$SKY_LC$ Efface le TAG actuellement sélectionné."
SKY_1_1_B7_TT_FORM_CHANGE_TAG: "#BOLD Changer votre pays en nouveau pays#!\n$SKY_line$\n$SKY_LC$ Change votre pays en TAG sélectionné et applique sa culture et sa religion d'État.\n$SKY_RC$ Change seulement votre pays en TAG sélectionné."
SKY_1_1_B7_TT_FORM_RELEASE_COUNTRY: "#BOLD Former un nouveau pays dans vos régions marquées#!\n$SKY_line$\n$SKY_LC$ Forme le TAG sélectionné dans vos régions marquées.\n\nVous ne passerez pas au nouveau pays."
SKY_1_1_B7_TT_FORM_MARKED_CHANGE_TAG: "#BOLD Changer le pays cible en nouveau pays#!\n$SKY_line$\n$SKY_LC$ Change le pays cible en TAG sélectionné et applique sa culture et sa religion d'État.\n$SKY_RC$ Change seulement le pays cible en TAG sélectionné."
SKY_1_1_B7_TT_FORM_MARKED_RELEASE_COUNTRY: "#BOLD Former un nouveau pays dans les régions marquées du pays cible#!\n$SKY_line$\n$SKY_LC$ Forme le TAG sélectionné dans les régions marquées du pays cible.\n\nLe joueur ne passera pas au nouveau pays."
SKY_1_1_B7_TT_FORM_APPLY_IDENTITY: "#BOLD Utiliser culture et religion du TAG#!\n$SKY_line$\n$SKY_LC$ Change votre pays vers la culture et la religion d'État du TAG sélectionné.\n$SKY_RC$ Change le pays cible vers la culture et la religion d'État du TAG sélectionné."
SKY_1_1_SP_GUIDE_BTN1: "$SKY_DEFAULT_TITLE$!\nAvant de commencer, laissez Xier vous expliquer la logique des clics. #P Clic gauche#! sur un bouton pour ajouter un effet. Survolez un bouton pour voir ses détails. Si l'effet ajouté est un $concept_modifier$, vous pouvez faire un #N clic droit#! pour retirer ce $concept_modifier$. La plupart des boutons prennent en charge les combinaisons de touches. Maintenez une touche du clavier, puis faites un clic gauche sur le bouton.\N@innovation!En général, #p clic gauche#! utilise une valeur que $xier$ juge utile et raisonnable. #BLUE Shift#! donne une valeur cent fois supérieure ou davantage. #COLOR:{0.3686,0.3961,0.7216} Alt#! donne une valeur plus faible pour un ajustement précis. #GOLD Ctrl#! applique généralement l'effet opposé."
SKY_1_1_SP_GUIDE_BTN2: "La plupart des fonctions de marquage #BOLD ne prennent en charge qu'une seule cible à la fois#!. Cela vaut aussi pour le marquage des biens et des compagnies sur cette page. Le curseur de la première page peut ajuster les revenus. #I Cliquez#! sur le curseur pour choisir la valeur souhaitée, puis cliquez sur le bouton de confirmation ci-dessous pour terminer l'opération. Pour retirer un modificateur, faites un #N clic droit#! dessus, ou réglez le curseur sur #n 0#!."
SKY_1_1_SP_GUIDE_BTN3: "Pour les personnages nationaux ou en exil, faites un clic droit sur le personnage puis sélectionnez #yellow $sakuya_mark_character$#! dans le menu contextuel pour le marquer. Pour les personnages étrangers, marquez d'abord le pays cible, puis trouvez #YELLOW $SKY_B3_CHAR_MARK_OPEN$#! sur cette page et sélectionnez le personnage à marquer dans l'événement."
SKY_1_1_SP_GUIDE_BTN4: "#yellow $SKY_B4_TAKE_MARKED_NAVY_SHIPS$#! et #yellow $SKY_1_1_B4_BTN_DESTROY_SHIPS$#! nécessitent qu'une flotte soit marquée au préalable. Maintenez #BLUE Shift#! et cliquez sur #yellow $SKY_R4_MARK_ARMY$#! pour sélectionner une flotte à marquer via l'événement.\NLors du lancement d'une crise diplomatique ou d'une guerre, vous devez confirmer que l'objectif de guerre est valide. Si les conditions ne sont pas remplies, l'opération peut échouer. Des cas similaires existent aussi dans d'autres fonctions de $CMP$."
SKY_1_1_SP_GUIDE_BTN5: "Comme les autres systèmes de marquage de $CMP$, le $concept_interest_group$ marqué dans $SKY_B5_SUBSEC_1$ sera utilisé par d'autres options de modification. Le groupe d'intérêt sélectionné éclairera certaines fonctions qui nécessitent d'abord un groupe d'intérêt marqué, comme le changement de groupe d'intérêt de $sakuya_mark_character$. Dans la plupart des cas, il est recommandé de ne sélectionner qu'un seul $concept_interest_group$."
SKY_1_1_SP_GUIDE_BTN6: "Faites un clic droit sur une région que vous possédez, puis sélectionnez #yellow $decree_sakuya_mark_state$#! dans le menu pour marquer le $state$ à ajuster. Vous pouvez aussi sélectionner #yellow $decree_sakuya_mark_state$#! sous #i $concept_political_lens$#! et $mm_issue_decree_interaction$ en bas, afin de marquer plus facilement sur la carte. Pour marquer une région étrangère, faites un clic droit sur le pays cible et sélectionnez #yellow $sakuya_mark_foreign_state$#!.\N#T #N Il est fortement recommandé de ne marquer qu'un seul lieu à la fois !#!#!"
SKY_1_1_SP_GUIDE_BTN6_tab4: "Après avoir choisi la catégorie de bâtiment à ajuster dans le sélecteur de bâtiments, le bâtiment actuellement sélectionné s'affiche en bas à gauche du menu. Sélectionnez d'abord le $state$ cible avec $decree_sakuya_mark_state$, puis cliquez sur le curseur pour régler la valeur souhaitée, et cliquez ensuite sur #yellow $SKY_B6_BUILD_ADD_BUILDING$#!. Choisir le palier #n 0#! effacera ce bâtiment ou ce potentiel de ressource. La réussite de l'ajout des bâtiments et des potentiels de ressource dépend de la #N technologie#! et d'autres conditions du joueur ou du pays cible.\NLes bâtiments des catégories $SKY_B6_BUILD_CAT_RESOURCE$ et $SKY_B6_BUILD_CAT_AGRICULTURE$ prennent aussi en charge #yellow $SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL$#!."
SKY_1_1_SP_GUIDE_BTN6_tab5: "\NSur cette page, tous les modificateurs ciblent les $concept_buildings$, sauf #yellow $SKY_B6_RESERVED_BUILD_R2_C1$#! et #yellow $SKY_B6_RESERVED_BUILD_R2_C2$#!, dont les modificateurs ciblent le $state$. Vous devez cliquer sur les $concept_buildings$ modifiés avant de voir le $concept_modifier$ correspondant."
SKY_1_1_SP_GUIDE_BTN7: "\NFaites un clic droit sur le pays à marquer, puis sélectionnez #yellow $sakuya_mark_country$#! pour le marquer. Vous pouvez aussi sélectionner #yellow $sakuya_mark_country$#! sous #i $concept_diplomatic_lens$#! et $concept_diplomatic_actions$ en bas, afin de marquer plus facilement sur la carte."
 SKY_1_1_SP_GUIDE_BTN8: "\N\N#yellow $SKY_BTN8_TAB_TECHNOLOGY$#! rassemble $concept_technology$- modificateurs associés ; utilisez les onglets ci-dessus pour passer de l'un à l'autre $production$, $military$, et $society$. La plupart des boutons respectent les règles standard relatives aux boutons grands et petits, et un clic droit efface le $concept_modifier$.\N\Net #yellow $SKY_BTN8_TAB_CULTURE$#!, cliquez sur #yellow $SKY_B8_CULTURE_MARK$#! pour ouvrir $SKY_1_2_CULTURE_INDEX_TITLE$#!. Sélectionnez une cible $concept_culture$ dans le $concept_culture$ sélecteur, puis l'utiliser pour $concept_primary_cultures$, $concept_homelands$, ainsi que d'autres fonctions culturelles."
SKY_1_1_SP_GUIDE_BTN9: "\nEssayez de survoler le grand titre de $CMP$ pendant une seconde...?\n@innovation!Différents fonds d'écran affichent différents contenus."
SKY_1.1_CLOSE: "Cliquer pour fermer."
SKY_B4_TT_JOIN_WAR_INITIATOR_SIDE: "#tooltip_header Rejoindre guerre#!\n\nAjoute le pays au camp de l'initiateur de la guerre sélectionnée.\nUne guerre doit être sélectionnée au préalable.\n$SKY_line$\n$SKY_LC$ Le joueur rejoint le camp de l'initiateur\n$SKY_RC$ Le pays marqué rejoint le camp de l'initiateur\n$SKY_SL$ Le joueur quitte si possible\n$SKY_AL$ Le pays marqué quitte si possible"
