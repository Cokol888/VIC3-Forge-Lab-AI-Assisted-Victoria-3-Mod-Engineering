 SKY_1_2_B7_TT_TAKE_FOREIGN_STATE_DISABLED: "#BOLD $SKY_B7_TAKE_FOREIGN_STATE$#!\n$SKY_line$\nVous devez sélectionner à la fois un pays et une région de ce pays.\n\nCliquez avec le bouton droit de la souris sur le pays que vous souhaitez sélectionner, puis choisissez #T $sakuya_mark_country$#! sous « Actions diplomatiques », puis sélectionnez #T $sakuya_mark_foreign_state$#!."
