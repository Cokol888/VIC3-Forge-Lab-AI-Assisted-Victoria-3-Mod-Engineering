 notification_sakuya_superdip_force_join_power_bloc_toast_name: "[SCOPE.sCountry('target').GetName] a rejoint notre Power Bloc"
 notification_sakuya_superdip_force_join_power_bloc_toast_desc: "[SCOPE.sCountry('target').GetRuler.GetFullName] a reconnu après la réunion que l'analyse de la situation internationale présentée par Sakuya était claire et difficile à contester. [SCOPE.sCountry('target').GetName] a ensuite rejoint le $concept_power_bloc$ que [SCOPE.sCountry('actor').GetName] appartient à."
 notification_sakuya_superdip_force_join_power_bloc_toast_tooltip: "#header $notification_sakuya_superdip_force_join_power_bloc_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_force_join_power_bloc_toast_desc$"
 sakuya_superdip.3.t: "Sakuya a convaincu [SCOPE.sCountry('sakuya_superdip_target_country').GetName]'s [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]"
 sakuya_superdip.3.d: "Lors d'une réunion en privé, Sakuya a convaincu [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] de réexaminer les relations avec [SCOPE.sCountry('sakuya_superdip_actor_country').GetName]."
 sakuya_superdip.3.f: "À la fin de la réunion, [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] avait déjà remis dans le tiroir la lettre au ton sévère qu’elle avait préparée et demandé qu’on organise la prochaine réunion. Sakuya se contenta de refermer calmement sa montre de poche, comme si tout était normal."
 sakuya_superdip.3.a: "C'est une bonne chose."
