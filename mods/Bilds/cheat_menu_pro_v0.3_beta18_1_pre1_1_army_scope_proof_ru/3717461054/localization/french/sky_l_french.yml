 SKY_1_2_B7_TT_ACQUIRE_TREATY_PORT_DISABLED: "#BOLD $SKY_B7_ACQUIRE_TREATY_PORT$#!\n$SKY_line$\nVous devez d'abord sélectionner l'un de nos États ou un État étranger.\n\nFaire d'un de nos États un pays étranger $concept_treaty_port$: choisissez l'un de nos États, mettez en œuvre la #T $decree_sakuya_mark_state$#! décret, puis utilisez le #T $sakuya_mark_country$#! action diplomatique à l'égard du pays concerné.\n\nPour obtenir un $concept_treaty_port$ depuis un pays étranger : cliquez avec le bouton droit sur le pays de destination, puis sélectionnez #T $sakuya_mark_country$#! sous « Actions diplomatiques », puis sélectionnez #T $sakuya_mark_foreign_state$#!."
