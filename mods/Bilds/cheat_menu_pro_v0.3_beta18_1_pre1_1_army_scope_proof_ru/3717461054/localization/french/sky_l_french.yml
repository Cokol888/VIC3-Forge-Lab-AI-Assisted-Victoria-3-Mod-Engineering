 SKY_B5_TT_LOBBY_IG_JOIN: "#BOLD Rejoindre/quitter $concept_political_lobby_short$#!\n\n$SKY_LC$ Le $concept_interest_group$ choisi rejoint le $concept_political_lobby_short$ choisi\n$SKY_RC$ Le $concept_interest_group$ choisi quitte le $concept_political_lobby_short$ choisi\n$SKY_SL$ Tous les $concept_interest_group$s de ce pays rejoignent le $concept_political_lobby_short$ choisi\n$SKY_CL$ Retire tous les membres du $concept_political_lobby_short$ choisi\n$SKY_line$\n#italic Si le $concept_political_lobby_short$ appartient à un pays étranger, le $concept_interest_group$ correspondant de ce pays est utilisé automatiquement.\nClic gauche/droit requiert un $concept_interest_group$ et un $concept_political_lobby_short$ choisis.#!"
 SKY_B5_TT_LOBBY_CREATE: "#BOLD Créer $concept_political_lobby_short$#!\n\n$SKY_LC$ Crée dans ce pays un $concept_political_lobby_short$ pro-pays cible\n$SKY_RC$ Crée dans ce pays un $concept_political_lobby_short$ anti-pays cible\n$SKY_SL$ Crée dans le pays cible un $concept_political_lobby_short$ pro-joueur\n$SKY_AL$ Crée dans le pays cible un $concept_political_lobby_short$ anti-joueur\n$SKY_line$\n#italic Requiert un pays cible marqué. Si un $concept_interest_group$ est choisi, il devient membre initial.#!"
 SKY_B5_TT_LOBBY_LEVERAGE: "#BOLD $country_lobby_leverage_generation_mult$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ -100%\n$SKY_RC$ Effacer $concept_modifier$\n$SKY_line$\n#italic Affecte la vitesse de génération de $concept_power_bloc_leverage$ par tous les $concept_political_lobby_short$s de ce pays.#!\n$SKY_stackable$"
