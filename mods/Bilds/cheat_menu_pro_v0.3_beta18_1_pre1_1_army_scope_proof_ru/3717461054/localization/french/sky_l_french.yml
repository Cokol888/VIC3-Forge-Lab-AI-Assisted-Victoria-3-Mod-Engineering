SKY_1_1_B7_FORM_CHANGE_TAG: "Changer #p nous#! en nouveau pays"
SKY_1_1_B7_FORM_RELEASE_COUNTRY: "Former un pays dans #COLOR:{0.6000,0.7804,0.5804,1} nos régions marquées#!"
SKY_1_1_B7_FORM_MARKED_CHANGE_TAG: "Changer #N pays cible#! en nouveau pays"
