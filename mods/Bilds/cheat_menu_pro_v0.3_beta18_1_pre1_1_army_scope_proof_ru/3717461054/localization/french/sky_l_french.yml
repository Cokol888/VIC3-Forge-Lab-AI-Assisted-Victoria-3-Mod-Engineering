 SKY_B1_TT_SUPER_RIGHT_CLICK: "#BOLD $SKY_B1_SUPER_RIGHT_CLICK$#!\n$SKY_line$\n$SKY_LC$ Ouvrir. \n$SKY_RC$ Fermer. \N\N#LORE Une fois activé, n'oubliez pas de mettre le jeu en pause, cela rafraîchira l'état le jour suivant. Cliquez ensuite avec le bouton droit de la souris sur n'importe quel pays pour voir les actions diplomatiques supplémentaires, telles que #t $sakuya_superdip_humiliate_01$#!."
 SKY_B1_TT_POWER_PERCENT_PLUS: "$SKY_LC$ $SKY_SELF_COUNTRY$ +25% \n$SKY_SL$ $SKY_SELF_COUNTRY$ +100% \n$SKY_AL$ $SKY_SELF_COUNTRY$ #n - #!100% \n$SKY_CL$ $SKY_MARKED_COUNTRY$ +25% \n$SKY_RC$ $SKY_MARKED_COUNTRY$ #n - #!25% \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_CONSTRUCTION_PERCENT_TBC: "#BOLD Construction rapide +#!\n$SKY_line$\nCette option n'est pas disponible pour le moment. Veuillez utiliser le bouton « Capacité de construction » situé à côté."
 SKY_B1_TT_FAST_CONSTRUCTION_LIMIT: "#BOLD Puissance de construction et allocation de construction privée #!\n$SKY_line$\n$SKY_LC$ Puissance de construction +9999999. \n$SKY_CL$ Allocation de construction privée +1000%. \n$SKY_RC$ Allocation de construction privée #n - #!10000%."
 SKY_B1_TT_TREASURY_CAP_QUICK: "#BOLD $concept_gold_reserves$#!\n$SKY_line$\n$SKY_LC$ Augmenter @money!de 100 % de la limite supérieure de $concept_gold_reserves$. \n$SKY_SL$ Augmenter @money!de 20 % de la limite supérieure de $concept_gold_reserves$. \n$SKY_AL$ Diminuer @money!de 100 % de la limite supérieure de $concept_gold_reserves$. \n$SKY_CL$ $SKY_MARKED_COUNTRY$Diminuer @money!de 100 % de la limite supérieure de $concept_gold_reserves$. \n$SKY_RC$ Augmentez @money!de 99,999% de la limite supérieure de $concept_gold_reserves$. \n$SKY_line$\nDes ajustements plus détaillés peuvent être effectués sur la page Économie."
 SKY_B1_TT_BIRTH_RATE_V2: "#BOLD $SKY_B1_R2_C2$#!\n$SKY_line$\n$SKY_LC$ +100% pendant 1 an. \n$SKY_SL$ +3000% pendant 1 an. \n$SKY_AL$ +5%. \n$SKY_CL$ #n - #!100% pendant 1 an. \n$SKY_RC$ Clair. \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_BIRTH_RATE_PLUS: "#BOLD $SKY_B1_R2_C2$ + #!\n$SKY_line$\n$SKY_LC$ +500% pendant 1 an. \n$SKY_SL$ #n - #!2000% pendant 1 an. \n$SKY_AL$ #n - #!20% pendant 1 an. \n$SKY_CL$ +10000% pendant 1 an. \n$SKY_RC$ +99999% pendant 1 mois. \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_INTEGRATE_ALL: "#BOLD États membres#!\n$SKY_line$\n$SKY_LC$ Intégrer tous les $SKY_SELF_COUNTRY$ États.\n$SKY_SL$ Vitesse d'incorporation +100 %.\n$SKY_AL$ Vitesse d'incorporation +5 %.\n$SKY_CL$ Rapidité de constitution #n -#!100%.\n$SKY_RC$ Réinitialiser le modificateur de vitesse d'intégration.\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_CLEAN_POLLUTION: "#BOLD Lutter contre la pollution#!\n$SKY_line$\n$SKY_LC$ Réduire la pollution dans tous les domaines $SKY_SELF_COUNTRY$ États.\n$SKY_SL$ Impact de la pollution #n -#!100%.\n$SKY_AL$ Impact de la pollution #n -#!5%.\n$SKY_CL$ Impact sur la pollution +100 %.\n$SKY_RC$ Réinitialiser le modificateur d'impact de la pollution.\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_THROUGHPUT_ALL: "#BOLD Débit#!\n$SKY_line$\n$SKY_LC$ Tout $SKY_SELF_COUNTRY$ indique une hausse de 20 %.\n$SKY_SL$ Tout $SKY_SELF_COUNTRY$ indique une hausse de plus de 1 000 %.\n$SKY_AL$ Tout $SKY_SELF_COUNTRY$ +5 %.\n$SKY_CL$ Tout $SKY_SELF_COUNTRY$ États #n -#!20%.\n$SKY_RC$ D'accord.\n$SKY_line$\n$SKY_stackable$"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_BREAK_FREE: "#T $ai_strategy_subject_break_free$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ changera de stratégie pour adopter celle qui est actuellement sélectionnée.\N\N#lore $SKY_TARGET_COUNTRY$ souhaite s'affranchir de son $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_STRENGTHEN_SELF: "#T $ai_strategy_subject_strengthen_self$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ changera de stratégie pour adopter celle qui est actuellement sélectionnée.\N\N#lore $SKY_TARGET_COUNTRY$ souhaite augmenter $concept_autonomy$ et réduire sa dépendance vis-à-vis de $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_MAINTAIN_AUTONOMY: "#T $ai_strategy_subject_maintain_autonomy$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ changera de stratégie pour adopter celle qui est actuellement sélectionnée.\N\N#lore $SKY_TARGET_COUNTRY$ souhaite conserver son niveau actuel $concept_autonomy$ sous son $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_OVERLORD_COMPLIANCE: "#T $ai_strategy_subject_overlord_compliance$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ changera de stratégie pour adopter celle qui est actuellement sélectionnée.\N\N#lore $SKY_TARGET_COUNTRY$ souhaite une intégration plus étroite avec ses $concept_overlord$ et en suivra fidèlement les instructions.#!"
