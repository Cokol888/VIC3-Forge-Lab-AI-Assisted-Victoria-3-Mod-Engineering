 SKY_B6_BUILD_TT_CAT_URBAN: "#BOLD Urbain#!\n\n$SKY_LC$ Affiche usines et autres bâtiments urbains ordinaires\n$SKY_RC$ Affiche centres urbains, bâtiments spéciaux, merveilles et monuments"
 SKY_B6_BUILD_SELECTED_TITLE: "Bâtiment\nchoisi"
 SKY_B6_BUILD_SELECTED_NONE: "Aucun"
 SKY_B6_BUILD_TT_CONFIRM: "#BOLD Placer bâtiment#!\n\n$SKY_LC$ Applique le changement de niveau actuel aux États marqués du joueur\n$SKY_RC$ Si un pays est marqué et a des États étrangers marqués, applique ce changement à ces États\n$SKY_line$\n#lore 0 supprime le bâtiment. Les valeurs positives ajoutent des niveaux. Si l’État cible n’a pas ce bâtiment, il est créé au niveau correspondant.#!"
 SKY_B6_BUILD_APPLY_SEC: "#T #COLOR:{0.7275,0.6333,0.4529,1} Placer bâtiment#!"
 SKY_B6_BUILD_APPLY_RESOURCE_SEC: "#T #COLOR:{0.7275,0.6333,0.4529,1} Placer bâtiment et ressources potentielles#!"
 SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL: "Ajouter ressources potentielles"
 SKY_B6_BUILD_TT_RESOURCE_POTENTIAL: "#BOLD Ajouter ressources potentielles#!\n\n$SKY_LC$ Ajoute aux États marqués du joueur les ressources potentielles liées au bâtiment choisi\n$SKY_RC$ Si un pays est marqué et a des États étrangers marqués, applique à ces États\n$SKY_line$\n#lore Niveau 0 retire. Les niveaux positifs ajoutent ou augmentent la valeur actuelle. Les bâtiments agricoles ne gèrent pour l’instant qu’ajout et retrait.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1: "#BOLD $concept_throughput$ du bâtiment choisi#!\n\n#lore Choisissez d’abord un bâtiment dans $SKY_BTN6_SEC$-$SKY_BTN6_TAB3$ et marquez au moins 1 $concept_state$.#!\n#lore Si le bâtiment actuel ne prend pas ceci en charge, utilisez le $concept_throughput$ générique en bas à droite.#!\n#lore Pris en charge : $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Efface ce groupe, y compris le bouton + à droite\n#lore Cumulable avec le grand pas à droite.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1_PLUS: "#BOLD $concept_throughput$ du bâtiment choisi : grand pas#!\n\n#lore Groupe indépendant du bouton normal à gauche, cumulable. Effacer à gauche efface aussi ceci.#!\n#lore Pris en charge : $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
 SKY_B6_RESERVED_BUILD_R1_C2: "Intrants bâtiment choisi"
 SKY_B6_TT_RESERVED_BUILD_R1_C2: "#BOLD Intrants bâtiment choisi#!\n\n#lore S’applique au bâtiment choisi dans les États marqués du joueur.#!\n#lore Les actions positives réduisent les besoins en biens du bâtiment.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Efface ce groupe"
 SKY_B6_RESERVED_BUILD_R1_C3: "Salaire min. bâtiment choisi"
 SKY_B6_TT_RESERVED_BUILD_R1_C3: "#BOLD Salaire min. bâtiment choisi#!\n\n#lore S’applique au bâtiment choisi dans les États marqués du joueur.#!\n#lore Les actions positives réduisent la cible de salaire du bâtiment.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Efface ce groupe"
 SKY_B6_TT_RESERVED_BUILD_R2_C1: "#BOLD Taille employés bâtiment choisi#!\n\n#lore Agit selon le type de bâtiment choisi et s’applique aux États marqués du joueur.#!\n#lore Les actions positives réduisent la taille d’employés par défaut.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Efface ce groupe"
 SKY_B6_TT_RESERVED_BUILD_R2_C2: "#BOLD Conditions bâtiment choisi#!\n\n#lore S’applique au bâtiment correspondant dans les États marqués du joueur.#!\n#lore Les actions positives réduisent le modificateur de conditions de travail du bâtiment.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Efface ce groupe"
 SKY_B6_TT_RESERVED_BUILD_R2_C3: "#BOLD $concept_throughput$ générique du bâtiment choisi#!\n\n#lore S’applique directement au bâtiment choisi dans les États marqués du joueur.#!\n#lore Si le $concept_throughput$ exclusif en haut à gauche ne couvre pas le bâtiment actuel, utilisez celui-ci.#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Efface ce groupe, y compris le bouton + à droite"
 SKY_B6_TT_RESERVED_BUILD_R2_C3_PLUS: "#BOLD $concept_throughput$ générique du bâtiment choisi : grand pas#!\n\n#lore Groupe indépendant du bouton normal à gauche, cumulable. Clic droit à gauche l’efface aussi.#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
