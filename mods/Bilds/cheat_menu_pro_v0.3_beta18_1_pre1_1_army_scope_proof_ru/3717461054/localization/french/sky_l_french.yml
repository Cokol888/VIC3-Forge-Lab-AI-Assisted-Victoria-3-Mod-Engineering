 notification_sakuya_superdip_annex_country_toast_name: "[SCOPE.sCountry('actor').GetName] unifié [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_annex_country_toast_desc: "Après que Sakuya l'ait convaincu, [SCOPE.sCountry('target').GetRuler.GetFullName] a signé le [SCOPE.sCountry('actor').GetCapital.GetCityHubName] Traité à [SCOPE.sCountry('target').GetCapital.GetCityHubName], et [SCOPE.sCountry('target').GetName] et [SCOPE.sCountry('actor').GetName] ont enfin achevé leur unification."
