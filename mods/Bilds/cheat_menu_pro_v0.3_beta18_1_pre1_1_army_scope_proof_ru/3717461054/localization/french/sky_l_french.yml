 SKY_B8_TT_FAMOUS_CHARACTER: "#BOLD Invocation de figure célèbre#!\n\n$SKY_LC$ Rejoint le pays joueur comme agitateur\n$SKY_RC$ Devient dirigeant du pays joueur\n$SKY_AL$ Rejoint le pays joueur comme général\n$SKY_SL$ Rejoint le pays joueur comme amiral\n$SKY_line$\n#italic Même figure invocable plusieurs fois. Le rôle dépend du clic.#!"
 SKY_ABOUT_WELCOME_1: "#BOLD Bienvenue !#!\nRavi de vous rencontrer. Je suis Xier, développeur de Victoria 3 Cheat Menu Pro. Honneur de vous retrouver dans Victoria 3. #BOLD Groupe QQ :#! 734267077. Venez nous rejoindre !"
 SKY_ABOUT_WELCOME_2: "#BOLD Que pensez-vous de ce mod ?#!\nJe le développe encore. Comparé à EU5, le moteur de Victoria 3 semble proche des anciens titres, mais il est très différent. Quoi qu’il en soit, amusez-vous bien ! Vous rencontrer me rend vraiment heureux."
 SKY_UPDATE_LOG_V1_TITLE: "#BOLD Notes de mise à jour $SKY_WINDOW_TITLE$ v1.0#!"
 SKY_UPDATE_LOG_V1_TEXT: "- Version initiale publiée\n- Système de barre de navigation porté depuis EU5\n- 9 catégories de fonctions, 12 boutons réservés chacune\n- Page À propos avec journal, personnalisation et infos\n- Prise en charge du chinois simplifié"
 SKY_SETTINGS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Paramètres de personnalisation#!"
 SKY_SETTINGS_PLACEHOLDER: "Paramètres de personnalisation en développement. Restez à l’écoute.\nLes versions futures prendront en charge fond personnalisé, thème d’interface, etc."
 SKY_ABOUT_LINKS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Contact#!"
 SKY_ABOUT_TEXT_1: "#BOLD Merci d’utiliser $SKY_WINDOW_TITLE$ !#!\nRavi de vous rencontrer. Je suis Xier, développeur de Pékin vivant actuellement en Tchéquie. Pour toute question, contactez-moi via le groupe QQ ou le serveur Discord. Pour soutenir Xier, aimez le mod sur Steam Workshop ou faites un don via le lien de sponsor.\nCe mod est totalement gratuit. Si vous l’avez obtenu par un canal payant, signalez-le aussitôt. Xier vous en sera très reconnaissant !"
 SKY_ABOUT_TEXT_2: "#BOLD Notes de compatibilité#!\n$SKY_WINDOW_TITLE$ est conçu pour maximiser la compatibilité avec les autres mods. Toutefois, les limites du moteur imposent de modifier un fichier GUI système afin d’afficher l’interface des $concept_modifier$s.\nPour charger les gros mods au mieux, ordre conseillé : gros mods, petits mods, mods UI, puis $SKY_WINDOW_TITLE$. Le jeu écrasant les fichiers plus anciens par les plus récents, placer $SKY_WINDOW_TITLE$ en dernier garantit que ses changements UI priment sur les autres mods UI.\nEn cas de problème, contactez-moi via QQ ou Discord. Je ferai de mon mieux pour aider."
