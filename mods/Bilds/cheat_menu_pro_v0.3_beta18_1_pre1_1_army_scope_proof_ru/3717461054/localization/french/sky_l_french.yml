 sakuya_superdip_humiliate_01: "Laissez Sakuya humilier ce pays."
 sakuya_superdip_humiliate_01_action_name: "Laissez Sakuya humilier ce pays."
 sakuya_superdip_humiliate_01_desc: "Vous enverrez Sakuya dîner avec l'ambassadeur de ce pays au nom de nos dirigeants."
 sakuya_superdip_humiliation_pact_01: "$humiliation$"
 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "Sakuya humilie le pays visé lors d'un dîner diplomatique tout à fait déplacé, ternissant ainsi sa réputation sur la scène internationale. Durée : 5 ans."
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] est humilié par Sakuya, qui a été envoyée par [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]. Durée : 5 ans."
 sakuya_superdip_humiliation_pact_01_effect_desc_global: "Conclure le pacte d'humiliation de Sakuya"
 sakuya_superdip_humiliation_pact_01_effect_desc_first: "[COUNTRY.GetNameNoFlag] fait honte à Sakuya [TARGET_COUNTRY.GetName] depuis 5 ans"
 sakuya_superdip_humiliation_pact_01_effect_desc_third: "[COUNTRY.GetName] fait honte à Sakuya [TARGET_COUNTRY.GetName] depuis 5 ans"
 sakuya_superdip.1.t: "Sakuya s'exprime lors d'un dîner diplomatique !"
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName] est plongée dans le chaos lorsque Sakuya se bat avec des fonctionnaires de [SCOPE.sCountry('sakuya_superdip_target_country').GetName] pendant le dîner."
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] Il a essayé de faire tomber un banc sur Sakuya, mais elle s'est habilement écartée, a attrapé un morceau de gâteau sur la table et l'a écrasé sur [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]sur la tête de... \N\N\"#lore Vieux fou… Tu as essayé de me tendre une embuscade ? #!\""
 sakuya_superdip.1.a: "Bonne réprimande !"
 sakuya_superdip.1.b: "J'ajouterai quelques malédictions..."
 sakuya_superdip.1.c: "Sakuya-sensei, ne faites pas ça..."
 sakuya_superdip.1.c_desc: "Après [SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName] Bien qu'elle ait tout fait pour l'en empêcher, Sakuya Izayoi rangea provisoirement ses couteaux d'argent, puis but une gorgée de vin, l'air aussi serein que jamais."
 notification_sakuya_superdip_humiliation_toast_name: "Sakuya, humiliée avec mépris [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "Sakuya a remis une note diplomatique d'un raffinement culturel remarquable au dirigeant de [SCOPE.sCountry('target').GetName], [SCOPE.sCountry('target').GetRuler.GetFullName]. Pour une raison quelconque, ils l'ont interprétée comme une #BOLD insulte#!. Leur vulgarité nous a amusés ; eux semblaient plutôt mécontents. Les relations diplomatiques entre [SCOPE.sCountry('actor').GetName] et [SCOPE.sCountry('target').GetName] semblent s'être détériorées."
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "Sakuya dit :\NTa mère était un hamster,\Net ton père sent le sureau !"
 sakuya_superdip_insult_02: "Sakuya dit :\NLe jour du jugement dernier est arrivé !\NLes serviteurs de Lucifer arpentent la terre—\NOh, non, ce n'est que le représentant de votre pays."
 sakuya_superdip_insult_03: "Sakuya dit :\NDe plus, je pense que votre capital doit être détruit !"
 sakuya_superdip_insult_04: "Sakuya dit :\NLorsque les générations futures rédigeront l'histoire de notre époque,\Nils te regarderont avec ce mélange de pitié et de dégoût qu'on appelle la compassion."
 sakuya_superdip_insult_05: "Sakuya dit :\NMa dernière visite aux toilettes a été bien plus agréable que le dîner avec votre ambassadeur."
 sakuya_superdip_insult_06: "Sakuya dit :\NOh, regarde.\NIl y a de jolis trucs cochons par ici."
 sakuya_superdip_insult_07: "Sakuya dit :\NTon sang rendra la terre que je te prends encore plus fertile."
 sakuya_superdip_insult_08: "Sakuya dit :\NLes réceptions diplomatiques un peu ennuyeuses ont toujours besoin d'un poisson-chat pour les animer.\NEt toi, mon ami, tu es le meilleur poisson-chat qui soit !"
 sakuya_superdip_insult_09: "Sakuya dit :\NPourquoi la situation dans ton pays est-elle toujours aussi catastrophique ?\NJe soupçonne que c'est à cause de vous tous."
 sakuya_superdip_insult_10: "Sakuya dit :\NDans ce formidable jeu auquel nous jouons,\Ntu n'es qu'un simple pion."
 sakuya_superdip_insult_11: "Sakuya dit :\NTes méfaits sont connus de l'Irlande jusqu'au Cathay."
 sakuya_superdip_insult_12: "Sakuya dit :\NTon dirigeant a l'esprit d'une banane bien mûre,\Nmais fait preuve d'un véritable génie en matière de défécation en public."
 sakuya_superdip_insult_13: "Sakuya dit :\NQue ton ciel soit parsemé de comètes."
 sakuya_superdip_insult_14: "Sakuya dit :\NAucune carte ne peut être une œuvre d'art\Ntant que votre pays en fait partie."
 sakuya_superdip_insult_15: "Sakuya dit :\NJe ne comprends pas pourquoi tu aimes faire le pitre lors des dîners diplomatiques.\NÊtes-vous en quête de sens,\Nou simplement pour divertir la foule ?"
