SKY_1_1_B7_TT_FORM_OPEN_TAG_INDEX: "#BOLD Selecionar TAG#!\n$SKY_line$\n$SKY_LC$ Abre o seletor de TAG.\n\nA TAG selecionada será usada como país alvo dos botões abaixo."
SKY_1_1_B7_TT_FORM_CLEAR_TAG_SELECTION: "#BOLD Limpar Seleção#!\n$SKY_line$\n$SKY_LC$ Limpa a TAG selecionada atualmente."
SKY_1_1_B7_TT_FORM_CHANGE_TAG: "#BOLD Mudar Seu País para um Novo País#!\n$SKY_line$\n$SKY_LC$ Muda seu país para a TAG selecionada e aplica sua cultura e religião estatal.\n$SKY_RC$ Apenas muda seu país para a TAG selecionada."
SKY_1_1_B7_TT_FORM_RELEASE_COUNTRY: "#BOLD Formar um Novo País nos Seus Estados Marcados#!\n$SKY_line$\n$SKY_LC$ Forma a TAG selecionada nos seus estados marcados.\n\nVocê não trocará para o novo país."
SKY_1_1_B7_TT_FORM_MARKED_CHANGE_TAG: "#BOLD Mudar País Alvo para um Novo País#!\n$SKY_line$\n$SKY_LC$ Muda o país alvo para a TAG selecionada e aplica sua cultura e religião estatal.\n$SKY_RC$ Apenas muda o país alvo para a TAG selecionada."
SKY_1_1_B7_TT_FORM_MARKED_RELEASE_COUNTRY: "#BOLD Formar um Novo País nos Estados Marcados do País Alvo#!\n$SKY_line$\n$SKY_LC$ Forma a TAG selecionada nos estados marcados do país alvo.\n\nO jogador não trocará para o novo país."
SKY_1_1_B7_TT_FORM_APPLY_IDENTITY: "#BOLD Usar Cultura e Religião da TAG Selecionada#!\n$SKY_line$\n$SKY_LC$ Muda seu país para a cultura e religião estatal da TAG selecionada.\n$SKY_RC$ Muda o país alvo para a cultura e religião estatal da TAG selecionada."
SKY_1_1_SP_GUIDE_BTN1: "$SKY_DEFAULT_TITLE$!\nAntes de começar, permita que Xier explique a lógica de clique dos botões. #P Clique esquerdo#! em um botão para adicionar um efeito. Passe o mouse sobre um botão para ver seus detalhes. Se o efeito adicionado for um $concept_modifier$, você pode #N clicar com o botão direito#! para remover esse $concept_modifier$. A maioria dos botões aceita combinações de teclas. Segure uma tecla do teclado e então clique com o botão esquerdo no botão.\N@innovation!Em geral, #p clique esquerdo#! usa um valor que $xier$ considera útil e razoável. #BLUE Shift#! fornece um valor cem vezes maior ou ainda mais alto. #COLOR:{0.3686,0.3961,0.7216} Alt#! fornece um valor menor para ajuste preciso. #GOLD Ctrl#! geralmente aplica o efeito oposto."
SKY_1_1_SP_GUIDE_BTN2: "A maioria das funções de marcação #BOLD só aceita um alvo por vez#!. Isso também se aplica à marcação de bens e companhias nesta página. O controle deslizante da primeira página pode ajustar a renda. #I Clique#! no controle para selecionar o valor desejado, depois clique no botão de confirmação abaixo para concluir a operação. Para remover um modificador, #N clique com o botão direito#! nele, ou defina o controle como #n 0#!."
SKY_1_1_SP_GUIDE_BTN3: "Para personagens domésticos ou exilados, clique com o botão direito no personagem e selecione #yellow $sakuya_mark_character$#! no menu pop-up para marcá-lo. Para personagens estrangeiros, marque primeiro o país alvo, depois encontre #YELLOW $SKY_B3_CHAR_MARK_OPEN$#! nesta página e selecione no evento pop-up o personagem que deseja marcar."
SKY_1_1_SP_GUIDE_BTN4: "#yellow $SKY_B4_TAKE_MARKED_NAVY_SHIPS$#! e #yellow $SKY_1_1_B4_BTN_DESTROY_SHIPS$#! exigem que uma frota seja marcada primeiro. Segure #BLUE Shift#! e clique em #yellow $SKY_R4_MARK_ARMY$#! para selecionar uma frota a marcar pelo evento pop-up.\NQuando iniciar uma jogada diplomática ou guerra, confirme se o objetivo de guerra é válido. Se as condições não forem atendidas, a operação pode falhar. Casos semelhantes também existem em outras funções de $CMP$."
SKY_1_1_SP_GUIDE_BTN5: "Assim como outros sistemas de marcação em $CMP$, o $concept_interest_group$ marcado em $SKY_B5_SUBSEC_1$ será referenciado por outras opções de modificação. O grupo de interesse selecionado acenderá algumas funções que exigem um grupo de interesse marcado primeiro, como mudar o grupo de interesse de $sakuya_mark_character$. Na maioria dos casos, recomenda-se selecionar apenas um $concept_interest_group$."
SKY_1_1_SP_GUIDE_BTN6: "Clique com o botão direito em um estado que você possui, depois selecione #yellow $decree_sakuya_mark_state$#! no menu para marcar o $state$ que deseja ajustar. Você também pode selecionar #yellow $decree_sakuya_mark_state$#! em #i $concept_political_lens$#! e $mm_issue_decree_interaction$ abaixo, facilitando a marcação no mapa. Para marcar um estado estrangeiro, clique com o botão direito no país alvo e selecione #yellow $sakuya_mark_foreign_state$#!.\N#T #N Recomenda-se fortemente marcar apenas um local por vez!#!#!"
SKY_1_1_SP_GUIDE_BTN6_tab4: "Depois de selecionar a categoria de edifício que deseja ajustar no seletor de edifícios, o edifício selecionado atualmente aparecerá no canto inferior esquerdo do menu. Selecione primeiro o $state$ alvo com $decree_sakuya_mark_state$, depois clique no controle deslizante para ajustar o valor desejado, e então clique em #yellow $SKY_B6_BUILD_ADD_BUILDING$#!. Selecionar o nível #n 0#! limpará este edifício ou potencial de recurso. O sucesso ao adicionar edifícios e potencial de recurso depende de #N tecnologia#! e outras condições do jogador ou do país alvo.\NEdifícios das categorias $SKY_B6_BUILD_CAT_RESOURCE$ e $SKY_B6_BUILD_CAT_AGRICULTURE$ também aceitam #yellow $SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL$#!."
SKY_1_1_SP_GUIDE_BTN6_tab5: "\NNesta página, todos os modificadores têm $concept_buildings$ como alvo, exceto #yellow $SKY_B6_RESERVED_BUILD_R2_C1$#! e #yellow $SKY_B6_RESERVED_BUILD_R2_C2$#!, cujos modificadores têm o $state$ como alvo. Você precisa clicar nos $concept_buildings$ modificados antes de ver o $concept_modifier$ correspondente."
SKY_1_1_SP_GUIDE_BTN7: "\NClique com o botão direito no país que deseja marcar, depois selecione #yellow $sakuya_mark_country$#! para marcá-lo. Você também pode selecionar #yellow $sakuya_mark_country$#! em #i $concept_diplomatic_lens$#! e $concept_diplomatic_actions$ abaixo, facilitando a marcação no mapa."
 SKY_1_1_SP_GUIDE_BTN8: "\N\N#yellow $SKY_BTN8_TAB_TECHNOLOGY$#! reúne $concept_technology$modificadores relacionados; use as guias acima para alternar entre $production$, $military$, e $society$. A maioria dos botões segue as regras padrão para botões grandes/pequenos, e o clique com o botão direito do mouse limpa o campo correspondente $concept_modifier$.\N\Ne #yellow $SKY_BTN8_TAB_CULTURE$#!, clique em #yellow $SKY_B8_CULTURE_MARK$#! para abrir $SKY_1_2_CULTURE_INDEX_TITLE$#!. Selecione um destino $concept_culture$ no $concept_culture$ seletor e, em seguida, use-o para $concept_primary_cultures$, $concept_homelands$, e outras funções culturais."
SKY_1_1_SP_GUIDE_BTN9: "\nTente passar o mouse sobre o grande título de $CMP$ por um segundo...?\n@innovation!Papéis de parede diferentes mostram conteúdos diferentes."
SKY_1.1_CLOSE: "Clique para fechar."
