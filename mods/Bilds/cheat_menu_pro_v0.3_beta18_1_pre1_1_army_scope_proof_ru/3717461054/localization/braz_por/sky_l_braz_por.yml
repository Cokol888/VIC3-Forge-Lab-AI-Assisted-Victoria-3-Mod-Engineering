 SKY_B8_TT_FAMOUS_CHARACTER: "#BOLD Invocar Figura Famosa#!\n\n$SKY_LC$ Entra no país do jogador como agitador\n$SKY_RC$ Vira governante do país do jogador\n$SKY_AL$ Entra no país do jogador como general\n$SKY_SL$ Entra no país do jogador como almirante\n$SKY_line$\n#italic A mesma figura pode ser invocada várias vezes. O papel depende do clique.#!"
 SKY_ABOUT_WELCOME_1: "#BOLD Bem-vindo!#!\nPrazer em conhecer você. Sou Xier, dev do Victoria 3 Cheat Menu Pro. É uma honra reencontrar você em Victoria 3. #BOLD Grupo QQ:#! 734267077. Venha jogar conosco!"
 SKY_ABOUT_WELCOME_2: "#BOLD O que achou deste mod?#!\nContinuo desenvolvendo. Comparado ao EU5, o motor de Victoria 3 parece similar aos títulos anteriores, mas é bem diferente. De todo modo, divirtam-se! Conhecer vocês me deixa muito feliz."
 SKY_UPDATE_LOG_V1_TITLE: "#BOLD $SKY_WINDOW_TITLE$ v1.0 Notas de Atualização#!"
 SKY_UPDATE_LOG_V1_TEXT: "- Versão inicial lançada\n- Sistema de barra de navegação portado do EU5\n- 9 categorias de função, cada uma com 12 botões reservados\n- Página Sobre inclui log de atualização, personalização e informações\n- Suporte a localização em chinês simplificado"
 SKY_SETTINGS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Personalização#!"
 SKY_SETTINGS_PLACEHOLDER: "Personalização em desenvolvimento. Aguarde.\nVersões futuras terão fundo customizado, tema da interface e mais."
 SKY_ABOUT_LINKS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Contato#!"
 SKY_ABOUT_TEXT_1: "#BOLD Obrigado por usar $SKY_WINDOW_TITLE$!#!\nPrazer em conhecer você. Sou Xier, dev de Pequim vivendo na Chéquia. Dúvidas? Fale comigo pelo grupo QQ ou servidor Discord. Para apoiar Xier, curta no Steam Workshop ou doe pelo link de patrocínio acima.\nEste mod é totalmente grátis. Se você o obteve por canal pago, denuncie imediatamente. Xier agradece muito!"
 SKY_ABOUT_TEXT_2: "#BOLD Notas de Compatibilidade#!\n$SKY_WINDOW_TITLE$ foi desenhado para máxima compatibilidade com outros mods. Porém, por limites do motor, precisa modificar um arquivo GUI do sistema para exibir a interface de $concept_modifier$.\nPara carregar mods grandes por completo, ordem recomendada: mods grandes, mods pequenos, mods de UI e, por fim, $SKY_WINDOW_TITLE$. Como arquivos carregados depois sobrescrevem os anteriores, deixar $SKY_WINDOW_TITLE$ por último garante que sua UI sobrescreva outros mods de UI.\nSe tiver problemas, fale pelo grupo QQ ou servidor Discord. Farei o possível para ajudar."
