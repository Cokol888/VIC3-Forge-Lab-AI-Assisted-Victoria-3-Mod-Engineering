 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "Sakuya humilha o país-alvo por meio de um jantar diplomático extremamente impróprio, prejudicando sua reputação no cenário internacional. Duração: 5 anos."
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] é humilhado por Sakuya, que foi enviada por [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]. Duração: 5 anos."
 sakuya_superdip_humiliation_pact_01_effect_desc_global: "Estabelecer o pacto de humilhação de Sakuya"
 sakuya_superdip_humiliation_pact_01_effect_desc_first: "[COUNTRY.GetNameNoFlag] deixa Sakuya envergonhada [TARGET_COUNTRY.GetName] por 5 anos"
 sakuya_superdip_humiliation_pact_01_effect_desc_third: "[COUNTRY.GetName] deixa Sakuya envergonhada [TARGET_COUNTRY.GetName] por 5 anos"
 sakuya_superdip.1.t: "Sakuya fala em um jantar diplomático!"
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName] entra em caos quando Sakuya começa a brigar com funcionários de [SCOPE.sCountry('sakuya_superdip_target_country').GetName] durante o jantar."
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] tentou jogar um banco em Sakuya, mas ela se esquivou com agilidade, pegou um pedaço de bolo da mesa e o jogou com força em [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]na cabeça dele. \N\N\"#lore Velho tolo... Tentou me emboscar? #!\""
 sakuya_superdip.1.a: "Boa repreensão!"
 sakuya_superdip.1.b: "Vou acrescentar algumas maldições..."
 sakuya_superdip.1.c: "Sakuya-sensei, não faça isso..."
 sakuya_superdip.1.c_desc: "Depois de [SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName] Apesar de ter feito de tudo para impedi-la, Sakuya Izayoi guardou temporariamente suas facas de prata e, em seguida, tomou um gole de vinho, parecendo tão serena como sempre."
 notification_sakuya_superdip_humiliation_toast_name: "Sakuya foi humilhada com desdém [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "Sakuya entregou uma nota diplomática de notável refinamento cultural ao governante de [SCOPE.sCountry('target').GetName], [SCOPE.sCountry('target').GetRuler.GetFullName]. Por algum motivo, eles a interpretaram como um #BOLD insulto#!. Achamos divertida a vulgaridade deles; eles pareceram bastante descontentes. As relações diplomáticas entre [SCOPE.sCountry('actor').GetName] e [SCOPE.sCountry('target').GetName] parecem ter piorado."
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "Sakuya diz:\NSua mãe era um hamster,\Ne seu pai cheira a bagas de sabugueiro!"
 sakuya_superdip_insult_02: "Sakuya diz:\NO dia do juízo final está chegando!\NOs servos de Lúcifer andam pela Terra—\NAh, não, é apenas o representante do seu país."
 sakuya_superdip_insult_03: "Sakuya diz:\NAlém disso, acredito que o seu capital deve ser destruído!"
 sakuya_superdip_insult_04: "Sakuya diz:\NQuando as gerações futuras escreverem a história da nossa época,\Neles vão olhar para você com aquela mistura de pena e repulsa chamada compaixão."
 sakuya_superdip_insult_05: "Sakuya diz:\NMinha última ida ao banheiro foi muito mais agradável do que o jantar com o seu embaixador."
 sakuya_superdip_insult_06: "Sakuya diz:\NOlha só.\NTem umas obscenidades bem legais por aqui."
 sakuya_superdip_insult_07: "Sakuya diz:\NO teu sangue tornará a terra que eu te tirar ainda mais fértil."
 sakuya_superdip_insult_08: "Sakuya diz:\NEventos diplomáticos enfadonhos sempre precisam de um peixe-gato para animá-los.\NE você, meu amigo, é o melhor bagre de todos!"
 sakuya_superdip_insult_09: "Sakuya diz:\NPor que as coisas no seu país estão sempre tão ruins?\NSuspeito que a causa sejam todos vocês."
 sakuya_superdip_insult_10: "Sakuya diz:\NNeste grande jogo que jogamos,\Nvocê é apenas um peão."
 sakuya_superdip_insult_11: "Sakuya diz:\NAs histórias sobre suas travessuras são contadas da Irlanda até Cathay."
 sakuya_superdip_insult_12: "Sakuya diz:\NSeu governante tem a capacidade de raciocínio de uma banana madura,\Nmas demonstra verdadeira genialidade na defecação em público."
 sakuya_superdip_insult_13: "Sakuya diz:\NQue o seu céu esteja repleto de cometas."
 sakuya_superdip_insult_14: "Sakuya diz:\NUm mapa pode ser uma obra de arte\Ndesde que o seu país esteja na lista."
 sakuya_superdip_insult_15: "Sakuya diz:\NNão entendo por que você gosta de fazer papel de bobo em jantares diplomáticos.\NVocê está em busca de um sentido,\Nou apenas para entreter o público?"
