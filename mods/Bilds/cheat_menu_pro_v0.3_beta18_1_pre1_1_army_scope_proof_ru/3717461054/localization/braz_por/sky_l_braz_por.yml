 SKY_B7_TT_CHARTERED_COMPANY: "#BOLD $concept_chartered_company$#!\n#lore $concept_chartered_company_desc$#!\n$SKY_line$\n$SKY_LC$ Torna $SKY_TARGET_COUNTRY$ $concept_chartered_company$ de $SKY_SELF_COUNTRY$\n$SKY_RC$ Torna $SKY_SELF_COUNTRY$ $concept_chartered_company$ de $SKY_TARGET_COUNTRY$"
 SKY_B7_TT_CROWN_LAND: "#BOLD $concept_crown_land$#!\n#lore $concept_crown_land_desc$#!\n$SKY_line$\n$SKY_LC$ Torna $SKY_TARGET_COUNTRY$ $concept_crown_land$ de $SKY_SELF_COUNTRY$\n$SKY_RC$ Torna $SKY_SELF_COUNTRY$ $concept_crown_land$ de $SKY_TARGET_COUNTRY$"
 SKY_B7_TT_AUTONOMY_AND_INDEPENDENCE: "#BOLD Autonomia e Independência#!\n$SKY_line$\n$SKY_LC$ Se o alvo for súdito de $SKY_SELF_COUNTRY$, reduz sua autonomia\n$SKY_RC$ Se o alvo for súdito de $SKY_SELF_COUNTRY$, aumenta sua autonomia\n$SKY_SL$ Se $SKY_SELF_COUNTRY$ for súdito, torna-se independente imediatamente\n$SKY_AL$ Se o alvo for súdito, torna-o independente imediatamente"
 SKY_B7_TT_LIBERTY_DESIRE: "#BOLD $concept_liberty_desire$#!\n$SKY_line$\n$SKY_LC$ Reduz $concept_liberty_desire$ de $SKY_TARGET_COUNTRY$ em 20\n$SKY_RC$ Aumenta $concept_liberty_desire$ de $SKY_TARGET_COUNTRY$ em 20\n$SKY_AL$ Reduz $concept_liberty_desire$ de $SKY_TARGET_COUNTRY$ em 5\n$SKY_CR$ Se $SKY_SELF_COUNTRY$ for súdito de $SKY_TARGET_COUNTRY$, aumenta $concept_liberty_desire$ de $SKY_SELF_COUNTRY$ em 20\n$SKY_SL$ Se $SKY_SELF_COUNTRY$ for $concept_vassal$ de $SKY_TARGET_COUNTRY$, reduz $concept_liberty_desire$ de $SKY_SELF_COUNTRY$ em 20"
 SKY_B7_TT_PLAYER_LIBERTY_MOD: "#BOLD $concept_liberty_desire$ $concept_modifier$#!\n$SKY_line$\n$SKY_LC$ $SKY_SELF_COUNTRY$ +20 $concept_liberty_desire$ $concept_modifier$\n$SKY_RC$ $SKY_SELF_COUNTRY$ -20 $concept_liberty_desire$ $concept_modifier$\n$SKY_SL$ Se $SKY_MARKED_COUNTRY$ existir, $SKY_TARGET_COUNTRY$ +20 $concept_liberty_desire$ $concept_modifier$\n$SKY_CL$ Se $SKY_MARKED_COUNTRY$ existir, $SKY_TARGET_COUNTRY$ -20 $concept_liberty_desire$ $concept_modifier$\n$SKY_AL$ Remove globalmente $concept_modifier$s de $concept_liberty_desire$ do jogador e do alvo"
 SKY_B7_TT_ACQUIRE_TREATY_PORT: "#BOLD Obter $concept_treaty_port$#!\n#lore $concept_treaty_port_desc$#!\n$SKY_line$\n$SKY_LC$ Se houver $concept_state$ estrangeiro marcado, cede um $concept_treaty_port$ nele a $SKY_SELF_COUNTRY$\n$SKY_RC$ Se houver $concept_state$ de $SKY_SELF_COUNTRY$ marcado, cede um $concept_treaty_port$ nele a $SKY_MARKED_COUNTRY$"
 SKY_B7_TT_CEDE_HOME_STATE: "#BOLD Cede $SKY_SELF_COUNTRY$ $concept_state$#!\n$SKY_line$\n$SKY_LC$ Entregue o que está marcado $SKY_SELF_COUNTRY$ $concept_state$ para $SKY_MARKED_COUNTRY$.\n$SKY_RC$ Dê a $SKY_MARKED_COUNTRY$ e transformá-lo imediatamente em um estado incorporado."
 SKY_B7_TT_TAKE_FOREIGN_STATE: "#BOLD Escolha o estrangeiro $concept_state$#!\n$SKY_line$\n$SKY_LC$ Anexar o documento estrangeiro marcado $concept_state$ diretamente em $SKY_SELF_COUNTRY$.\n$SKY_RC$ Anexe-o a $SKY_SELF_COUNTRY$ e transformá-lo imediatamente em um estado incorporado."
 SKY_B7_TT_TR_ALLIANCE: "#BOLD $concept_alliance$#!\n#lore $concept_alliance_desc$#!\n$SKY_line$\n$SKY_LC$ Cria aliança de 99 anos\n$SKY_RC$ Sai deste tipo de tratado"
 SKY_B7_TT_TR_DEFENSIVE_PACT: "#BOLD $concept_defensive_pact$#!\n#lore $concept_defensive_pact_desc$#!\n$SKY_line$\n$SKY_LC$ Cria pacto defensivo de 99 anos\n$SKY_RC$ Sai deste tipo de tratado"
 SKY_B7_TT_TR_GUARANTEE_INDEPENDENCE: "#BOLD $concept_guarantee_independence$#!\n#lore $concept_guarantee_independence_desc$#!\n$SKY_line$\n$SKY_LC$ $SKY_SELF_COUNTRY$ garante a independência de $SKY_TARGET_COUNTRY$\n$SKY_RC$ Remove este tipo de tratado"
 SKY_B7_TT_TR_SUPPORT_INDEPENDENCE: "#BOLD $support_independence$#!\n#lore $request_support_independence_desc$#!\n$SKY_line$\n$SKY_LC$ $SKY_SELF_COUNTRY$ apoia a independência de $SKY_TARGET_COUNTRY$\n$SKY_RC$ Remove este tipo de tratado"
 SKY_B7_TT_EMBASSY: "#BOLD $offer_embassy$#!\n$SKY_line$\n$SKY_LC$ $SKY_SELF_COUNTRY$ estabelece artigo de embaixada com $SKY_TARGET_COUNTRY$\n$SKY_RC$ Remove este tipo de tratado"
 SKY_B7_TT_TR_TREATY_PORT: "#BOLD $concept_treaty_port$#!\n#lore $concept_treaty_port_desc$#!\n$SKY_line$\n$SKY_LC$ Cria tratado de porto de tratado para nosso país usando o $concept_state$ estrangeiro marcado\n$SKY_RC$ Cria tratado de porto de tratado para o país marcado usando o $concept_state$ marcado em nosso país"
 SKY_B7_TT_TR_COMPANY_MONOPOLY: "#BOLD $concept_company$ $SKY_MONOPOLY$#!\n$SKY_line$\n$SKY_LC$ Faz a $concept_company$ marcada do jogador $SKY_MONOPOLY$ centros de comércio de $SKY_TARGET_COUNTRY$\n$SKY_RC$ Faz a $concept_company$ marcada do jogador $SKY_MONOPOLY$ ferrovias de $SKY_TARGET_COUNTRY$\n$SKY_AL$ Faz a $concept_company$ marcada do jogador $SKY_MONOPOLY$ indústrias de armas de $SKY_TARGET_COUNTRY$\n$SKY_CL$ Remove estes três tratados de $SKY_MONOPOLY$"
