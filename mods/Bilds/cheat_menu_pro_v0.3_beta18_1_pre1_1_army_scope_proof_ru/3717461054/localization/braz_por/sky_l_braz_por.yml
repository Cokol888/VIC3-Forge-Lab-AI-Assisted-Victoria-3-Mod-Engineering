 SKY_B7_TT_TRIBUTARY: "#BOLD $concept_tributary$#!\n#lore $concept_tributary_desc$#!\nSó $concept_unrecognized_power$ pode ter relações de $concept_tributary$.\n$SKY_line$\n$SKY_LC$ Torna $SKY_TARGET_COUNTRY$ $concept_tributary$ de $SKY_SELF_COUNTRY$\n$SKY_RC$ Torna $SKY_SELF_COUNTRY$ $concept_tributary$ de $SKY_TARGET_COUNTRY$"
