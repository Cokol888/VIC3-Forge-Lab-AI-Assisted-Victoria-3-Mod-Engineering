 SKY_B6_POPMIG_TT_NATIONAL_REV: "#BOLD $SKY_B6_POPMIG_NATIONAL$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Move 20% da população de $SKY_SELF_COUNTRY$ para $concept_state$s incorporados de $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nMarque um país primeiro."
