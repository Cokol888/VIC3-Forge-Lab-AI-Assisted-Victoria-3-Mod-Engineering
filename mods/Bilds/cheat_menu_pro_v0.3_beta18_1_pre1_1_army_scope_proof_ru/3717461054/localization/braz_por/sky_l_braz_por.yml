 SKY_B6_POPMIG_TT_SAME_CULTURE: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Move 20% da população em $SKY_MARKED_COUNTRY$ que pertence às culturas primárias de $SKY_SELF_COUNTRY$ para $concept_state$s marcados de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_SAME_CULTURE_REV: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nMove a população em $SKY_SELF_COUNTRY$ que pertence às culturas primárias de $SKY_MARKED_COUNTRY$ para $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, distribuída para $concept_state$s incorporados do alvo.\n$SKY_AL$ 5%, distribuída para $concept_state$s incorporados do alvo.\n$SKY_CL$ 50%, distribuída para $concept_state$s incorporados do alvo.\n$SKY_SL$ 33%, movida para $concept_state$s marcados do alvo.\n$SKY_RC$ 100%, distribuída para $concept_state$s incorporados do alvo."
 SKY_B6_POPMIG_TT_NON_PRIMARY: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nMove a população de cultura não primária de $SKY_SELF_COUNTRY$ para $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, distribuída para $concept_state$s incorporados do alvo.\n$SKY_AL$ 5%, distribuída para $concept_state$s incorporados do alvo.\n$SKY_CL$ 50%, distribuída para $concept_state$s incorporados do alvo.\n$SKY_SL$ 33%, movida para $concept_state$s marcados do alvo.\n$SKY_RC$ 100%, distribuída para $concept_state$s incorporados do alvo."
 SKY_B6_POPMIG_TT_NON_PRIMARY_REV: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Move 20% da população de cultura não primária de $SKY_MARKED_COUNTRY$ para $concept_state$s marcados de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_POINT: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Move 20% da população em $concept_state$s marcados de $SKY_MARKED_COUNTRY$ para $concept_state$s marcados de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n Recomenda-se marcar só um estado de cada lado. Com múltiplos marcados, o script escolhe aleatoriamente um alvo válido.#!"
 SKY_B6_POPMIG_TT_POINT_REV: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Move 20% da população em $concept_state$s marcados de $SKY_SELF_COUNTRY$ para $concept_state$s marcados de $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n Recomenda-se marcar só um estado de cada lado. Com múltiplos marcados, o script escolhe aleatoriamente um alvo válido.#!"
 SKY_B6_POPMIG_TT_LOW_ACCEPTANCE: "#BOLD $SKY_B6_POPMIG_LOW_ACCEPTANCE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nMove a população nos dois níveis mais baixos de aceitação de $SKY_SELF_COUNTRY$ para $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, distribuída para $concept_state$s incorporados do alvo.\n$SKY_AL$ 5%, distribuída para $concept_state$s incorporados do alvo.\n$SKY_CL$ 50%, distribuída para $concept_state$s incorporados do alvo.\n$SKY_SL$ 33%, movida para $concept_state$s marcados do alvo.\n$SKY_RC$ 100%, distribuída para $concept_state$s incorporados do alvo.\n\nRequer país marcado. $SKY_SL$ também requer ao menos um $concept_state$ marcado nesse país."
