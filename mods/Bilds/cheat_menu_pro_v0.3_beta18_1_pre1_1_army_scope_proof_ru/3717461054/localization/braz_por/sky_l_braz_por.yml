 SKY_B5_TT_LOBBY_IG_JOIN: "#BOLD Entrar/Sair do $concept_political_lobby_short$#!\n\n$SKY_LC$ $concept_interest_group$ selecionado entra no $concept_political_lobby_short$ selecionado\n$SKY_RC$ $concept_interest_group$ selecionado sai do $concept_political_lobby_short$ selecionado\n$SKY_SL$ Todos os $concept_interest_group$s deste país entram no $concept_political_lobby_short$ selecionado\n$SKY_CL$ Remove todos os membros do $concept_political_lobby_short$ selecionado\n$SKY_line$\n#italic Se o $concept_political_lobby_short$ pertence a país estrangeiro, usa automaticamente o $concept_interest_group$ correspondente desse país.\nClique esq./dir. exigem $concept_interest_group$ e $concept_political_lobby_short$ selecionados.#!"
 SKY_B5_TT_LOBBY_CREATE: "#BOLD Criar $concept_political_lobby_short$#!\n\n$SKY_LC$ Cria $concept_political_lobby_short$ pró-alvo neste país\n$SKY_RC$ Cria $concept_political_lobby_short$ anti-alvo neste país\n$SKY_SL$ Cria $concept_political_lobby_short$ pró-jogador no alvo\n$SKY_AL$ Cria $concept_political_lobby_short$ anti-jogador no alvo\n$SKY_line$\n#italic Requer país-alvo marcado. Se houver $concept_interest_group$ selecionado, ele será membro inicial.#!"
