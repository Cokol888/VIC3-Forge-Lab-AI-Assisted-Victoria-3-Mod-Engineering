 sakuya_superdip_beguile_country_01_desc: "Que a Sakuya intervenha pessoalmente para melhorar nossas relações diplomáticas com esse país."
 notification_sakuya_superdip_annex_country_toast_name: "[SCOPE.sCountry('actor').GetName] unificado [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_annex_country_toast_desc: "Depois que Sakuya a convenceu, [SCOPE.sCountry('target').GetRuler.GetFullName] assinou o [SCOPE.sCountry('actor').GetCapital.GetCityHubName] Tratado em [SCOPE.sCountry('target').GetCapital.GetCityHubName], e [SCOPE.sCountry('target').GetName] e [SCOPE.sCountry('actor').GetName] finalmente concluíram sua unificação."
 notification_sakuya_superdip_annex_country_toast_tooltip: "#header $notification_sakuya_superdip_annex_country_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_annex_country_toast_desc$"
 notification_sakuya_superdip_force_join_power_bloc_toast_name: "[SCOPE.sCountry('target').GetName] juntou-se ao nosso Power Bloc"
 notification_sakuya_superdip_force_join_power_bloc_toast_desc: "[SCOPE.sCountry('target').GetRuler.GetFullName] reconheceu, após a reunião, que a explicação de Sakuya sobre a situação internacional era clara e difícil de contestar. [SCOPE.sCountry('target').GetName] depois ingressou na $concept_power_bloc$ que [SCOPE.sCountry('actor').GetName] pertence a."
 notification_sakuya_superdip_force_join_power_bloc_toast_tooltip: "#header $notification_sakuya_superdip_force_join_power_bloc_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_force_join_power_bloc_toast_desc$"
 sakuya_superdip.3.t: "Sakuya convenceu [SCOPE.sCountry('sakuya_superdip_target_country').GetName]'s [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]"
 sakuya_superdip.3.d: "Em uma reunião privada, Sakuya convenceu [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] reconsiderar as relações com [SCOPE.sCountry('sakuya_superdip_actor_country').GetName]."
 sakuya_superdip.3.f: "No final da reunião, [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] já havia devolvido a nota severa que havia preparado inicialmente à gaveta e pedido que marcassem a próxima reunião. Sakuya simplesmente fechou o relógio de bolso com calma, como se tudo estivesse como deveria estar."
 sakuya_superdip.3.a: "Isso é bom."
