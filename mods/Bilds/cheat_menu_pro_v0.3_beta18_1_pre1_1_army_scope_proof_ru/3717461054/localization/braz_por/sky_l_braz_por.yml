 SKY_B7_TT_SUBJECTS_LIBERTY_DESIRE: "#BOLD $concept_liberty_desire$ de todos os súditos#!\n$SKY_line$\n$SKY_LC$ Todos os súditos de $SKY_SELF_COUNTRY$: -20 $concept_liberty_desire$\n$SKY_RC$ Todos os súditos de $SKY_SELF_COUNTRY$: +20 $concept_liberty_desire$\n$SKY_AL$ Todos os súditos de $SKY_SELF_COUNTRY$: -5 $concept_liberty_desire$\n$SKY_CL$ Se $SKY_MARKED_COUNTRY$ existir, todos os súditos de $SKY_TARGET_COUNTRY$: -20 $concept_liberty_desire$\n$SKY_SL$ Se $SKY_MARKED_COUNTRY$ existir, todos os súditos de $SKY_TARGET_COUNTRY$: +20 $concept_liberty_desire$"
 SKY_B7_TT_SUBJECTS_LIBERTY_MOD: "#BOLD $concept_liberty_desire$ $concept_modifier$ dos súditos#!\n$SKY_line$\n$SKY_LC$ Adicionar -20 de $concept_liberty_desire$ $concept_modifier$ dos súditos a $SKY_SELF_COUNTRY$.\n$SKY_SL$ Adicionar +20 de $concept_liberty_desire$ $concept_modifier$ dos súditos a $SKY_SELF_COUNTRY$.\n$SKY_AL$ Adicionar -5 de $concept_liberty_desire$ $concept_modifier$ dos súditos a $SKY_SELF_COUNTRY$.\n$SKY_CL$ Se $SKY_MARKED_COUNTRY$ existir, adicionar -20 de $concept_liberty_desire$ $concept_modifier$ dos súditos a $SKY_TARGET_COUNTRY$.\n$SKY_RC$ Remover o $concept_liberty_desire$ $concept_modifier$ dos súditos deste botão pequeno."
