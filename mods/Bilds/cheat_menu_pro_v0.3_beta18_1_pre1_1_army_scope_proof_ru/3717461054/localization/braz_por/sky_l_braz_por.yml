SKY_1_1_B6_TT_RESERVED_BUILD_R1_C2_PLUS: "#BOLD Necessidades de Insumo do Edifício Selecionado#!\n\nAplica-se ao edifício atualmente selecionado no seu estado marcado.\n\n$SKY_LC$ #n -#!50%\n$SKY_SL$ #n -#!99900%\n$SKY_AL$ #n -#!66%\n$SKY_CL$ +100%\n$SKY_RC$ +20%."
SKY_1_1_B6_TT_RESERVED_BUILD_R1_C3: "#BOLD Salário Mín. do Edifício Selecionado#!\n\nAplica-se ao edifício atualmente selecionado no seu estado marcado.\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!99%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ #n -#!10%\n$SKY_RC$ Limpa este grupo e o botão +."
