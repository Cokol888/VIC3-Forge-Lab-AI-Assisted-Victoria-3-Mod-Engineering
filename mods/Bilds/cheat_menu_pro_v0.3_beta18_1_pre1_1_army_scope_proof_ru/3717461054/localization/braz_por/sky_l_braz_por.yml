SKY_1_1_SP_THANKS_3: "Xier teve a sorte de conhecer todos vocês, e agradece por sua companhia ao longo do caminho:\n\nA Okang, usuário Afdian_c9b6a, Fan Jiayuan,\nusuário Afdian_79091, Gao Fu Shuai Que Er, usuário Afdian_jm3J,\nEl Mono, Xiao Shi, AbrahamKafe"
SKY_1_1_SP_THANKS_4: "Os mil e quinhentos membros\ndos dois grupos do Xier Modifier\ne você"
SKY_1_1_SP_THANKS_5: "Conhecer você foi realmente uma sorte."
