 SKY_B6_BUILD_TT_CAT_URBAN: "#BOLD Urbano#!\n\n$SKY_LC$ Mostra fábricas e outros edifícios urbanos comuns\n$SKY_RC$ Mostra centros urbanos, edifícios especiais, maravilhas e monumentos"
 SKY_B6_BUILD_SELECTED_TITLE: "Edifício\nSelecionado"
 SKY_B6_BUILD_SELECTED_NONE: "Nada Selecionado"
 SKY_B6_BUILD_TT_CONFIRM: "#BOLD Instalar Edifício#!\n\n$SKY_LC$ Aplica a mudança de nível atual aos estados marcados do jogador\n$SKY_RC$ Se houver país marcado e ele tiver estados estrangeiros marcados, aplica a esses estados\n$SKY_line$\n#lore 0 remove o edifício. Valores positivos adicionam níveis. Se o estado-alvo não tiver este edifício, ele será criado no nível correspondente.#!"
 SKY_B6_BUILD_APPLY_SEC: "#T #COLOR:{0.7275,0.6333,0.4529,1} Instalar Edifício#!"
 SKY_B6_BUILD_APPLY_RESOURCE_SEC: "#T #COLOR:{0.7275,0.6333,0.4529,1} Instalar Edifício e Recurso Potencial#!"
 SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL: "Adicionar Recurso Potencial"
 SKY_B6_BUILD_TT_RESOURCE_POTENTIAL: "#BOLD Adicionar Recurso Potencial#!\n\n$SKY_LC$ Adiciona aos estados marcados do jogador os recursos potenciais do edifício selecionado\n$SKY_RC$ Se houver país marcado e ele tiver estados estrangeiros marcados, aplica a esses estados\n$SKY_line$\n#lore Nível 0 remove. Níveis positivos adicionam ou elevam o valor atual. Edifícios agrícolas hoje só suportam adicionar e remover.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1: "#BOLD $concept_throughput$ do Edifício Selecionado#!\n\n#lore Primeiro selecione edifício em $SKY_BTN6_SEC$-$SKY_BTN6_TAB3$ e marque ao menos 1 $concept_state$.#!\n#lore Se o edifício atual não suportar isto, use o botão genérico de $concept_throughput$ no canto inferior direito.#!\n#lore Suporte atual: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Limpa este grupo, incluindo o botão + à direita\n#lore Acumula com o botão de passo grande à direita.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1_PLUS: "#BOLD $concept_throughput$ do Edifício: Passo Grande#!\n\n#lore Grupo independente do botão comum à esquerda e acumulável. Limpar a esquerda também limpa isto.#!\n#lore Suporte atual: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
 SKY_B6_RESERVED_BUILD_R1_C2: "Demanda de Entrada do Edifício"
 SKY_B6_TT_RESERVED_BUILD_R1_C2: "#BOLD Demanda de Entrada do Edifício#!\n\n#lore Aplica-se ao edifício selecionado nos estados marcados do jogador.#!\n#lore Operações positivas reduzem a demanda de bens de entrada do edifício.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Limpa este grupo"
 SKY_B6_RESERVED_BUILD_R1_C3: "Salário Mínimo do Edifício"
 SKY_B6_TT_RESERVED_BUILD_R1_C3: "#BOLD Salário Mínimo do Edifício#!\n\n#lore Aplica-se ao edifício selecionado nos estados marcados do jogador.#!\n#lore Operações positivas reduzem a meta salarial do edifício.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Limpa este grupo"
 SKY_B6_TT_RESERVED_BUILD_R2_C1: "#BOLD Tamanho de Emprego do Edifício#!\n\n#lore Faz efeito conforme o tipo de edifício selecionado e se aplica aos estados marcados do jogador.#!\n#lore Operações positivas reduzem o tamanho padrão de empregados.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Limpa este grupo"
 SKY_B6_TT_RESERVED_BUILD_R2_C2: "#BOLD Condições de Trabalho do Edifício#!\n\n#lore Aplica-se ao edifício correspondente nos estados marcados do jogador.#!\n#lore Operações positivas reduzem o modificador de condições de trabalho do edifício.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Limpa este grupo"
 SKY_B6_TT_RESERVED_BUILD_R2_C3: "#BOLD $concept_throughput$ Genérico do Edifício#!\n\n#lore Aplica-se diretamente ao edifício selecionado nos estados marcados do jogador.#!\n#lore Se o $concept_throughput$ exclusivo no canto superior esquerdo não cobrir o edifício atual, use este.#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Limpa este grupo, incluindo o botão + à direita"
 SKY_B6_TT_RESERVED_BUILD_R2_C3_PLUS: "#BOLD $concept_throughput$ Genérico: Passo Grande#!\n\n#lore Grupo independente do botão comum à esquerda e acumulável. Clique direito à esquerda também limpa isto.#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
