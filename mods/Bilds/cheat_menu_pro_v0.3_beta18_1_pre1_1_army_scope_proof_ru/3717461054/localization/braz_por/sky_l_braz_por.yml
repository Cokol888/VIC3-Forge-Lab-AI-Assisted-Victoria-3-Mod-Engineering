 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Alvo: culturas primárias do alvo#!\n\n$SKY_LC$ Se houver país marcado: adiciona todas as nossas culturas primárias às do alvo\n$SKY_RC$ Se tivermos $concept_state$ marcado: adiciona as culturas-pátria desse $concept_state$ às do alvo\n$SKY_SL$ Se o alvo tiver $concept_state$ marcado: adiciona as culturas-pátria desse $concept_state$ às do alvo\n$SKY_CL$ Se houver $concept_character$ marcado: adiciona a cultura dele às do alvo"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Alvo: nossas culturas primárias#!\n\n$SKY_LC$ Se houver país marcado: remove todas as culturas primárias do alvo das nossas\n$SKY_RC$ Se tivermos $concept_state$ marcado: remove as culturas-pátria desse $concept_state$ das nossas\n$SKY_SL$ Se houver país marcado e o alvo tiver $concept_state$ marcado: remove as culturas-pátria desse $concept_state$ das nossas\n$SKY_CL$ Se houver $concept_character$ marcado: remove a cultura dele das nossas\n$SKY_line$\n#n Aviso: não remove a última cultura primária de um país. Não deixe país sem cultura primária, ou o save pode quebrar.#!"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Alvo: culturas primárias do alvo#!\n\n$SKY_LC$ Se houver país marcado: remove todas as nossas culturas primárias das do alvo\n$SKY_RC$ Se tivermos $concept_state$ marcado: remove as culturas-pátria desse $concept_state$ das do alvo\n$SKY_SL$ Se o alvo tiver $concept_state$ marcado: remove as culturas-pátria desse $concept_state$ das do alvo\n$SKY_CL$ Se houver $concept_character$ marcado: remove a cultura dele das do alvo\n$SKY_line$\n#n Aviso: não remove a última cultura primária de um país. Não deixe país sem cultura primária, ou o save pode quebrar.#!"
