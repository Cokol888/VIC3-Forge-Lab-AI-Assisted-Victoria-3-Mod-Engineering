 SKY_B8_TT_RECOGNIZED: "#BOLD Reconhecido#!\n\n$SKY_LC$ Torna $SKY_SELF_COUNTRY$ reconhecido\n$SKY_RC$ Torna $SKY_SELF_COUNTRY$ não reconhecido\n$SKY_SL$ Torna $SKY_MARKED_COUNTRY$ reconhecido\n$SKY_CL$ Torna $SKY_MARKED_COUNTRY$ não reconhecido\n$SKY_line$\n#italic Se nenhum país estiver marcado, Shift/Ctrl não terá efeito.#!"
 SKY_B8_TT_REGENCY: "#BOLD Regência#!\n\n$SKY_LC$ Adiciona regência a $SKY_SELF_COUNTRY$\n$SKY_RC$ Remove regência de $SKY_SELF_COUNTRY$\n$SKY_SL$ Adiciona regência a $SKY_MARKED_COUNTRY$\n$SKY_CL$ Remove regência de $SKY_MARKED_COUNTRY$\n$SKY_line$\n#italic Só vale para países com lei monárquica. Sem país marcado, Shift/Ctrl não terá efeito.#!"
 SKY_B8_TT_COLONIAL: "#BOLD Status Colonial#!\n\n$SKY_LC$ Define $SKY_SELF_COUNTRY$ como país colonial\n$SKY_SL$ Define $SKY_MARKED_COUNTRY$ como país colonial\n$SKY_line$\n#italic Muda à força o status do país. Sem país marcado, Shift não terá efeito.#!"
 SKY_B8_TT_RETIRE: "#BOLD Aposentadoria Forçada#!\n\n$SKY_LC$ Aposenta imediatamente o $concept_character$ marcado.\n$SKY_line$\n#italic Requer personagem marcado.#!"
 SKY_B8_TT_MARTYR_EXILE: "#BOLD Exílio Mártir#!\n\n$SKY_LC$ Exila o $concept_character$ marcado como mártir político.\n$SKY_line$\n#italic O alvo será exilado e deixará impacto de mártir político em casa. Confirme que há personagem selecionado.#!"
 SKY_B8_TT_DISINHERIT: "#BOLD Deserdar#!\n\n$SKY_LC$ Deserda o $concept_character$ marcado.\n$SKY_line$\n#italic Requer personagem marcado. Geralmente só faz sentido para alvos com sistema sucessório.#!"
 SKY_B8_TT_LAWSET_LIBERAL: "#BOLD País Liberal#!\n\n$SKY_LC$ Faz $SKY_SELF_COUNTRY$ adotar o pacote completo de leis liberais\n$SKY_RC$ Faz $SKY_MARKED_COUNTRY$ adotar o pacote completo de leis liberais\n$SKY_line$\n#italic Muda instantaneamente todas as leis relevantes do país. Sem país marcado, clique direito não terá efeito.#!"
 SKY_B8_TT_LAWSET_FASCIST: "#BOLD País Fascista#!\n\n$SKY_LC$ Muda $SKY_SELF_COUNTRY$ para o pacote completo de leis fascistas\n$SKY_RC$ Muda $SKY_MARKED_COUNTRY$ para o pacote completo de leis fascistas\n$SKY_line$\n#italic Sem país marcado, clique direito não terá efeito.#!"
 SKY_B8_TT_LAWSET_GDP: "#BOLD Foco em PIB#!\n\n$SKY_LC$ Muda $SKY_SELF_COUNTRY$ para o pacote de leis focado em PIB\n$SKY_RC$ Muda $SKY_MARKED_COUNTRY$ para o pacote de leis focado em PIB\n$SKY_line$\n#italic Sem país marcado, clique direito não terá efeito.#!"
 SKY_B8_TT_LAWSET_SOL: "#BOLD Foco em SoL#!\n\n$SKY_LC$ Muda $SKY_SELF_COUNTRY$ para o pacote de leis focado em SoL\n$SKY_RC$ Muda $SKY_MARKED_COUNTRY$ para o pacote de leis focado em SoL\n$SKY_line$\n#italic Sem país marcado, clique direito não terá efeito.#!"
 SKY_B8_TT_LAWSET_COMMUNIST: "#BOLD Comunismo#!\n\n$SKY_LC$ Muda $SKY_SELF_COUNTRY$ para o pacote completo de leis comunistas\n$SKY_RC$ Muda $SKY_MARKED_COUNTRY$ para o pacote completo de leis comunistas\n$SKY_line$\n#italic Sem país marcado, clique direito não terá efeito.#!"
 SKY_B8_TT_LAWSET_SHIT: "#BOLD Distopia#!\n\n$SKY_LC$ Muda $SKY_SELF_COUNTRY$ para o pacote completo de leis distópicas\n$SKY_RC$ Muda $SKY_MARKED_COUNTRY$ para o pacote completo de leis distópicas\n$SKY_line$\n#italic Arrasta o país de volta à era mais sombria e retira todos os direitos. Sem país marcado, clique direito não terá efeito.#!"
 SKY_B8_TT_HOW_DARE_U: "#BOLD HOW DARE U#!\n\n$SKY_LC$ Aplica modificador militar extremo a $SKY_SELF_COUNTRY$\n$SKY_AL$ Aplica modificador militar extremo a $SKY_MARKED_COUNTRY$\n$SKY_SL$ Aplica a versão negativa a $SKY_SELF_COUNTRY$\n$SKY_CL$ Aplica a versão negativa a $SKY_MARKED_COUNTRY$\n$SKY_RC$ Limpa modificadores deste botão\n$SKY_line$\n#italic A versão positiva contém 3 modificadores de exército, 3 de marinha, 2 de combate e 2 de prestígio. Taxa de abate 99999. A versão negativa define valores militares em -999 e inverte prestígio para +90%. Sem país marcado, Alt/Ctrl não terá efeito.#!"
 SKY_B8_TT_DOOMFALL: "#BOLD Queda Fatal#!\n\n$SKY_LC$ Planta uma bomba econômica e revolucionária em $SKY_MARKED_COUNTRY$ e subtrai dinheiro igual a 1000% do limite do tesouro\n$SKY_AL$ Aplica o mesmo a $SKY_SELF_COUNTRY$ e subtrai dinheiro igual a 1000% do limite do tesouro\n$SKY_RC$ Limpa modificadores deste botão\n$SKY_line$\n#italic Foca em radicalismo, revolução, caos e estagnação econômica. Capacidade de construção vai direto para -99999. Sem país marcado, clique esquerdo não terá efeito.#!"
 SKY_B8_TT_SOCIAL_COLLAPSE: "#BOLD Colapso Social#!\n\n$SKY_LC$ Joga $SKY_MARKED_COUNTRY$ em colapso institucional, demográfico e social\n$SKY_AL$ Aplica o mesmo estado a $SKY_SELF_COUNTRY$\n$SKY_RC$ Limpa modificadores deste botão\n$SKY_line$\n#italic Foca em decadência total de legitimidade, legalistas, migração, tumulto e limites de instituições sociais. SoL é definido diretamente em -19. Sem país marcado, clique esquerdo não terá efeito.#!"
