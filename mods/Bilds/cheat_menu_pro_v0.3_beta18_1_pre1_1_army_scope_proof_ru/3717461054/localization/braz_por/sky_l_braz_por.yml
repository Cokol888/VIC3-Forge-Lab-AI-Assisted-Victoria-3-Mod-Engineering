 SKY_B6_POPGEN_TT_BTN_CULTURE: "#BOLD $concept_culture$#!\n\nSeleciona a fonte de $concept_culture$ dos novos pops."
 SKY_B6_POPGEN_TT_START_PLAYER: "#BOLD Gerar em $concept_state$ de $SKY_SELF_COUNTRY$#!\n\nGera em $concept_state$s marcados de $SKY_SELF_COUNTRY$.\n\nRequer ao menos um $concept_state$ marcado em $SKY_SELF_COUNTRY$ e seleções de quantidade, proporção de trabalhadores, $concept_literacy$ e $concept_culture$."
