 SKY_B7_TT_AI_STRATEGY_PRUSSIA_OF_THE_BALKANS: "#T $ai_strategy_prussia_of_the_balkans$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ mudará sua estratégia para a estratégia selecionada.\N\N#lore $SKY_TARGET_COUNTRY$ tentará reconstruir um império búlgaro do Mar Negro aos mares Jônico e Egeu, criando um exército capaz de defender independência, interesses e ambições por tecnologia, força e números.#!"
 SKY_B7_TT_SPECIAL_CLAUSE_UNLOCK: "#BOLD Alternar Cláusula de Cooperação#!\n$SKY_line$\n$SKY_LC$ Ativa $sakuya_b7_special_cooperation_clause$ na interface de negociação. \n$SKY_RC$ Remove esta variável e oculta $sakuya_b7_special_cooperation_clause$ de novo\n$SKY_line$\n#lore $sakuya_b7_special_cooperation_clause$ não tem efeito real. Só dá aceitação altíssima a $SKY_TARGET_COUNTRY$, facilitando assinatura forçada.#!"
 sakuya_b7_special_cooperation_clause: "Cláusula Especial de Cooperação"
 sakuya_b7_special_cooperation_clause_desc: "Cláusula preparada por Sakuya para negociações de tratado. Não pergunte por que o país-alvo foi enfeitiçado."
