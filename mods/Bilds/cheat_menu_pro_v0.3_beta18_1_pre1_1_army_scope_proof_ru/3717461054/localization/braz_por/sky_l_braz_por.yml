 SKY_B1_THROUGHPUT: "rendimento"
 SKY_B1_TT_SUPER_RIGHT_CLICK: "#BOLD $SKY_B1_SUPER_RIGHT_CLICK$#!\n$SKY_line$\n$SKY_LC$ Abrir. \n$SKY_RC$ Fechar. \N\N#LORE Depois de ativado, lembre-se de cancelar a pausa do jogo, pois ele atualizará o estado no dia seguinte. Em seguida, clique com o botão direito do mouse em qualquer país para ver ações diplomáticas adicionais, como #t $sakuya_superdip_humiliate_01$#!."
 SKY_B1_TT_POWER_PERCENT_PLUS: "$SKY_LC$ $SKY_SELF_COUNTRY$ +25% \n$SKY_SL$ $SKY_SELF_COUNTRY$ +100% \n$SKY_AL$ $SKY_SELF_COUNTRY$ #n - #!100% \n$SKY_CL$ $SKY_MARKED_COUNTRY$ +25% \n$SKY_RC$ $SKY_MARKED_COUNTRY$ #n - #!25% \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_CONSTRUCTION_PERCENT_TBC: "#BOLD Construção rápida +#!\n$SKY_line$\nEste recurso não está disponível no momento. Por favor, use o botão “Capacidade de construção” ao lado."
 SKY_B1_TT_FAST_CONSTRUCTION_LIMIT: "#BOLD Alocação de poder de construção e construção privada #!\n$SKY_line$\n$SKY_LC$ Poder de construção +9999999. \n$SKY_CL$ Alocação de construção privada +1000%. \n$SKY_RC$ Alocação de construção privada #n - #!10000%."
 SKY_B1_TT_TREASURY_CAP_QUICK: "#BOLD $concept_gold_reserves$#!\n$SKY_line$\n$SKY_LC$ Aumente o endereço @money!em 100% do limite superior de $concept_gold_reserves$. \n$SKY_SL$ Aumente @money!em 20% do limite superior de $concept_gold_reserves$. \n$SKY_AL$ Diminua @money!em 100% do limite superior de $concept_gold_reserves$. \n$SKY_CL$ $SKY_MARKED_COUNTRY$Diminua @money!em 100% do limite superior de $concept_gold_reserves$. \n$SKY_RC$ Aumente @money!em 99,999% do limite superior de $concept_gold_reserves$. \n$SKY_line$\nAjustes mais detalhados podem ser feitos na página Economia."
 SKY_B1_TT_BIRTH_RATE_V2: "#BOLD $SKY_B1_R2_C2$#!\n$SKY_line$\n$SKY_LC$ +100% por 1 ano. \n$SKY_SL$ +3000% por 1 ano. \n$SKY_AL$ +5%. \n$SKY_CL$ #n - #!100% por 1 ano. \n$SKY_RC$ Limpo. \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_BIRTH_RATE_PLUS: "#BOLD $SKY_B1_R2_C2$ + #!\n$SKY_line$\n$SKY_LC$ +500% por 1 ano. \n$SKY_SL$ #n - #!2000% por 1 ano. \n$SKY_AL$ #n - #!20% por 1 ano. \n$SKY_CL$ +10000%, dura 1 ano. \n$SKY_RC$ +99999% por 1 mês. \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_INTEGRATE_ALL: "#BOLD Estados da integração#!\n$SKY_line$\n$SKY_LC$ Incluir tudo $SKY_SELF_COUNTRY$ estados.\n$SKY_SL$ Velocidade de incorporação +100%.\n$SKY_AL$ Velocidade de incorporação +5%.\n$SKY_CL$ Rapidez na constituição #n -#!100%.\n$SKY_RC$ Remover o modificador de velocidade de incorporação.\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_CLEAN_POLLUTION: "#BOLD Combate à poluição#!\n$SKY_line$\n$SKY_LC$ Reduzir a poluição em todos os $SKY_SELF_COUNTRY$ estados.\n$SKY_SL$ Impacto da poluição #n -#!100%.\n$SKY_AL$ Impacto da poluição #n -#!5%.\n$SKY_CL$ Impacto da poluição +100%.\n$SKY_RC$ Remover o modificador de impacto da poluição.\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_THROUGHPUT_ALL: "#BOLD Rendimento#!\n$SKY_line$\n$SKY_LC$ Todos $SKY_SELF_COUNTRY$ indica um aumento de 20%.\n$SKY_SL$ Todos $SKY_SELF_COUNTRY$ aumenta em mais de 1000%.\n$SKY_AL$ Todos $SKY_SELF_COUNTRY$ indica um aumento de 5%.\n$SKY_CL$ Todos $SKY_SELF_COUNTRY$ estados #n -#!20%.\n$SKY_RC$ Entendido.\n$SKY_line$\n$SKY_stackable$"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_BREAK_FREE: "#T $ai_strategy_subject_break_free$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ mudará sua estratégia para a estratégia selecionada no momento.\N\N#lore $SKY_TARGET_COUNTRY$ quer conquistar a independência de seu $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_STRENGTHEN_SELF: "#T $ai_strategy_subject_strengthen_self$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ mudará sua estratégia para a estratégia selecionada no momento.\N\N#lore $SKY_TARGET_COUNTRY$ quer aumentar $concept_autonomy$ e reduzir a dependência de seu $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_MAINTAIN_AUTONOMY: "#T $ai_strategy_subject_maintain_autonomy$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ mudará sua estratégia para a estratégia selecionada no momento.\N\N#lore $SKY_TARGET_COUNTRY$ pretende manter a sua atual $concept_autonomy$ sob a sua $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_OVERLORD_COMPLIANCE: "#T $ai_strategy_subject_overlord_compliance$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ mudará sua estratégia para a estratégia selecionada no momento.\N\N#lore $SKY_TARGET_COUNTRY$ deseja uma integração mais estreita com seus $concept_overlord$ e seguirei fielmente suas instruções.#!"
