 SKY_B3_INST_TT_SET_LEVEL_1: "#BOLD Nível Institucional#!\n\n$SKY_LC$ Define esta instituição no nível 1 imediatamente.\n$SKY_SL$ Nível máximo da instituição atual +1, acumulável.\n$SKY_CL$ Nível máximo da instituição atual -1.\n$SKY_RC$ Apaga o modificador de nível máximo atual.\n\nO nível da instituição é limitado pelo máximo permitido. Mesmo se definido acima, o excedente voltará ao intervalo permitido."
