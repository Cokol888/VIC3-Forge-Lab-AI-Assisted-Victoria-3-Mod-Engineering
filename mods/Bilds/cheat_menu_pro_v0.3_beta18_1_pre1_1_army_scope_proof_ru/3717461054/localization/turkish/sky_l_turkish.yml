 SKY_1_2_B7_TT_ACQUIRE_TREATY_PORT_DISABLED: "#BOLD $SKY_B7_ACQUIRE_TREATY_PORT$#!\n$SKY_line$\nÖncelikle eyaletlerimizden birini ya da bir yabancı eyaleti seçmeniz gerekiyor.\n\nEyaletlerimizden birini yabancı bir ülkenin $concept_treaty_port$: Eyaletlerimizden birini seçin, #T $decree_sakuya_mark_state$#! kararnameyi, ardından #T $sakuya_mark_country$#! hedef ülkeye yönelik diplomatik girişim.\n\nBir $concept_treaty_port$ yabancı bir ülkeden: hedef ülkeye sağ tıklayın, ardından #T $sakuya_mark_country$#! \"Diplomatik Eylemler\" altından, ardından şunu seçin #T $sakuya_mark_foreign_state$#!."
