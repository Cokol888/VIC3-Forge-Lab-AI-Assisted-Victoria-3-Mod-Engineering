 SKY_B8_TT_DOOMFALL: "#BOLD Kıyamet Düşüşü#!\n\n$SKY_LC$ $SKY_MARKED_COUNTRY$ içine ekonomik ve devrimci bomba yerleştir, hazine sınırının 1000% kadar parayı doğrudan çıkar\n$SKY_AL$ Aynı etkiyi $SKY_SELF_COUNTRY$ üzerine uygula ve hazine sınırının 1000% kadar parayı doğrudan çıkar\n$SKY_RC$ Bu düğmeyle ilgili değiştiricileri temizle\n$SKY_line$\n#italic Radikalizm, devrim, kaos ve ekonomik durgunluğa odaklanır. İnşaat kapasitesi doğrudan -99999 yapılır. Ülke işaretli değilse sol tık etkili olmaz.#!"
 SKY_B8_TT_SOCIAL_COLLAPSE: "#BOLD Toplumsal Çöküş#!\n\n$SKY_LC$ $SKY_MARKED_COUNTRY$ kurumsal, demografik ve toplumsal düzen çöküşüne at\n$SKY_AL$ Aynı durumu $SKY_SELF_COUNTRY$ üzerine uygula\n$SKY_RC$ Bu düğmeyle ilgili değiştiricileri temizle\n$SKY_line$\n#italic Meşruiyet, sadıklar, göç, kargaşa ve çeşitli sosyal kurum sınırlarının tam çürümesine odaklanır. Yaşam standardı doğrudan -19 yapılır. Ülke işaretli değilse sol tık etkili olmaz.#!"
