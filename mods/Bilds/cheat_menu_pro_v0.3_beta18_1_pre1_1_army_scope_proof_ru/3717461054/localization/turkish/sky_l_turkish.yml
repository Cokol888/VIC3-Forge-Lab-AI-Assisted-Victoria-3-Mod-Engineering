 SKY_B8_TT_FAMOUS_CHARACTER: "#BOLD Ünlü Karakter Çağır#!\n\n$SKY_LC$ Oyuncu ülkesine ajitatör olarak katılır\n$SKY_RC$ Oyuncu ülkesinin hükümdarı olur\n$SKY_AL$ Oyuncu ülkesine general olarak katılır\n$SKY_SL$ Oyuncu ülkesine amiral olarak katılır\n$SKY_line$\n#italic Aynı figür tekrar tekrar çağrılabilir. Kesin rol tıklama yöntemine bağlıdır.#!"
 SKY_ABOUT_WELCOME_1: "#BOLD Hoş geldiniz!#!\nTanıştığıma memnun oldum. Ben Xier, Victoria 3 Cheat Menu Pro geliştiricisiyim. Victoria 3 içinde sizinle tekrar karşılaşmak onur. #BOLD QQ grubu:#! 734267077. Bize katılın!"
 SKY_ABOUT_WELCOME_2: "#BOLD Bu mod hakkında ne düşünüyorsunuz?#!\nOnu sürekli geliştirmeye devam ediyorum. EU5 ile karşılaştırıldığında Victoria 3 motoru önceki oyunlara benzer görünür, ama aslında çok farklıdır. Her durumda, umarım herkes eğlenir! Hepinizle tanışmak beni gerçekten mutlu ediyor."
 SKY_UPDATE_LOG_V1_TITLE: "#BOLD $SKY_WINDOW_TITLE$ v1.0 Güncelleme Notları#!"
 SKY_UPDATE_LOG_V1_TEXT: "- İlk sürüm yayımlandı\n- Gezinme çubuğu sistemi EU5 üzerinden taşındı\n- 9 işlev kategorisi, her birinde 12 ayrılmış düğme\n- Hakkında sayfasında güncelleme günlüğü, kişiselleştirme ayarları ve bilgi var\n- Basitleştirilmiş Çince yerelleştirme desteklenir"
 SKY_SETTINGS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Kişiselleştirme Ayarları#!"
 SKY_SETTINGS_PLACEHOLDER: "Kişiselleştirme ayarları geliştirme aşamasında. Lütfen beklemede kalın.\nGelecek sürümler arka plan özelleştirme, arayüz teması değiştirme ve daha fazlasını destekleyecek."
 SKY_ABOUT_LINKS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} İletişim#!"
 SKY_ABOUT_TEXT_1: "#BOLD $SKY_WINDOW_TITLE$ kullandığınız için teşekkürler!#!\nTanıştığıma memnun oldum. Ben Xier, Pekin’den bir geliştiriciyim ve şu anda Çekya’da yaşıyorum. Sorularınız varsa QQ grubu veya Discord sunucusu üzerinden bana ulaşabilirsiniz. Xier’i desteklemek isterseniz Steam Workshop’ta Xier’e beğeni verebilir veya yukarıdaki sponsor bağlantısından bağış yapabilirsiniz.\nBu mod tamamen ücretsizdir. Bu modu herhangi bir ücretli kanaldan aldıysanız, lütfen hemen bildirin. Xier çok minnettar olur!"
 SKY_ABOUT_TEXT_2: "#BOLD Uyumluluk Notları#!\n$SKY_WINDOW_TITLE$ diğer modlarla uyumluluğu en üst düzeye çıkarmak için özenle tasarlandı. Ancak oyun motoru sınırlamaları nedeniyle, $concept_modifier$ arayüzünü göstermek için bir sistem GUI dosyasını uzlaşma olarak değiştirmesi gerekir.\nBüyük modların mümkün olduğunca eksiksiz yüklenmesi için önerilen yükleme sırası: önce büyük modlar, sonra küçük modlar, sonra UI modları ve en son $SKY_WINDOW_TITLE$. Oyun daha sonra yüklenen dosyaları önceki dosyaların üzerine yazmak için kullandığından, $SKY_WINDOW_TITLE$ en sona koymak onun UI değişikliklerinin diğer UI modlarını geçersiz kılmasını sağlar.\nKullanım sırasında sorun yaşarsanız, lütfen QQ grubu veya Discord sunucusu üzerinden bana ulaşın. Yardım ve destek için elimden geleni yapacağım."
