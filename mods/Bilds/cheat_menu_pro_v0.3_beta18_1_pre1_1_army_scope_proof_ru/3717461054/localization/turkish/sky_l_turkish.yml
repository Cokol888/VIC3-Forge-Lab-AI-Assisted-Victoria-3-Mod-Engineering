SKY_1_1_SP_GUIDE_BTN1: "$SKY_DEFAULT_TITLE$!\nBaşlamadan önce Xier düğme tıklama mantığını açıklasın. Bir düğmeye #P sol tık#! yapmak etki ekler. Ayrıntıları görmek için imleci düğmenin üstüne getirin. Eklenen etki bir $concept_modifier$ ise, bu $concept_modifier$ #N sağ tık#! ile kaldırılabilir. Çoğu düğme tuş birleşimlerini destekler. Klavyede bir tuşa basılı tutup düğmeye sol tıklayın.\N@innovation!Genelde #p sol tık#!, $xier$ tarafından yararlı ve makul görülen bir değer kullanır. #BLUE Shift#! yüz kat ya da daha yüksek değer verir. #COLOR:{0.3686,0.3961,0.7216} Alt#! hassas ayar için küçük değer verir. #GOLD Ctrl#! genelde ters etki uygular."
SKY_1_1_SP_GUIDE_BTN2: "Çoğu işaretleme işlevi #BOLD aynı anda yalnızca bir hedef destekler#!. Bu sayfadaki mal ve şirket işaretleme de böyledir. İlk sayfadaki kaydırıcı geliri ayarlayabilir. Gerekli değeri seçmek için kaydırıcıya #I tıklayın#!, ardından işlemi tamamlamak için aşağıdaki onay düğmesine basın. Bir değiştiriciyi kaldırmak için ona #N sağ tıklayın#! ya da kaydırıcıyı #n 0#! yapın."
SKY_1_1_SP_GUIDE_BTN3: "Yerli veya sürgündeki karakterler için karaktere sağ tıklayın ve açılır menüden #yellow $sakuya_mark_character$#! seçerek işaretleyin. Yabancı karakterler için önce hedef ülkeyi işaretleyin, sonra bu sayfada #YELLOW $SKY_B3_CHAR_MARK_OPEN$#! bulun ve açılır olayda işaretlemek istediğiniz karakteri seçin."
SKY_1_1_SP_GUIDE_BTN4: "#yellow $SKY_B4_TAKE_MARKED_NAVY_SHIPS$#! ve #yellow $SKY_1_1_B4_BTN_DESTROY_SHIPS$#! için önce bir filo işaretlenmelidir. #BLUE Shift#! basılı tutup #yellow $SKY_R4_MARK_ARMY$#! düğmesine tıklayarak açılır olaydan bir filo seçebilirsiniz.\NDiplomatik oyun veya savaş başlatırken savaş hedefinin geçerli olduğunu kontrol edin. Koşullar sağlanmazsa işlem başarısız olabilir. Benzer durumlar $CMP$ içindeki diğer işlevlerde de olabilir."
SKY_1_1_SP_GUIDE_BTN5: "$CMP$ içindeki diğer işaretleme sistemleri gibi, $SKY_B5_SUBSEC_1$ içinde işaretlenen $concept_interest_group$ başka değiştirme seçenekleri tarafından kullanılır. Seçili çıkar grubu, önce çıkar grubu işaretlenmesini gerektiren bazı işlevleri aydınlatır. Örneğin $sakuya_mark_character$ çıkar grubunu değiştirme. Çoğu durumda yalnızca bir $concept_interest_group$ seçilmesi önerilir."
SKY_1_1_SP_GUIDE_BTN6: "Sahip olduğunuz bir eyalete sağ tıklayın ve ayarlamak istediğiniz $state$ işaretlemek için menüden #yellow $decree_sakuya_mark_state$#! seçin. Haritada daha kolay işaretlemek için aşağıdaki #i $concept_political_lens$#! ve $mm_issue_decree_interaction$ içinden de #yellow $decree_sakuya_mark_state$#! seçebilirsiniz. Yabancı eyalet işaretlemek için hedef ülkeye sağ tıklayın ve #yellow $sakuya_mark_foreign_state$#! seçin.\N#T #N Aynı anda yalnızca bir konum işaretlemeniz şiddetle önerilir!#!#!"
SKY_1_1_SP_GUIDE_BTN6_tab4: "Bina seçicisinde ayarlamak istediğiniz bina kategorisini seçtikten sonra, menünün sol alt kısmında mevcut seçili bina gösterilir. Önce $decree_sakuya_mark_state$ ile hedef $state$ seçin, sonra kaydırıcıyla istediğiniz değeri ayarlayın ve #yellow $SKY_B6_BUILD_ADD_BUILDING$#! düğmesine basın. #n 0#! kademesi bu bina veya kaynak potansiyelini temizler. Bina ve kaynak potansiyeli ekleme başarısı, oyuncu veya hedef ülkenin #N teknoloji#! ve başka koşullarına bağlıdır.\N$SKY_B6_BUILD_CAT_RESOURCE$ ve $SKY_B6_BUILD_CAT_AGRICULTURE$ kategorilerindeki binalar ayrıca #yellow $SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL$#! destekler."
SKY_1_1_SP_GUIDE_BTN6_tab5: "\NBu sayfada #yellow $SKY_B6_RESERVED_BUILD_R2_C1$#! ve #yellow $SKY_B6_RESERVED_BUILD_R2_C2$#! dışındaki tüm değiştiriciler $concept_buildings$ hedefler. Bu ikisi ise $state$ hedefler. İlgili $concept_modifier$ görmek için değiştirilmiş $concept_buildings$ üzerine tıklamanız gerekir."
SKY_1_1_SP_GUIDE_BTN7: "\Nİşaretlemek istediğiniz ülkeye sağ tıklayın ve #yellow $sakuya_mark_country$#! seçin. Haritada daha kolay işaretlemek için aşağıdaki #i $concept_diplomatic_lens$#! ve $concept_diplomatic_actions$ içinden de #yellow $sakuya_mark_country$#! seçebilirsiniz."
 SKY_1_1_SP_GUIDE_BTN8: "\N\N#yellow $SKY_BTN8_TAB_TECHNOLOGY$#! toplar $concept_technology$- ile ilgili değiştiriciler; yukarıdaki sekmeleri kullanarak bunlar arasında geçiş yapabilirsiniz $production$, $military$ve $society$. Düğmelerin çoğu standart büyük/küçük düğme kurallarına uyar ve sağ tıklama, ilgili öğeyi siler $concept_modifier$.\N\Nve #yellow $SKY_BTN8_TAB_CULTURE$#!, tıklayın #yellow $SKY_B8_CULTURE_MARK$#! açmak için $SKY_1_2_CULTURE_INDEX_TITLE$#!. Bir hedef seçin $concept_culture$ içinde $concept_culture$ seçiciyi seçin, ardından bunu $concept_primary_cultures$, $concept_homelands$ve diğer kültürel etkinlikler."
SKY_1_1_SP_GUIDE_BTN9: "\n$CMP$ büyük başlığının üstünde fareyi bir saniye tutmayı deneyin...?\n@innovation!Farklı duvar kağıtları farklı içerikler gösterir."
SKY_1.1_CLOSE: "Kapatmak için tıkla."
