 SKY_B6_TT_RESERVED_BUILD_R1_C2: "#BOLD Seçili Bina Girdi Talebi#!\n\n#lore Oyuncu işaretli eyaletlerindeki mevcut seçili binaya uygulanır.#!\n#lore Pozitif işlemler bina mal girdi talebini azaltır.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Bu grubu temizle"
 SKY_B6_RESERVED_BUILD_R1_C3: "Seçili Bina Asgari Ücreti"
 SKY_B6_TT_RESERVED_BUILD_R1_C3: "#BOLD Seçili Bina Asgari Ücreti#!\n\n#lore Oyuncu işaretli eyaletlerindeki mevcut seçili binaya uygulanır.#!\n#lore Pozitif işlemler bina ücret hedefini azaltır.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Bu grubu temizle"
 SKY_B6_TT_RESERVED_BUILD_R2_C1: "#BOLD Seçili Bina Çalışan Boyutu#!\n\n#lore Mevcut seçili bina türüne göre etkili olur ve oyuncu işaretli eyaletlerine uygulanır.#!\n#lore Pozitif işlemler varsayılan çalışan boyutunu azaltır.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Bu grubu temizle"
 SKY_B6_TT_RESERVED_BUILD_R2_C2: "#BOLD Seçili Bina Çalışma Koşulları#!\n\n#lore Oyuncu işaretli eyaletlerindeki karşılık gelen binaya uygulanır.#!\n#lore Pozitif işlemler bina çalışma koşulu değiştiricisini azaltır.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Bu grubu temizle"
 SKY_B6_TT_RESERVED_BUILD_R2_C3: "#BOLD Seçili Bina Genel $concept_throughput$#!\n\n#lore Oyuncu işaretli eyaletlerindeki mevcut seçili binaya doğrudan uygulanır.#!\n#lore Sol üstteki özel $concept_throughput$ mevcut binayı kapsamıyorsa bunu kullan.#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Sağdaki + düğmesi dahil bu grubu temizle"
 SKY_B6_TT_RESERVED_BUILD_R2_C3_PLUS: "#BOLD Seçili Bina Genel $concept_throughput$: Büyük Adım#!\n\n#lore Soldaki normal düğmeden bağımsız gruptur ve birikebilir. Sol tarafta sağ tık bunu da temizler.#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
