 sakuya_superdip.3.t: "Sakuya ikna etti [SCOPE.sCountry('sakuya_superdip_target_country').GetName]'s [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]"
 sakuya_superdip.3.d: "Özel bir görüşmede Sakuya ikna etti [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] ile ilişkileri yeniden gözden geçirmek [SCOPE.sCountry('sakuya_superdip_actor_country').GetName]."
 sakuya_superdip.3.f: "Toplantının sonunda, [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] Başlangıçta hazırladığı sert notu çoktan çekmeceye geri koymuş ve bir sonraki toplantıyı ayarlamasını istemişti. Sakuya, sanki her şey olması gerektiği gibiymişçesine, cep saatini sakin bir şekilde kapattı."
 sakuya_superdip.3.a: "Bu çok iyi."
