 notification_sakuya_superdip_annex_country_toast_desc: "Sakuya'nın ikna etmesinden sonra, [SCOPE.sCountry('target').GetRuler.GetFullName] imzaladı [SCOPE.sCountry('actor').GetCapital.GetCityHubName] Anlaşma [SCOPE.sCountry('target').GetCapital.GetCityHubName]ve [SCOPE.sCountry('target').GetName] ve [SCOPE.sCountry('actor').GetName] nihayet birleşmelerini tamamladılar."
