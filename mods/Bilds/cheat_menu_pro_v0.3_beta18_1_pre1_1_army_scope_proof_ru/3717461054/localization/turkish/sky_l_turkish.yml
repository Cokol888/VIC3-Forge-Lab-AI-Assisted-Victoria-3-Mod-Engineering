 sakuya_superdip.1.t: "Sakuya diplomatik bir yemekte konuşuyor!"
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName] Sakuya'nın yetkililerle kavgaya tutuşmasıyla ortalık bir anda kargaşaya dönüşür [SCOPE.sCountry('sakuya_superdip_target_country').GetName] akşam yemeği sırasında."
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] Sakuya'nın üzerine bir bank devirmeye çalıştı, ama Sakuya ustaca kenara çekildi, masadan bir parça pasta aldı ve onu [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]'nin kafası. \N\N\"#lore Seni yaşlı budala... Bana pusu kurmaya mı çalıştın? #!\""
 sakuya_superdip.1.a: "İyi azarlama!"
 sakuya_superdip.1.b: "Ben de birkaç küfürle katılacağım."
 sakuya_superdip.1.c: "Sakuya-sensei, bunu yapmayın."
 sakuya_superdip.1.c_desc: "Sonra [SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName] Onu durdurmak için elinden geleni yapan Sakuya Izayoi, gümüş bıçaklarını bir süreliğine kenara bıraktı, ardından şaraptan bir yudum aldı ve her zamanki gibi sakin görünüyordu."
 notification_sakuya_superdip_humiliation_toast_name: "Sakuya küçümseyici bir tavırla aşağıladı [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "Sakuya, [SCOPE.sCountry('target').GetName] hükümdarı [SCOPE.sCountry('target').GetRuler.GetFullName] için kayda değer kültürel incelikte bir diplomatik nota sundu. Nedense bunu bir #BOLD hakaret#! olarak yorumladılar. Onların bayağılığı bize eğlenceli geldi; onlar ise oldukça hoşnutsuz görünüyordu. [SCOPE.sCountry('actor').GetName] ile [SCOPE.sCountry('target').GetName] arasındaki diplomatik ilişkiler kötüleşmiş gibi görünüyor."
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "Sakuya şöyle diyor:\NAnnen bir hamsterdi,\Nve babanın üstünden mürver kokusu geliyor!"
 sakuya_superdip_insult_02: "Sakuya şöyle diyor:\NKıyamet günü geldi çattı!\NLucifer'in uşakları yeryüzünde dolaşıyor—\NAh, hayır, o sadece ülkenizin temsilcisidir."
 sakuya_superdip_insult_03: "Sakuya şöyle diyor:\NAyrıca, sermayenizin yok edilmesi gerektiğine inanıyorum!"
 sakuya_superdip_insult_04: "Sakuya şöyle diyor:\NGelecek nesiller bizim dönemimizin tarihini yazdıklarında,\Nsana, şefkat denen o acıma ve tiksinti karışımıyla bakacaklar."
 sakuya_superdip_insult_05: "Sakuya şöyle diyor:\NTuvalete son gidişim, büyükelçinizle yediğim akşam yemeğinden çok daha keyifliydi."
 sakuya_superdip_insult_06: "Sakuya şöyle diyor:\NOh, bak.\NBurada çok hoş bir pislik var."
 sakuya_superdip_insult_07: "Sakuya şöyle diyor:\NKanın, senden aldığım toprağı daha da verimli hale getirecek."
 sakuya_superdip_insult_08: "Sakuya şöyle diyor:\NSıkıcı diplomatik etkinliklerin canlanabilmesi için her zaman bir yaban balığı gerekir.\NVe sen, dostum, tüm kedibalıklarının en iyisisin!"
 sakuya_superdip_insult_09: "Sakuya şöyle diyor:\NNeden ülkenizde işler hep bu kadar berbat?\NSanırım bunun sebebi hepinizsiniz."
 sakuya_superdip_insult_10: "Sakuya şöyle diyor:\NOynadığımız bu harika oyunda,\NSen sadece bir piyonun."
 sakuya_superdip_insult_11: "Sakuya şöyle diyor:\NKötü işlerinin hikâyeleri İrlanda'dan Cathay'e kadar anlatılıyor."
 sakuya_superdip_insult_12: "Sakuya şöyle diyor:\NHükümdarınızın akıl yürütme yeteneği olgunlaşmış bir muz kadar,\Nama kamuya açık yerlerde tuvaletini yapma konusunda gerçek bir deha olduğunu gösteriyor."
 sakuya_superdip_insult_13: "Sakuya şöyle diyor:\NGökyüzün kuyruklu yıldızlarla dolsun."
 sakuya_superdip_insult_14: "Sakuya şöyle diyor:\NHiçbir harita bir sanat eseri olamaz\Nülkeniz bu konuda kararlı olduğu sürece."
 sakuya_superdip_insult_15: "Sakuya şöyle diyor:\NDiplomatik akşam yemeklerinde neden aptal rolü oynamaktan hoşlandığını anlamıyorum.\NAnlam mı arıyorsunuz,\Nyoksa sadece seyircileri eğlendirmek mi?"
