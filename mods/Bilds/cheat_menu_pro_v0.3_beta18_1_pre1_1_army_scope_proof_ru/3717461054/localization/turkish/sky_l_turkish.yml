 sakuya_superdip_humiliation_pact_01: "$humiliation$"
 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "Sakuya, son derece uygunsuz bir diplomatik akşam yemeği düzenleyerek hedef ülkeyi küçük düşürür ve bu ülkenin uluslararası arenadaki itibarını zedeler. Süre: 5 yıl."
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] Sakuya tarafından küçük düşürülür; Sakuya ise [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]. Süre: 5 yıl."
