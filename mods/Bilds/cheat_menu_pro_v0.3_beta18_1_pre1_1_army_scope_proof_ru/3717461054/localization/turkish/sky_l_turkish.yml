 notification_sakuya_superdip_force_join_power_bloc_toast_desc: "[SCOPE.sCountry('target').GetRuler.GetFullName] toplantı sonrasında, Sakuya'nın uluslararası duruma ilişkin açıklamasının net ve reddedilmesi zor olduğunu kabul etti. [SCOPE.sCountry('target').GetName] ardından $concept_power_bloc$ ki [SCOPE.sCountry('actor').GetName] kime ait."
