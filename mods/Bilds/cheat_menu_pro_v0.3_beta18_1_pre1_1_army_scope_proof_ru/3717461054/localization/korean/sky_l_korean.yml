 sakuya_superdip.3.t: "사쿠야가 설득했다 [SCOPE.sCountry('sakuya_superdip_target_country').GetName]'s [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]"
 sakuya_superdip.3.d: "비공개 회의에서 사쿠야는 설득했다 [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] …와의 관계를 재검토하기 위해 [SCOPE.sCountry('sakuya_superdip_actor_country').GetName]."
 sakuya_superdip.3.f: "회의가 끝날 무렵, [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] 이미 미리 준비해 둔 날카로운 내용의 쪽지를 서랍에 다시 넣고 다음 만남을 주선해 달라고 부탁했다. 사쿠야는 마치 모든 것이 당연한 일인 양, 태연하게 회중시계를 닫았다."
 sakuya_superdip.3.a: "잘됐네요."
