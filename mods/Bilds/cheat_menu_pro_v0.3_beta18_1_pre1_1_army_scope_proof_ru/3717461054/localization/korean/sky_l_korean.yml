 SKY_1_1_B6_STATE_TT_EFF_LOYALISTS_ALL: "#BOLD Loyalists#!\n\n$SKY_LC$ +20%\n$SKY_SL$ +100%\n$SKY_AL$ +5%\n$SKY_CL$ +50%\n$SKY_RC$ +75%\n$SKY_line$\nApplies to all $concept_state$s in your country."
