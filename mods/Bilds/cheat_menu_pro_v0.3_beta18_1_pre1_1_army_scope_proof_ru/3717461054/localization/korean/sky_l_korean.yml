 notification_sakuya_superdip_force_join_power_bloc_toast_desc: "[SCOPE.sCountry('target').GetRuler.GetFullName] 회의가 끝난 후, 사쿠야가 설명한 국제 정세가 명쾌하고 거절하기 어려웠다는 점을 인정했다. [SCOPE.sCountry('target').GetName] 그 후 ~에 합류했다 $concept_power_bloc$ 그 [SCOPE.sCountry('actor').GetName] 소속되어 있다."
