 SKY_B2_ECON_TT_MARKED_FINE: "#BOLD $SKY_MARKED_COUNTRY$#!\n$SKY_line$\n$SKY_LC$ 같은 값을 적용합니다.\n$SKY_SL$ 더 큰 값을 적용합니다.\n$SKY_AL$ 작은 값을 적용합니다.\n$SKY_CL$ 반대 값을 적용합니다.\n$SKY_RC$ 반대 값을 적용합니다.\n$SKY_line$\n#lore 먼저 대상 국가를 표시해야 합니다.#!"
