 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold 대상: 우리 주류 문화#!\n\n$SKY_LC$ 국가가 표시된 경우: 대상국의 모든 주류 문화를 우리 주류 문화에 추가\n$SKY_RC$ 우리에게 표시된 $concept_state$가 있는 경우: 그 $concept_state$의 본토 문화를 우리 주류 문화에 추가\n$SKY_SL$ 국가가 표시되고 대상국에 표시된 $concept_state$가 있는 경우: 그 $concept_state$의 본토 문화를 우리 주류 문화에 추가\n$SKY_CL$ $concept_character$가 표시된 경우: 그 인물의 문화를 우리 주류 문화에 추가"
 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold 대상: 대상국 주류 문화#!\n\n$SKY_LC$ 국가가 표시된 경우: 우리 모든 주류 문화를 대상국 주류 문화에 추가\n$SKY_RC$ 우리에게 표시된 $concept_state$가 있는 경우: 그 $concept_state$의 본토 문화를 대상국 주류 문화에 추가\n$SKY_SL$ 대상국에 표시된 $concept_state$가 있는 경우: 그 $concept_state$의 본토 문화를 대상국 주류 문화에 추가\n$SKY_CL$ $concept_character$가 표시된 경우: 그 인물의 문화를 대상국 주류 문화에 추가"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold 대상: 우리 주류 문화#!\n\n$SKY_LC$ 국가가 표시된 경우: 대상국의 모든 주류 문화를 우리 주류 문화에서 제거\n$SKY_RC$ 우리에게 표시된 $concept_state$가 있는 경우: 그 $concept_state$의 본토 문화를 우리 주류 문화에서 제거\n$SKY_SL$ 국가가 표시되고 대상국에 표시된 $concept_state$가 있는 경우: 그 $concept_state$의 본토 문화를 우리 주류 문화에서 제거\n$SKY_CL$ $concept_character$가 표시된 경우: 그 인물의 문화를 우리 주류 문화에서 제거\n$SKY_line$\n#n 주의: 한 국가의 마지막 주류 문화는 제거하지 않습니다. 주류 문화가 없는 국가를 만들지 마십시오. 저장이 손상될 수 있습니다.#!"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold 대상: 대상국 주류 문화#!\n\n$SKY_LC$ 국가가 표시된 경우: 우리 모든 주류 문화를 대상국 주류 문화에서 제거\n$SKY_RC$ 우리에게 표시된 $concept_state$가 있는 경우: 그 $concept_state$의 본토 문화를 대상국 주류 문화에서 제거\n$SKY_SL$ 대상국에 표시된 $concept_state$가 있는 경우: 그 $concept_state$의 본토 문화를 대상국 주류 문화에서 제거\n$SKY_CL$ $concept_character$가 표시된 경우: 그 인물의 문화를 대상국 주류 문화에서 제거\n$SKY_line$\n#n 주의: 한 국가의 마지막 주류 문화는 제거하지 않습니다. 주류 문화가 없는 국가를 만들지 마십시오. 저장이 손상될 수 있습니다.#!"
