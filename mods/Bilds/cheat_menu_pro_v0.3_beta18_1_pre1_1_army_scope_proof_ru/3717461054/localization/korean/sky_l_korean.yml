 SKY_B3_TRAIT_GROUP_RULER: "통치자"
 SKY_B3_TRAIT_GROUP_ALL_ROUNDER: "만능형"
 SKY_B3_TRAIT_GROUP_TT_GENERAL: "#BOLD 지휘관#!\n$SKY_line$\n$SKY_LC$ 전투 지휘에 적합한 특성 세트를 추가합니다.\n$SKY_RC$ 이 특성 세트를 제거합니다.\n$SKY_line$\n육군, 해군, 지형, 포병, 공격, 방어, 보급, 약탈, 함대 지휘에 중점을 둡니다."
 SKY_B3_TRAIT_GROUP_TT_EXECUTIVE: "#BOLD $concept_company$ 임원#!\n$SKY_line$\n$SKY_LC$ $concept_company$ 경영과 산업 관리에 적합한 특성 세트를 추가합니다.\n$SKY_RC$ 이 특성 세트를 제거합니다.\n$SKY_line$\n처리량, 경영, 기업가 정신, 공학, 산업 관리를 중점으로 합니다."
 SKY_B3_TRAIT_GROUP_TT_BAD_RULER: "#BOLD 폭군#!\n$SKY_line$\n$SKY_LC$ 형편없는 통치자에게 어울리는 특성 세트를 추가합니다.\n$SKY_RC$ 이 특성 세트를 제거합니다.\n$SKY_line$\n오만, 분노, 잔혹함, 사치, 사기, 중독, 무능 등 해로운 통치 성향을 포함합니다."
 SKY_B3_TRAIT_GROUP_TT_AGITATOR: "#BOLD 선동가#!\n$SKY_line$\n$SKY_LC$ 정치 선동에 적합한 특성 세트를 추가합니다.\n$SKY_RC$ 이 특성 세트를 제거합니다.\n$SKY_line$\n카리스마, 호소력, 정치 조직, 연설, 선동, 사회 운동에 중점을 둡니다."
 SKY_B3_TRAIT_GROUP_TT_RULER: "#BOLD 통치자#!\n$SKY_line$\n$SKY_LC$ 국가 통치에 적합한 특성 세트를 추가합니다.\n$SKY_RC$ 이 특성 세트를 제거합니다.\n$SKY_line$\n외교, 행정, 식민지, 정치 조직, 위신, 국가 운영에 중점을 둡니다."
 SKY_B3_TRAIT_GROUP_TT_ALL_ROUNDER: "#BOLD 만능형#!\n$SKY_line$\n$SKY_LC$ 폭넓게 유용한 특성 세트를 추가합니다.\n$SKY_RC$ 이 특성 세트를 제거합니다.\n$SKY_line$\n통치, 회사, 정치, 외교, 육군, 해군에 두루 쓸 수 있는 강점을 모읍니다."
