 sakuya_superdip_humiliate_01: "사쿠야가 이 나라를 망신시키게 놔둬요."
 sakuya_superdip_humiliate_01_action_name: "사쿠야가 이 나라를 망신시키게 놔둬요."
 sakuya_superdip_humiliate_01_desc: "우리 통치자들을 대신해 사쿠야를 보내 이 나라의 대사와 식사를 하도록 하시오."
 sakuya_superdip_humiliation_pact_01: "$humiliation$"
 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "사쿠야는 극히 부적절한 외교 만찬을 통해 대상국을 모욕하고, 국제 무대에서 그 나라의 명성을 실추시킨다. 지속 기간: 5년."
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] ...에게 모욕을 당하는데, 그 사람은 [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]. 기간: 5년."
 sakuya_superdip_humiliation_pact_01_effect_desc_global: "사쿠야와의 굴욕의 계약을 맺는다"
 sakuya_superdip_humiliation_pact_01_effect_desc_first: "[COUNTRY.GetNameNoFlag] 사쿠야를 망신스럽게 만든다 [TARGET_COUNTRY.GetName] 5년 동안"
 sakuya_superdip_humiliation_pact_01_effect_desc_third: "[COUNTRY.GetName] 사쿠야를 망신스럽게 만든다 [TARGET_COUNTRY.GetName] 5년 동안"
 sakuya_superdip.1.t: "사쿠야가 외교 만찬에서 발언을 합니다!"
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName] 사쿠야가 ~의 관계자들과 난투극을 벌이면서 현장은 혼란에 휩싸인다 [SCOPE.sCountry('sakuya_superdip_target_country').GetName] 저녁 식사 중에."
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] 사쿠야에게 벤치를 내리치려 했지만, 사쿠야는 재빠르게 비켜서더니 테이블 위의 케이크 한 조각을 집어 들어 [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]의 머리. \N\N\"#lore 이 늙은 바보야… 나를 기습하려고 했나? #!\""
 sakuya_superdip.1.a: "좋은 꾸중!"
 sakuya_superdip.1.b: "몇 가지 욕을 해보겠습니다..."
 sakuya_superdip.1.c: "사쿠야 선생님, 이러지 마세요..."
 sakuya_superdip.1.c_desc: "~ 이후 [SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName] 그녀를 막기 위해 온갖 노력을 기울였지만, 이자요이 사쿠야는 잠시 은색 칼을 내려놓은 뒤 와인을 한 모금 마시며 여느 때와 다름없이 침착한 표정을 지었다."
 notification_sakuya_superdip_humiliation_toast_name: "사쿠야는 경멸 섞인 태도로 모욕을 주었다 [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "사쿠야는 [SCOPE.sCountry('target').GetName]의 통치자 [SCOPE.sCountry('target').GetRuler.GetFullName]에게 대단히 세련된 외교 문서를 전달했습니다. 어째서인지 그들은 그것을 #BOLD 모욕#!으로 받아들였습니다. 우리는 그들의 조야함을 재미있게 여겼지만, 그들은 꽤 불쾌해 보였습니다. [SCOPE.sCountry('actor').GetName]와 [SCOPE.sCountry('target').GetName]의 외교 관계는 악화된 듯합니다."
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "사쿠야가 말합니다:\N네 엄마는 햄스터였는데,\N게다가 아빠한테는 엘더베리 냄새가 나!"
 sakuya_superdip_insult_02: "사쿠야가 말합니다:\N심판의 날이 다가왔다!\N루시퍼의 부하들이 지상을 배회하고 있다—\N아뇨, 그건 그저 귀국의 대표일 뿐입니다."
 sakuya_superdip_insult_03: "사쿠야가 말합니다:\N게다가, 나는 당신의 자본이 파괴되어야 한다고 믿습니다!"
 sakuya_superdip_insult_04: "사쿠야가 말합니다:\N미래 세대가 우리 시대를 기록할 때,\N그들은 동정심이라 불리는, 연민과 혐오가 뒤섞인 시선으로 당신을 바라볼 것이다."
 sakuya_superdip_insult_05: "사쿠야가 말합니다:\N화장실에 갔을 때가 당신네 대사와 함께한 저녁 식사보다 훨씬 더 즐거웠습니다."
 sakuya_superdip_insult_06: "사쿠야가 말합니다:\N오, 이거 봐.\N이쪽에 꽤 괜찮은 야한 내용이 있네요."
 sakuya_superdip_insult_07: "사쿠야가 말합니다:\N당신의 피는 내가 당신에게서 가져가는 흙을 더욱 비옥하게 만들 것입니다."
 sakuya_superdip_insult_08: "사쿠야가 말합니다:\N지루한 외교 행사에는 항상 분위기를 띄워줄 메기가 필요하다.\N그리고 친구여, 넌 그야말로 최고의 메기야!"
 sakuya_superdip_insult_09: "사쿠야가 말합니다:\N왜 당신 나라 일은 항상 그렇게 끔찍한가요?\N아마도 그 원인은 여러분 모두 때문인 것 같아요."
 sakuya_superdip_insult_10: "사쿠야가 말합니다:\N우리가 즐기는 이 멋진 게임에서,\N넌 그저 하수인에 불과해."
 sakuya_superdip_insult_11: "사쿠야가 말합니다:\N당신의 악행에 대한 소문은 아일랜드에서 카타이까지 널리 퍼져 있다."
 sakuya_superdip_insult_12: "사쿠야가 말합니다:\N당신의 통치자는 잘 익은 바나나만큼이나 사고력이 떨어지는데,\N하지만 공공장소에서 배변하는 데 있어서는 진정한 천재성을 보여준다."
 sakuya_superdip_insult_13: "사쿠야가 말합니다:\N당신의 하늘이 혜성으로 가득 차기를."
 sakuya_superdip_insult_14: "사쿠야가 말합니다:\N어떤 지도도 예술 작품이 될 수는 없다\N당신의 나라가 그 목록에 포함되어 있는 한."
 sakuya_superdip_insult_15: "사쿠야가 말합니다:\N왜 당신이 외교 만찬 자리에서 일부러 바보 행세를 하는지 이해할 수가 없습니다.\N의미를 찾고 계신가요,\N아니면 그저 관중들을 즐겁게 해주기 위한 것일까?"
