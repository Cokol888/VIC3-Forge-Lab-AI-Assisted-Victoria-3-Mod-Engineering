 SKY_ABOUT_WELCOME_1: "#BOLD 환영합니다!#!\n만나서 반갑습니다. 저는 Victoria 3 Cheat Menu Pro 개발자 Xier입니다. Victoria 3에서 다시 만나 영광입니다. #BOLD QQ 그룹:#! 734267077. 놀러 오세요!"
 SKY_ABOUT_WELCOME_2: "#BOLD 이 모드가 어떤가요?#!\n계속 개발 중입니다. EU5와 비교하면 Victoria 3의 엔진은 이전 작품과 비슷해 보이지만 실제로는 크게 다릅니다. 아무튼 모두 즐겁게 플레이하길 바랍니다! 여러분을 만난 것은 정말 기쁜 일입니다."
 SKY_UPDATE_LOG_V1_TITLE: "#BOLD $SKY_WINDOW_TITLE$ v1.0 업데이트 노트#!"
 SKY_UPDATE_LOG_V1_TEXT: "- 초기 버전 출시\n- EU5에서 내비게이션 바 시스템 이식\n- 9개 기능 분류, 각 분류마다 12개 예약 버튼\n- 소개 페이지에 업데이트 로그, 개인화 설정, 소개 정보 포함\n- 중국어 간체 현지화 지원"
 SKY_SETTINGS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} 개인화 설정#!"
 SKY_SETTINGS_PLACEHOLDER: "개인화 설정은 개발 중입니다. 기대해 주세요.\n향후 배경 사용자 지정, 인터페이스 테마 전환 등을 지원할 예정입니다."
 SKY_ABOUT_LINKS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} 연락처#!"
 SKY_ABOUT_TEXT_1: "#BOLD $SKY_WINDOW_TITLE$ 사용 감사합니다!#!\n만나서 반갑습니다. 저는 베이징 출신으로 현재 체코에 사는 개발자 Xier입니다. 질문이 있으면 QQ 그룹 또는 Discord 서버로 연락해 주세요. Xier를 지원하고 싶다면 Steam 창작마당에서 좋아요를 누르거나 위 후원 링크로 기부할 수 있습니다.\n이 모드는 완전 무료입니다. 유료 경로로 이 모드를 받았다면 즉시 신고해 주세요. Xier가 매우 감사히 여기겠습니다!"
 SKY_ABOUT_TEXT_2: "#BOLD 호환성 안내#!\n$SKY_WINDOW_TITLE$는 다른 모드와의 호환성을 최대화하도록 설계되었습니다. 다만 게임 엔진 제한 때문에 $concept_modifier$ 인터페이스 표시를 위해 시스템 GUI 파일 하나를 수정해야 합니다.\n대형 모드가 최대한 온전히 로드되도록 권장 순서는 대형 모드, 소형 모드, UI 모드, 마지막으로 $SKY_WINDOW_TITLE$입니다. 게임은 나중에 로드된 파일이 먼저 로드된 파일을 덮어쓰므로, $SKY_WINDOW_TITLE$를 마지막에 두면 그 UI 수정이 다른 UI 모드를 덮어씁니다.\n사용 중 문제가 생기면 QQ 그룹 또는 Discord 서버로 연락해 주세요. 최대한 도와드리겠습니다."
