SKY_1_1_B7_TT_FORM_OPEN_TAG_INDEX: "#BOLD TAG 선택#!\n$SKY_line$\n$SKY_LC$ TAG 선택기를 엽니다.\n\n선택한 TAG는 아래 버튼들의 대상 국가가 됩니다."
