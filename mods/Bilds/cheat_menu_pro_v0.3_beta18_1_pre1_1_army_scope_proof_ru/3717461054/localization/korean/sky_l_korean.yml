 SKY_B6_BUILD_TT_RESOURCE_POTENTIAL: "#BOLD 잠재 자원 추가#!\n\n$SKY_LC$ 현재 선택 건물에 대응하는 잠재 자원을 플레이어 표시 주에 추가\n$SKY_RC$ 국가가 표시되고 그 국가에 표시 외국 주가 있으면 해당 외국 주에 적용\n$SKY_line$\n#lore 0단계는 제거합니다. 양수 단계는 현재 단계값을 추가하거나 높입니다. 농업 건물은 현재 추가와 제거만 지원합니다.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1: "#BOLD 선택 건물 $concept_throughput$#!\n\n#lore 먼저 $SKY_BTN6_SEC$-$SKY_BTN6_TAB3$에서 건물을 선택하고 최소 1개 $concept_state$를 표시하십시오.#!\n#lore 현재 건물이 이 항목을 지원하지 않으면 오른쪽 아래 공용 $concept_throughput$ 버튼을 사용하십시오.#!\n#lore 현재 지원: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ 오른쪽 + 버튼 포함 이 그룹 제거\n#lore 오른쪽 큰 단계 버튼과 중첩 가능.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1_PLUS: "#BOLD 선택 건물 $concept_throughput$: 큰 단계#!\n\n#lore 왼쪽 일반 버튼과 독립 그룹이며 중첩 가능. 왼쪽을 제거하면 이것도 제거됩니다.#!\n#lore 현재 지원: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
 SKY_B6_RESERVED_BUILD_R1_C2: "선택 건물 투입 수요"
 SKY_B6_TT_RESERVED_BUILD_R1_C2: "#BOLD 선택 건물 투입 수요#!\n\n#lore 플레이어 표시 주의 현재 선택 건물에 적용됩니다.#!\n#lore 양수 작업은 건물 상품 투입 수요를 낮춥니다.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ 이 그룹 제거"
 SKY_B6_RESERVED_BUILD_R1_C3: "선택 건물 최저임금"
 SKY_B6_TT_RESERVED_BUILD_R1_C3: "#BOLD 선택 건물 최저임금#!\n\n#lore 플레이어 표시 주의 현재 선택 건물에 적용됩니다.#!\n#lore 양수 작업은 건물 임금 목표를 낮춥니다.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ 이 그룹 제거"
 SKY_B6_TT_RESERVED_BUILD_R2_C1: "#BOLD 선택 건물 직원 규모#!\n\n#lore 현재 선택 건물 유형에 따라 적용되며 플레이어 표시 주에 작용합니다.#!\n#lore 양수 작업은 기본 직원 규모를 낮춥니다.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ 이 그룹 제거"
 SKY_B6_TT_RESERVED_BUILD_R2_C2: "#BOLD 선택 건물 근로 조건#!\n\n#lore 플레이어 표시 주의 해당 건물에 적용됩니다.#!\n#lore 양수 작업은 건물 근로 조건 수정을 낮춥니다.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ 이 그룹 제거"
 SKY_B6_TT_RESERVED_BUILD_R2_C3: "#BOLD 선택 건물 공용 $concept_throughput$#!\n\n#lore 플레이어 표시 주의 현재 선택 건물에 직접 적용됩니다.#!\n#lore 왼쪽 위 전용 $concept_throughput$이 현재 건물을 포괄하지 못할 때 이것을 쓰십시오.#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ 오른쪽 + 버튼 포함 이 그룹 제거"
 SKY_B6_TT_RESERVED_BUILD_R2_C3_PLUS: "#BOLD 선택 건물 공용 $concept_throughput$: 큰 단계#!\n\n#lore 왼쪽 일반 버튼과 독립 그룹이며 중첩 가능. 왼쪽 우클릭도 이것을 함께 제거합니다.#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
