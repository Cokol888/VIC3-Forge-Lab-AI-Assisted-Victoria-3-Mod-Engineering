SKY_1_1_B7_TT_FORM_CHANGE_TAG: "#BOLD 우리 국가를 새 국가로 변경#!\n$SKY_line$\n$SKY_LC$ 우리 국가를 선택한 TAG로 변경하고, 해당 문화와 국교를 적용합니다.\n$SKY_RC$ 우리 국가를 선택한 TAG로만 변경합니다."
SKY_1_1_B7_TT_FORM_RELEASE_COUNTRY: "#BOLD 우리 표시 주에 새 국가 수립#!\n$SKY_line$\n$SKY_LC$ 우리 표시 주에 선택한 TAG를 수립합니다.\n\n새 국가로 전환하지 않습니다."
SKY_1_1_B7_TT_FORM_MARKED_CHANGE_TAG: "#BOLD 대상국을 새 국가로 변경#!\n$SKY_line$\n$SKY_LC$ 대상국을 선택한 TAG로 변경하고, 해당 문화와 국교를 적용합니다.\n$SKY_RC$ 대상국을 선택한 TAG로만 변경합니다."
SKY_1_1_B7_TT_FORM_MARKED_RELEASE_COUNTRY: "#BOLD 대상국 표시 주에 새 국가 수립#!\n$SKY_line$\n$SKY_LC$ 대상국의 표시 주에 선택한 TAG를 수립합니다.\n\n플레이어는 새 국가로 전환하지 않습니다."
SKY_1_1_B7_TT_FORM_APPLY_IDENTITY: "#BOLD 선택 TAG 문화와 국교 적용#!\n$SKY_line$\n$SKY_LC$ 우리 국가를 선택 TAG의 문화와 국교로 변경합니다.\n$SKY_RC$ 대상국을 선택 TAG의 문화와 국교로 변경합니다."
SKY_1_1_SP_GUIDE_BTN1: "$SKY_DEFAULT_TITLE$!\n사용 전에 Xier가 버튼 클릭 논리를 설명하겠습니다. #P 좌클릭#!으로 버튼 효과를 추가합니다. 세부 효과는 버튼에 마우스를 올려 확인하십시오. 추가된 효과가 $concept_modifier$라면 #N 우클릭#!으로 해당 $concept_modifier$를 제거할 수 있습니다. 대부분의 버튼은 조합 키를 지원합니다. 키보드의 특정 키를 누른 채 버튼을 좌클릭하십시오.\N@innovation!일반적으로 #p 좌클릭#!은 $xier$가 유익하고 합리적이라고 보는 값입니다. #BLUE Shift#!는 그 백 배 또는 더 큰 값을 제공합니다. #COLOR:{0.3686,0.3961,0.7216} Alt#!는 정밀 조정을 위한 작은 값을 제공합니다. #GOLD Ctrl#!은 보통 반대 효과입니다."
SKY_1_1_SP_GUIDE_BTN2: "대부분의 표시 기능은 #BOLD 한 번에 하나의 대상만#! 지원합니다. 이 페이지의 상품과 회사 표시도 같습니다. 첫 페이지의 슬라이더로 수입을 조정할 수 있습니다. #I 클릭#!하여 원하는 값을 고른 뒤, 아래 확인 버튼을 누르면 작업이 완료됩니다. 수정치를 제거하려면 #N 우클릭#!하거나 슬라이더를 #n 0#!으로 맞추십시오."
SKY_1_1_SP_GUIDE_BTN3: "국내 또는 망명 중인 인물은 인물을 우클릭한 뒤, 팝업 메뉴에서 #yellow $sakuya_mark_character$#!를 선택하면 표시됩니다. 외국 인물은 먼저 대상 국가를 표시한 뒤, 이 페이지의 #YELLOW $SKY_B3_CHAR_MARK_OPEN$#!에서 팝업 이벤트로 표시할 인물을 선택하십시오."
SKY_1_1_SP_GUIDE_BTN4: "#yellow $SKY_B4_TAKE_MARKED_NAVY_SHIPS$#!와 #yellow $SKY_1_1_B4_BTN_DESTROY_SHIPS$#!는 먼저 함대를 표시해야 실행됩니다. #BLUE Shift#!를 누른 채 #yellow $SKY_R4_MARK_ARMY$#!를 클릭하면 팝업 이벤트에서 표시할 함대를 선택할 수 있습니다.\N외교전이나 전쟁을 시작할 때는 전쟁 명분이 유효한지 확인해야 합니다. 조건이 충족되지 않으면 작업이 실패할 수 있습니다. $CMP$의 다른 기능에도 비슷한 경우가 있습니다."
SKY_1_1_SP_GUIDE_BTN5: "$CMP$의 다른 표시 시스템처럼, $SKY_B5_SUBSEC_1$에서 표시한 $concept_interest_group$은 다른 수정 옵션에서 참조됩니다. 선택한 이익집단은 이익집단 표시가 필요한 일부 기능을 점등시킵니다. 예를 들어 $sakuya_mark_character$의 소속 이익집단 변경 등이 있습니다. 대부분의 경우 $concept_interest_group$은 하나만 선택하는 것을 권장합니다."
SKY_1_1_SP_GUIDE_BTN6: "소유한 주를 우클릭하고 메뉴에서 #yellow $decree_sakuya_mark_state$#!를 선택하면 조정할 $state$를 표시할 수 있습니다. 아래 #i $concept_political_lens$#!의 $mm_issue_decree_interaction$에서 #yellow $decree_sakuya_mark_state$#!를 선택하여 지도에서 더 쉽게 표시할 수도 있습니다. 외국 주를 표시하려면 대상 국가를 우클릭하고 #yellow $sakuya_mark_foreign_state$#!를 선택하십시오.\N#T #N 한 번에 한 장소만 표시하는 것을 강력히 권장합니다!#!#!"
SKY_1_1_SP_GUIDE_BTN6_tab4: "건물 선택기에서 조정할 건물 범주를 선택하면, 메뉴 왼쪽 아래에 현재 선택된 건물이 표시됩니다. 먼저 $decree_sakuya_mark_state$로 대상 $state$를 선택하고, 슬라이더로 원하는 값을 조정한 뒤 #yellow $SKY_B6_BUILD_ADD_BUILDING$#!를 클릭하십시오. #n 0#! 단계를 선택하면 해당 건물 또는 잠재 자원을 제거합니다. 건물과 잠재 자원이 성공적으로 추가되는지는 플레이어 또는 대상 국가의 #N 기술#! 등 조건에 따라 달라집니다.\N$SKY_B6_BUILD_CAT_RESOURCE$와 $SKY_B6_BUILD_CAT_AGRICULTURE$ 범주의 건물은 #yellow $SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL$#!도 지원합니다."
SKY_1_1_SP_GUIDE_BTN6_tab5: "\N이 페이지의 수정치는 #yellow $SKY_B6_RESERVED_BUILD_R2_C1$#!와 #yellow $SKY_B6_RESERVED_BUILD_R2_C2$#!가 $state$를 대상으로 하는 것을 제외하면 모두 $concept_buildings$를 대상으로 합니다. 해당 $concept_modifier$를 보려면 수정한 $concept_buildings$를 클릭해야 합니다."
SKY_1_1_SP_GUIDE_BTN7: "\N표시할 국가를 우클릭하고 #yellow $sakuya_mark_country$#!를 선택하면 표시됩니다. 아래 #i $concept_diplomatic_lens$#!의 $concept_diplomatic_actions$에서 #yellow $sakuya_mark_country$#!를 선택하여 지도에서 더 쉽게 표시할 수도 있습니다."
 SKY_1_1_SP_GUIDE_BTN8: "\N\N#yellow $SKY_BTN8_TAB_TECHNOLOGY$#! 모아 $concept_technology$- 관련 수식어; 상단의 탭을 사용하여 전환할 수 있습니다 $production$, $military$, 그리고 $society$. 대부분의 버튼은 표준 대형/소형 버튼 규칙을 따르며, 마우스 오른쪽 버튼을 클릭하면 해당 항목이 지워집니다. $concept_modifier$.\N\N그리고 #yellow $SKY_BTN8_TAB_CULTURE$#!, 클릭 #yellow $SKY_B8_CULTURE_MARK$#! 열기 $SKY_1_2_CULTURE_INDEX_TITLE$#!. 대상을 선택하세요 $concept_culture$ 에서 $concept_culture$ 선택기를 지정한 다음, 이를 사용하여 $concept_primary_cultures$, $concept_homelands$, 그리고 기타 문화 활동 등."
SKY_1_1_SP_GUIDE_BTN9: "\n$CMP$의 큰 제목 위에 마우스를 1초 올려 보시겠습니까...?\n@innovation!벽지에 따라 다른 내용을 볼 수 있습니다."
SKY_1.1_CLOSE: "클릭하여 닫기."
SKY_B4_TT_JOIN_WAR_INITIATOR_SIDE: "#tooltip_header 전쟁 참가#!\n\n국가를 선택한 전쟁의 개시자 측 진영에 합류시킵니다.\n먼저 전쟁을 선택해야 합니다.\n$SKY_line$\n$SKY_LC$ 플레이어가 개시자 측에 합류\n$SKY_RC$ 표시국이 개시자 측에 합류\n$SKY_SL$ 가능하면 플레이어 이탈\n$SKY_AL$ 가능하면 표시국 이탈"
SKY_B4_TT_JOIN_WAR_TARGET_SIDE: "#tooltip_header 대상 측 참가#!\n\n국가를 선택한 전쟁의 대상 측 진영에 합류시킵니다.\n먼저 전쟁을 선택해야 합니다.\n$SKY_line$\n$SKY_LC$ 플레이어가 대상 측에 합류\n$SKY_RC$ 표시국이 대상 측에 합류"
