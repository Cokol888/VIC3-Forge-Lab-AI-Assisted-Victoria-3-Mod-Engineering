 SKY_B8_TT_TECH_ERA_BUTTON: "#BOLD 기술 시대#!\n$SKY_line$\n$SKY_LC$ 이 시대와 그 이전 모든 시대의 해당 기술 분야를 해금하세요.\n$SKY_AL$ 이 시대의 기술 중 이 카테고리에 속하는 기술만 잠금 해제하세요.\n$SKY_RC$ 선택한 국가에 대해, 해당 시대 및 그 이전 모든 시대의 이 기술 범주에 대한 잠금을 해제합니다.\n$SKY_CL$ 선택한 국가의 경우, 해당 시대의 이 기술 카테고리에만 접근 권한을 부여합니다."
