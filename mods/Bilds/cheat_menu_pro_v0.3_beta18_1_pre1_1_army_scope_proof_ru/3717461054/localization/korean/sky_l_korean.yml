 SKY_B3_AMENDMENT_TT_POLITICAL_CONCESSION: "#BOLD $amendment_generic_sponsor_polstr_increase$#!\N\N먼저 이익 단체 도구에서 하나의 이익 단체에만 플래그를 지정해야 합니다. \N이러한 정치적 양보는 현재 제정 중인 법률에만 추가됩니다. \N\N$SKY_LC$기본 정치적 양보를 추가합니다. \NShift+ $SKY_LC$낮은 강도의 협상 양보를 추가합니다. \NAlt+ $SKY_LC$중간 강도의 협상 양보를 추가합니다. \NCtrl+ $SKY_LC$높은 강도의 협상 양보를 추가합니다. \N$SKY_RC$현재 제정된 법률에 대한 정치적 양보를 삭제합니다."
