 SKY_B3_TT_GOODS_OBSESSION_SELECTED_CULTURE: "#BOLD 문화 집착: 표시된 문화#!\n$SKY_line$\n#lore 선택한 상품 1개와 표시된 $concept_culture$ 1개가 정확히 필요합니다.#!\n\n$SKY_LC$ 표시된 $concept_culture$에 선택한 상품에 대한 집착을 추가합니다.\n$SKY_RC$ 표시된 $concept_culture$에서 선택한 상품에 대한 집착을 제거합니다.\N\N먼저 $concept_culture$를 표시해야 합니다. #LORE $concept_culture$ 표시 방법을 모르겠습니까? #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$를 열고, $SKY_1_2_CULTURE_INDEX_TITLE$에서 문화를 하나 선택하십시오#!."
 SKY_B3_TT_GOODS_TABOO_SELECTED_CULTURE: "#BOLD 문화 금기: 표시된 문화#!\n$SKY_line$\n#lore 선택한 상품 1개와 표시된 $concept_culture$ 1개가 정확히 필요합니다.#!\n\n$SKY_LC$ 표시된 $concept_culture$에 선택한 상품에 대한 금기를 추가합니다.\n$SKY_RC$ 표시된 $concept_culture$에서 선택한 상품에 대한 금기를 제거합니다.\N\N먼저 $concept_culture$를 표시해야 합니다. #LORE $concept_culture$ 표시 방법을 모르겠습니까? #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$를 열고, $SKY_1_2_CULTURE_INDEX_TITLE$에서 문화를 하나 선택하십시오#!."
