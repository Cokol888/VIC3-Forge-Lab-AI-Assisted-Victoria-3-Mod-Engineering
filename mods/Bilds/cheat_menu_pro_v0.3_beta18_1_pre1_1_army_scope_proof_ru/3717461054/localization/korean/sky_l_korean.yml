 SKY_B4_TT_START_DP: "#tooltip_header $concept_diplomatic_play_short$ 시작#!\n\n먼저 대상국을 표시하고 외교 요구를 선택해야 합니다.\n$SKY_line$\n$SKY_LC$ 플레이어 → 대상국\n$SKY_RC$ 대상국 → 플레이어"
