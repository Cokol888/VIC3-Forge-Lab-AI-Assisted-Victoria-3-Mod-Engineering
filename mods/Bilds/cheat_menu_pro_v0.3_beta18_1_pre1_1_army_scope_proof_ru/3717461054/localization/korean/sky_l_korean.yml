 SKY_B6_POPMIG_TT_LOW_ACCEPTANCE: "#BOLD $SKY_B6_POPMIG_LOW_ACCEPTANCE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_SELF_COUNTRY$의 수용도 최저 두 단계 인구를 $SKY_MARKED_COUNTRY$로 이동.\n$SKY_LC$ 20%, 대상국 편입 $concept_state$에 분산.\n$SKY_AL$ 5%, 대상국 편입 $concept_state$에 분산.\n$SKY_CL$ 50%, 대상국 편입 $concept_state$에 분산.\n$SKY_SL$ 33%, 대상국 표시 $concept_state$로 이동.\n$SKY_RC$ 100%, 대상국 편입 $concept_state$에 분산.\n\n먼저 국가를 표시해야 합니다. $SKY_SL$은 그 국가에 최소 1개 $concept_state$ 표시도 필요합니다."
