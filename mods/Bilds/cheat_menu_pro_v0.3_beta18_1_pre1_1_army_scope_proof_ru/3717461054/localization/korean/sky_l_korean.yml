 SKY_B5_TT_LOBBY_IG_JOIN: "#BOLD $concept_political_lobby_short$ 가입/탈퇴#!\n\n$SKY_LC$ 선택 $concept_interest_group$이 선택 $concept_political_lobby_short$에 가입\n$SKY_RC$ 선택 $concept_interest_group$이 선택 $concept_political_lobby_short$에서 탈퇴\n$SKY_SL$ 이 국가의 모든 $concept_interest_group$이 선택 $concept_political_lobby_short$에 가입\n$SKY_CL$ 선택 $concept_political_lobby_short$의 모든 구성원 제거\n$SKY_line$\n#italic $concept_political_lobby_short$가 외국 소속이면 그 국가의 대응 $concept_interest_group$을 자동 사용합니다.\n좌클릭/우클릭은 $concept_interest_group$과 $concept_political_lobby_short$가 모두 선택되어야 합니다.#!"
 SKY_B5_TT_LOBBY_CREATE: "#BOLD $concept_political_lobby_short$ 생성#!\n\n$SKY_LC$ 이 국가에 친대상국 $concept_political_lobby_short$ 생성\n$SKY_RC$ 이 국가에 반대상국 $concept_political_lobby_short$ 생성\n$SKY_SL$ 대상국에 친플레이어 $concept_political_lobby_short$ 생성\n$SKY_AL$ 대상국에 반플레이어 $concept_political_lobby_short$ 생성\n$SKY_line$\n#italic 표시된 대상국이 필요합니다. $concept_interest_group$이 선택되어 있으면 초기 구성원으로 사용됩니다.#!"
