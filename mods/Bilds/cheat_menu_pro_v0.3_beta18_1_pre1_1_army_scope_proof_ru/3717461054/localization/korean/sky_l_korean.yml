SKY_1_1_B6_TT_RESERVED_BUILD_R1_C3: "#BOLD 선택 건물 최저 임금#!\n\n자국 표시 주 안의 현재 선택 건물에 적용.\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!99%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ #n -#!10%\n$SKY_RC$ 이 그룹과 + 버튼 제거."
SKY_1_1_B6_TT_RESERVED_BUILD_R1_C3_PLUS: "#BOLD 선택 건물 최저 임금#!\n\n자국 표시 주 안의 현재 선택 건물에 적용.\n\n$SKY_LC$ #n -#!50%\n$SKY_SL$ #n -#!99900%\n$SKY_AL$ #n -#!66%\n$SKY_CL$ +100%\n$SKY_RC$ +20%."
