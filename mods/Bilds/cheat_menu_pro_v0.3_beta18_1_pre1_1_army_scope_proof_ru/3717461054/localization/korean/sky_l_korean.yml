 SKY_B6_BUILD_TT_CONFIRM: "#BOLD 건물 배치#!\n\n$SKY_LC$ 현재 건물 등급 변경을 플레이어 표시 주에 적용\n$SKY_RC$ 국가가 표시되고 그 국가에 표시 외국 주가 있으면 해당 외국 주에 현재 건물 등급 변경 적용\n$SKY_line$\n#lore 0은 건물을 삭제합니다. 양수는 등급을 추가합니다. 대상 주에 이 건물이 없으면 해당 등급으로 바로 생성됩니다.#!"
