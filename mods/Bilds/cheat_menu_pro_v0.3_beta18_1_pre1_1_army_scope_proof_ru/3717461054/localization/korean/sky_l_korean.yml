 SKY_1_2_B8_CULTURE_TT_NEED_MARKED_CULTURE: "#BOLD $SKY_B8_CULTURE_MARK$#!\n$SKY_line$\n아직 사용하지 않았습니다 $SKY_B8_CULTURE_MARK$ 아직!\n를 클릭하세요 $SKY_B8_CULTURE_MARK$ 위의 버튼을 클릭한 다음, $concept_culture$ ~에 표시하고 싶으세요 $SKY_1_2_CULTURE_INDEX_TITLE$."
 SKY_1_2_B7_TT_ACQUIRE_TREATY_PORT_DISABLED: "#BOLD $SKY_B7_ACQUIRE_TREATY_PORT$#!\n$SKY_line$\n먼저 우리 주 중 하나나 외국 주 하나를 선택해야 합니다.\n\n우리 주 중 하나를 외국으로 만들기 위해 $concept_treaty_port$: 저희 주 중 하나를 선택하고, 다음을 시행하십시오. #T $decree_sakuya_mark_state$#! 명령을 내린 다음, 다음을 사용하십시오. #T $sakuya_mark_country$#! 대상국에 대한 외교적 조치.\n\n~을 얻으려면 $concept_treaty_port$ 다른 국가에서: 대상 국가를 마우스 오른쪽 버튼으로 클릭한 다음, #T $sakuya_mark_country$#! ‘외교적 조치’ 항목에서 다음을 선택하십시오 #T $sakuya_mark_foreign_state$#!."
 SKY_1_2_B7_TT_CEDE_HOME_STATE_DISABLED: "#BOLD $SKY_B7_CEDE_HOME_STATE$#!\n$SKY_line$\n우리 주 중 하나를 선택하고 다음을 시행하십시오. #T $decree_sakuya_mark_state$#! 이를 기념하기 위한 칙령을 반포하고, 그 다음 #T $sakuya_mark_country$#! 대상국에 대한 외교적 조치."
 SKY_1_2_B7_TT_TAKE_FOREIGN_STATE_DISABLED: "#BOLD $SKY_B7_TAKE_FOREIGN_STATE$#!\n$SKY_line$\n해당 국가와 그 국가 내의 외국을 모두 선택해야 합니다.\n\n표시하려는 국가를 마우스 오른쪽 버튼으로 클릭한 다음, #T $sakuya_mark_country$#! ‘외교적 조치’ 항목에서 다음을 선택하십시오 #T $sakuya_mark_foreign_state$#!."
