 SKY_B4_TT_DP_MANEUVERS: "#tooltip_header $concept_diplomatic_play_short$ 책략#!\n\n플레이어 국가의 $concept_diplomatic_play_short$ 책략을 조정합니다.\n$SKY_line$\n$SKY_LC$ +50\n$SKY_CL$ #n -#!50\n$SKY_AL$ +5\n$SKY_SL$ +99999\n$SKY_RC$ 제거"
