 SKY_B8_TT_LAWSET_LIBERAL: "#BOLD 자유주의 국가#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$이 자유주의 법률 세트 전체를 수용\n$SKY_RC$ $SKY_MARKED_COUNTRY$이 자유주의 법률 세트 전체를 수용\n$SKY_line$\n#italic 이 작업은 국가의 모든 관련 법률을 즉시 바꿉니다. 표시국이 없으면 우클릭은 효과가 없습니다.#!"
 SKY_B8_TT_LAWSET_FASCIST: "#BOLD 파시스트 국가#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$을 파시스트 국가 법률 세트 전체로 전환\n$SKY_RC$ $SKY_MARKED_COUNTRY$을 파시스트 국가 법률 세트 전체로 전환\n$SKY_line$\n#italic 표시국이 없으면 우클릭은 효과가 없습니다.#!"
 SKY_B8_TT_LAWSET_GDP: "#BOLD GDP 지향#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$을 GDP 지향 법률 세트 전체로 전환\n$SKY_RC$ $SKY_MARKED_COUNTRY$을 GDP 지향 법률 세트 전체로 전환\n$SKY_line$\n#italic 표시국이 없으면 우클릭은 효과가 없습니다.#!"
 SKY_B8_TT_LAWSET_SOL: "#BOLD SoL 지향#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$을 SoL 지향 법률 세트 전체로 전환\n$SKY_RC$ $SKY_MARKED_COUNTRY$을 SoL 지향 법률 세트 전체로 전환\n$SKY_line$\n#italic 표시국이 없으면 우클릭은 효과가 없습니다.#!"
 SKY_B8_TT_LAWSET_COMMUNIST: "#BOLD 공산주의#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$을 공산주의 법률 세트 전체로 전환\n$SKY_RC$ $SKY_MARKED_COUNTRY$을 공산주의 법률 세트 전체로 전환\n$SKY_line$\n#italic 표시국이 없으면 우클릭은 효과가 없습니다.#!"
 SKY_B8_TT_LAWSET_SHIT: "#BOLD 디스토피아#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$을 디스토피아 법률 세트 전체로 전환\n$SKY_RC$ $SKY_MARKED_COUNTRY$을 디스토피아 법률 세트 전체로 전환\n$SKY_line$\n#italic 국가를 가장 어두운 시대로 끌고 가 모든 권리를 박탈합니다. 표시국이 없으면 우클릭은 효과가 없습니다.#!"
 SKY_B8_TT_HOW_DARE_U: "#BOLD HOW DARE U#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$에 초강력 군사 수정 적용\n$SKY_AL$ $SKY_MARKED_COUNTRY$에 초강력 군사 수정 적용\n$SKY_SL$ $SKY_SELF_COUNTRY$에 음수판 적용\n$SKY_CL$ $SKY_MARKED_COUNTRY$에 음수판 적용\n$SKY_RC$ 이 버튼 관련 수정 제거\n$SKY_line$\n#italic 양수판은 육군 3개, 해군 3개, 전투 2개, 위신 2개 수정을 포함합니다. 사살률은 99999. 음수판은 군사값을 일괄 -999로, 위신을 +90%로 반전합니다. 표시국이 없으면 Alt/Ctrl은 효과가 없습니다.#!"
 SKY_B8_TT_DOOMFALL: "#BOLD 파멸 강림#!\n\n$SKY_LC$ $SKY_MARKED_COUNTRY$에 경제와 혁명의 폭탄을 심고 국고 한도 1000%만큼의 돈을 직접 차감\n$SKY_AL$ 같은 효과를 $SKY_SELF_COUNTRY$에 적용하고 국고 한도 1000%만큼의 돈을 직접 차감\n$SKY_RC$ 이 버튼 관련 수정 제거\n$SKY_line$\n#italic 급진성, 혁명, 혼란, 경제 침체에 집중합니다. 건설력은 직접 -99999가 됩니다. 표시국이 없으면 좌클릭은 효과가 없습니다.#!"
 SKY_B8_TT_SOCIAL_COLLAPSE: "#BOLD 사회 붕괴#!\n\n$SKY_LC$ $SKY_MARKED_COUNTRY$을 제도, 인구, 사회 질서 붕괴 상태로 몰아넣음\n$SKY_AL$ 같은 상태를 $SKY_SELF_COUNTRY$에 적용\n$SKY_RC$ 이 버튼 관련 수정 제거\n$SKY_line$\n#italic 정통성, 충성파, 이주, 혼란, 각종 사회 제도 한도의 전면 쇠퇴에 집중합니다. 생활 수준은 직접 -19가 됩니다. 표시국이 없으면 좌클릭은 효과가 없습니다.#!"
