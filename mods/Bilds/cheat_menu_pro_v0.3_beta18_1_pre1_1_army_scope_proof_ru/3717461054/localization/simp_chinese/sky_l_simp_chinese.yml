 SKY_B8_TT_FAMOUS_CHARACTER: "#BOLD 名人召唤#!\n\n$SKY_LC$ 作为鼓动者加入玩家国家\n$SKY_RC$ 成为玩家国家的统治者\n$SKY_AL$ 作为将军加入玩家国家\n$SKY_SL$ 作为海军将领加入玩家国家\n$SKY_line$\n#italic 同一人物可以重复召唤；具体身份取决于点击方式。#!"
 SKY_ABOUT_WELCOME_1: "#BOLD 欢迎！#!\n很高兴认识你。我是Xier，Victoria 3 喜儿修改器 Pro 的开发者。很荣幸能在维多利亚3再次与你相遇。#BOLD QQ群：#!734267077，欢迎来玩！"
 SKY_ABOUT_WELCOME_2: "#BOLD 你觉得这个MOD怎么样？#!\n我一直在持续开发中。与EU5相比，Victoria 3的引擎看起来和之前的作品类似，但实际上有很大不同。不管怎样，希望大家玩得开心！遇到你们真的是一件很快乐的事。"
 SKY_UPDATE_LOG_V1_TITLE: "#BOLD $SKY_WINDOW_TITLE$ v1.0 更新说明#!"
 SKY_UPDATE_LOG_V1_TEXT: "- 初始版本发布\n- 从EU5移植导航栏系统\n- 9个功能分类，每个分类12个预留按钮\n- 关于页面包含更新日志、个性化设置和关于信息\n- 支持简体中文本地化"
 SKY_SETTINGS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} 个性化设置#!"
 SKY_SETTINGS_PLACEHOLDER: "个性化设置功能正在开发中，敬请期待。\n后续将支持背景自定义、界面主题切换等功能。"
 SKY_ABOUT_LINKS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} 联系方式#!"
 SKY_ABOUT_TEXT_1: "#BOLD 感谢使用 $SKY_WINDOW_TITLE$！#!\n很高兴认识你。我是Xier，一位来自北京、目前居住在捷克的开发者。如果你有任何问题，欢迎加入QQ群或Discord群联系我。如果你想支持Xier，可以在Steam创意工坊给Xier一个点赞，或者通过上方的赞助链接捐赠~\n本MOD完全免费。如果你通过任何付费渠道获得了本MOD，请立即举报。Xier将非常感激！"
 SKY_ABOUT_TEXT_2: "#BOLD 兼容性说明#!\n$SKY_WINDOW_TITLE$ 经过精心设计，以实现与其他MOD的最大兼容性。但由于游戏引擎限制，需要修改一个系统GUI文件作为折衷方案来显示$concept_modifier$界面。\n为确保大型MOD尽可能完整加载，建议加载顺序为：大型MOD优先，然后是小型MOD，接着是UI类MOD，最后加载 $SKY_WINDOW_TITLE$。由于游戏遵循后加载覆盖先加载的规则，将 $SKY_WINDOW_TITLE$ 放在最后可确保其UI修改覆盖其他UI类MOD。\n如果在使用过程中遇到任何问题，请随时通过QQ群或Discord群联系我，我会尽力提供帮助和支持。"
