 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold 作用对象：我国主流文化#!\n\n$SKY_LC$ 若已标记国家：从我国主流文化移除目标国全部主流文化\n$SKY_RC$ 若我国有标记$concept_state$：从我国主流文化移除该$concept_state$所在本土文化\n$SKY_SL$ 若已标记国家且目标国有标记$concept_state$：从我国主流文化移除该$concept_state$所在本土文化\n$SKY_CL$ 若已标记$concept_character$：从我国主流文化移除该角色文化\n$SKY_line$\n#n 注意：不会移除某国最后一个主流文化。不要让任何国家没有主流文化，否则可能损坏存档。#!"
