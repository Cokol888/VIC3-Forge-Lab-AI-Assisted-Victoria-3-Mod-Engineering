 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold 作用对象：我国主流文化#!\n\n$SKY_LC$ 若已标记国家：将目标国全部主流文化添加到我国主流文化\n$SKY_RC$ 若我国有标记$concept_state$：将该$concept_state$所在本土文化添加到我国主流文化\n$SKY_SL$ 若已标记国家且目标国有标记$concept_state$：将该$concept_state$所在本土文化添加到我国主流文化\n$SKY_CL$ 若已标记$concept_character$：将该角色文化添加到我国主流文化"
