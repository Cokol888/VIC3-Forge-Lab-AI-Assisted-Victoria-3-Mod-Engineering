 SKY_B8_TT_LAWSET_SHIT: "#BOLD 反乌托邦#!\n\n$SKY_LC$ 将$SKY_SELF_COUNTRY$切换为整套反乌托邦法律\n$SKY_RC$ 将$SKY_MARKED_COUNTRY$切换为整套反乌托邦法律\n$SKY_line$\n#italic 让国家倒退回最黑暗的时代，剥夺所有权利。如果未标记任何国家，使用右键将不会产生效果。#!"
 SKY_B8_TT_HOW_DARE_U: "#BOLD HOW DARE U#!\n\n$SKY_LC$ 为$SKY_SELF_COUNTRY$施加超强军事修正\n$SKY_AL$ 为$SKY_MARKED_COUNTRY$施加超强军事修正\n$SKY_SL$ 为$SKY_SELF_COUNTRY$施加负向版本\n$SKY_CL$ 为$SKY_MARKED_COUNTRY$施加负向版本\n$SKY_RC$ 清除此按钮相关修正\n$SKY_line$\n#italic 正向版包含 3 个陆军、3 个海军、2 个战斗、2 个威望修正；杀伤率为 99999。负向版军事值统一为 -999，威望反转为 +90%。若未标记国家，则 Alt/Ctrl 不会生效。#!"
 SKY_B8_TT_DOOMFALL: "#BOLD 厄运降临#!\n\n$SKY_LC$ 向$SKY_MARKED_COUNTRY$埋下经济与革命炸弹，并直接扣除其 1000% 金库上限的钱\n$SKY_AL$ 向$SKY_SELF_COUNTRY$施加同样效果，并直接扣除 1000% 金库上限的钱\n$SKY_RC$ 清除此按钮相关修正\n$SKY_line$\n#italic 侧重激进、革命、混乱、经济迟滞；其中建造力直接为 -99999。若未标记国家，则左键不会生效。#!"
 SKY_B8_TT_SOCIAL_COLLAPSE: "#BOLD 社会崩坏#!\n\n$SKY_LC$ 让$SKY_MARKED_COUNTRY$进入制度、人口与秩序崩坏状态\n$SKY_AL$ 让$SKY_SELF_COUNTRY$进入同样状态\n$SKY_RC$ 清除此按钮相关修正\n$SKY_line$\n#italic 侧重合法性、忠派、迁徙、动乱与各类社会机构上限的全面衰败；其中生活水平直接为 -19。若未标记国家，则左键不会生效。#!"
