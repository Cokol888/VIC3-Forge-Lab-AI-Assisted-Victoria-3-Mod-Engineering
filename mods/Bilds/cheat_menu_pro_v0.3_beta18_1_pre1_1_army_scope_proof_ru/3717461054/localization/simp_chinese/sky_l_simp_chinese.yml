 SKY_B8_TT_COLONIAL: "#BOLD 殖民地国格#!\n\n$SKY_LC$ 将$SKY_SELF_COUNTRY$设为殖民地国家\n$SKY_SL$ 将$SKY_MARKED_COUNTRY$设为殖民地国家\n$SKY_line$\n#italic 强制改变国家地位；如果未标记任何国家，使用 Shift 将不会产生效果。#!"
 SKY_B8_TT_RETIRE: "#BOLD 强制隐退#!\n\n$SKY_LC$ 让当前已标记$concept_character$立即隐退。\n$SKY_line$\n#italic 需要先标记角色。#!"
 SKY_B8_TT_MARTYR_EXILE: "#BOLD 殉道流亡#!\n\n$SKY_LC$ 将当前已标记$concept_character$以“政治殉道者”身份流放。\n$SKY_line$\n#italic 目标角色将被流放，并在国内留下政治殉道者的影响。请确保已选中一个角色。#!"
 SKY_B8_TT_DISINHERIT: "#BOLD 剥夺继承#!\n\n$SKY_LC$ 对当前已标记$concept_character$执行剥夺继承。\n$SKY_line$\n#italic 需要先标记角色；通常只对具备继承体系的目标有实际意义。#!"
 SKY_B8_TT_LAWSET_LIBERAL: "#BOLD 自由国家#!\n\n$SKY_LC$ 让$SKY_SELF_COUNTRY$拥抱整套自由主义法律\n$SKY_RC$ 让$SKY_MARKED_COUNTRY$拥抱整套自由主义法律\n$SKY_line$\n#italic 此操作将瞬间改变国家的所有相关法律。如果未标记任何国家，使用右键将不会产生效果。#!"
 SKY_B8_TT_LAWSET_FASCIST: "#BOLD 法西斯国家#!\n\n$SKY_LC$ 将$SKY_SELF_COUNTRY$切换为整套法西斯国家法律\n$SKY_RC$ 将$SKY_MARKED_COUNTRY$切换为整套法西斯国家法律\n$SKY_line$\n#italic 若未标记国家，则右键不会生效。#!"
