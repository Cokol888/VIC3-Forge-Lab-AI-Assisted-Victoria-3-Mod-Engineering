SKY_1_1_B7_TT_FORM_CHANGE_TAG: "#BOLD 将我国变为新的国家#!\n$SKY_line$\n$SKY_LC$ 我国变为选中的TAG，并改为对应文化与国教。\n$SKY_RC$ 我国只变为选中的TAG。"
SKY_1_1_B7_TT_FORM_RELEASE_COUNTRY: "#BOLD 在我国已标记地区成立新的国家#!\n$SKY_line$\n$SKY_LC$ 在我国已标记地区成立选中的TAG。\n\n我国不会切换为新国家。"
SKY_1_1_B7_TT_FORM_MARKED_CHANGE_TAG: "#BOLD 将目标国家变为新的国家#!\n$SKY_line$\n$SKY_LC$ 目标国家变为选中的TAG，并改为对应文化与国教。\n$SKY_RC$ 目标国家只变为选中的TAG。"
SKY_1_1_B7_TT_FORM_MARKED_RELEASE_COUNTRY: "#BOLD 在目标国家的标记地区成立新的国家#!\n$SKY_line$\n$SKY_LC$ 在目标国家的标记地区成立选中的TAG。\n\n玩家不会切换为新国家。"
SKY_1_1_B7_TT_FORM_APPLY_IDENTITY: "#BOLD 改为与选中的TAG相同的文化与国教#!\n$SKY_line$\n$SKY_LC$ 我国改为选中TAG的文化与国教。\n$SKY_RC$ 目标国家改为选中TAG的文化与国教。"
SKY_1_1_SP_GUIDE_BTN1: "$SKY_DEFAULT_TITLE$！\n在开始使用前，请允许喜儿为您介绍按钮的点击逻辑。#P 左键#!点击按钮会添加效果，具体效果可将鼠标悬停在按钮上查看。若添加的是$concept_modifier$，则可通过#N 右键#!点击删除该$concept_modifier$。大多数按钮支持组合键，您可以按住键盘上的某个按键后，再左键点击按钮。\N@innovation!通常情况下，#p 左键#!对应$xier$认为较为合理且有益的数值；#BLUE Shift#!则会提供百倍甚至更高的数值；#COLOR:{0.3686,0.3961,0.7216} Alt#!会提供较小数值，方便进行精确调整；#GOLD Ctrl#!通常则为相反效果。"
SKY_1_1_SP_GUIDE_BTN2: "大多数标记功能一次#BOLD 只能支持一个目标#!，本页中的商品与公司标记同样如此。第一页的滑杆可用于调整收入，#I 点击#!滑杆选择您需要的数值后，再点击下方确认按钮即可完成操作。若想删除修正，可通过#N 右键#!点击，或将滑杆调整至#n 0#!。"
SKY_1_1_SP_GUIDE_BTN3: "对于国内或正在流亡的角色，右键点击角色，并在弹出的菜单中选择#yellow $sakuya_mark_character$#!即可完成标记。对于外国角色，则需要先标记目标国家，然后在此页面找到#YELLOW $SKY_B3_CHAR_MARK_OPEN$#!，并在弹出的事件中选择您想标记的角色。"
SKY_1_1_SP_GUIDE_BTN4: "#yellow $SKY_B4_TAKE_MARKED_NAVY_SHIPS$#!与#yellow $SKY_1_1_B4_BTN_DESTROY_SHIPS$#!需要先标记舰队后才能执行。按住#BLUE Shift#!并点击#yellow $SKY_R4_MARK_ARMY$#!后，可根据弹窗事件选择一支舰队进行标记。\N发起博弈或战争时，需要确认战争理由是否合法；若条件不满足，可能会导致操作无法成功执行。类似情况在$CMP$的其他功能中也同样存在。"
SKY_1_1_SP_GUIDE_BTN5: "与$CMP$中的其他标记系统一样，$SKY_B5_SUBSEC_1$所标记的$concept_interest_group$会被其他修改选项引用。选中的利益集团会点亮部分必须先标记利益集团才能生效的功能，例如更改$sakuya_mark_character$所属的利益集团。大多数情况下，建议仅选择一个$concept_interest_group$。"
SKY_1_1_SP_GUIDE_BTN6: "右键点击您所持有的地区，在菜单中选择#yellow $decree_sakuya_mark_state$#!，即可标记您想调整的$state$。您也可以在下方#i $concept_political_lens$#!的$mm_issue_decree_interaction$中选择#yellow $decree_sakuya_mark_state$#!，以更方便地在地图上进行标记。若要标记外国地区，则需右键点击目标国家，并选择#yellow $sakuya_mark_foreign_state$#!。\N#T #N 强烈建议一次仅标记一个地点！#!#!"
SKY_1_1_SP_GUIDE_BTN6_tab4: "在建筑选择器中选择您想调整的建筑类别后，菜单左下角会显示当前已选中的建筑。请先通过$decree_sakuya_mark_state$选择目标$state$，再点击滑杆调整所需数值，随后点击#yellow $SKY_B6_BUILD_ADD_BUILDING$#!即可。选择#n 0#!档将清除此类建筑或潜在资源。建筑和潜在资源是否能添加成功，取决于玩家或目标国家的#N 科技#!等条件。\N$SKY_B6_BUILD_CAT_RESOURCE$与$SKY_B6_BUILD_CAT_AGRICULTURE$类别的建筑还支持#yellow $SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL$#!。"
SKY_1_1_SP_GUIDE_BTN6_tab5: "\N本页的修正除了#yellow $SKY_B6_RESERVED_BUILD_R2_C1$#!和#yellow $SKY_B6_RESERVED_BUILD_R2_C2$#!所给予的修正目标是$state$，其余目标皆为$concept_buildings$。您需要点击您修改了的$concept_buildings$，然后才能看到对应的$concept_modifier$。"
SKY_1_1_SP_GUIDE_BTN7: "\N右键点击您想要标记的国家，并选择#yellow $sakuya_mark_country$#!即可完成标记。您也可以在您也可以在下方#i $concept_diplomatic_lens$#!的$concept_diplomatic_actions$中选择#yellow $sakuya_mark_country$#!，以更方便地在地图上进行标记。"
SKY_1_1_SP_GUIDE_BTN9: "\n试试在$CMP$的大标题，把鼠标放上去一秒...？\n@innovation!切换不同的壁纸能看到不同的内容哦。"
SKY_1.1_CLOSE: "点我关闭。"
