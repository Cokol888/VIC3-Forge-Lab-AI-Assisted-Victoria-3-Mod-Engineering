 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "咲夜用一场极不体面的外交晚宴羞辱了目标国家，使其在国际舞台上蒙羞。持续时间：5年。"
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]被[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]派出的咲夜羞辱了。持续时间：5年。"
