 sakuya_superdip.1.t: "咲夜在外交晚宴出言不逊！"
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName]的晚宴上，咲夜与[SCOPE.sCountry('sakuya_superdip_target_country').GetName]的官员们打作一团，场面混乱不堪。"
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]试图抄起板凳砸向咲夜， 但咲夜优雅地侧身躲过，并随手从餐桌上抓了一大块蛋糕向[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]头上砸去。\N\N\"#lore 老东西...就你还想偷袭我？#!\"" 
 sakuya_superdip.1.a: "骂的好！"
 sakuya_superdip.1.b: "我也骂几句..."
 sakuya_superdip.1.c: "咲夜老师，别这样..."
 sakuya_superdip.1.c_desc: "十六夜咲夜在[SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName]的极力劝阻后， 暂时将银色的小刀收了起来，然后喝了一口葡萄酒，看起来还是那么潇洒。"
 notification_sakuya_superdip_humiliation_toast_name: "咲夜轻蔑地羞辱了[SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "咲夜向[SCOPE.sCountry('target').GetName]的[SCOPE.sCountry('target').GetRuler.GetFullName]陈述了一段极具文化底蕴的外交照会意见。但他们不知为何将其解读为一个#BOLD 侮辱#!。我们以他们的粗鄙为乐，他们却似乎颇为不悦。[SCOPE.sCountry('actor').GetName]与[SCOPE.sCountry('target').GetName]的外交关系似乎恶化了。"
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "咲夜说：\N你妈妈就跟仓鼠似的那么能生，\N你爸爸浑身一股果酒味儿！"
 sakuya_superdip_insult_02: "咲夜说：\N我们的末日降临了！\N你看路西法的走狗正在四处流窜呐——\N啊，不，原来只是贵国代表啊。"
 sakuya_superdip_insult_03: "咲夜说：\N还有，我认为贵国首都必须被毁灭！"
 sakuya_superdip_insult_04: "咲夜说：\N当后人书写我们这个时代的历史时，\N想必他们会可怜你们——以及对你们感到恶心。"
 sakuya_superdip_insult_05: "咲夜说：\N我上次去出恭都比跟贵国大使共进晚餐要愉快得多。"
 sakuya_superdip_insult_06: "咲夜说：\N快看！\N那边有一小坨可爱的脏东西！"
 sakuya_superdip_insult_07: "咲夜说：\N你们流的血可使我们从你们那里夺取的土地更肥沃。"
 sakuya_superdip_insult_08: "咲夜说：\N烦闷的外交场合总是得需要一些鲶鱼出来活跃气氛的。\N而你，我的朋友，你是最棒的鲶鱼！"
 sakuya_superdip_insult_09: "咲夜说：\N贵国的事为什么总是那么糟糕？\N我想全都是因为你们这些人。"
 sakuya_superdip_insult_10: "咲夜说：\N在我们下的这局大棋里，\N你就是一个小卒子。"
 sakuya_superdip_insult_11: "咲夜说：\N你的恶行从爱尔兰到契丹无人不知，无人不晓。"
 sakuya_superdip_insult_12: "咲夜说：\N贵国统治者逻辑能力堪比成年香蕉，\N倒是在随地大小便领域才高八斗。"
 sakuya_superdip_insult_13: "咲夜说：\N祝贵国满天都是扫把星。"
 sakuya_superdip_insult_14: "咲夜说：\N当你国出现在地图上时，\N那地图就再也不能称为艺术品了。"
 sakuya_superdip_insult_15: "咲夜说：\N我不明白你为什么喜欢在外交晚宴上当一个丑角。\N是为了寻找自己的存在的意义，\N还是为了娱乐大众？"
