 notification_sakuya_superdip_force_join_power_bloc_toast_tooltip: "#header $notification_sakuya_superdip_force_join_power_bloc_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_force_join_power_bloc_toast_desc$"
 sakuya_superdip.3.t: "咲夜蛊惑了[SCOPE.sCountry('sakuya_superdip_target_country').GetName]的[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]"
 sakuya_superdip.3.d: "咲夜在一场私人会谈中说服了[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]重新审视与[SCOPE.sCountry('sakuya_superdip_actor_country').GetName]的关系。"
 sakuya_superdip.3.f: "会谈结束时，[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]已经将原先准备好的强硬照会收回抽屉，并主动要求安排下一次会面。咲夜只是平静地合上怀表，仿佛一切本该如此。"
 sakuya_superdip.3.a: "很好。"
