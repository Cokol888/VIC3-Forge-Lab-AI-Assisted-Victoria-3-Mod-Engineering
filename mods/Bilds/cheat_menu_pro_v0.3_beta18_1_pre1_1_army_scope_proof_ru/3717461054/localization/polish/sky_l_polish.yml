 SKY_B1_TT_CONSTRUCTION_PERCENT_TBC: "#BOLD Szybka budowa +#!\n$SKY_line$\nTa opcja jest obecnie niedostępna. Proszę skorzystać z przycisku „Możliwości budowlane” znajdującego się obok."
 SKY_B1_TT_FAST_CONSTRUCTION_LIMIT: "#BOLD Moc budowania i przydział dla budownictwa prywatnego #!\n$SKY_line$\n$SKY_LC$ Moc budowania +9999999. \n$SKY_CL$ Przydział dla budownictwa prywatnego +1000%. \n$SKY_RC$ Przydział na budowę prywatną #n - #!10000%."
 SKY_B1_TT_TREASURY_CAP_QUICK: "#BOLD $concept_gold_reserves$#!\n$SKY_line$\n$SKY_LC$ Zwiększenie @money!o 100% górnej granicy $concept_gold_reserves$. \n$SKY_SL$ Zwiększenie @money!o 20% górnego limitu $concept_gold_reserves$. \n$SKY_AL$ Zmniejszenie @money!o 100% górnego limitu $concept_gold_reserves$. \n$SKY_CL$ $SKY_MARKED_COUNTRY$Zmniejszenie @money!o 100% górnego limitu $concept_gold_reserves$. \n$SKY_RC$ Zwiększenie @money!o 99,999% górnego limitu $concept_gold_reserves$. \n$SKY_line$\nBardziej szczegółowe zmiany można wprowadzić na stronie Ekonomia."
 SKY_B1_TT_BIRTH_RATE_V2: "#BOLD $SKY_B1_R2_C2$#!\n$SKY_line$\n$SKY_LC$ +100% przez 1 rok. \n$SKY_SL$ +3000% przez 1 rok. \n$SKY_AL$ +5%. \n$SKY_CL$ #n - #!100% przez 1 rok. \n$SKY_RC$ Wyczyść. \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_BIRTH_RATE_PLUS: "#BOLD $SKY_B1_R2_C2$ + #!\n$SKY_line$\n$SKY_LC$ +500% przez 1 rok. \n$SKY_SL$ #n - #!2000% przez 1 rok. \n$SKY_AL$ #n - #!20% przez 1 rok. \n$SKY_CL$ +10000% przez 1 rok. \n$SKY_RC$ +99999% przez 1 miesiąc. \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_INTEGRATE_ALL: "#BOLD Państwa członkowskie#!\n$SKY_line$\n$SKY_LC$ Uwzględnij wszystkie $SKY_SELF_COUNTRY$ stany.\n$SKY_SL$ Szybkość rejestracji +100%.\n$SKY_AL$ Szybkość tworzenia jednostek +5%.\n$SKY_CL$ Szybkość rejestracji #n -#!100%.\n$SKY_RC$ Wyczyść modyfikator prędkości włączania.\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_CLEAN_POLLUTION: "#BOLD Zwalczaj zanieczyszczenie środowiska#!\n$SKY_line$\n$SKY_LC$ Ograniczyć zanieczyszczenie we wszystkich $SKY_SELF_COUNTRY$ stany.\n$SKY_SL$ Wpływ zanieczyszczeń #n -#!100%.\n$SKY_AL$ Wpływ zanieczyszczeń #n -#!5%.\n$SKY_CL$ Wpływ zanieczyszczenia +100%.\n$SKY_RC$ Usuń modyfikator wpływu zanieczyszczenia.\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_THROUGHPUT_ALL: "#BOLD Przepustowość#!\n$SKY_line$\n$SKY_LC$ Wszystkie $SKY_SELF_COUNTRY$ wzrost o 20%.\n$SKY_SL$ Wszystkie $SKY_SELF_COUNTRY$ wzrost o 1000%.\n$SKY_AL$ Wszystkie $SKY_SELF_COUNTRY$ wzrost o 5%.\n$SKY_CL$ Wszystkie $SKY_SELF_COUNTRY$ stany #n -#!20%.\n$SKY_RC$ Jasne.\n$SKY_line$\n$SKY_stackable$"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_BREAK_FREE: "#T $ai_strategy_subject_break_free$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ zmieni swoją strategię na obecnie wybraną.\N\N#lore $SKY_TARGET_COUNTRY$ chce uniezależnić się od swojego $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_STRENGTHEN_SELF: "#T $ai_strategy_subject_strengthen_self$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ zmieni swoją strategię na obecnie wybraną.\N\N#lore $SKY_TARGET_COUNTRY$ chce zwiększyć $concept_autonomy$ i zmniejszyć zależność od $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_MAINTAIN_AUTONOMY: "#T $ai_strategy_subject_maintain_autonomy$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ zmieni swoją strategię na obecnie wybraną.\N\N#lore $SKY_TARGET_COUNTRY$ chce utrzymać obecny $concept_autonomy$ w ramach $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_OVERLORD_COMPLIANCE: "#T $ai_strategy_subject_overlord_compliance$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ zmieni swoją strategię na obecnie wybraną.\N\N#lore $SKY_TARGET_COUNTRY$ chce ściślejszej integracji ze swoim $concept_overlord$ i będziemy wiernie przestrzegać zawartych w nim wskazówek.#!"
