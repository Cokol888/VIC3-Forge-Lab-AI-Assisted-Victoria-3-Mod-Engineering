 SKY_B2_ECON_TT_MARKED_FINE: "#BOLD $SKY_MARKED_COUNTRY$#!\n$SKY_line$\n$SKY_LC$ Zastosuj te sama wartosc.\n$SKY_SL$ Zastosuj wieksza wartosc.\n$SKY_AL$ Zastosuj mala wartosc.\n$SKY_CL$ Zastosuj wartosc przeciwna.\n$SKY_RC$ Zastosuj wartosc przeciwna.\n$SKY_line$\n#lore Najpierw oznacz kraj docelowy.#!"
