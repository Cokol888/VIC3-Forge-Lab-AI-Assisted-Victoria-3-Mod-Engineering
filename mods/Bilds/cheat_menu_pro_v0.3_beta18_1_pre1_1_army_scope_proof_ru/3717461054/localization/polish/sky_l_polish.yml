 SKY_1_2_B7_TT_ACQUIRE_TREATY_PORT_DISABLED: "#BOLD $SKY_B7_ACQUIRE_TREATY_PORT$#!\n$SKY_line$\nNajpierw musisz zaznaczyć jeden z naszych stanów albo jeden stan zagraniczny.\n\nAby jeden z naszych stanów stał się obcym państwem $concept_treaty_port$: wybierz jeden z naszych stanów, wprowadź #T $decree_sakuya_mark_state$#! rozporządzenie, a następnie użyj #T $sakuya_mark_country$#! działania dyplomatyczne wobec danego kraju.\n\nAby uzyskać $concept_treaty_port$ z innego kraju: kliknij prawym przyciskiem myszy na wybrany kraj, wybierz #T $sakuya_mark_country$#! w sekcji „Działania dyplomatyczne”, a następnie wybierz #T $sakuya_mark_foreign_state$#!."
 SKY_1_2_B7_TT_CEDE_HOME_STATE_DISABLED: "#BOLD $SKY_B7_CEDE_HOME_STATE$#!\n$SKY_line$\nWybierz jeden z naszych stanów i wprowadź #T $decree_sakuya_mark_state$#! wydać odpowiedni dekret; następnie skorzystać z #T $sakuya_mark_country$#! działania dyplomatyczne wobec danego kraju."
 SKY_1_2_B7_TT_TAKE_FOREIGN_STATE_DISABLED: "#BOLD $SKY_B7_TAKE_FOREIGN_STATE$#!\n$SKY_line$\nNależy zaznaczyć zarówno kraj, jak i miasto w tym kraju.\n\nKliknij prawym przyciskiem myszy kraj, który chcesz zaznaczyć, a następnie wybierz #T $sakuya_mark_country$#! w sekcji „Działania dyplomatyczne”, a następnie wybierz #T $sakuya_mark_foreign_state$#!."
