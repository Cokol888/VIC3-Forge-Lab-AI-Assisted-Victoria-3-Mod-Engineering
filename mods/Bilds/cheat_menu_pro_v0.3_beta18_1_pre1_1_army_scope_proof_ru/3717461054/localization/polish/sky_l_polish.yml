 SKY_B7_TT_SUBJECTS_LIBERTY_DESIRE: "#BOLD $concept_liberty_desire$ wszystkich państw zależnych#!\n$SKY_line$\n$SKY_LC$ Wszystkie państwa zależne $SKY_SELF_COUNTRY$: -20 $concept_liberty_desire$\n$SKY_RC$ Wszystkie państwa zależne $SKY_SELF_COUNTRY$: +20 $concept_liberty_desire$\n$SKY_AL$ Wszystkie państwa zależne $SKY_SELF_COUNTRY$: -5 $concept_liberty_desire$\n$SKY_CL$ Jeśli $SKY_MARKED_COUNTRY$ istnieje, wszystkie państwa zależne $SKY_TARGET_COUNTRY$: -20 $concept_liberty_desire$\n$SKY_SL$ Jeśli $SKY_MARKED_COUNTRY$ istnieje, wszystkie państwa zależne $SKY_TARGET_COUNTRY$: +20 $concept_liberty_desire$"
 SKY_B7_TT_SUBJECTS_LIBERTY_MOD: "#BOLD $concept_liberty_desire$ $concept_modifier$ państw zależnych#!\n$SKY_line$\n$SKY_LC$ Dodaj -20 $concept_liberty_desire$ $concept_modifier$ państw zależnych do $SKY_SELF_COUNTRY$.\n$SKY_SL$ Dodaj +20 $concept_liberty_desire$ $concept_modifier$ państw zależnych do $SKY_SELF_COUNTRY$.\n$SKY_AL$ Dodaj -5 $concept_liberty_desire$ $concept_modifier$ państw zależnych do $SKY_SELF_COUNTRY$.\n$SKY_CL$ Jeśli $SKY_MARKED_COUNTRY$ istnieje, dodaj -20 $concept_liberty_desire$ $concept_modifier$ państw zależnych do $SKY_TARGET_COUNTRY$.\n$SKY_RC$ Usuń $concept_liberty_desire$ $concept_modifier$ państw zależnych z tego małego przycisku."
