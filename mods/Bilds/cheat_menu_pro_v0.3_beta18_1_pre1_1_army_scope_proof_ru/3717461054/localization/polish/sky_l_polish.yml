 SKY_B3_TRAIT_GROUP_GENERAL: "Dowodca"
 SKY_B3_TRAIT_GROUP_EXECUTIVE: "Dyrektor $concept_company$"
 SKY_B3_TRAIT_GROUP_BAD_RULER: "Zly wladca"
 SKY_B3_TRAIT_GROUP_AGITATOR: "Agitator"
 SKY_B3_TRAIT_GROUP_RULER: "Wladca"
 SKY_B3_TRAIT_GROUP_ALL_ROUNDER: "Wszechstronny"
 SKY_B3_TRAIT_GROUP_TT_GENERAL: "#BOLD Dowodca#!\n$SKY_line$\n$SKY_LC$ Dodaje pelny zestaw cech odpowiednich do dowodzenia wojskowego.\n$SKY_RC$ Usuwa ten zestaw cech.\n$SKY_line$\nSkupia sie na armii, marynarce, terenie, artylerii, ataku, obronie, zaopatrzeniu, lupieniu i dowodzeniu flota."
 SKY_B3_TRAIT_GROUP_TT_EXECUTIVE: "#BOLD Dyrektor $concept_company$#!\n$SKY_line$\n$SKY_LC$ Dodaje pelny zestaw cech odpowiednich do zarzadzania $concept_company$ i przemyslem.\n$SKY_RC$ Usuwa ten zestaw cech.\n$SKY_line$\nSkupia sie na przepustowosci, zarzadzaniu, przedsiebiorczosci, inzynierii i administracji przemyslowej."
 SKY_B3_TRAIT_GROUP_TT_BAD_RULER: "#BOLD Zly wladca#!\n$SKY_line$\n$SKY_LC$ Dodaje pelny zestaw cech odpowiednich dla katastrofalnego wladcy.\n$SKY_RC$ Usuwa ten zestaw cech.\n$SKY_line$\nObejmuje arogancje, gniew, okrucienstwo, luksus, oszustwo, uzaleznienie, nieudolnosc i inne szkodliwe nawyki rzadzenia."
 SKY_B3_TRAIT_GROUP_TT_AGITATOR: "#BOLD Agitator#!\n$SKY_line$\n$SKY_LC$ Dodaje pelny zestaw cech odpowiednich do agitacji politycznej.\n$SKY_RC$ Usuwa ten zestaw cech.\n$SKY_line$\nSkupia sie na charyzmie, atrakcyjnosci, organizacji politycznej, przemowieniach, agitacji i ruchach spolecznych."
 SKY_B3_TRAIT_GROUP_TT_RULER: "#BOLD Wladca#!\n$SKY_line$\n$SKY_LC$ Dodaje pelny zestaw cech odpowiednich do rzadzenia krajem.\n$SKY_RC$ Usuwa ten zestaw cech.\n$SKY_line$\nSkupia sie na dyplomacji, administracji, koloniach, organizacji politycznej, prestizu i zarzadzaniu panstwem."
 SKY_B3_TRAIT_GROUP_TT_ALL_ROUNDER: "#BOLD Wszechstronny#!\n$SKY_line$\n$SKY_LC$ Dodaje pelny zestaw szeroko uzytecznych cech.\n$SKY_RC$ Usuwa ten zestaw cech.\n$SKY_line$\nLaczy typowe atuty przydatne w rzadzeniu, firmach, polityce, dyplomacji, armii i marynarce."

