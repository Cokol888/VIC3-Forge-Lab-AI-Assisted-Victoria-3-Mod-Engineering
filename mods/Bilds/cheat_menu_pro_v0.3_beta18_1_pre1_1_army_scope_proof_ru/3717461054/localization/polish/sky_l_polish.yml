 sakuya_superdip_humiliate_01: "Niech Sakuya upokorzy ten kraj."
 sakuya_superdip_humiliate_01_action_name: "Niech Sakuya upokorzy ten kraj."
 sakuya_superdip_humiliate_01_desc: "Wyślesz Sakuya na kolację z ambasadorem tego kraju w imieniu naszych władców."
 sakuya_superdip_humiliation_pact_01: "$humiliation$"
 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "Sakuya poniża dany kraj poprzez zorganizowanie kolacji dyplomatycznej o wysoce niestosownym charakterze, szkodząc w ten sposób jego reputacji na arenie międzynarodowej. Czas trwania: 5 lat."
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] zostaje upokorzony przez Sakuya, którą wysłał [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]. Okres obowiązywania: 5 lat."
 sakuya_superdip_humiliation_pact_01_effect_desc_global: "Zawrzeć pakt o upokorzeniu Sakuya"
 sakuya_superdip_humiliation_pact_01_effect_desc_first: "[COUNTRY.GetNameNoFlag] przynosi Sakuya wstyd [TARGET_COUNTRY.GetName] przez 5 lat"
 sakuya_superdip_humiliation_pact_01_effect_desc_third: "[COUNTRY.GetName] przynosi Sakuya wstyd [TARGET_COUNTRY.GetName] przez 5 lat"
 sakuya_superdip.1.t: "Sakuya zabiera głos podczas dyplomatycznej kolacji!"
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName] panuje chaos, gdy Sakuya zaczyna się bić z funkcjonariuszami z [SCOPE.sCountry('sakuya_superdip_target_country').GetName] podczas kolacji."
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] próbował zrzucić na Sakuya ławkę, ale ona zręcznie się odsunęła, chwyciła kawałek ciasta ze stołu i rzuciła nim w [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]na głowie. \N\N\"#lore Stary głupcze… Chciałeś mnie zaskoczyć? #!\""
 sakuya_superdip.1.a: "Dobre besztanie!"
 sakuya_superdip.1.b: "Dołączę się z kilkoma przekleństwami..."
 sakuya_superdip.1.c: "Sakuya-sensei, nie rób tego..."
 sakuya_superdip.1.c_desc: "Po [SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName] Chociaż wszyscy usilnie próbowali ją powstrzymać, Sakuya Izayoi na chwilę odłożyła swoje srebrne noże, po czym upiła łyk wina, zachowując jak zawsze spokój."
 notification_sakuya_superdip_humiliation_toast_name: "Sakuya została poniżona z pogardą [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "Sakuya przekazała władcy [SCOPE.sCountry('target').GetName], [SCOPE.sCountry('target').GetRuler.GetFullName], notę dyplomatyczną o niezwykłym wyrafinowaniu kulturowym. Z jakiegoś powodu odczytali ją jako #BOLD zniewagę#!. Bawiła nas ich wulgarność; oni wydawali się raczej niezadowoleni. Stosunki dyplomatyczne między [SCOPE.sCountry('actor').GetName] i [SCOPE.sCountry('target').GetName] wydają się pogorszone."
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "Sakuya mówi:\NTwoja mama była chomikiem,\Na twój tata pachnie bzem!"
 sakuya_superdip_insult_02: "Sakuya mówi:\NZbliża się dzień sądu ostatecznego!\NSługusy Lucyfera krążą po ziemi—\NO nie, to tylko przedstawiciel twojego kraju."
 sakuya_superdip_insult_03: "Sakuya mówi:\NCo więcej, uważam, że wasz kapitał musi zostać zniszczony!"
 sakuya_superdip_insult_04: "Sakuya mówi:\NKiedy przyszłe pokolenia będą pisać historię naszych czasów,\Nbędą patrzeć na ciebie z tą mieszanką litości i obrzydzenia, którą nazywa się współczuciem."
 sakuya_superdip_insult_05: "Sakuya mówi:\NMoja ostatnia wizyta w toalecie była o wiele przyjemniejsza niż kolacja z waszym ambasadorem."
 sakuya_superdip_insult_06: "Sakuya mówi:\NO, spójrz.\NMamy tu trochę uroczej nieprzyzwoitości."
 sakuya_superdip_insult_07: "Sakuya mówi:\NTwoja krew sprawi, że ziemia, którą od ciebie zabiorę, stanie się jeszcze żyzniejsza."
 sakuya_superdip_insult_08: "Sakuya mówi:\NNudne spotkania dyplomatyczne zawsze potrzebują jakiegoś „czarnego charakteru”, żeby je ożywić.\NA ty, mój przyjacielu, jesteś najwspanialszym sumem ze wszystkich!"
 sakuya_superdip_insult_09: "Sakuya mówi:\NDlaczego w twoim kraju sprawy zawsze mają się tak fatalnie?\NPodejrzewam, że to wasza wina."
 sakuya_superdip_insult_10: "Sakuya mówi:\NW tej wspaniałej grze, w którą gramy,\Njesteś tylko pionkiem."
 sakuya_superdip_insult_11: "Sakuya mówi:\NOpowieści o twoich wybrykach krążą od Irlandii aż po Kataj."
 sakuya_superdip_insult_12: "Sakuya mówi:\NTwój władca ma zdolność logicznego myślenia na poziomie dojrzałego banana,\Nale prawdziwy geniusz przejawia w publicznym wypróżnianiu się."
 sakuya_superdip_insult_13: "Sakuya mówi:\NNiech twoje niebo wypełni się kometami."
 sakuya_superdip_insult_14: "Sakuya mówi:\NŻadna mapa nie może być dziełem sztuki\No ile wasz kraj się w tym znajduje."
