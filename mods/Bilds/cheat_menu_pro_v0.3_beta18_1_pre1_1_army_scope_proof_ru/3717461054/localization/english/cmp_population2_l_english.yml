 CMP_POP2_ADD:0 "Add population"
 CMP_POP2_REMOVE:0 "Remove population"
 CMP_POP2_TT_ADD:0 "Creates the selected number of peasants in every target state. New cohorts receive 80% literacy and peasant qualification."
 CMP_POP2_TT_REMOVE:0 "REMOVES the selected absolute number of people per target state via kill_population_in_state."
 CMP_POP2_LITERACY_TITLE:0 "Literacy — exact value"
