l_english:
 CMP_TR_HEADER: "Tech & Res — geology and regional presets"
 CMP_TR_TT_RESOURCE_CATEGORY: "#BOLD Resources#!\nUse the explicit Standard and T&R buttons in the resource category selector."
 CMP_TR_TIER_HINT: "Geology tier: the number on a button is the exact resource potential. LMB = player marked states, Alt+LMB = all incorporated states, RMB = marked-country states."
 CMP_TR_RESOURCE_ADD: "ADD"
 CMP_TR_RESOURCE_SET: "SET"
 CMP_TR_RESOURCE_CLEAR: "CLEAR"
 CMP_TR_TT_NUMERIC_ADD: "#BOLD ADD resource potential#!\nAdds the selected slider value to existing potential. If the resource is absent, creates it with that value."
 CMP_TR_TT_NUMERIC_SET: "#BOLD SET resource potential#!\nReplaces existing potential with the exact selected slider value. 0 removes the potential."
 CMP_TR_TT_NUMERIC_CLEAR: "#BOLD CLEAR resource potential#!\nRemoves the selected resource potential regardless of the slider value."
 CMP_TR_TT_GEO_ADD: "#BOLD ADD Tech & Res geology#!\nAdds the selected official Tech & Res amount. Geological state traits are not changed, because accumulated potential may no longer match a canonical tier."
 CMP_TR_TT_GEO_SET: "#BOLD SET Tech & Res geology#!\nSets the exact official Tech & Res amount and synchronizes the matching geological state trait."
 CMP_TR_TT_GEO_CLEAR: "#BOLD CLEAR Tech & Res geology#!\nRemoves the resource potential and all geological traits associated with this Tech & Res resource."
 CMP_TR_TIER_1: "Tier 1"
 CMP_TR_TT_TIER_1: "Select Tech & Res geology tier 1. The button shows the exact potential for the selected resource."
 CMP_TR_TIER_2: "Tier 2"
 CMP_TR_TT_TIER_2: "Select Tech & Res geology tier 2. The button shows the exact potential for the selected resource."
 CMP_TR_TIER_3: "Tier 3"
 CMP_TR_TT_TIER_3: "Select Tech & Res geology tier 3. The button shows the exact potential for the selected resource."
 CMP_TR_TIER_4: "Tier 4"
 CMP_TR_TT_TIER_4: "Select Tech & Res geology tier 4. The button shows the exact potential for the selected resource."
 CMP_TR_TIER_5: "Tier 5"
 CMP_TR_TT_TIER_5: "Select Tech & Res geology tier 5. The button shows the exact potential for the selected resource."
 CMP_TR_PRESET_MINING: "Mining Hub"
 CMP_TR_PRESET_ADVANCED: "Advanced Hub"
 CMP_TR_PRESET_ENERGY: "Energy Hub"
 CMP_TR_PRESET_NUCLEAR: "Nuclear Hub"
 CMP_TR_TT_PRESET_MINING: "#BOLD Balanced Mining Hub#!\nSET Copper 50 + Bauxite 50 + Common Ores 50 and synchronize medium geology traits."
 CMP_TR_TT_PRESET_ADVANCED: "#BOLD Balanced Advanced Hub#!\nSET Advanced Ores 80 + Rare Earths 55 and synchronize medium geology traits."
 CMP_TR_TT_PRESET_ENERGY: "#BOLD Balanced Energy Hub#!\nSET Natural Gas 50 + Water 20 and synchronize medium/moderate geology traits."
 CMP_TR_TT_PRESET_NUCLEAR: "#BOLD Balanced Nuclear Hub#!\nSET Uranium 45 + Water 20 and synchronize medium/moderate geology traits."
