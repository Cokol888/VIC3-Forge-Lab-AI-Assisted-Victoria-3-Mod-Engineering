 SKY_B6_TT_PRINCIPLE_NAVY: "#BOLD $principle_group_navy$#!\n\n$SKY_LC$ $SKY_R5_ADD_LV3$$principle_group_navy$\n$SKY_SL$ $SKY_R5_ADD_LV2$$principle_group_navy$\n$SKY_AL$ $SKY_R5_ADD_LV1$$principle_group_navy$\n$SKY_RC$ $SKY_R5_REMOVE_ALL_LV$\n\n#lore $principle_group_navy_desc$#!"
 SKY_B7_TT_SUBJECTS_LIBERTY_DESIRE: "#BOLD All Subjects' $concept_liberty_desire$#!\n$SKY_line$\n$SKY_LC$ All subjects of $SKY_SELF_COUNTRY$: -20 $concept_liberty_desire$\n$SKY_RC$ All subjects of $SKY_SELF_COUNTRY$: +20 $concept_liberty_desire$\n$SKY_AL$ All subjects of $SKY_SELF_COUNTRY$: -5 $concept_liberty_desire$\n$SKY_CL$ If $SKY_MARKED_COUNTRY$ exists, all subjects of $SKY_TARGET_COUNTRY$: -20 $concept_liberty_desire$\n$SKY_SL$ If $SKY_MARKED_COUNTRY$ exists, all subjects of $SKY_TARGET_COUNTRY$: +20 $concept_liberty_desire$"
 SKY_B7_TT_SUBJECTS_LIBERTY_MOD: "#BOLD Subject $concept_liberty_desire$ $concept_modifier$#!\n$SKY_line$\n$SKY_LC$ Add -20 subject $concept_liberty_desire$ $concept_modifier$ to $SKY_SELF_COUNTRY$.\n$SKY_SL$ Add +20 subject $concept_liberty_desire$ $concept_modifier$ to $SKY_SELF_COUNTRY$.\n$SKY_AL$ Add -5 subject $concept_liberty_desire$ $concept_modifier$ to $SKY_SELF_COUNTRY$.\n$SKY_CL$ If $SKY_MARKED_COUNTRY$ exists, add -20 subject $concept_liberty_desire$ $concept_modifier$ to $SKY_TARGET_COUNTRY$.\n$SKY_RC$ Remove this small button's subject $concept_liberty_desire$ $concept_modifier$."
