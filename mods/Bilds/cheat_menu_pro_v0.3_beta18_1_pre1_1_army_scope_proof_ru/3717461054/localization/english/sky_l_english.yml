 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Target: our primary cultures#!\n\n$SKY_LC$ If a country is marked: add all target country primary cultures to our primary cultures\n$SKY_RC$ If we have a marked $concept_state$: add the homeland cultures of that $concept_state$ to our primary cultures\n$SKY_SL$ If a country is marked and the target country has a marked $concept_state$: add the homeland cultures of that $concept_state$ to our primary cultures\n$SKY_CL$ If a $concept_character$ is marked: add that character’s culture to our primary cultures"
 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Target: target country primary cultures#!\n\n$SKY_LC$ If a country is marked: add all our primary cultures to the target country’s primary cultures\n$SKY_RC$ If we have a marked $concept_state$: add the homeland cultures of that $concept_state$ to the target country’s primary cultures\n$SKY_SL$ If the target country has a marked $concept_state$: add the homeland cultures of that $concept_state$ to the target country’s primary cultures\n$SKY_CL$ If a $concept_character$ is marked: add that character’s culture to the target country’s primary cultures"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Target: our primary cultures#!\n\n$SKY_LC$ If a country is marked: remove all target country primary cultures from our primary cultures\n$SKY_RC$ If we have a marked $concept_state$: remove the homeland cultures of that $concept_state$ from our primary cultures\n$SKY_SL$ If a country is marked and the target country has a marked $concept_state$: remove the homeland cultures of that $concept_state$ from our primary cultures\n$SKY_CL$ If a $concept_character$ is marked: remove that character’s culture from our primary cultures\n$SKY_line$\n#n Warning: this will not remove a country’s last primary culture. Do not leave any country with no primary culture, or the save may be damaged.#!"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Target: target country primary cultures#!\n\n$SKY_LC$ If a country is marked: remove all our primary cultures from the target country’s primary cultures\n$SKY_RC$ If we have a marked $concept_state$: remove the homeland cultures of that $concept_state$ from the target country’s primary cultures\n$SKY_SL$ If the target country has a marked $concept_state$: remove the homeland cultures of that $concept_state$ from the target country’s primary cultures\n$SKY_CL$ If a $concept_character$ is marked: remove that character’s culture from the target country’s primary cultures\n$SKY_line$\n#n Warning: this will not remove a country’s last primary culture. Do not leave any country with no primary culture, or the save may be damaged.#!"
