SKY_1_1_B6_BUILD_TT_CONFIRM: "#BOLD Add Building#!\n\n$SKY_LC$ Add a building in your marked $concept_state$s.\n$SKY_AL$ Add a building in all incorporated $concept_state$s of your country.\n$SKY_RC$ Add a building in marked states of the marked country.\n$SKY_line$\n0 removes it. Positive values add or increase it."
SKY_1_1_B6_BUILD_TT_RESOURCE_POTENTIAL: "#BOLD Add Resource Potential#!\n\n$SKY_LC$ Add resource potential in your marked $concept_state$s.\n$SKY_AL$ Add resource potential in all incorporated $concept_state$s of your country.\n$SKY_RC$ Add resource potential in marked states of the marked country.\n$SKY_line$\n0 removes it. Positive values add or increase it."
SKY_1_1_B6_TT_RESERVED_BUILD_R1_C2: "#BOLD Selected Building Input Needs#!\n\nApplies to the currently selected building in your marked state.\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!99%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ #n -#!10%\n$SKY_RC$ Clear this group and the plus button."
