 SKY_B3_CHAR_TT_FX_SET_ADULT: "#BOLD Set Adult#!\n\n$SKY_LC$ Set the currently marked $concept_character$ as adult.\n$SKY_line$\n#italic If the target is already adult, the button is unavailable and the effect will not execute again.#!"
