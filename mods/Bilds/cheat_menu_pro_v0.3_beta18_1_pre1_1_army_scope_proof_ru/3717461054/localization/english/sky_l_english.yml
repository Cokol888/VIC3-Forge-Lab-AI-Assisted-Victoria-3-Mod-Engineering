 SKY_B1_TT_SUPER_RIGHT_CLICK: "#BOLD $SKY_B1_SUPER_RIGHT_CLICK$#!\n$SKY_line$\n$SKY_LC$ Open. \n$SKY_RC$ Close. \N\N#LORE Once activated, remember to unpause the game, it will refresh the state the next day. Then right click on any country to see additional diplomatic actions such as #t $sakuya_superdip_humiliate_01$#!."
 SKY_B1_TT_POWER_PERCENT_PLUS: "$SKY_LC$ $SKY_SELF_COUNTRY$ +25% \n$SKY_SL$ $SKY_SELF_COUNTRY$ +100% \n$SKY_AL$ $SKY_SELF_COUNTRY$ #n - #!100% \n$SKY_CL$ $SKY_MARKED_COUNTRY$ +25% \n$SKY_RC$ $SKY_MARKED_COUNTRY$ #n - #!25% \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_CONSTRUCTION_PERCENT_TBC: "#BOLD Quick Construction +#!\n$SKY_line$\nThis is currently unavailable. Please use the Construction Capacity button next to it."
 SKY_B1_TT_FAST_CONSTRUCTION_LIMIT: "#BOLD Build Power and Private Construction Allocation #!\n$SKY_line$\n$SKY_LC$ Build Power +9999999. \n$SKY_CL$ Private Construction Allocation +1000%. \n$SKY_RC$ Private Construction Allocation #n - #!10000%."
 SKY_B1_TT_TREASURY_CAP_QUICK: "#BOLD $concept_gold_reserves$#!\n$SKY_line$\n$SKY_LC$ Increase @money!by 100% of the $concept_gold_reserves$limit. \n$SKY_SL$ Increase @money!by 20% of the upper limit of $concept_gold_reserves$. \n$SKY_AL$ Decrease @money!by 100% of the upper limit of $concept_gold_reserves$. \n$SKY_CL$ $SKY_MARKED_COUNTRY$Decrease @money!by 100% of the upper limit of $concept_gold_reserves$. \n$SKY_RC$ Increase @money!by 99,999% of the upper limit of $concept_gold_reserves$. \n$SKY_line$\nMore detailed adjustments can be made on the Economy page."
 SKY_B1_TT_BIRTH_RATE_V2: "#BOLD $SKY_B1_R2_C2$#!\n$SKY_line$\n$SKY_LC$ +100% for 1 year. \n$SKY_SL$ +3000% for 1 year. \n$SKY_AL$ +5%. \n$SKY_CL$ #n - #!100% for 1 year. \n$SKY_RC$ Clear. \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_BIRTH_RATE_PLUS: "#BOLD $SKY_B1_R2_C2$ + #!\n$SKY_line$\n$SKY_LC$ +500% for 1 year. \n$SKY_SL$ #n - #!2000% for 1 year. \n$SKY_AL$ #n - #!20% for 1 year. \n$SKY_CL$ +10000%, lasts 1 year. \n$SKY_RC$ +99999%, lasts 1 month. \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_INTEGRATE_ALL: "#BOLD Integrate States#!\n$SKY_line$\n$SKY_LC$ Incorporate all $SKY_SELF_COUNTRY$ states.\n$SKY_SL$ Incorporation speed +100%.\n$SKY_AL$ Incorporation speed +5%.\n$SKY_CL$ Incorporation speed #n -#!100%.\n$SKY_RC$ Clear the incorporation speed modifier.\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_CLEAN_POLLUTION: "#BOLD Clean Up Pollution#!\n$SKY_line$\n$SKY_LC$ Reduce pollution in all $SKY_SELF_COUNTRY$ states.\n$SKY_SL$ Pollution impact #n -#!100%.\n$SKY_AL$ Pollution impact #n -#!5%.\n$SKY_CL$ Pollution impact +100%.\n$SKY_RC$ Clear the pollution impact modifier.\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_THROUGHPUT_ALL: "#BOLD Throughput#!\n$SKY_line$\n$SKY_LC$ All $SKY_SELF_COUNTRY$ states +20%.\n$SKY_SL$ All $SKY_SELF_COUNTRY$ states +1000%.\n$SKY_AL$ All $SKY_SELF_COUNTRY$ states +5%.\n$SKY_CL$ All $SKY_SELF_COUNTRY$ states #n -#!20%.\n$SKY_RC$ Clear.\n$SKY_line$\n$SKY_stackable$"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_BREAK_FREE: "#T $ai_strategy_subject_break_free$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ will change its strategy to the currently selected strategy.\N\N#lore $SKY_TARGET_COUNTRY$ wants to gain independence from its $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_STRENGTHEN_SELF: "#T $ai_strategy_subject_strengthen_self$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ will change its strategy to the currently selected strategy.\N\N#lore $SKY_TARGET_COUNTRY$ wants to increase $concept_autonomy$ and reduce dependence on its $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_MAINTAIN_AUTONOMY: "#T $ai_strategy_subject_maintain_autonomy$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ will change its strategy to the currently selected strategy.\N\N#lore $SKY_TARGET_COUNTRY$ wants to maintain its current $concept_autonomy$ under its $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_OVERLORD_COMPLIANCE: "#T $ai_strategy_subject_overlord_compliance$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ will change its strategy to the currently selected strategy.\N\N#lore $SKY_TARGET_COUNTRY$ wants closer integration with its $concept_overlord$ and will faithfully follow its instructions.#!"
