 SKY_B6_POPMIG_TT_NATIONAL: "#BOLD $SKY_B6_POPMIG_NATIONAL$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Move 20% of $SKY_MARKED_COUNTRY$ population to incorporated $concept_state$s of $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nA country must be marked first.\N#lore Each pop will try to be randomly distributed to eligible states. Same below.#!"
 SKY_B6_POPMIG_TT_NATIONAL_REV: "#BOLD $SKY_B6_POPMIG_NATIONAL$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Move 20% of $SKY_SELF_COUNTRY$ population to incorporated $concept_state$s of $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nA country must be marked first."
 SKY_B6_POPMIG_TT_TO_STATE: "#BOLD $SKY_B6_POPMIG_TO_STATE$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Move 20% of $SKY_MARKED_COUNTRY$ population to marked $concept_state$s of $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nRequires a country to be marked first, and at least one $concept_state$ marked in $SKY_SELF_COUNTRY$."
 SKY_B6_POPMIG_TT_TO_STATE_REV: "#BOLD $SKY_B6_POPMIG_TO_STATE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Move 20% of $SKY_SELF_COUNTRY$ population to marked $concept_state$s of $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nRequires a country to be marked first, and at least one $concept_state$ marked in that country."
 SKY_B6_POPMIG_TT_SAME_CULTURE: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Move 20% of the population in $SKY_MARKED_COUNTRY$ belonging to $SKY_SELF_COUNTRY$ primary cultures to marked $concept_state$s of $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_SAME_CULTURE_REV: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nMove the population in $SKY_SELF_COUNTRY$ belonging to $SKY_MARKED_COUNTRY$ primary cultures to $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, distributed to target country incorporated $concept_state$s.\n$SKY_AL$ 5%, distributed to target country incorporated $concept_state$s.\n$SKY_CL$ 50%, distributed to target country incorporated $concept_state$s.\n$SKY_SL$ 33%, moved to target country marked $concept_state$s.\n$SKY_RC$ 100%, distributed to target country incorporated $concept_state$s."
 SKY_B6_POPMIG_TT_NON_PRIMARY: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nMove non-primary-culture population of $SKY_SELF_COUNTRY$ to $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, distributed to target country incorporated $concept_state$s.\n$SKY_AL$ 5%, distributed to target country incorporated $concept_state$s.\n$SKY_CL$ 50%, distributed to target country incorporated $concept_state$s.\n$SKY_SL$ 33%, moved to target country marked $concept_state$s.\n$SKY_RC$ 100%, distributed to target country incorporated $concept_state$s."
 SKY_B6_POPMIG_TT_NON_PRIMARY_REV: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Move 20% of $SKY_MARKED_COUNTRY$ non-primary-culture population to marked $concept_state$s of $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_POINT: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Move 20% of the population in marked $concept_state$s of $SKY_MARKED_COUNTRY$ to marked $concept_state$s of $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n It is recommended that both sides mark only one state. If multiple states are marked, the script will randomly choose a target from eligible states.#!"
 SKY_B6_POPMIG_TT_POINT_REV: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Move 20% of the population in marked $concept_state$s of $SKY_SELF_COUNTRY$ to marked $concept_state$s of $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n It is recommended that both sides mark only one state. If multiple states are marked, the script will randomly choose a target from eligible states.#!"
 SKY_B6_POPMIG_TT_LOW_ACCEPTANCE: "#BOLD $SKY_B6_POPMIG_LOW_ACCEPTANCE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nMove the population in the two lowest acceptance levels of $SKY_SELF_COUNTRY$ to $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, distributed to target country incorporated $concept_state$s.\n$SKY_AL$ 5%, distributed to target country incorporated $concept_state$s.\n$SKY_CL$ 50%, distributed to target country incorporated $concept_state$s.\n$SKY_SL$ 33%, moved to target country marked $concept_state$s.\n$SKY_RC$ 100%, distributed to target country incorporated $concept_state$s.\n\nRequires a country to be marked first. $SKY_SL$ also requires at least one $concept_state$ marked in that country."
