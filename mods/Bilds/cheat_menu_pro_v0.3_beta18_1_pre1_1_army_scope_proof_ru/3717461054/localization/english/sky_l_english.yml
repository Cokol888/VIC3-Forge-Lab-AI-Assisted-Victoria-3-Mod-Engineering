 SKY_B3_TT_GOODS_SELECTED_TAX: "#BOLD Selected Goods Consumption Tax#!\n\n#lore Available only when exactly 1 good is selected.#!\n\n$SKY_LC$ Current country adds consumption tax on the selected good\n$SKY_SL$ If a country is marked: target country adds consumption tax on the selected good\n$SKY_AL$ If a country is marked: target country removes this consumption tax\n$SKY_line$\n$SKY_RC$ Current country removes this consumption tax"
 SKY_B3_TT_GOODS_OBSESSION: "#BOLD Cultural Obsession#!\n\n#lore Available only when exactly 1 good is selected.#!\n\n$SKY_LC$ Current country’s primary cultures add obsession with the selected good\n$SKY_SL$ If a country is marked: target country’s primary cultures add the same obsession\n$SKY_AL$ If a country is marked: target country’s primary cultures remove this obsession\n$SKY_line$\n$SKY_RC$ Current country’s primary cultures remove this obsession"
 SKY_B3_TT_GOODS_TABOO: "#BOLD Cultural Taboo#!\n\n#lore Available only when exactly 1 good is selected.#!\n\n$SKY_LC$ Current country’s primary cultures add taboo against the selected good\n$SKY_SL$ If a country is marked: target country’s primary cultures add the same taboo\n$SKY_AL$ If a country is marked: target country’s primary cultures remove this taboo\n$SKY_line$\n$SKY_RC$ Current country’s primary cultures remove this taboo"
 SKY_B3_TT_COMPANY_REMOVE_MARKED: "#BOLD Disband Marked $concept_company$#!\n\n$SKY_LC$ If a marked $concept_company$ exists, disband it.\n#lore Clickable only when a mark exists.#!"
 SKY_B3_TT_COMPANY_PROSPERITY_PUSH: "#BOLD Establish Super Company#!\n\n$SKY_LC$ Click to let Sakuya favor your country and grant you the possibility of establishing a super company.\n$SKY_RC$ Delete this variable.\N\N#LORE Click this button, unpause the game, then enter the $concept_company$ interface again. You may find a $concept_company$ named $company_sakuya_gensokyo_industrial_group$."
 SKY_B3_TT_COMPANY_SET_EXECUTIVE: "#BOLD Appoint $concept_company$ Executive#!\n\n$SKY_LC$ Appoint the marked $concept_character$ as executive, CEO, of the marked $concept_company$.\n#lore Clickable only when both a company mark and a $concept_character$ mark exist.#!"
