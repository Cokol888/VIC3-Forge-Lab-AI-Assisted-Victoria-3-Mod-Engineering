 SKY_B1_TT_FAST_CONSTRUCTION: "#BOLD Fast Construction#!\n\n$SKY_LC$ +100\n$SKY_SL$ +999999 for 1 month\n$SKY_AL$ +10\n$SKY_line$\n$SKY_RC$ Clear\n$SKY_CL$ #n -#!100\n$SKY_line$\n#italic Also increases $country_construction_add$ and $country_max_weekly_construction_progress_add$. $SKY_SL$ additionally disables the investment pool for 1 month.#!\n$SKY_stackable$"
 SKY_B1_TT_RESEARCH_SPEED: "#BOLD Research Speed#!\n\n$SKY_LC$ Innovation cap +50, innovation +50%, spread +50%\n$SKY_SL$ Innovation cap +99999, innovation +99999%, spread +99999% for 1 year\n$SKY_AL$ Innovation cap +10, innovation +10%, spread +10%\n$SKY_line$\n$SKY_RC$ Clear\n$SKY_CL$ #n Innovation cap -#!50, #n innovation -#!50%, #n spread -#!50%\n$SKY_line$\n$SKY_stackable$"
