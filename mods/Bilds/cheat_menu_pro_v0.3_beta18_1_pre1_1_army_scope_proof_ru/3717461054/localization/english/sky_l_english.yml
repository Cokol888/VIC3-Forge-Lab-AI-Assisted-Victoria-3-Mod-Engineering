 sakuya_superdip_humiliate_01: "Let Sakuya humiliate this country."
 sakuya_superdip_humiliate_01_action_name: "Let Sakuya humiliate this country."
 sakuya_superdip_humiliate_01_desc: "You will send Sakuya to dine with the ambassador of this country on behalf of our rulers."
 sakuya_superdip_humiliation_pact_01: "$humiliation$"
 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "Sakuya humiliates the target country through a deeply improper diplomatic dinner, damaging its reputation on the international stage. Duration: 5 years."
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is humiliated by Sakuya, who was sent by [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]. Duration: 5 years."
 sakuya_superdip_humiliation_pact_01_effect_desc_global: "Establish Sakuya's humiliation pact"
 sakuya_superdip_humiliation_pact_01_effect_desc_first: "[COUNTRY.GetNameNoFlag] sends Sakuya to shame [TARGET_COUNTRY.GetName] for 5 years"
 sakuya_superdip_humiliation_pact_01_effect_desc_third: "[COUNTRY.GetName] sends Sakuya to shame [TARGET_COUNTRY.GetName] for 5 years"
 sakuya_superdip.1.t: "Sakuya speaks out at a diplomatic dinner!"
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName] is thrown into chaos as Sakuya begins brawling with officials from [SCOPE.sCountry('sakuya_superdip_target_country').GetName] during the dinner."
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] tried to bring a bench down on Sakuya, but she neatly stepped aside, grabbed a piece of cake from the table, and smashed it onto [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]'s head. \N\N"#lore Old fool... You tried to ambush me? #!""
 sakuya_superdip.1.a: "Good scolding!"
 sakuya_superdip.1.b: "I'll curse a few too..."
 sakuya_superdip.1.c: "Ms. Sakuya, stop it..."
 sakuya_superdip.1.c_desc: "After [SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName] made every effort to stop her, Sakuya Izayoi temporarily put away her silver knives, then took a sip of wine, looking as composed as ever."
 notification_sakuya_superdip_humiliation_toast_name: "Sakuya contemptuously humiliated [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "Sakuya delivered a diplomatic note of remarkable cultural refinement to [SCOPE.sCountry('target').GetName]'s [SCOPE.sCountry('target').GetRuler.GetFullName]. For some reason, they interpreted it as a #BOLD insult#!. We found their vulgarity amusing; they seemed rather displeased. Diplomatic relations between [SCOPE.sCountry('actor').GetName] and [SCOPE.sCountry('target').GetName] appear to have deteriorated."
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "Sakuya says:\NYour mother was a hamster,\Nand your father smells of elderberries!"
 sakuya_superdip_insult_02: "Sakuya says:\NJudgment day is upon us!\NThe minions of Lucifer walk upon the earth—\NOh, no, it is merely your country's representative."
 sakuya_superdip_insult_03: "Sakuya says:\NFurthermore, I believe your capital must be destroyed!"
 sakuya_superdip_insult_04: "Sakuya says:\NWhen the account of our time is written by future generations,\Nthey will look at you with that mix of pity and disgust called compassion."
 sakuya_superdip_insult_05: "Sakuya says:\NMy last visit to the commode was vastly more enjoyable than dinner with your ambassador."
 sakuya_superdip_insult_06: "Sakuya says:\NOh, look.\NThere is some lovely filth over here."
 sakuya_superdip_insult_07: "Sakuya says:\NYour blood will make the soil I take from you all the richer."
 sakuya_superdip_insult_08: "Sakuya says:\NDull diplomatic occasions always need a catfish to liven them up.\NAnd you, my friend, are the finest catfish of all!"
 sakuya_superdip_insult_09: "Sakuya says:\NWhy are matters in your country always so dreadful?\NI suspect the cause is all of you."
 sakuya_superdip_insult_10: "Sakuya says:\NIn this great game we play,\Nyou are a mere pawn."
 sakuya_superdip_insult_11: "Sakuya says:\NTales of your misdeeds are told from Ireland to Cathay."
 sakuya_superdip_insult_12: "Sakuya says:\NYour ruler has the reasoning powers of a ripe banana,\Nbut shows true genius in public defecation."
 sakuya_superdip_insult_13: "Sakuya says:\NMay your sky be filled with comets."
 sakuya_superdip_insult_14: "Sakuya says:\NNo map can be a work of art\Nas long as your nation is on it."
 sakuya_superdip_insult_15: "Sakuya says:\NI do not understand why you enjoy playing the fool at diplomatic dinners.\NAre you searching for meaning,\Nor merely entertaining the crowd?"
