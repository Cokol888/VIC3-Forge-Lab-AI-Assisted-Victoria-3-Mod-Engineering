 SKY_B8_TT_FAMOUS_CHARACTER: "#BOLD Famous Character Summon#!\n\n$SKY_LC$ Join the player country as an agitator\n$SKY_RC$ Become the ruler of the player country\n$SKY_AL$ Join the player country as a general\n$SKY_SL$ Join the player country as an admiral\n$SKY_line$\n#italic The same figure can be summoned repeatedly. The exact role depends on the click method.#!"
 SKY_ABOUT_WELCOME_1: "#BOLD Welcome!#!\nNice to meet you. I am Xier, the developer of Victoria 3 Cheat Menu Pro. It is an honor to meet you again in Victoria 3. #BOLD QQ group:#! 734267077. Come join us!"
 SKY_ABOUT_WELCOME_2: "#BOLD What do you think of this mod?#!\nI am still developing it continuously. Compared with EU5, Victoria 3’s engine looks similar to earlier titles, but is actually very different. In any case, I hope everyone has fun! Meeting you all really makes me happy."
 SKY_UPDATE_LOG_V1_TITLE: "#BOLD $SKY_WINDOW_TITLE$ v1.0 Update Notes#!"
 SKY_UPDATE_LOG_V1_TEXT: "- Initial version released\n- Ported navigation bar system from EU5\n- 9 function categories, each with 12 reserved buttons\n- About page includes update log, personalization settings, and about information\n- Supports Simplified Chinese localization"
 SKY_SETTINGS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Personalization Settings#!"
 SKY_SETTINGS_PLACEHOLDER: "Personalization settings are under development. Please stay tuned.\nFuture versions will support background customization, interface theme switching, and more."
 SKY_ABOUT_LINKS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Contact#!"
 SKY_ABOUT_TEXT_1: "#BOLD Thank you for using $SKY_WINDOW_TITLE$!#!\nNice to meet you. I am Xier, a developer from Beijing currently living in Czechia. If you have any questions, feel free to contact me through the QQ group or Discord server. If you want to support Xier, you can give Xier a like on the Steam Workshop, or donate through the sponsor link above.\nThis mod is completely free. If you obtained this mod through any paid channel, please report it immediately. Xier would be very grateful!"
 SKY_ABOUT_TEXT_2: "#BOLD Compatibility Notes#!\n$SKY_WINDOW_TITLE$ has been carefully designed to maximize compatibility with other mods. However, due to game engine limitations, it needs to modify one system GUI file as a compromise in order to display the $concept_modifier$ interface.\nTo ensure large mods load as completely as possible, the recommended load order is: large mods first, then small mods, then UI mods, and finally $SKY_WINDOW_TITLE$. Since the game uses later-loaded files to override earlier-loaded ones, placing $SKY_WINDOW_TITLE$ last ensures its UI modifications override other UI mods.\nIf you encounter any problems while using it, please feel free to contact me through the QQ group or Discord server. I will do my best to provide help and support."
