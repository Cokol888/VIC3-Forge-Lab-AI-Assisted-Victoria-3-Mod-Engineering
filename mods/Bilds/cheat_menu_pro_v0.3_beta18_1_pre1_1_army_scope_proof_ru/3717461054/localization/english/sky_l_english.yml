 SKY_B4_TT_END_DP: "#tooltip_header End $concept_diplomatic_play_short$#!\n\nForce-end the selected $concept_diplomatic_play$.\nA $concept_diplomatic_play_short$ must be selected first.\n$SKY_line$\n$SKY_LC$ End unconditionally\n$SKY_SL$ Initiator wins\n$SKY_RC$ Target wins"
 SKY_B4_TT_JOIN_DP: "#tooltip_header Join $concept_diplomatic_play_short$#!\n\nAdd a country to the selected $concept_diplomatic_play$.\nA $concept_diplomatic_play_short$ must be selected first.\n$SKY_line$\n$SKY_LC$ Player joins initiator side\n$SKY_RC$ Player joins target side\n$SKY_SL$ Marked country joins initiator side\n$SKY_CL$ Marked country joins target side"
 SKY_B4_TT_ESCALATION: "#tooltip_header $concept_escalation$#!\n\nAdjust escalation of the selected $concept_diplomatic_play_short$.\nA $concept_diplomatic_play_short$ must be selected first.\n$SKY_line$\n$SKY_LC$ +20\n$SKY_RC$ -20\n$SKY_SL$ Max out\n$SKY_AL$ Reset to zero"
 SKY_B4_TT_JOIN_WAR: "#tooltip_header Join War#!\n\nAdd a country to the initiator side of the selected war.\nA war must be selected first.\n$SKY_line$\n$SKY_LC$ Player joins initiator side\n$SKY_RC$ Marked country joins initiator side\n$SKY_SL$ If possible, make the player leave\n$SKY_AL$ If possible, make the marked country leave"
 SKY_B4_TT_END_WAR: "#tooltip_header End War#!\n\nForce-end the selected war.\nA war must be selected first.\n$SKY_line$\n$SKY_LC$ End unconditionally\n$SKY_SL$ Initiator wins\n$SKY_RC$ Target wins"
 SKY_B4_TT_WAR_SUPPORT: "#tooltip_header War Support#!\n\nAdjust war support in the selected war.\nBy default, this prioritizes the player. If the player is not at war, it prioritizes the marked country. If still invalid, it falls back to the initiator side.\n$SKY_line$\n$SKY_LC$ Initiator +25\n$SKY_RC$ Initiator -25\n$SKY_SL$ Initiator +100\n$SKY_CL$ Target +25\n$SKY_AL$ Target -25"
 SKY_B4_TT_DP_MANEUVERS: "#tooltip_header $concept_diplomatic_play_short$ Maneuvers#!\n\nAdjust the player country’s $concept_diplomatic_play_short$ maneuvers.\n$SKY_line$\n$SKY_LC$ +50\n$SKY_CL$ #n -#!50\n$SKY_AL$ +5\n$SKY_SL$ +99999\n$SKY_RC$ Clear"
 SKY_B4_TT_WAR_EXHAUSTION_CASUALTIES: "#tooltip_header $country_war_exhaustion_casualties_mult$#!\n\nAdjust the war exhaustion taken by the player country from casualties.\n$SKY_line$\n$SKY_LC$ #p -#!20%\n$SKY_SL$ #p -#!20000%\n$SKY_AL$ #p -#!5%\n$SKY_CL$ +20%\n$SKY_RC$ Clear"
 SKY_B4_TT_DIPLOMATIC_REPUTATION: "#tooltip_header $country_diplomatic_reputation_add$#!\n\nAdjust the player country’s diplomatic reputation.\n$SKY_line$\n$SKY_LC$ +1\n$SKY_SL$ +1000\n$SKY_AL$ +0.1\n$SKY_CL$ #n -#!1\n$SKY_RC$ Clear"
 SKY_B4_TT_START_DP: "#tooltip_header Start $concept_diplomatic_play_short$#!\n\nYou must first mark a target country and select a diplomatic demand.\n$SKY_line$\n$SKY_LC$ Player → target country\n$SKY_RC$ Target country → player"
 SKY_B4_TT_START_WAR: "#tooltip_header Start War#!\n\nSkip the $concept_diplomatic_play_short$ phase and enter war directly.\nYou must first mark a target country and select a diplomatic demand.\n$SKY_line$\n$SKY_LC$ Player → target country\n$SKY_RC$ Target country → player"
 SKY_B4_TT_WAR_SELECT_DP: "#BOLD Select $concept_diplomatic_play_short$#!\n\n$SKY_LC$ Select a $concept_diplomatic_play_short$ involving the player\n$SKY_RC$ Select a $concept_diplomatic_play_short$ involving the marked country\n$SKY_line$\n#italic Open the $concept_diplomatic_play_short$ list for selection.#!"
 SKY_B4_TT_WAR_SELECT_WAR: "#BOLD Select War#!\n\n$SKY_LC$ Select a war involving the player\n$SKY_RC$ Select a war involving the marked country\n$SKY_line$\n#italic Open the war list for selection.#!"
 SKY_B4_TT_WAR_CLEAR_SEL: "#BOLD Deselect#!\n\n$SKY_LC$ Clear the selected $concept_diplomatic_play_short$ and war\n$SKY_line$\n#italic This button is unavailable when no $concept_diplomatic_play_short$ or war is selected.#!"
