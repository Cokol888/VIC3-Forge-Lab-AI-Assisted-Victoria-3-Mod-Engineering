 SKY_B7_TT_AUTONOMY_AND_INDEPENDENCE: "#BOLD Autonomy and Independence#!\n$SKY_line$\n$SKY_LC$ If the target is a subject of $SKY_SELF_COUNTRY$, reduce its autonomy\n$SKY_RC$ If the target is a subject of $SKY_SELF_COUNTRY$, increase its autonomy\n$SKY_SL$ If $SKY_SELF_COUNTRY$ is a subject, immediately become independent\n$SKY_AL$ If the target is a subject, immediately become independent"
