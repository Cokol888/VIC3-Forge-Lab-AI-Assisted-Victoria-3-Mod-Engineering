SKY_1_1_B7_TT_FORM_OPEN_TAG_INDEX: "#BOLD Select TAG#!\n$SKY_line$\n$SKY_LC$ Open the TAG selector.\n\nThe selected TAG will be used as the target country for the buttons below."
SKY_1_1_B7_TT_FORM_CLEAR_TAG_SELECTION: "#BOLD Clear Selection#!\n$SKY_line$\n$SKY_LC$ Clear the currently selected TAG."
SKY_1_1_B7_TT_FORM_CHANGE_TAG: "#BOLD Change Your Country to a New Country#!\n$SKY_line$\n$SKY_LC$ Change your country to the selected TAG, and apply its culture and state religion.\n$SKY_RC$ Only change your country to the selected TAG."
SKY_1_1_B7_TT_FORM_RELEASE_COUNTRY: "#BOLD Form a New Country in Your Marked States#!\n$SKY_line$\n$SKY_LC$ Form the selected TAG in your marked states.\n\nYou will not switch to the new country."
SKY_1_1_B7_TT_FORM_MARKED_CHANGE_TAG: "#BOLD Change Target Country to a New Country#!\n$SKY_line$\n$SKY_LC$ Change the target country to the selected TAG, and apply its culture and state religion.\n$SKY_RC$ Only change the target country to the selected TAG."
SKY_1_1_B7_TT_FORM_MARKED_RELEASE_COUNTRY: "#BOLD Form a New Country in the Target Country's Marked States#!\n$SKY_line$\n$SKY_LC$ Form the selected TAG in the target country's marked states.\n\nThe player will not switch to the new country."
SKY_1_1_B7_TT_FORM_APPLY_IDENTITY: "#BOLD Use Selected TAG Culture and Religion#!\n$SKY_line$\n$SKY_LC$ Change your country to the selected TAG's culture and state religion.\n$SKY_RC$ Change the target country to the selected TAG's culture and state religion."
SKY_1_1_SP_GUIDE_BTN1: "$SKY_DEFAULT_TITLE$!\nBefore you start, allow Xier to explain the button click logic. #P Left click#! a button to add an effect. Hover over a button to see its details. If the added effect is a $concept_modifier$, you can #N right click#! to remove that $concept_modifier$. Most buttons support key combinations. Hold a keyboard key, then left click the button.\N@innovation!In general, #p left click#! uses a value that $xier$ considers useful and reasonable. #BLUE Shift#! provides a value one hundred times greater or even higher. #COLOR:{0.3686,0.3961,0.7216} Alt#! provides a smaller value for precise adjustment. #GOLD Ctrl#! usually applies the opposite effect."
SKY_1_1_SP_GUIDE_BTN2: "Most marking functions #BOLD only support one target at a time#!. This also applies to goods and company marking on this page. The slider on the first page can adjust income. #I Click#! the slider to select the value you need, then click the confirm button below to complete the operation. To remove a modifier, #N right click#! it, or set the slider to #n 0#!."
SKY_1_1_SP_GUIDE_BTN3: "For domestic or exiled characters, right click the character and select #yellow $sakuya_mark_character$#! in the pop-up menu to mark them. For foreign characters, mark the target country first, then find #YELLOW $SKY_B3_CHAR_MARK_OPEN$#! on this page and select the character you want to mark in the pop-up event."
SKY_1_1_SP_GUIDE_BTN4: "#yellow $SKY_B4_TAKE_MARKED_NAVY_SHIPS$#! and #yellow $SKY_1_1_B4_BTN_DESTROY_SHIPS$#! require a fleet to be marked first. Hold #BLUE Shift#! and click #yellow $SKY_R4_MARK_ARMY$#! to select a fleet to mark through the pop-up event.\NWhen starting a diplomatic play or war, you need to confirm that the war goal is valid. If the conditions are not met, the operation may fail. Similar cases also exist in other $CMP$ functions."
SKY_1_1_SP_GUIDE_BTN5: "Like other marking systems in $CMP$, the $concept_interest_group$ marked in $SKY_B5_SUBSEC_1$ will be referenced by other modification options. The selected interest group will light up some functions that require an interest group to be marked first, such as changing the interest group of $sakuya_mark_character$. In most cases, it is recommended to select only one $concept_interest_group$."
SKY_1_1_SP_GUIDE_BTN6: "Right click a state you own, then select #yellow $decree_sakuya_mark_state$#! in the menu to mark the $state$ you want to adjust. You can also select #yellow $decree_sakuya_mark_state$#! under #i $concept_political_lens$#! and $mm_issue_decree_interaction$ below, making it easier to mark on the map. To mark a foreign state, right click the target country and select #yellow $sakuya_mark_foreign_state$#!.\N#T #N It is strongly recommended to mark only one location at a time!#!#!"
SKY_1_1_SP_GUIDE_BTN6_tab4: "After selecting the building category you want to adjust in the building selector, the currently selected building will be shown at the lower left of the menu. Please select the target $state$ with $decree_sakuya_mark_state$ first, then click the slider to adjust the desired value, and then click #yellow $SKY_B6_BUILD_ADD_BUILDING$#!. Selecting the #n 0#! tier will clear this building or resource potential. Whether buildings and resource potential can be added successfully depends on #N technology#! and other conditions of the player or target country.\NBuildings in the $SKY_B6_BUILD_CAT_RESOURCE$ and $SKY_B6_BUILD_CAT_AGRICULTURE$ categories also support #yellow $SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL$#!."
SKY_1_1_SP_GUIDE_BTN6_tab5: "\NOn this page, all modifiers target $concept_buildings$, except #yellow $SKY_B6_RESERVED_BUILD_R2_C1$#! and #yellow $SKY_B6_RESERVED_BUILD_R2_C2$#!, whose modifiers target the $state$. You need to click the modified $concept_buildings$ before you can see the corresponding $concept_modifier$."
SKY_1_1_SP_GUIDE_BTN7: "\NRight click the country you want to mark, then select #yellow $sakuya_mark_country$#! to mark it. You can also select #yellow $sakuya_mark_country$#! under #i $concept_diplomatic_lens$#! and $concept_diplomatic_actions$ below, making it easier to mark on the map."
 SKY_1_1_SP_GUIDE_BTN8: "\N\N#yellow $SKY_BTN8_TAB_TECHNOLOGY$#! gathers $concept_technology$-related modifiers; use the tabs above to switch between $production$, $military$, and $society$. Most buttons follow the standard large/small button rules, and right-click clears the corresponding $concept_modifier$.\N\NIn #yellow $SKY_BTN8_TAB_CULTURE$#!, click #yellow $SKY_B8_CULTURE_MARK$#! to open $SKY_1_2_CULTURE_INDEX_TITLE$#!. Select a target $concept_culture$ in the $concept_culture$ selector, then use it for $concept_primary_cultures$, $concept_homelands$, and other culture functions."
SKY_1_1_SP_GUIDE_BTN9: "\nTry hovering over the large $CMP$ title for one second...?\n@innovation!Different wallpapers show different content."
SKY_1.1_CLOSE: "Click to close."
SKY_B4_TT_JOIN_WAR_INITIATOR_SIDE: "#tooltip_header Join War#!\n\nAdd the country to the initiator side of the selected war.\nA war must be selected first.\n$SKY_line$\n$SKY_LC$ Player joins the initiator side\n$SKY_RC$ Marked country joins the initiator side\n$SKY_SL$ Player leaves if possible\n$SKY_AL$ Marked country leaves if possible"
