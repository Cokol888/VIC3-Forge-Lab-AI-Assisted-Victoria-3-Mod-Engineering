 notification_sakuya_superdip_annex_country_toast_name: "[SCOPE.sCountry('actor').GetName] unified [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_annex_country_toast_desc: "After Sakuya's persuasion, [SCOPE.sCountry('target').GetRuler.GetFullName] signed the [SCOPE.sCountry('actor').GetCapital.GetCityHubName] Treaty in [SCOPE.sCountry('target').GetCapital.GetCityHubName], and [SCOPE.sCountry('target').GetName] and [SCOPE.sCountry('actor').GetName] finally completed their unification."
 notification_sakuya_superdip_annex_country_toast_tooltip: "#header $notification_sakuya_superdip_annex_country_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_annex_country_toast_desc$"
 notification_sakuya_superdip_force_join_power_bloc_toast_name: "[SCOPE.sCountry('target').GetName] joined our Power Bloc"
 notification_sakuya_superdip_force_join_power_bloc_toast_desc: "[SCOPE.sCountry('target').GetRuler.GetFullName] acknowledged after the meeting that Sakuya's explanation of the international situation was clear and hard to refuse. [SCOPE.sCountry('target').GetName] then joined the $concept_power_bloc$ that [SCOPE.sCountry('actor').GetName] belongs to."
 notification_sakuya_superdip_force_join_power_bloc_toast_tooltip: "#header $notification_sakuya_superdip_force_join_power_bloc_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_force_join_power_bloc_toast_desc$"
 sakuya_superdip.3.t: "Sakuya persuaded [SCOPE.sCountry('sakuya_superdip_target_country').GetName]'s [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]"
 sakuya_superdip.3.d: "In a private meeting, Sakuya convinced [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] to reconsider relations with [SCOPE.sCountry('sakuya_superdip_actor_country').GetName]."
 sakuya_superdip.3.f: "By the end of the meeting, [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] had already returned the harsh note originally prepared to the drawer and asked to arrange the next meeting. Sakuya simply closed her pocket watch calmly, as if everything was as it should be."
 sakuya_superdip.3.a: "That's good."
