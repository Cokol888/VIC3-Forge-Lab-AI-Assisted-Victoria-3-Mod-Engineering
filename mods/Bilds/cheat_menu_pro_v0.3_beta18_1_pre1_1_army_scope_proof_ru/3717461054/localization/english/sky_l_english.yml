 SKY_1_2_B4_TT_SHIP_CONSTRUCTION_CAPACITY_DISABLED: "#BOLD Ship Construction Capacity#!\n$SKY_line$\nThis option generated large numbers of convoy construction queues that could not be canceled, so it is now disabled.\n\n$SKY_LC$ Clear related modifiers.\n$SKY_RC$ Clear related modifiers."
