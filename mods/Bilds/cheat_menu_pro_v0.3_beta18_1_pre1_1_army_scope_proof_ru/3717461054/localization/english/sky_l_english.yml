 SKY_B8_TT_LAWSET_SOL: "#BOLD SoL-Oriented#!\n\n$SKY_LC$ Switch $SKY_SELF_COUNTRY$ to the full SoL-oriented law set\n$SKY_RC$ Switch $SKY_MARKED_COUNTRY$ to the full SoL-oriented law set\n$SKY_line$\n#italic If no country is marked, right-click will have no effect.#!"
 SKY_B8_TT_LAWSET_COMMUNIST: "#BOLD Communism#!\n\n$SKY_LC$ Switch $SKY_SELF_COUNTRY$ to the full communist law set\n$SKY_RC$ Switch $SKY_MARKED_COUNTRY$ to the full communist law set\n$SKY_line$\n#italic If no country is marked, right-click will have no effect.#!"
 SKY_B8_TT_LAWSET_SHIT: "#BOLD Dystopia#!\n\n$SKY_LC$ Switch $SKY_SELF_COUNTRY$ to the full dystopian law set\n$SKY_RC$ Switch $SKY_MARKED_COUNTRY$ to the full dystopian law set\n$SKY_line$\n#italic Drag the country back into the darkest age and strip away all rights. If no country is marked, right-click will have no effect.#!"
 SKY_B8_TT_HOW_DARE_U: "#BOLD HOW DARE U#!\n\n$SKY_LC$ Apply an extremely powerful military modifier to $SKY_SELF_COUNTRY$\n$SKY_AL$ Apply an extremely powerful military modifier to $SKY_MARKED_COUNTRY$\n$SKY_SL$ Apply the negative version to $SKY_SELF_COUNTRY$\n$SKY_CL$ Apply the negative version to $SKY_MARKED_COUNTRY$\n$SKY_RC$ Clear modifiers related to this button\n$SKY_line$\n#italic The positive version contains 3 army, 3 navy, 2 combat, and 2 prestige modifiers. Kill rate is 99999. The negative version sets military values uniformly to -999 and reverses prestige to +90%. If no country is marked, Alt/Ctrl will not take effect.#!"
 SKY_B8_TT_DOOMFALL: "#BOLD Doomfall#!\n\n$SKY_LC$ Plant an economic and revolutionary bomb in $SKY_MARKED_COUNTRY$ and directly subtract money equal to 1000% of its treasury limit\n$SKY_AL$ Apply the same effect to $SKY_SELF_COUNTRY$ and directly subtract money equal to 1000% of its treasury limit\n$SKY_RC$ Clear modifiers related to this button\n$SKY_line$\n#italic Focuses on radicalism, revolution, chaos, and economic stagnation. Construction capacity is directly set to -99999. If no country is marked, left-click will not take effect.#!"
 SKY_B8_TT_SOCIAL_COLLAPSE: "#BOLD Social Collapse#!\n\n$SKY_LC$ Throw $SKY_MARKED_COUNTRY$ into institutional, demographic, and social-order collapse\n$SKY_AL$ Apply the same state to $SKY_SELF_COUNTRY$\n$SKY_RC$ Clear modifiers related to this button\n$SKY_line$\n#italic Focuses on full-scale decay of legitimacy, loyalists, migration, turmoil, and various social institution caps. Standard of living is directly set to -19. If no country is marked, left-click will not take effect.#!"
