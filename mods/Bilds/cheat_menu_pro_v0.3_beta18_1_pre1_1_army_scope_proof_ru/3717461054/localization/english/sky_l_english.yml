 SKY_B6_TT_RESERVED_BUILD_R1_C1: "#BOLD Selected Building $concept_throughput$#!\n\n#lore First select a building in $SKY_BTN6_SEC$-$SKY_BTN6_TAB3$, and first mark at least 1 $concept_state$.#!\n#lore If the current building does not support this item, use the generic $concept_throughput$ button at the lower right instead.#!\n#lore Currently supported: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Clear this group, including the + button on the right\n#lore Can stack with the large-step button on the right.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1_PLUS: "#BOLD Selected Building $concept_throughput$: Large Step#!\n\n#lore Independent group from the regular button on the left and can stack. Clearing the left side will also clear this.#!\n#lore Currently supported: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
 SKY_B6_RESERVED_BUILD_R1_C2: "Selected Building Input Demand"
 SKY_B6_TT_RESERVED_BUILD_R1_C2: "#BOLD Selected Building Input Demand#!\n\n#lore Applies to the currently selected building in player marked states.#!\n#lore Positive operations reduce building goods input demand.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Clear this group"
 SKY_B6_RESERVED_BUILD_R1_C3: "Selected Building Minimum Wage"
 SKY_B6_TT_RESERVED_BUILD_R1_C3: "#BOLD Selected Building Minimum Wage#!\n\n#lore Applies to the currently selected building in player marked states.#!\n#lore Positive operations reduce building wage target.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Clear this group"
 SKY_B6_TT_RESERVED_BUILD_R2_C1: "#BOLD Selected Building Employee Size#!\n\n#lore Takes effect according to the currently selected building type and applies to player marked states.#!\n#lore Positive operations reduce default employee size.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Clear this group"
 SKY_B6_TT_RESERVED_BUILD_R2_C2: "#BOLD Selected Building Working Conditions#!\n\n#lore Applies to the corresponding building in player marked states.#!\n#lore Positive operations reduce building working condition modifier.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Clear this group"
 SKY_B6_TT_RESERVED_BUILD_R2_C3: "#BOLD Selected Building Generic $concept_throughput$#!\n\n#lore Directly applies to the currently selected building in player marked states.#!\n#lore When the exclusive $concept_throughput$ in the upper left does not cover the current building, use this one.#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Clear this group, including the + button on the right"
 SKY_B6_TT_RESERVED_BUILD_R2_C3_PLUS: "#BOLD Selected Building Generic $concept_throughput$: Large Step#!\n\n#lore Independent group from the regular button on the left and can stack. Right-click on the left side will also clear this.#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
