 SKY_B6_TT_FX_MANDATE_SPRINT: "#BOLD Mandate Progress Sprint#!\n\n$SKY_LC$ +9999 for 1 month\n$SKY_SL$ +99999 for 1 month\n$SKY_AL$ +999 for 1 month\n$SKY_CL$ +99 for 1 month\n$SKY_RC$ Clear\n$SKY_line$\n#lore Greatly increases $concept_power_bloc$ mandate progress for a short time.#!"
 SKY_B6_TT_FX_ADD_LEVERAGE: "#BOLD Add Leverage#!\n\n$SKY_LC$ +100 toward our country\n$SKY_SL$ #n -#!100 toward our country\n$SKY_AL$ #n -#!100 toward the marked country\n$SKY_CL$ +10000 toward the marked country\n$SKY_RC$ +100 toward the marked country\n$SKY_line$\n#lore Directly adds leverage to the currently marked $concept_power_bloc$.#!"
 SKY_B6_TT_FX_JOIN_POWER_BLOC: "#BOLD Join/Leave $concept_power_bloc$#!\n\n$SKY_LC$ Make the marked country join the marked $concept_power_bloc$\n$SKY_AL$ Make our country join the marked $concept_power_bloc$\n$SKY_RC$ If possible, make our country leave its current $concept_power_bloc$\n\n#lore You must mark the target $concept_power_bloc$ first.#!"
 SKY_B6_TT_FX_INVITE_TO_POWER_BLOC: "#BOLD $invite_to_power_bloc$#!\n\n$SKY_LC$ Make our side directly join the marked $concept_power_bloc$\n$SKY_RC$ Make the marked country directly join the marked $concept_power_bloc$\n\n#lore $invite_to_power_bloc_desc$#!"
 SKY_B6_TT_FX_REGIME_CHANGE: "#BOLD $force_regime_change$#!\n\n$SKY_LC$ Directly perform this $concept_power_bloc$ action on the marked country\n\n#lore $force_regime_change_desc$#!"
 SKY_B6_TT_FX_FORCE_STATE_RELIGION: "#BOLD $force_state_religion$#!\n\n$SKY_LC$ Directly perform this $concept_power_bloc$ action on the marked country\n\n#lore $force_state_religion_desc$#!"
 SKY_B6_TT_FX_SPREAD_CULTURE: "#BOLD $add_power_bloc_culture$#!\n\n$SKY_LC$ Directly perform this $concept_power_bloc$ action on the marked country\n\n#lore $add_power_bloc_culture_desc$#!"
