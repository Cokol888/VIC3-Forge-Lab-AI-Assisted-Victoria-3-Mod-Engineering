 SKY_B3_TRAIT_GROUP_TT_GENERAL: "#BOLD Commander#!\n$SKY_line$\n$SKY_LC$ Add a full set of traits suited to battlefield command.\n$SKY_RC$ Remove this trait set.\n$SKY_line$\nFocuses on army, navy, terrain, artillery, attack, defense, supply, pillage, and fleet command."
 SKY_B3_TRAIT_GROUP_TT_EXECUTIVE: "#BOLD $concept_company$ Executive#!\n$SKY_line$\n$SKY_LC$ Add a full set of traits suited to $concept_company$ management and industry.\n$SKY_RC$ Remove this trait set.\n$SKY_line$\nFocuses on throughput, management, entrepreneurship, engineering, and industrial administration."
 SKY_B3_TRAIT_GROUP_TT_BAD_RULER: "#BOLD Bad Ruler#!\n$SKY_line$\n$SKY_LC$ Add a full set of traits suited to a disastrous ruler.\n$SKY_RC$ Remove this trait set.\n$SKY_line$\nIncludes arrogance, anger, cruelty, luxury, fraud, addiction, incompetence, and other harmful ruling habits."
 SKY_B3_TRAIT_GROUP_TT_AGITATOR: "#BOLD Agitator#!\n$SKY_line$\n$SKY_LC$ Add a full set of traits suited to political agitation.\n$SKY_RC$ Remove this trait set.\n$SKY_line$\nFocuses on charisma, appeal, political organization, speeches, agitation, and social movements."
 SKY_B3_TRAIT_GROUP_TT_RULER: "#BOLD Ruler#!\n$SKY_line$\n$SKY_LC$ Add a full set of traits suited to ruling a country.\n$SKY_RC$ Remove this trait set.\n$SKY_line$\nFocuses on diplomacy, administration, colonies, political organization, prestige, and governance."
 SKY_B3_TRAIT_GROUP_TT_ALL_ROUNDER: "#BOLD All-rounder#!\n$SKY_line$\n$SKY_LC$ Add a full set of broadly useful traits.\n$SKY_RC$ Remove this trait set.\n$SKY_line$\nCombines common strengths for ruling, companies, politics, diplomacy, army, and navy."
