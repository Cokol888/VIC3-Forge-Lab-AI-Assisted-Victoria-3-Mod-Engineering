 SKY_B1_TT_E_LITERACY: "#BOLD $concept_literacy$#!\n\n$SKY_LC$ Set to 50%\n$SKY_SL$ Set to 100%\n$SKY_AL$ Set to 20%\n$SKY_line$\n$SKY_RC$ Set to 75%\n$SKY_CL$ Set to 1%\n$SKY_line$\n#lore Directly acts on all pops nationwide.#!"
 SKY_B1_TT_E_LOYALISTS: "#BOLD $mm_loyalists$/$mm_radicals$#!\n\n$SKY_LC$ Turn 20% of the whole country into $mm_loyalists$\n$SKY_SL$ Turn 100% of the whole country into $mm_loyalists$\n$SKY_AL$ Try to neutralize by removing $mm_loyalists$ and $mm_radicals$\n$SKY_line$\n$SKY_RC$ Turn 20% of the whole country into $mm_radicals$\n$SKY_CL$ Turn 100% of the whole country into $mm_radicals$"
 SKY_B1_TT_E_RELIGION: "#BOLD Religion#!\n\n$SKY_LC$ Convert the whole country to our religion\n$SKY_SL$ Convert only provinces where the marked $concept_state$ decree is active\n$SKY_AL$ If a country is marked: change our state religion to the target country’s religion\n$SKY_line$\n$SKY_RC$ If a country is marked: change the target country to our religion and force conversion"
 SKY_B1_TT_E_CULTURE: "#BOLD $concept_culture$#!\n\n$SKY_LC$ Assimilate the whole country to our ruler culture\n$SKY_SL$ Assimilate only provinces where the marked $concept_state$ decree is active\n$SKY_AL$ If a country is marked: add the target country’s primary cultures to our primary cultures\n$SKY_RC$ If a country is marked: add our primary cultures to the target country’s primary cultures"
 SKY_B1_TT_E_QUALIFICATIONS: "#BOLD Qualifications#!\n\n$SKY_LC$ Set all occupational qualifications nationwide to 100%\n$SKY_SL$ Set all occupational qualifications in the marked $concept_state$ to 100%\n$SKY_AL$ Set all occupational qualifications nationwide to 20%\n$SKY_RC$ Set all occupational qualifications nationwide to 50%\n$SKY_CL$ Set all occupational qualifications nationwide to 1%"
