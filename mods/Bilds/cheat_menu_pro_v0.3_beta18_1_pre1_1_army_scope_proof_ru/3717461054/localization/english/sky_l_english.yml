 SKY_B3_CHAR_TT_FX_TRANSFER: "#BOLD Transfer#!\n\n$SKY_LC$ Transfer to our country and set as agitator\n$SKY_RC$ Transfer to marked country and set as agitator\n$SKY_CL$ Transfer to our country and set as general\n$SKY_line$\n#italic During transfer, this tries to preserve the original $concept_character$’s $concept_interest_group$ type and synchronize it to the corresponding $concept_interest_group$ in the target country, reducing $concept_character$ invalidation.#!\n#lore If you want to further turn them into a ruler, $concept_interest_group$ leader, and so on, it is recommended to first pull the $concept_character$ into our country as an agitator, then continue using the nearby role and $concept_character$ effect buttons. If you later feel there are too many agitators, you can also use the nearby button to remove their agitator role.#!"
