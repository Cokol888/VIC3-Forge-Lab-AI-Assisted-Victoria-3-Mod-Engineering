SKY_1_1_SP_THANKS_1: "Days and nights pass like a fleeting white steed."
SKY_1_1_SP_THANKS_2: "$CMP$ was not made in a single day,\nbut Xier has never walked this path alone."
SKY_1_1_SP_THANKS_3: "Xier was fortunate to meet you all, and is grateful for your company along the way:\n\nFor Okang, Afdian user_c9b6a, Fan Jiayuan,\nAfdian user_79091, Gao Fu Shuai Que Er, \nAfdian user_jm3J, El Mono, HMS Perseus, Xiao Shi\N AbrahamKafe"
SKY_1_1_SP_THANKS_4: "The fifteen hundred members\nof Xier Modifier's two groups\nand you"
SKY_1_1_SP_THANKS_5: "Meeting you was truly a lucky thing."
