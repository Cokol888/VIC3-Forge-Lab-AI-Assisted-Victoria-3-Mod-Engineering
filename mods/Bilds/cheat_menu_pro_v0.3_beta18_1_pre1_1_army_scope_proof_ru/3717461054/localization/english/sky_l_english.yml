 SKY_B6_STATE_TT_INTEGRATE: "#BOLD Instant Incorporation#!\n\n$SKY_LC$ Instantly incorporate the target $concept_state$\n$SKY_RC$ Instantly unincorporate the target $concept_state$\n$SKY_line$\n#lore By default, this prioritizes a marked $concept_state$ in our country. If none exists, it acts on a marked foreign $concept_state$.#!"
 SKY_B6_STATE_TT_HOMELAND: "#BOLD Cultural Homeland#!\n\n$SKY_LC$ Add homelands of all our primary cultures to the target $concept_state$\n$SKY_RC$ Remove homelands of all our primary cultures\n$SKY_AL$ Add homelands of all marked country primary cultures to the target $concept_state$\n$SKY_CL$ Remove homelands of all marked country primary cultures\n$SKY_line$\n#lore When a foreign source is needed, this reads all primary cultures of the marked country.#!"
 SKY_B6_STATE_TT_CLAIM: "#BOLD $concept_state$ Claim#!\n\n$SKY_LC$ Add our claim on the target $concept_state$\n$SKY_RC$ Remove our claim on the target $concept_state$\n$SKY_AL$ Add the marked country’s claim on the target $concept_state$\n$SKY_CL$ Remove the marked country’s claim on the target $concept_state$\n$SKY_line$\n#lore This button prioritizes marked foreign $concept_state$s. If no foreign $concept_state$ is marked, it falls back to marked $concept_state$s in our country.#!"
 SKY_B6_STATE_TT_CAPITAL: "#BOLD $concept_unemployed$ Pop Migration#!\n\n$SKY_LC$ Move 33% of our $concept_unemployed$ pops to our marked $concept_state$\n$SKY_AL$ Move 100% of our $concept_unemployed$ pops to our marked $concept_state$\n$SKY_SL$ Move 50% of the marked country’s $concept_unemployed$ pops to our marked $concept_state$\n$SKY_CL$ Move 100% of the marked country’s $concept_unemployed$ pops to that country’s marked $concept_state$\n$SKY_RC$ Move 100% of our $concept_unemployed$ pops to states held by the target country\n$SKY_line$\n#n If several eligible target $concept_state$s exist, the pops will be distributed among several $concept_state$s.#!"
 SKY_B6_STATE_TT_ARABLE: "#BOLD $concept_arable_land$#!\n\n$SKY_LC$ +20\n$SKY_SL$ +100\n$SKY_AL$ +5\n$SKY_CL$ #n -#!20\n$SKY_line$\n#lore Directly modifies the $concept_arable_land$ of the target $concept_state$ area.#!\N#LORE $concept_arable_land_desc$#!#!"
 SKY_B6_STATE_TT_DEVASTATION: "#BOLD Devastation#!\n\n$SKY_LC$ #P -20#!\n$SKY_SL$ #P -100#!\n$SKY_AL$ #P -5#!\n$SKY_CL$ +20\n$SKY_line$\n#lore Left-click actions reduce devastation.#!"
 SKY_B6_STATE_TT_MOD_NAVAL_BASE: "#BOLD Strategic Region Involvement of This Area#!\n\n$SKY_LC$ +2000\n$SKY_SL$ +10000\n$SKY_AL$ +50\n$SKY_RC$ #n -#!2000\n$SKY_line$\n#lore Executes $add_involvement$ for the player country in the $concept_strategic_region$ containing the marked area.#!"
 SKY_B6_STATE_TT_MOD_BIRTH_RATE: "#BOLD $state_birth_rate_mult$#!\n\n$SKY_LC$ +20% for 1 year, stacks up to 20\n$SKY_SL$ +20000% for 1 month, does not stack\n$SKY_AL$ +5% for 1 year, stacks up to 20\n$SKY_CL$ +2000% for 1 year, stacks up to 20\n$SKY_RC$ Clear all birth rate modifiers"
 SKY_B6_STATE_TT_MOD_MORTALITY: "#BOLD $state_mortality_mult$#!\n\n$SKY_LC$ +20% for 1 year, stacks up to 20\n$SKY_SL$ +99999% for 1 month, does not stack\n$SKY_AL$ +5% for 1 year, stacks up to 20\n$SKY_CL$ +2000% for 1 year, stacks up to 20\n$SKY_RC$ Clear all mortality modifiers"
 SKY_B6_STATE_TT_MOD_PEASANTS_CONSUMPTION: "#BOLD $peasants_no_icon$ Goods Consumption#!\n\n$SKY_LC$ -20%\n$SKY_SL$ -100%\n$SKY_AL$ -5%\n$SKY_CL$ +20%\n$SKY_RC$ Clear\n$SKY_line$\n$SKY_stackable$"
 SKY_B6_STATE_TT_EFF_LOYALISTS: "#BOLD Loyalists#!\n\n$SKY_LC$ +20%\n$SKY_SL$ +100%\n$SKY_AL$ +5%\n$SKY_CL$ +50%\n$SKY_RC$ +75%\n$SKY_line$\nApplies to marked $concept_state$s."
 SKY_B6_STATE_TT_EFF_RADICALS: "#BOLD Radicals#!\n\n$SKY_LC$ +0.2\n$SKY_SL$ +1.0\n$SKY_AL$ +0.05\n$SKY_CL$ Try to neutralize\n$SKY_line$\n#lore Ctrl reduces both radicals and loyalists.#!"
 SKY_B6_STATE_TT_EFF_RELIGION: "#BOLD Change Religion#!\n\n$SKY_LC$ Change to our religion 100%\n$SKY_SL$ Change to our religion 50%\n$SKY_AL$ Change to marked country religion 100%\n$SKY_CL$ Change to our religion 20%\n$SKY_RC$ Change to our religion 75%\n$SKY_line$\nApplies to marked $concept_state$s."
 SKY_B6_STATE_TT_EFF_CULTURE: "#BOLD Change Culture#!\n\n$SKY_LC$ Change to our primary culture 100%\n$SKY_SL$ Change to our primary culture 50%\n$SKY_AL$ Change to marked country primary culture 100%\n$SKY_CL$ Change to our primary culture 20%\n$SKY_RC$ Change to our primary culture 75%\n$SKY_line$\nApplies to marked $concept_state$s."
 SKY_B6_STATE_TT_EFF_LITERACY: "#BOLD Literacy#!\n\n$SKY_LC$ Set to 100%\n$SKY_SL$ Set to 50%\n$SKY_AL$ Set to 1%\n$SKY_CL$ Set to 20%\n$SKY_RC$ Set to 75%\n$SKY_line$\nApplies to marked $concept_state$s."
 SKY_B6_STATE_TT_EFF_QUALIFICATIONS: "#BOLD Qualifications#!\n\n$SKY_LC$ Set to 100%\n$SKY_SL$ Set to 50%\n$SKY_AL$ Set to 1%\n$SKY_CL$ Set to 20%\n$SKY_RC$ Set to 75%\n$SKY_line$\nApplies to marked $concept_state$s."
 SKY_B6_STATE_TT_EFF_POLLUTION: "#BOLD Pollution#!\n\n$SKY_LC$ #P -20%#!\n$SKY_SL$ #P -100%#!\n$SKY_AL$ #P -5%#!\n$SKY_CL$ +20%\n$SKY_line$\nApplies to marked $concept_state$s."
 SKY_B6_STATE_TT_EFF_RESOURCE: "#BOLD $country_resource_discovery_chance_mult$#!\n\n$SKY_LC$ +20000%\n$SKY_SL$ +20%\n$SKY_AL$ +5%\n$SKY_CL$ #n -#!20%\n$SKY_RC$ Clear\n$SKY_line$\n#lore Increasing this makes resources easier to discover, but does not directly generate resources in the current $concept_state$.#!"
