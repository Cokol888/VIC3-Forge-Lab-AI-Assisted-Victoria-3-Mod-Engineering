 SKY_B5_TT_LOBBY_DISBAND: "#BOLD Disband $concept_political_lobby_short$#!\n\n$SKY_LC$ Disband the currently selected $concept_political_lobby_short$\n$SKY_SL$ Disband all $concept_political_lobby_short$s in this country\n$SKY_AL$ Disband all $concept_political_lobby_short$s in the marked country\n$SKY_line$\n#italic This $concept_political_lobby_short$ will permanently disappear. Shift/Alt does not require selecting a $concept_political_lobby_short$.#!"
 SKY_B5_TT_LOBBY_IG_JOIN: "#BOLD Join/Leave $concept_political_lobby_short$#!\n\n$SKY_LC$ Selected $concept_interest_group$ joins the selected $concept_political_lobby_short$\n$SKY_RC$ Selected $concept_interest_group$ leaves the selected $concept_political_lobby_short$\n$SKY_SL$ All $concept_interest_group$s in this country join the selected $concept_political_lobby_short$\n$SKY_CL$ Remove all members of the selected $concept_political_lobby_short$\n$SKY_line$\n#italic If the $concept_political_lobby_short$ belongs to a foreign country, the corresponding $concept_interest_group$ in that country is used automatically.\nLeft-click/right-click require both a $concept_interest_group$ and a $concept_political_lobby_short$ to be selected.#!"
 SKY_B5_TT_LOBBY_CREATE: "#BOLD Create $concept_political_lobby_short$#!\n\n$SKY_LC$ Create a pro-target-country $concept_political_lobby_short$ in this country\n$SKY_RC$ Create an anti-target-country $concept_political_lobby_short$ in this country\n$SKY_SL$ Create a pro-player $concept_political_lobby_short$ in the target country\n$SKY_AL$ Create an anti-player $concept_political_lobby_short$ in the target country\n$SKY_line$\n#italic Requires a marked target country. If a $concept_interest_group$ is selected, it is used as an initial member.#!"
 SKY_B5_TT_LOBBY_LEVERAGE: "#BOLD $country_lobby_leverage_generation_mult$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ -100%\n$SKY_RC$ Clear $concept_modifier$\n$SKY_line$\n#italic Affects the generation speed of $concept_power_bloc_leverage$ from all $concept_political_lobby_short$s in this country.#!\n$SKY_stackable$"
