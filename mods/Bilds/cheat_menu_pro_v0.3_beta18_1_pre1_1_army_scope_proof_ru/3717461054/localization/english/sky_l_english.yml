 SKY_B1_TT_BIRTH_RATE: "#BOLD Population Growth#!\n\n$SKY_LC$ +2000% for 1 year\n$SKY_AL$ +20% for 6 months\n$SKY_SL$ +99999% for 1 month\n$SKY_line$\n$SKY_CL$ #n -#!2000% for 1 year\n$SKY_RC$ Clear\n$SKY_line$\n$SKY_unstackable$"
