l_english:
 CMP_B7_STATUS_OK: "Last action: APPLIED — click to clear"
 CMP_B7_STATUS_NO_TARGET: "Last action: NO VALID TARGET — click to clear"
 CMP_B7_STATUS_SUBJECT_CONFLICT: "Last action: SUBJECT HAS ANOTHER OVERLORD — click to clear"
 CMP_B7_STATUS_SUBJECT_INVALID: "Last action: SUBJECT TYPE REJECTED — click to clear"
 CMP_B7_STATUS_TREATY_INVALID: "Last action: TREATY REJECTED BY GAME RULES — click to clear"
 CMP_B7_STATUS_NO_TREATY: "Last action: NO MATCHING TREATY FOUND — click to clear"
 CMP_B7_STATUS_NOT_SUBJECT: "Last action: TARGET IS NOT A VALID SUBJECT — click to clear"
 CMP_B7_TT_STATUS_OK: "The scripted action passed its checks and was applied. Click this bar to clear the status."
 CMP_B7_TT_STATUS_NO_TARGET: "No marked country/state required by this operation could be resolved. Check the TARGETS bar and try again."
 CMP_B7_TT_STATUS_SUBJECT_CONFLICT: "The country is already a subject of another overlord. CMP will not silently overwrite that hierarchy. Make it independent or choose the current overlord first."
 CMP_B7_TT_STATUS_SUBJECT_INVALID: "Victoria 3 rejected the requested subject type, or the post-action subject/type check did not match. Subject types have recognition/colonial/company restrictions in 1.13."
 CMP_B7_TT_STATUS_TREATY_INVALID: "can_create_treaty returned false for this exact treaty payload. The article may be impossible, mutually exclusive, already present, or fail its article/input rules."
 CMP_B7_TT_STATUS_NO_TREATY: "RMB removal found no treaty with the requested article between the player and marked country."
 CMP_B7_TT_STATUS_NOT_SUBJECT: "The requested autonomy/independence operation requires the relevant country to be a subject in the expected hierarchy."
 CMP_B7_TT_PROTECTORATE: "#BOLD Protectorate#!\nLMB: make the marked country our Protectorate. RMB: make us its Protectorate.\n\nCMP now verifies the resulting hierarchy/type and reports failure in the status bar."
 CMP_B7_TT_PUPPET: "#BOLD Puppet#!\nLMB: make the marked country our Puppet. RMB: make us its Puppet.\n\nCMP verifies the resulting hierarchy/type; incompatible 1.13 subject types are reported instead of failing silently."
 CMP_B7_TT_DOMINION: "#BOLD Dominion#!\nLMB: make the marked country our Dominion. RMB: make us its Dominion.\n\nResult is checked immediately and shown in the status bar."
 CMP_B7_TT_VASSAL: "#BOLD Vassal#!\nLMB: make the marked country our Vassal. RMB: make us its Vassal.\n\nResult is checked immediately; subject restrictions are not silently ignored."
 CMP_B7_TT_TRIBUTARY: "#BOLD Tributary#!\nLMB: make the marked country our Tributary. RMB: make us its Tributary.\n\nThis type is generally tied to unrecognized overlords; invalid results are reported."
 CMP_B7_TT_COLONY: "#BOLD Colony#!\nLMB: make the marked country our Colony. RMB: make us its Colony.\n\nCompany/colonial country restrictions can apply; CMP reports a rejected result."
 CMP_B7_TT_CHARTERED_COMPANY: "#BOLD Chartered Company#!\nLMB: make the marked country our Chartered Company. RMB: reverse.\n\nCompany-country restrictions are strict in 1.13; CMP verifies the resulting type."
 CMP_B7_TT_CROWN_LAND: "#BOLD Crown Land#!\nLMB: make the marked country our Crown Land. RMB: reverse.\n\nCMP verifies the resulting hierarchy/type and reports rejection."
 CMP_B7_TT_AUTONOMY_INDEPENDENCE: "#BOLD Autonomy / Independence#!\nLMB: decrease marked subject autonomy. RMB: increase it. Shift+LMB: make player independent. Alt+LMB: make marked subject independent.\n\nIf the required subject relationship is absent, the status bar explains the failure."
 CMP_B7_TT_TR_ALLIANCE: "#BOLD Alliance treaty#!\nLMB: create a 99-year alliance. RMB: withdraw from treaties containing this article.\n\nCreation runs Victoria 3's can_create_treaty validation; rejection is shown in the status bar."
 CMP_B7_TT_TR_DEFENSIVE_PACT: "#BOLD Defensive Pact#!\nLMB: create for 99 years. RMB: withdraw from matching treaty article.\n\nCreation is validated by can_create_treaty."
 CMP_B7_TT_TR_GUARANTEE: "#BOLD Guarantee Independence#!\nLMB: create directed treaty article. RMB: remove matching article/treaty participation.\n\nCreation is validated by can_create_treaty."
 CMP_B7_TT_TR_SUPPORT: "#BOLD Support Independence#!\nLMB: create directed treaty article. RMB: remove matching article/treaty participation.\n\nCreation is validated by can_create_treaty."
 CMP_B7_TT_TR_TREATY_PORT: "#BOLD Treaty Port#!\nLMB: marked foreign state -> treaty port for us. RMB: marked home state -> treaty port for marked country.\n\nBoth country and state inputs are validated by can_create_treaty; invalid payloads are reported."
 CMP_B7_STATUS_STATE_TRANSFER_FAILED: "Last action: STATE TRANSFER NOT CONFIRMED — click to dismiss"
 CMP_B7_STATUS_TREATY_PORT_ATTEMPTED: "Last action: TREATY PORT COMMAND SENT — verify map after a game tick"
 CMP_B7_TT_STATUS_STATE_TRANSFER_FAILED: "CMP executed set_state_owner, but the immediate owner check did not confirm the transfer. Check state restrictions and the game log."
 CMP_B7_TT_STATUS_TREATY_PORT_ATTEMPTED: "Direct cede_treaty_port creates/transfers a treaty-port split rather than behaving like ordinary whole-state ownership, so checking the whole state's owner immediately would be misleading. The command was issued; verify the port after a game tick."
 CMP_B7_TT_INCREASE_RELATIONS: "Increase relations with the marked country. LMB +20, Alt +1, Ctrl +50, Shift +1000. Operation result is shown in the status line."
 CMP_B7_TT_DECREASE_RELATIONS: "Decrease relations with the marked country. LMB -20, Alt -1, Ctrl -50, Shift -1000. Operation result is shown in the status line."
 CMP_B7_TT_OBLIGATION: "Obligation. LMB: marked country owes the player. RMB: player owes the marked country. A marked country is required; result is shown in the status line."
 CMP_B7_TT_DIRECT_TREATY_PORT: "Direct treaty port. LMB: acquire a port from the marked foreign state. RMB: grant a port to the marked country from a marked home state. This is not an ordinary whole-state transfer; verify the map after a game tick."
 CMP_B7_TT_CEDE_HOME_STATE: "Cede a marked home state to the marked country. LMB: transfer. RMB: transfer and incorporate for the recipient. CMP verifies the new owner after the operation."
 CMP_B7_TT_TAKE_FOREIGN_STATE: "Take marked states from the marked country. LMB: transfer to player. RMB: transfer and incorporate. CMP reports whether at least one eligible state was processed."
