 CMP_ARMY_DESIGNER_TITLE:0 "Army Template Designer"
 CMP_ARMY_DESIGNER_DESC:0 "Choose total size and role shares. Infantry and artillery are explicit; mobile troops receive the remainder. Each role uses the highest supported researched tier."
 CMP_ARMY_DESIGNER_SIZE:0 "Size"
 CMP_ARMY_DESIGNER_INF:0 "Infantry"
 CMP_ARMY_DESIGNER_ART:0 "Artillery"
 CMP_ARMY_DESIGNER_MOBILE_NOTE:0 "Mobile share = remainder to 100% (0–50% with the available controls)."
 CMP_ARMY_DESIGNER_CREATE:0 "CREATE CUSTOM ARMY"
 CMP_ARMY_DESIGNER_CREATE_TT:0 "Creates one regular mixed formation in the highest-GDP marked player state. The button requires a marked state and at least one unlocked artillery and mobile unit."
 CMP_ARMY_DESIGNER_CLEAR:0 "Reset designer"
 CMP_ARMY_DESIGNER_OK:0 "Custom army created"
 CMP_ARMY_DESIGNER_FAIL:0 "Custom army was not created — check state and technologies"
 CMP_ARMY_DESIGNER_BEST_NOTE:0 "Beta7 uses “best available” role tiers. Exact per-role tier locking is intentionally deferred until runtime validation is complete."
 CMP_ARMY_AMPH_TITLE:0 "Amphibious Builder"
 CMP_ARMY_AMPH_DESC:0 "Creates an all-Marine regular formation in a marked player state with a port. Uses the best verified Tech & Res Marine tier unlocked by your technology."
 CMP_ARMY_AMPH_TECH_OK:0 "Marine technology: OK"
 CMP_ARMY_AMPH_TECH_NO:0 "Marine technology: locked"
 CMP_ARMY_AMPH_PORT_OK:0 "Marked port state: OK"
 CMP_ARMY_AMPH_PORT_NO:0 "Marked port state: required"
 CMP_ARMY_AMPH_CREATE:0 "CREATE MARINE FORCE"
 CMP_ARMY_AMPH_CREATE_TT:0 "Creates an all-Marine formation. Victoria 3 1.13 allows all-Marine formations to be attached to fleets; automatic fleet attachment is not scripted in beta7."
 CMP_ARMY_AMPH_CLEAR:0 "Reset Marines"
 CMP_ARMY_AMPH_OK:0 "Marine formation created"
 CMP_ARMY_AMPH_FAIL:0 "Marine formation was not created — check port state and technology"
 CMP_ARMY_AMPH_SCOPE_NOTE:0 "Vanilla low/mid/high Marine tiers are not spawned yet because their exact current unlock gates are not present in the supplied files. Verified T&R tiers only: Modern / Advanced."
 CMP_ARMY_ROLE_FIX_TT:0 "Beta7 fixes auto-role mapping: T&R Modern Heavy Tank is an artillery-group unit; Modern Light Tanks is the mobile/cavalry-group unit."
