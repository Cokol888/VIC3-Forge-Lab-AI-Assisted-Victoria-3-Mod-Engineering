 CMP_MIL_ARMY_STATE_TARGET_NONE:0 "#N A marked owned state is required#!"
 CMP_WS_MIL_HELP_MARINES:0 "#tooltip_header Marine formation#!\n$CMP_ARMY_AMPH_DESC$\n\nA marked player state with a port, Marine amount and verified Marine technology are required.\n\n#BOLD Manual step#!\nAutomatic army-to-fleet attachment is not attempted. Attach the created formation in the normal game interface."
 CMP_WS_MIL_HELP_TASKFORCE:0 "#tooltip_header Landing force#!\n$CMP_TASKFORCE_DESC$\n\n$CMP_TASKFORCE_PREPARE_TT$\n\n#BOLD Required#!\nAn eligible marked fleet, a marked player port state, Marine amount, Marine technology and compatible naval technology.\n\n#BOLD After preparation#!\n$CMP_TASKFORCE_RESULT$"
