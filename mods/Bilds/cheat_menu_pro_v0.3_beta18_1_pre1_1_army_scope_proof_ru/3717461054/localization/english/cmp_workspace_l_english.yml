 CMP_WS_POP_HELP_OVERVIEW:0 "#tooltip_header Population & Society 2.0#!\n$CMP_POP2_DESC$\n\n#BOLD Workflow#!\n1. Open Targets and choose marked home states, incorporated states or marked foreign states.\n2. Choose one of four Population tabs.\n3. Configure a value and run an explicit action.\n4. Read the result in the fixed footer.\n\nControls and feedback remain fixed while only the active tab content scrolls."
 CMP_WS_POP_HELP_POPULATION:0 "#tooltip_header Population and literacy#!\n$CMP_POP2_POP_DESC$\n\n#BOLD Add#!\n$CMP_POP2_TT_ADD$\n\n#BOLD Remove#!\n$CMP_POP2_TT_REMOVE$\n\n#BOLD Literacy#!\n$CMP_POP2_LITERACY_DESC$\n$CMP_POP2_TT_SET_LITERACY$"
 CMP_WS_POP_HELP_PROFESSIONS:0 "#tooltip_header Professions and qualifications#!\n$CMP_POP2_PROF_DESC$\n\n#BOLD Create a cohort#!\n$CMP_POP2_TT_SPAWN_PROF$\n\n#BOLD Set qualification#!\n$CMP_POP2_QUAL_DESC$\n$CMP_POP2_TT_APPLY_QUAL$"
 CMP_WS_POP_HELP_WELFARE:0 "#tooltip_header Welfare and politics#!\n$CMP_POP2_WELFARE_DESC$\n\n#BOLD Wealth#!\n$CMP_POP2_TT_SET_WEALTH$\n\n#BOLD Political population#!\nLoyalist and radical actions add or reduce the selected share in every target state. Neutralize clears both accumulated shares."
 CMP_WS_POP_HELP_SOCIETY:0 "#tooltip_header Society#!\n$CMP_POP2_SOCIETY_DESC$\n\n#BOLD Migration#!\n$CMP_POP2_TT_MIGRATION$\n\n#BOLD Working-adult share#!\n$CMP_POP2_TT_WORKFORCE$\n\n#BOLD Identity safety#!\n$CMP_POP2_TT_CONFIRM$\n$CMP_POP2_TT_ASSIMILATE$\n$CMP_POP2_TT_CONVERT$\n\nPresets retain their existing gameplay behavior and report the result in the footer."
