 CMP_WS_POP_HELP_OVERVIEW_TT:0 "#tooltip_header Population & Society 2.0#!\nCompact controls, a state-target indicator and a fixed result footer. Click for detailed help."
 CMP_WS_POP_HELP_POPULATION_TT:0 "#tooltip_header Population and literacy#!\nClick for exact amount, add/remove and literacy rules."
