 CMP_WS_MIL_HELP_TITLE:0 "Help: Army & Fleet"
 CMP_WS_MIL_HELP_OVERVIEW_TT:0 "#tooltip_header Army & Fleet 2.0#!\nCompact military workflows, technology gates and fixed results. Click for detailed help."
 CMP_WS_MIL_HELP_ARMY_TT:0 "#tooltip_header Army Builder#!\nClick for state targeting, unit technology and formation-creation rules."
 CMP_WS_MIL_HELP_TEMPLATES_TT:0 "#tooltip_header Army templates#!\nClick for quick, mixed and custom composition rules."
 CMP_WS_MIL_HELP_CONTROLS_TT:0 "#tooltip_header Army Controls#!\nClick for target, parameter, exact value and reset rules."
 CMP_WS_MIL_HELP_FLEET_TT:0 "#tooltip_header Navy 2.0#!\nClick for the new mixed-fleet composition builder and exact selected existing-fleet workflow."
 CMP_WS_MIL_HELP_FLEET_TEMPLATES_TT:0 "#tooltip_header Fleet templates#!\nClick for share calculation and technology requirements."
 CMP_WS_MIL_HELP_MARINES_TT:0 "#tooltip_header Marines#!\nClick for port, Marine technology and manual attachment rules."
 CMP_WS_MIL_HELP_TASKFORCE_TT:0 "#tooltip_header Landing force#!\nClick for fleet support, marked port and post-creation steps."
 CMP_WS_MIL_HELP_OVERVIEW:0 "#tooltip_header Army & Fleet 2.0#!\n\nThe workspace unifies the existing Army Builder, templates, Army Controls, Fleet Builder, Fleet Designer and landing-force workflow without changing their gameplay effects.\n\n#BOLD Workflow#!\n1. Mark the required state, country or fleet.\n2. Choose a military tab.\n3. Configure the formation, fleet or parameter.\n4. Run the explicit action.\n5. Read the result in the fixed footer.\n\nTechnology gates remain mandatory; a grey control is not a shortcut around research."
 CMP_WS_MIL_HELP_ARMY:0 "#tooltip_header Army Builder#!\n$CMP_ARMY_BUILDER_DESC$\n\n#BOLD Target#!\nThis workflow creates a new formation in a marked owned state, so it does not need an existing-army selector.\n\nUnit lists are filtered into Infantry & Marines, Artillery, and Cavalry & Armor. Every shortened label exposes its full localized name and technology in a tooltip.\n\n#BOLD Validation#!\n$CMP_ARMY_BUILDER_APPLY_TT$\n\n$CMP_ARMY_BUILDER_RUNTIME_NOTE$"
 CMP_WS_MIL_HELP_TEMPLATES:0 "#tooltip_header Army templates#!\n\nEvery template creates a new formation in the marked owned state. Templates do not edit an existing army.\n\n#BOLD Quick presets#!\n$CMP_ARMY_BUILDER_QUICK_TITLE$\nA quick preset only selects the best unlocked unit and amount; press Create Army afterward.\n\n#BOLD Mixed templates#!\n$CMP_ARMY_MIXED_DESC$\n\n#BOLD Designer#!\n$CMP_ARMY_DESIGNER_DESC$\n$CMP_ARMY_DESIGNER_MOBILE_NOTE$"
 CMP_WS_MIL_HELP_CONTROLS:0 "#tooltip_header Army Controls#!\n$CMP_ARMY_CONTROL_DESC$\n\nThe target here is a country: the player country or the marked country. A modifier affects its armed forces as a whole, so there is no individual-army dropdown.\n\n#BOLD Exact levels#!\nCombat and speed parameters: +10%, +25%, +50%, +100%, +500%.\nCosts, supply and casualty war exhaustion: −10%, −25%, −50%, −75%, −90%.\n\n$CMP_ARMY_CONTROL_NOTE$"
 CMP_WS_MIL_HELP_FLEET:0 "#tooltip_header Navy 2.0#!\n#BOLD New fleet#!\nChoose independent counts for several ship types and mark an owned state with a port. One action creates one fleet formation with the combined composition. Presets only fill the composition and never create immediately.\n\n#BOLD Selected fleet#!\n$CMP_MIL_TARGET_FLEET_SELECT_TT$\n\nThe beta17 compatibility path adds ships only to the exact selected existing fleet. Silent first-eligible fallback is forbidden. Transfer, flagship and supply ships remain behind separate beta18 gates."
 CMP_WS_MIL_HELP_FLEET_TEMPLATES:0 "#tooltip_header Fleet Template Designer#!\n$CMP_FD_DESC$\n\nThe top row selects exactly one target fleet and is shared by the designer and amphibious task force. Choose size, escort, carrier and submarine shares. Capital ships receive the remainder. Carrier and submarine choices stay disabled until their technologies are researched.\n\n$CMP_FD_APPLY_TT$"
 CMP_MIL_ARMY_STATE_TARGET_OPEN:0 "Select creation state"
