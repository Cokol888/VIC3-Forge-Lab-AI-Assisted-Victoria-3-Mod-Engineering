 CMP_WS_POL_HELP_OVERVIEW_TT:0 "#tooltip_header Politics & Characters 2.0#!\nCompact tabs, context-sensitive target status and a fixed result footer. Click for detailed help."
 CMP_WS_POL_HELP_GOVERNMENT_TT:0 "#tooltip_header Government#!\nClick for parameters, institutions, eligibility and reset rules."
