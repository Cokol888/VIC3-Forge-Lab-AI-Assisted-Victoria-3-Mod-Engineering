 CMP_WS_RB_OP_ADD_TT:0 "#tooltip_header Add#!\nAdds levels one by one only while the state/building remains constructible and within its level/resource-potential cap."
 CMP_WS_RB_OP_SET_TT:0 "#tooltip_header Set safely#!\nRaises the building to the selected level without deleting it. If the existing level is higher, the operation is blocked instead of recreating the building."
 CMP_WS_RB_OP_CLEAR_TT:0 "#tooltip_header Remove / clear#!\nFor buildings, removes the entire selected building. For resources, clears the selected potential."
 CMP_WS_RB_SET_WARNING:0 "#Y Safe SET: raising is allowed; lowering is blocked to avoid destructive recreation and loss of internal state.#!"
