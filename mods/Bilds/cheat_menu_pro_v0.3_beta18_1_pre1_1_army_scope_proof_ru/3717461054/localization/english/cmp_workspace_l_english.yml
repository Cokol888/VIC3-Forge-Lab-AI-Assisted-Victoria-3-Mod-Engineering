 CMP_WS_RB_HELP_TITLE:0 "Help: Regions & Buildings"
 CMP_WS_RB_HELP_OVERVIEW_TT:0 "#tooltip_header Regions & Buildings 2.0#!\nThe compact surface keeps only workflow, selection, warnings and result visible. Click for detailed help."
 CMP_WS_RB_HELP_BUILDINGS_TT:0 "#tooltip_header Building operations#!\nClick for help about adding, setting and removing levels."
 CMP_WS_RB_HELP_RESOURCES_TT:0 "#tooltip_header Resource potential#!\nClick for help about resources and Tech & Res compatibility."
 CMP_WS_RB_HELP_PRESETS_TT:0 "#tooltip_header Ready-made presets#!\nClick to inspect the purpose and contents of all four presets."
 CMP_WS_RB_HELP_STAFFING_TT:0 "#tooltip_header Staffing Assistant#!\nClick for help about workforce profiles, reserves and occupancy thresholds."
 CMP_WS_RB_HELP_OVERVIEW:0 "#tooltip_header Regions & Buildings 2.0#!\n\n#BOLD Workflow#!\n1. Choose Operations or Staffing.\n2. Choose an object on the left.\n3. Configure parameters on the right.\n4. Click a target-state group.\n5. Read the result in the fixed footer.\n\nObject lists scroll independently, so configuration and apply buttons stay in place. A grey target button means the selection is incomplete or no eligible state exists."
 CMP_WS_RB_HELP_BUILDINGS:0 "#tooltip_header Buildings#!\n$CMP_RB2_HINT$\n\n#BOLD Categories#!\nOperations use the same functional taxonomy as Staffing: All, Primary, Industry, Infrastructure, Public, Military, Services and Ownership. The operations registry contains 92 guarded building types. Game-managed ownership objects remain intentionally unavailable for direct ADD/SET/REMOVE.\n\n#BOLD Add#!\nAdds levels one at a time and checks state constructibility plus the existing building queue/level or resource-potential cap before each level.\n\n#BOLD Set#!\nSafely raises to the selected level. Lowering is refused so production methods, ownership, cash reserves and other runtime state are not destroyed by recreation.\n\n#BOLD Remove#!\nRemoves the whole selected building; there is no misleading per-level amount for this operation."
 CMP_WS_RB_HELP_RESOURCES:0 "#tooltip_header Resource potential#!\nOnly resource buildings supported by the registry appear in the list. Add increases potential, Set recreates an exact value, and Remove clears it.\n\nFor Tech & Res objects, an exact Set synchronizes the geology trait only when the value matches a registered geology tier."
 CMP_WS_RB_HELP_PRESETS:0 "#tooltip_header Ready-made presets#!\n#BOLD Industrial Core#! — tools, steel, engines, power plants, railways and construction.\n#BOLD Heavy Industry#! — steel, engines, chemicals, explosives, power and railways.\n#BOLD Military Industry#! — arms, artillery, munitions, steel, explosives and railways.\n#BOLD Infrastructure Hub#! — railways, ports, construction and power plants.\n\nPresets apply registered exact levels to the selected group of states."
 CMP_WS_RB_HELP_STAFFING:0 "#tooltip_header Staffing Assistant#!\n$CMP_STAFF_HINT$\n\n$CMP_STAFF_ADAPTIVE_HINT$\n\n#BOLD Coverage 2.1#!\nStaffing now uses an independent registry instead of the 56-building construction catalog. The Workspace exposes 97 audited employable buildings; special monuments and unresolved company/canal cases are explicitly classified in the coverage registry instead of disappearing silently.\n\n#BOLD Categories#!\nStaffing has its own category state. Switching its filter does not change the Operations building selection.\n\n#BOLD Workflow#!\nChoose a building, reserve size, optional occupancy threshold and target. The profession profile is selected automatically from the staffing registry."
