 CMP_WS_DIP_HELP_OVERVIEW:0 "#tooltip_header Diplomacy & Sovereignty 2.0#!\n\n#BOLD Workflow#!\n1. Mark the required country, state or Power Bloc in Targets.\n2. Choose one of five tabs.\n3. Run an explicit action.\n4. Read the result in the fixed footer.\n\nOnly active-tab content scrolls. Long explanations are kept here; target state and destructive warnings stay visible."
 CMP_WS_DIP_HELP_RELATIONS:0 "#tooltip_header Relations and obligations#!\n\nRelation actions change the bilateral relation with the marked country by the displayed amount. Maximum and minimum use the established large legacy steps. Obligations explicitly choose which side owes the other."
 CMP_WS_DIP_HELP_SUBJECTS:0 "#tooltip_header Subject relations#!\n\nThe two directions are intentionally separate. The operation checks for a valid target, conflicting overlord and accepted subject type. Autonomy actions require an existing subject relation; independence reports when the required relation is absent."
 CMP_WS_DIP_HELP_TREATIES:0 "#tooltip_header Bilateral treaties#!\n\nCreation uses the game's treaty eligibility check. Removal searches for the matching treaty and reports when none exists. Each row changes exactly one treaty type."
 CMP_WS_DIP_HELP_SOVEREIGNTY:0 "#tooltip_header Sovereignty#!\n\nHome-state actions give the marked player state to the marked country. Foreign-state actions take the marked foreign state for the player. Incorporated variants additionally incorporate the transferred state. Treaty-port operations require map verification after a tick."
 CMP_WS_DIP_HELP_POWER_BLOC:0 "#tooltip_header Power Bloc#!\n\n#BOLD Cohesion#!\nFour verified actions adjust the marked bloc's cohesion.\n\n#BOLD Forced membership#!\nTwo expert actions directly add the player country or the marked country to the marked bloc. This is not an invitation: normal leverage, acceptance and cooldown rules are bypassed. The country must belong to no bloc beforehand; after the command the UI checks actual membership and reports a distinct result. Confirmation permits one action only.\n\n#BOLD Deferred#!\nNormal invitation and leaving need their own persistent workflow. Principles depend on Sphere of Influence, bloc identity, slot count and change cooldown. Leverage drifts weekly. These actions will not enter the Workspace without negative-case, tick and save/load verification."
