 CMP_WS_POL_HELP_OVERVIEW:0 "#tooltip_header Politics & Characters 2.0#!\n$CMP_POL2_DESC$\n\n#BOLD Workflow#!\n1. Choose the required target in Targets.\n2. Open one of five Politics tabs.\n3. Configure and execute an explicit action.\n4. Read the result in the fixed footer.\n\nOnly active-tab content scrolls. Target status, tabs and result remain visible. Long explanations stay in this help layer."
 CMP_WS_POL_HELP_GOVERNMENT:0 "#tooltip_header Government#!\n$CMP_POL2_GOV_DESC$\n\n#BOLD Parameters#!\nChoose one parameter and one magnitude, then Apply. Reset removes only Politics 2.0 government modifiers.\n\n#BOLD Institutions#!\n$CMP_POL2_INST_TT$\nChoose an institution and exact level 1–5, then apply it to eligible country targets."
 CMP_WS_POL_HELP_CHARACTERS:0 "#tooltip_header Marked character#!\n$CMP_POL2_CHAR_DESC$\n\nHealth and popularity are replaceable boosts, not exact internal values. Commander rank is available only to a marked General or Admiral. Removing a military role is destructive.\n\n#BOLD Age#!\n$CMP_POL2_AGE_NOTE$"
 CMP_WS_POL_HELP_IG:0 "#tooltip_header Interest Groups#!\n$CMP_POL2_IG_DESC$\n\nSelect one or more standard groups, then replace their approval or political-strength modifier on every eligible country target.\n\n#BOLD Political strength#!\n$CMP_POL2_IG_STRENGTH_NOTE$"
 CMP_WS_POL_HELP_LAWS:0 "#tooltip_header Current law enactment#!\n$CMP_POL2_LAW_DESC$\n\nProgress and phase controls use the current enactment. Add Setback worsens it; Complete and Cancel immediately change its state. Group targets skip countries without an active enactment."
 CMP_WS_POL_HELP_BLOC:0 "#tooltip_header Power Bloc cohesion#!\n$CMP_POL2_BLOC_DESC$\n\n$CMP_POL2_BLOC_NOTE$\n\nThe verified controls add or remove cohesion, or set it to 100."
