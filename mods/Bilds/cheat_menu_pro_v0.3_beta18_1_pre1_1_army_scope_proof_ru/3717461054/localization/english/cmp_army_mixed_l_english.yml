l_english:
 CMP_ARMY_MIXED_TITLE:0 "Mixed formation templates (technology-aware)"
 CMP_ARMY_MIXED_DESC:0 "Select a 50-battalion composition. Each role automatically uses the highest supported unit whose technology you have researched."
 CMP_ARMY_MIXED_BALANCED:0 "Balanced 50"
 CMP_ARMY_MIXED_BALANCED_TT:0 "25 infantry / 15 artillery / 10 mobile battalions. Requires at least one unlocked artillery and mobile unit."
 CMP_ARMY_MIXED_INFANTRY:0 "Infantry 50"
 CMP_ARMY_MIXED_INFANTRY_TT:0 "35 infantry / 10 artillery / 5 mobile battalions. A conservative infantry-heavy composition."
 CMP_ARMY_MIXED_BREAKTHROUGH:0 "Breakthrough 50"
 CMP_ARMY_MIXED_BREAKTHROUGH_TT:0 "20 infantry / 15 artillery / 15 mobile battalions. More firepower and mobility."
 CMP_ARMY_MIXED_ARMOR:0 "Armored Fist 50"
 CMP_ARMY_MIXED_ARMOR_TT:0 "15 infantry / 10 artillery / 25 mobile battalions. Requires Mobile Armor; later Tech & Res armor is selected automatically when researched."
 CMP_ARMY_MIXED_CREATE:0 "CREATE TEMPLATE"
 CMP_ARMY_MIXED_CREATE_TT:0 "Creates one new regular army in the marked player state. If several states are marked, the highest-GDP marked state is used."
 CMP_ARMY_MIXED_CLEAR:0 "Reset template"
 CMP_ARMY_MIXED_RESULT_OK:0 "Template army created"
 CMP_ARMY_MIXED_RESULT_FAIL:0 "Template could not be created — check target and technologies"
 CMP_ARMY_MIXED_NOTE:0 "Templates are convenience starting compositions, not a claim of an optimal combat meta."
