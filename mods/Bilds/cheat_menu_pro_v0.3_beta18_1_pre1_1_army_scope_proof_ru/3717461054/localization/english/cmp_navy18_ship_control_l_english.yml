 CMP_NAVY18_SHIPCTRL_SET_FLAGSHIP:0 "SET AS FLAGSHIP"
 CMP_NAVY18_SHIPCTRL_UNSET_FLAGSHIP:0 "UNSET FLAGSHIP"
 CMP_NAVY18_SHIPCTRL_FLAGSHIP_TT:0 "Changes flagship state only for the exact selected ship. Ships in battle or hulls that cannot be flagships block the action."
 CMP_NAVY18_SHIPCTRL_CLEAR:0 "Clear ship selection"
 CMP_NAVY18_SHIPCTRL_CLEAR_TT:0 "Clears the temporary exact-ship marker from player fleets."
