l_english:
 CMP_NAVY18_MODE_SHIPCTRL:0 "SHIPS"
 CMP_NAVY18_SHIPCTRL_TITLE:0 "Exact Ship Control"
 CMP_NAVY18_SHIPCTRL_DESC:0 "Select a fleet through Victoria 3 native flow, then select an exact ship by its position in the current fleet ordering. The exact marker is stored on the Ship object and does not depend on resolving the fleet again."
 CMP_NAVY18_SHIPCTRL_ORDER_NOTE:0 "Slots 1–100 are ordered by power projection among non-destroyed ships. Once selected, the marker stays on that exact Ship even if ordering changes."
 CMP_NAVY18_SHIPCTRL_SELECT_FLEET_FIRST:0 "Select a fleet first using Select / change fleet."
 CMP_NAVY18_SHIPCTRL_PAGE:0 "Ship page"
 CMP_NAVY18_SHIPCTRL_SLOT_TT:0 "Select the exact ship at this position. Disabled positions mean the fleet has fewer non-destroyed ships."
 CMP_NAVY18_SHIPCTRL_SELECTED:0 "Selected ship"
 CMP_NAVY18_SHIPCTRL_NONE:0 "No ship selected"
 CMP_NAVY18_SHIPCTRL_LOST:0 "The selected ship no longer exists — select another ship."
 CMP_NAVY18_SHIPCTRL_TYPE:0 "Type:"
 CMP_NAVY18_SHIPCTRL_STATUS:0 "Status"
 CMP_NAVY18_SHIPCTRL_FLAGSHIP:0 "#P Flagship#!"
 CMP_NAVY18_SHIPCTRL_NOT_FLAGSHIP:0 "Not flagship"
