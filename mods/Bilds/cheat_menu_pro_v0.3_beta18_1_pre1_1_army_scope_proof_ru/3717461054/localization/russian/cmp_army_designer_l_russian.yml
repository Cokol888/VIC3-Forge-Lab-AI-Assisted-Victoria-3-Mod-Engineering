l_russian:
 CMP_ARMY_DESIGNER_TITLE:0 "Конструктор шаблона армии"
 CMP_ARMY_DESIGNER_DESC:0 "Выберите общий размер и доли ролей. Пехота и артиллерия задаются явно, мобильные войска получают остаток. Для каждой роли берётся лучший изученный поддерживаемый уровень."
 CMP_ARMY_DESIGNER_SIZE:0 "Размер"
 CMP_ARMY_DESIGNER_INF:0 "Пехота"
 CMP_ARMY_DESIGNER_ART:0 "Артиллерия"
 CMP_ARMY_DESIGNER_MOBILE_NOTE:0 "Доля мобильных войск = остаток до 100% (0–50% при доступных настройках)."
 CMP_ARMY_DESIGNER_CREATE:0 "СОЗДАТЬ СВОЮ АРМИЮ"
 CMP_ARMY_DESIGNER_CREATE_TT:0 "Создаёт одну смешанную регулярную армию в отмеченной своей области с наибольшим ВВП. Нужна отмеченная область и хотя бы один открытый тип артиллерии и мобильных войск."
 CMP_ARMY_DESIGNER_CLEAR:0 "Сброс конструктора"
 CMP_ARMY_DESIGNER_OK:0 "Своя армия создана"
 CMP_ARMY_DESIGNER_FAIL:0 "Армия не создана — проверьте область и технологии"
 CMP_ARMY_DESIGNER_BEST_NOTE:0 "В бета 7 используется режим «лучший доступный» для каждой роли. Жёсткий выбор конкретного уровня будет добавлен после проверки в игре."
 CMP_ARMY_AMPH_TITLE:0 "Конструктор морской пехоты"
 CMP_ARMY_AMPH_DESC:0 "Создаёт полностью морскую регулярную армию в отмеченной своей области с портом. Используется лучший проверенный уровень морпехов Tech & Res, открытый технологиями."
 CMP_ARMY_AMPH_TECH_OK:0 "Технология морпехов: OK"
 CMP_ARMY_AMPH_TECH_NO:0 "Технология морпехов: закрыта"
 CMP_ARMY_AMPH_PORT_OK:0 "Отмеченная область с портом: OK"
 CMP_ARMY_AMPH_PORT_NO:0 "Нужна отмеченная область с портом"
 CMP_ARMY_AMPH_CREATE:0 "СОЗДАТЬ МОРПЕХОВ"
 CMP_ARMY_AMPH_CREATE_TT:0 "Создаёт полностью морское армейское соединение. В Victoria 3 1.13 полностью морские армии можно прикреплять к флотам; автоматическое прикрепление к флоту в бета 7 не скриптуется."
 CMP_ARMY_AMPH_CLEAR:0 "Сброс морпехов"
 CMP_ARMY_AMPH_OK:0 "Армия морпехов создана"
 CMP_ARMY_AMPH_FAIL:0 "Морпехи не созданы — проверьте порт и технологию"
 CMP_ARMY_AMPH_SCOPE_NOTE:0 "Базовые морпехи низкого/среднего/высокого уровня пока не спавнятся: их точные текущие условия разблокировки отсутствуют в переданных файлах. Используются только проверенные T&R: современный / продвинутый."
 CMP_ARMY_ROLE_FIX_TT:0 "В бета 7 исправлен автоподбор ролей: T&R: современный тяжёлый танк относится к артиллерийской группе, а современные лёгкие танки — к мобильной/кавалерийской."
 CMP_ARMY_DESIGNER_SIZE_25:0 "25"
 CMP_ARMY_DESIGNER_SIZE_50:0 "50"
 CMP_ARMY_DESIGNER_SIZE_75:0 "75"
 CMP_ARMY_DESIGNER_SIZE_100:0 "100"
