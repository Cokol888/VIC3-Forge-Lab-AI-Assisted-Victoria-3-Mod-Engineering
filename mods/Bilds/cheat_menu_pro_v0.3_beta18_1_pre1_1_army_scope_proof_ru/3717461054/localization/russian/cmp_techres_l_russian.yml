l_russian:
 CMP_TR_HEADER: "Tech & Res — геология и шаблоны областей"
 CMP_TR_TT_RESOURCE_CATEGORY: "#BOLD Ресурсы#!\nИспользуйте явные кнопки Обычные и T&R в переключателе категории ресурсов."
 CMP_TR_TIER_HINT: "Уровень геологии: число на кнопке = точный потенциал ресурса. ЛКМ — отмеченные области игрока, Alt+ЛКМ — все инкорпорированные области, ПКМ — области отмеченной страны."
 CMP_TR_RESOURCE_ADD: "ДОБАВИТЬ"
 CMP_TR_RESOURCE_SET: "ЗАДАТЬ"
 CMP_TR_RESOURCE_CLEAR: "ОЧИСТИТЬ"
 CMP_TR_TT_NUMERIC_ADD: "#BOLD Добавить потенциал ресурса#!\nПрибавляет выбранное ползунком значение к существующему потенциалу. Если ресурса нет — создаёт его с этим значением."
 CMP_TR_TT_NUMERIC_SET: "#BOLD Задать потенциал ресурса#!\nЗаменяет существующий потенциал точным значением ползунка. Значение 0 удаляет потенциал."
 CMP_TR_TT_NUMERIC_CLEAR: "#BOLD Очистить потенциал ресурса#!\nУдаляет потенциал выбранного ресурса независимо от положения ползунка."
 CMP_TR_TT_GEO_ADD: "#BOLD Добавить геологию Tech & Res#!\nДобавляет официальное значение выбранного уровня Tech & Res. Геологический trait не меняется, поскольку после накопления потенциал может перестать соответствовать каноническому уровню."
 CMP_TR_TT_GEO_SET: "#BOLD Задать геологию Tech & Res#!\nУстанавливает точное официальное значение Tech & Res и синхронизирует соответствующую геологическую особенность области."
 CMP_TR_TT_GEO_CLEAR: "#BOLD Очистить геологию Tech & Res#!\nУдаляет потенциал ресурса и все связанные с ним геологические особенности области Tech & Res."
 CMP_TR_TIER_1: "Уровень 1"
 CMP_TR_TT_TIER_1: "Выбрать геологический уровень Tech & Res №1. На кнопке показан точный потенциал выбранного ресурса."
 CMP_TR_TIER_2: "Уровень 2"
 CMP_TR_TT_TIER_2: "Выбрать геологический уровень Tech & Res №2. На кнопке показан точный потенциал выбранного ресурса."
 CMP_TR_TIER_3: "Уровень 3"
 CMP_TR_TT_TIER_3: "Выбрать геологический уровень Tech & Res №3. На кнопке показан точный потенциал выбранного ресурса."
 CMP_TR_TIER_4: "Уровень 4"
 CMP_TR_TT_TIER_4: "Выбрать геологический уровень Tech & Res №4. На кнопке показан точный потенциал выбранного ресурса."
 CMP_TR_TIER_5: "Уровень 5"
 CMP_TR_TT_TIER_5: "Выбрать геологический уровень Tech & Res №5. На кнопке показан точный потенциал выбранного ресурса."
 CMP_TR_PRESET_MINING: "Рудный узел"
 CMP_TR_PRESET_ADVANCED: "Передовой узел"
 CMP_TR_PRESET_ENERGY: "Энергоузел"
 CMP_TR_PRESET_NUCLEAR: "Ядерный узел"
 CMP_TR_TT_PRESET_MINING: "#BOLD Сбалансированный рудный узел#!\nЗАДАТЬ: медь 50 + бокситы 50 + обычные руды 50; синхронизировать средние геологические особенности области."
 CMP_TR_TT_PRESET_ADVANCED: "#BOLD Сбалансированный передовой узел#!\nЗАДАТЬ: высококачественные руды 80 + редкоземельные элементы 55; синхронизировать средние геологические особенности области."
 CMP_TR_TT_PRESET_ENERGY: "#BOLD Сбалансированный энергоузел#!\nЗАДАТЬ: природный газ 50 + вода 20; синхронизировать соответствующие геологические особенности области."
 CMP_TR_TT_PRESET_NUCLEAR: "#BOLD Сбалансированный ядерный узел#!\nЗАДАТЬ: уран 45 + вода 20; синхронизировать соответствующие геологические особенности области."

