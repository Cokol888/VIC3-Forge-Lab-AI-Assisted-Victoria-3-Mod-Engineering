l_russian:
 CMP_WS_TITLE:0 "Cheat Menu Pro — Рабочая область"
 CMP_WS_OPEN:0 "РАБОЧАЯ ОБЛАСТЬ"
 CMP_WS_OPEN_TT:0 "#tooltip_header Рабочая область#!\nЕдиная точка входа в цели, экономику, области, население, политику, дипломатию, армию, флот и настройки интерфейса. Последняя открытая страница сохраняется в текущей игровой сессии."
 CMP_WS_NAV_TARGET:0 "Цели"
 CMP_WS_NAV_ECONOMY:0 "Экономика"
 CMP_WS_NAV_REGIONS:0 "Области"
 CMP_WS_NAV_POPULATION:0 "Население"
 CMP_WS_NAV_POLITICS:0 "Политика"
 CMP_WS_NAV_DIPLOMACY:0 "Дипломатия"
 CMP_WS_NAV_MILITARY:0 "Армия и флот"
 CMP_WS_NAV_INTERFACE:0 "Интерфейс"
 CMP_WS_NAV_PENDING_TT:0 "Эта страница пока использует прежнюю компоновку и будет перенесена в одной из следующих beta-версий."
 CMP_WS_MIGRATION_NOTE:0 "Перенесены «Цели», «Экономика», «Области» и «Интерфейс»."
 CMP_WS_INFO:0 "i"
 CMP_WS_HELP_TITLE:0 "Справка"
 CMP_WS_HOME:0 "Сброс"
 CMP_WS_HOME_TT:0 "Сбросить навигацию, открытые справочные слои и фильтры списков. Профиль интерфейса, игровые цели, выбранные параметры и результаты сохраняются."
 CMP_WS_GLOBAL_HELP_TITLE:0 "Справка по рабочей области"
 CMP_WS_GLOBAL_HELP_TT:0 "Открыть общий каталог справки для всех разделов рабочей области."
 CMP_WS_GLOBAL_HELP_SUMMARY:0 "Выберите раздел ниже. Откроется его страница и обзорная справка; «Цели» открываются сразу, поскольку весь порядок работы уже виден на странице."
 CMP_WS_GLOBAL_HELP_ROUTE_TT:0 "Открыть этот раздел рабочей области и его обзорную справку."
 CMP_WS_GLOBAL_HELP_FOOTER:0 "«Сброс» очищает только навигацию и справку, сохраняя профиль интерфейса и игровой контекст. Стандартная команда закрытия окна закрывает рабочую область и все справочные слои."
 CMP_WS_ECO_FLOW:0 "Цель → действие → результат"
 CMP_WS_ECO_TARGET:0 "Цель"
