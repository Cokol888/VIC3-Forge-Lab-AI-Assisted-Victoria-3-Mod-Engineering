 CMP_WS_POL_HELP_OVERVIEW:0 "#tooltip_header Политика и персонажи 2.0#!\n$CMP_POL2_DESC$\n\n#BOLD Порядок работы#!\n1. Выберите требуемую цель в разделе «Цели».\n2. Откройте одну из пяти политических вкладок.\n3. Настройте и запустите явное действие.\n4. Проверьте результат в закреплённой нижней строке.\n\nПрокручивается только содержимое активной вкладки. Состояние цели, вкладки и результат остаются видимыми; длинные объяснения находятся в этой справке."
 CMP_WS_POL_HELP_GOVERNMENT:0 "#tooltip_header Правительство#!\n$CMP_POL2_GOV_DESC$\n\n#BOLD Параметры#!\nВыберите один параметр и величину, затем примените. Сброс удаляет только наши правительственные изменения раздела «Политика 2.0».\n\n#BOLD Институты#!\n$CMP_POL2_INST_TT$\nВыберите институт и точный уровень 1–5, затем примените к подходящим странам-целям."
 CMP_WS_POL_HELP_CHARACTERS:0 "#tooltip_header Отмеченный персонаж#!\n$CMP_POL2_CHAR_DESC$\n\nЗдоровье и популярность задаются заменяемыми бонусами, а не точными внутренними значениями. Ранг доступен только отмеченному генералу или адмиралу. Удаление военной роли необратимо меняет назначение персонажа.\n\n#BOLD Возраст#!\n$CMP_POL2_AGE_NOTE$"
 CMP_WS_POL_HELP_IG:0 "#tooltip_header Группы интересов#!\n$CMP_POL2_IG_DESC$\n\nВыберите одну или несколько стандартных групп, затем замените их одобрение либо политическую силу во всех подходящих странах-целях.\n\n#BOLD Политическая сила#!\n$CMP_POL2_IG_STRENGTH_NOTE$"
 CMP_WS_POL_HELP_LAWS:0 "#tooltip_header Текущее принятие закона#!\n$CMP_POL2_LAW_DESC$\n\nПрогресс и фазы относятся к текущему процессу. Неудача ухудшает его, а немедленное принятие и отмена сразу меняют состояние закона. В группах страны без активного процесса пропускаются."
 CMP_WS_POL_HELP_BLOC:0 "#tooltip_header Сплочённость блока держав#!\n$CMP_POL2_BLOC_DESC$\n\n$CMP_POL2_BLOC_NOTE$\n\nПроверенные операции добавляют или уменьшают сплочённость либо устанавливают её на 100."
