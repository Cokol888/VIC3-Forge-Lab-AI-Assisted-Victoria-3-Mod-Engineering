 CMP_MIL_ARMY_STATE_TARGET_NONE:0 "#N Нужна отмеченная собственная область#!"
 CMP_WS_MIL_HELP_MARINES:0 "#tooltip_header Формирование морской пехоты#!\n$CMP_ARMY_AMPH_DESC$\n\nНужны отмеченная область игрока с портом, количество батальонов и проверенное исследование морской пехоты.\n\n#BOLD Ручной шаг#!\nАвтоматическое прикрепление армии к флоту не выполняется. Прикрепите созданное формирование в обычном интерфейсе игры."
 CMP_WS_MIL_HELP_TASKFORCE:0 "#tooltip_header Десант#!\n$CMP_TASKFORCE_DESC$\n\n$CMP_TASKFORCE_PREPARE_TT$\n\n#BOLD Требуется#!\nПодходящий отмеченный флот, отмеченная область игрока с портом, количество морпехов, исследование морской пехоты и совместимое морское исследование.\n\n#BOLD После подготовки#!\n$CMP_TASKFORCE_RESULT$"
