 CMP_WS_ECO_TAB_POLICIES:0 "Собственность"
 CMP_WS_ECO_MONEY_TITLE:0 "Денежные операции"
 CMP_WS_ECO_MODIFIERS_TITLE:0 "Модификаторы"
 CMP_WS_ECO_POLICIES_TITLE:0 "Собственность и инвестиции"
 CMP_WS_ECO_HELP_OVERVIEW_TT:0 "#tooltip_header Как устроена Экономика 2.0#!\n$CMP_ECO2_DESC$\n\nНажмите, чтобы открыть закрепляемую справку."
 CMP_WS_ECO_HELP_MONEY_TT:0 "#tooltip_header Денежные операции#!\n$CMP_ECO2_DIRECT_DESC$\n\nНажмите, чтобы открыть закрепляемую справку."
 CMP_WS_ECO_HELP_MODIFIERS_TT:0 "#tooltip_header Экономические модификаторы#!\n$CMP_ECO2_MOD_DESC$\n\nНажмите, чтобы открыть закрепляемую справку."
 CMP_WS_ECO_HELP_POLICIES_TT:0 "#tooltip_header Собственность и инвестиции#!\n$CMP_ECO2_POLICY_DESC$\n\nНажмите, чтобы открыть закрепляемую справку."
 CMP_WS_ECO_HELP_OVERVIEW:0 "#tooltip_header Экономика 2.0#!\n$CMP_ECO2_DESC$\n\n#BOLD Порядок работы#!\n1. Откройте «Цель» и выберите Игрока, отмеченную страну либо группу A/B/C.\n2. Выберите раздел экономики.\n3. Выполните действие и проверьте результат в нижней строке.\n\n#BOLD Важно#!\nАктивная цель и результат операции всегда остаются видимыми: они не спрятаны только в подсказках."
 CMP_WS_ECO_HELP_MONEY:0 "#tooltip_header Денежные операции#!\n$CMP_ECO2_DIRECT_DESC$\n\n#BOLD Казна#!\n$CMP_ECO2_TT_TREASURY$\n\n#BOLD Инвестиционный фонд#!\n$CMP_ECO2_TT_INVESTMENT$\n\n#BOLD Долг и банкротство#!\n$CMP_ECO2_TT_CLEAR_DEBT$\n$CMP_ECO2_TT_BANKRUPTCY$\n$CMP_ECO2_TT_RESCUE$"
 CMP_WS_ECO_HELP_MODIFIERS:0 "#tooltip_header Экономические модификаторы#!\n$CMP_ECO2_MOD_DESC$\n\n#BOLD Выбор параметра#!\n$CMP_ECO2_TT_PARAM$\n\n#BOLD Выбор значения#!\n$CMP_ECO2_TT_VALUE$\n\n#BOLD Применение и сброс#!\n$CMP_ECO2_TT_APPLY$\n$CMP_ECO2_TT_RESET_SELECTED$\n$CMP_ECO2_TT_RESET_ALL$"
 CMP_WS_ECO_HELP_POLICIES:0 "#tooltip_header Собственность и инвестиции#!\n$CMP_ECO2_POLICY_DESC$\n\n#BOLD Включение#!\n$CMP_ECO2_TT_POLICY_ON$\n\n#BOLD Выключение#!\n$CMP_ECO2_TT_POLICY_OFF$\n\nКаждый переключатель применяется ко всем странам активной страновой цели."
 CMP_WS_TARGET_TITLE:0 "Центр целей"
