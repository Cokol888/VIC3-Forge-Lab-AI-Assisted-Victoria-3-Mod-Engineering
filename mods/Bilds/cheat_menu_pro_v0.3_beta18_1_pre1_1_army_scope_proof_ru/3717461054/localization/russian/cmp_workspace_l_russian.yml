 CMP_WS_INTERFACE_SUMMARY:0 "Выберите подходящую плотность элементов. Изменение применяется сразу."
 CMP_WS_INTERFACE_DESC:0 "Профили перестраивают элементы внутри одной безопасной рабочей области и не зависят от непроверенного динамического масштабирования."
 CMP_WS_INTERFACE_HELP_TITLE:0 "О профилях интерфейса"
 CMP_WS_INTERFACE_HELP_TT:0 "#tooltip_header Профили интерфейса#!\n$CMP_WS_INTERFACE_DESC$\n\nНажмите, чтобы открыть закрепляемую справку."
 CMP_WS_INTERFACE_HELP:0 "#tooltip_header Профили интерфейса#!\n$CMP_WS_INTERFACE_DESC$\n\n#BOLD Как это работает#!\n$CMP_WS_PROFILE_IMPL_NOTE$\n\n#BOLD Срок действия#!\n$CMP_WS_INTERFACE_FOOTER$"
 CMP_WS_PROFILE_90:0 "90% Компактный"
 CMP_WS_PROFILE_100:0 "100% Обычный"
 CMP_WS_PROFILE_115:0 "115% Крупный"
 CMP_WS_PROFILE_130:0 "130% Очень крупный"
 CMP_WS_PROFILE_90_DESC:0 "Больше элементов в строке; видимый текст не меньше 12 пунктов."
 CMP_WS_PROFILE_100_DESC:0 "Компоновка по умолчанию; основные кнопки высотой 48 пикселей."
 CMP_WS_PROFILE_115_DESC:0 "Более крупный текст и меньше элементов в строке."
 CMP_WS_PROFILE_130_DESC:0 "Максимальная читаемость; три кнопки выбора цели в строке."
 CMP_WS_PROFILE_TT:0 "Сразу переключить плотность рабочей области."
 CMP_WS_PROFILE_IMPL_NOTE:0 "Реализация: генератор создаёт отдельную перестроенную компоновку для каждого профиля. Это безопасный вариант, пока динамическое масштабирование корневого элемента не подтверждено в игре."
 CMP_WS_INTERFACE_FOOTER:0 "Выбранный профиль применяется сразу и действует до завершения игровой сессии."
 CMP_WS_RB_TITLE:0 "Области и сооружения 2.0"
 CMP_WS_RB_FLOW:0 "Режим → объект → операция → значение → цель"
 CMP_WS_STAFF_FLOW:0 "Здание → кадровый резерв → порог → цель"
 CMP_WS_RB_OPERATIONS_TT:0 "Операции с уровнями зданий, ресурсным потенциалом и готовыми шаблонами."
 CMP_WS_RB_STAFFING_TT:0 "Создание кадрового резерва для выбранного предприятия с необязательным порогом занятости."
 CMP_WS_RB_MODE_BUILDING_TT:0 "Выберите здание, затем способ изменения уровня, значение и целевые области."
 CMP_WS_RB_MODE_RESOURCE_TT:0 "Откройте список ресурсных зданий. Выбор объекта автоматически включает режим ресурсного потенциала."
 CMP_WS_RB_MODE_PRESET_TT:0 "Выберите готовый набор зданий и примените его к целевым областям."
 CMP_WS_RB_PICK_BUILDING:0 "Выбор здания"
 CMP_WS_RB_PICK_RESOURCE:0 "Выбор ресурса"
 CMP_WS_RB_PICK_PRESET:0 "Выбор шаблона"
 CMP_WS_RB_PICK_TT:0 "Выбрать этот объект. Полное название сохраняется в карточке справа."
 CMP_WS_RB_PRESET_TT:0 "Выбрать этот готовый набор зданий. Состав шаблона описан в справке."
 CMP_WS_RB_SELECTED:0 "Выбрано"
 CMP_WS_RB_NOT_SELECTED:0 "Сначала выберите здание слева"
 CMP_WS_RB_OPERATION_TITLE:0 "Операция"
 CMP_WS_RB_OP_ADD:0 "Добавить"
 CMP_WS_RB_OP_SET:0 "Задать"
 CMP_WS_RB_OP_CLEAR:0 "Убрать"
 CMP_WS_RB_OP_ADD_TT:0 "#tooltip_header Добавить#!\nДобавляет уровни по одному, пока строительство доступно в области и не достигнут лимит уровня или ресурсного потенциала."
 CMP_WS_RB_OP_SET_TT:0 "#tooltip_header Задать безопасно#!\nПовышает здание до выбранного уровня без удаления. Если текущий уровень выше, операция блокируется вместо пересоздания здания."
 CMP_WS_RB_OP_CLEAR_TT:0 "#tooltip_header Убрать / очистить#!\nДля зданий удаляет всё выбранное здание. Для ресурсов очищает выбранный потенциал."
 CMP_WS_RB_SET_WARNING:0 "#Y Безопасный SET: повышение разрешено; понижение блокируется, чтобы не пересоздавать здание и не терять его внутреннее состояние.#!"
 CMP_WS_RB_AMOUNT_TITLE:0 "Значение"
 CMP_WS_RB_AMOUNT_TT:0 "Количество уровней здания или единиц ресурсного потенциала для выбранной операции."
 CMP_WS_RB_TARGET_TITLE:0 "Применить к"
 CMP_WS_RB_TARGET_MARKED_SHORT:0 "Свои отмеч."
 CMP_WS_RB_TARGET_INCORP_SHORT:0 "Инкорпор."
 CMP_WS_RB_TARGET_FOREIGN_SHORT:0 "Чужие отмеч."
 CMP_WS_RB_TARGET_MARKED_TT:0 "Применить к отмеченным областям игрока. Кнопка доступна после полной настройки операции."
 CMP_WS_RB_TARGET_INCORP_TT:0 "Применить ко всем инкорпорированным областям игрока. Кнопка доступна после полной настройки операции."
 CMP_WS_RB_TARGET_FOREIGN_TT:0 "Применить к отмеченным областям отмеченной страны. Кнопка доступна после полной настройки операции."
 CMP_WS_RB_PRESET_READY:0 "Готовый набор"
 CMP_WS_RB_PRESET_SUMMARY:0 "Шаблон применяется отдельно к каждой целевой области. Каждое здание добавляется только пока область проходит условия строительства и лимиты уровня/ресурсного потенциала; пропуски дают частичный результат."
 CMP_WS_RB_CLEAR_TT:0 "Сбросить режим, операцию, значение, шаблон и результат Областей 2.0. Выбранное здание сохраняется для старых инструментов."
 CMP_WS_RB_FOOTER_IDLE:0 "Результат последней операции с областями появится здесь."
 CMP_WS_STAFF_AMOUNT_TITLE:0 "Кадровый резерв на область"
 CMP_WS_STAFF_THRESHOLD_TT:0 "#tooltip_header Порог занятости#!\nВыкл. всегда создаёт выбранный резерв. Порог пропускает предприятия, занятость которых уже равна ему или выше."
 CMP_WS_STAFF_PROFILE_EXTRACTION:0 "Профиль: добыча"
 CMP_WS_STAFF_PROFILE_AGRICULTURE:0 "Профиль: сельское хозяйство"
 CMP_WS_STAFF_PROFILE_LIGHT:0 "Профиль: лёгкая промышленность"
 CMP_WS_STAFF_PROFILE_HEAVY:0 "Профиль: тяжёлая промышленность"
 CMP_WS_STAFF_PROFILE_POWER:0 "Профиль: энергетика"
 CMP_WS_STAFF_PROFILE_INFRA:0 "Профиль: инфраструктура"
 CMP_WS_STAFF_FOOTER_IDLE:0 "Результат кадрового помощника появится здесь."
 CMP_WS_RB_HELP_TITLE:0 "Справка: области и сооружения"
 CMP_WS_RB_HELP_OVERVIEW_TT:0 "#tooltip_header Области и сооружения 2.0#!\nКраткий интерфейс оставляет на экране только порядок действий, текущий выбор, предупреждения и результат. Нажмите для подробной справки."
 CMP_WS_RB_HELP_BUILDINGS_TT:0 "#tooltip_header Операции со зданиями#!\nНажмите для справки о добавлении, точной установке и удалении уровней."
 CMP_WS_RB_HELP_RESOURCES_TT:0 "#tooltip_header Ресурсный потенциал#!\nНажмите для справки о ресурсах и совместимости с Tech & Res."
 CMP_WS_RB_HELP_PRESETS_TT:0 "#tooltip_header Готовые шаблоны#!\nНажмите, чтобы посмотреть назначение и состав четырёх шаблонов."
 CMP_WS_RB_HELP_STAFFING_TT:0 "#tooltip_header Кадровый помощник#!\nНажмите для справки о кадровых профилях, резерве и пороге занятости."
 CMP_WS_RB_HELP_OVERVIEW:0 "#tooltip_header Области и сооружения 2.0#!\n\n#BOLD Порядок работы#!\n1. Выберите «Операции» либо «Персонал».\n2. Выберите объект слева.\n3. Настройте параметры справа.\n4. Нажмите целевую группу областей.\n5. Проверьте результат в закреплённой нижней строке.\n\nСписки объектов прокручиваются независимо: настройки и кнопки применения остаются на месте. Серые кнопки цели означают, что выбор ещё не завершён либо подходящих областей нет."
 CMP_WS_RB_HELP_BUILDINGS:0 "#tooltip_header Здания#!\n$CMP_RB2_HINT$\n\n#BOLD Категории#!\nОперации используют ту же функциональную схему, что и Персонал: Все, Сырьё, Промышленность, Инфраструктура, Госсектор, Военные, Услуги и Собственность. В реестре операций находятся 92 типа зданий с защитными проверками. Управляемые игрой здания собственности намеренно не получают прямые операции добавления, задания уровня и удаления.\n\n#BOLD Добавить#!\nДобавляет уровни по одному и перед каждым уровнем проверяет доступность строительства в области, а для существующего здания — возможность добавить уровень без превышения лимита уровня или ресурсного потенциала.\n\n#BOLD Задать#!\nБезопасно повышает до выбранного уровня. Понижение запрещено, чтобы пересоздание не сбросило способы производства, владение, денежные резервы и другое внутреннее состояние.\n\n#BOLD Убрать#!\nУдаляет выбранное здание целиком; ввод количества для этой операции не показывается."
 CMP_WS_RB_HELP_RESOURCES:0 "#tooltip_header Ресурсный потенциал#!\nВ списке доступны только ресурсные здания, поддержанные registry. «Добавить» увеличивает потенциал, «Задать» пересоздаёт точное значение, «Убрать» очищает его.\n\nДля объектов Tech & Res геологический trait синхронизируется при точной установке только тогда, когда значение совпадает с зарегистрированным геологическим уровнем."
 CMP_WS_RB_HELP_PRESETS:0 "#tooltip_header Готовые шаблоны#!\n#BOLD Промышленный центр#! — инструменты, сталь, двигатели, электростанции, железные дороги и строительство.\n#BOLD Тяжёлая промышленность#! — сталь, двигатели, химия, взрывчатка, энергетика и железные дороги.\n#BOLD Военная промышленность#! — оружие, артиллерия, боеприпасы, сталь, взрывчатка и железные дороги.\n#BOLD Инфраструктурный узел#! — железные дороги, порты, строительство и электростанции.\n\nШаблоны применяют зарегистрированные точные уровни сразу к выбранной группе областей."
 CMP_WS_RB_HELP_STAFFING:0 "#tooltip_header Кадровый помощник#!\n$CMP_STAFF_HINT$\n\n$CMP_STAFF_ADAPTIVE_HINT$\n\n#BOLD Покрытие 2.1#!\n«Персонал» теперь использует отдельный реестр, а не строительный каталог из 56 зданий. В Workspace доступны 97 проверенных employable-сооружений; специальные монументы и неаудированные company/canal-случаи явно классифицированы в coverage registry, а не исчезают молча.\n\n#BOLD Категории#!\nУ «Персонала» собственное состояние фильтра. Его переключение не меняет выбор здания в «Операциях».\n\n#BOLD Порядок#!\nВыберите сооружение, размер резерва, необязательный порог занятости и цель. Профиль профессий определяется автоматически по staffing registry."
 CMP_WS_RB_CATEGORY_ALL:0 "Все"
 CMP_WS_RB_CATEGORY_EXTRACTION:0 "Добыча"
