 CMP_WS_MIL_HELP_OVERVIEW_TT:0 "#tooltip_header Армия и флот 2.0#!\nКомпактные военные операции, требования исследований и закреплённый результат. Нажмите для справки."
 CMP_WS_MIL_HELP_ARMY_TT:0 "#tooltip_header Сборка армии#!\nНажмите для справки о цели-области, исследованиях войск и создании формирований."
 CMP_WS_MIL_HELP_TEMPLATES_TT:0 "#tooltip_header Шаблоны армии#!\nНажмите для справки о быстрых, смешанных и настраиваемых составах."
 CMP_WS_MIL_HELP_CONTROLS_TT:0 "#tooltip_header Армейские параметры#!\nНажмите для справки о цели, параметре, точном значении и сбросе."
 CMP_WS_MIL_HELP_FLEET_TT:0 "#tooltip_header Флот 2.0#!\nНажмите для справки о конструкторе нового смешанного флота и точном выбранном существующем флоте."
 CMP_WS_MIL_HELP_FLEET_TEMPLATES_TT:0 "#tooltip_header Шаблоны флота#!\nНажмите для справки о расчёте долей и требованиях исследований."
 CMP_WS_MIL_HELP_MARINES_TT:0 "#tooltip_header Морская пехота#!\nНажмите для справки о порте, исследованиях и ручном присоединении."
 CMP_WS_MIL_HELP_TASKFORCE_TT:0 "#tooltip_header Десант#!\nНажмите для справки о поддержке флота, отмеченном порте и действиях после создания."
 CMP_WS_MIL_HELP_OVERVIEW:0 "#tooltip_header Армия и флот 2.0#!\n\nРабочая область объединяет существующие сборщики армии и флота, армейские и флотские шаблоны, параметры армии и подготовку десанта без изменения игровых эффектов.\n\n#BOLD Порядок работы#!\n1. Отметьте нужную область, страну или флот.\n2. Выберите военную вкладку.\n3. Настройте формирование, флот или параметр.\n4. Запустите явное действие.\n5. Проверьте результат в закреплённой нижней строке.\n\nТребования исследований сохраняются: серая кнопка не позволяет их обойти."
 CMP_WS_MIL_HELP_ARMY:0 "#tooltip_header Сборка армии#!\n$CMP_ARMY_BUILDER_DESC$\n\n#BOLD Цель#!\nЭта операция создаёт новое формирование в отмеченной собственной области, поэтому выбор существующей армии здесь не нужен.\n\nСписок разделён на пехоту и морпехов, артиллерию, кавалерию и бронетехнику. Сокращённая подпись всегда имеет подсказку с полным названием и требуемым исследованием.\n\n#BOLD Проверка#!\n$CMP_ARMY_BUILDER_APPLY_TT$\n\n$CMP_ARMY_BUILDER_RUNTIME_NOTE$"
 CMP_WS_MIL_HELP_TEMPLATES:0 "#tooltip_header Шаблоны армии#!\n\nВсе шаблоны создают новое формирование в отмеченной собственной области. Они не редактируют уже существующую армию.\n\n#BOLD Быстрые наборы#!\n$CMP_ARMY_BUILDER_QUICK_TITLE$\nБыстрый набор лишь выбирает лучший открытый тип войск и количество; после этого нажмите кнопку создания армии.\n\n#BOLD Смешанные шаблоны#!\n$CMP_ARMY_MIXED_DESC$\n\n#BOLD Конструктор#!\n$CMP_ARMY_DESIGNER_DESC$\n$CMP_ARMY_DESIGNER_MOBILE_NOTE$"
 CMP_WS_MIL_HELP_CONTROLS:0 "#tooltip_header Армейские параметры#!\n$CMP_ARMY_CONTROL_DESC$\n\nЗдесь цель — страна: держава игрока или отмеченная страна. Модификатор применяется к её вооружённым силам в целом, поэтому выпадающий список отдельных армий не используется.\n\n#BOLD Точные уровни#!\nБоевые параметры и скорость: +10%, +25%, +50%, +100%, +500%.\nРасходы, снабжение и истощение от потерь: −10%, −25%, −50%, −75%, −90%.\n\n$CMP_ARMY_CONTROL_NOTE$"
 CMP_WS_MIL_HELP_FLEET:0 "#tooltip_header Флот 2.0#!\n#BOLD Новый флот#!\nВыберите количества для нескольких типов кораблей и отметьте собственную область с портом. Одна кнопка создаёт один флот с итоговым смешанным составом. Шаблоны только заполняют состав и не запускают создание автоматически.\n\n#BOLD Выбранный флот#!\n$CMP_MIL_TARGET_FLEET_SELECT_TT$\n\nСовместимый путь beta17 добавляет корабли только в точный выбранный существующий флот. Скрытый выбор «первого подходящего» запрещён. Передача кораблей, флагман и корабли снабжения проходят отдельные этапы проверки beta18."
 CMP_WS_MIL_HELP_FLEET_TEMPLATES:0 "#tooltip_header Конструктор флота#!\n$CMP_FD_DESC$\n\nВерхняя строка выбирает ровно один целевой флот и общая для конструктора и десантной группы. Выберите размер, доли охранения, авианосцев и подлодок. Крупные корабли получают остаток. Авианосцы и подлодки недоступны до нужных исследований.\n\n$CMP_FD_APPLY_TT$"
 CMP_MIL_ARMY_STATE_TARGET_OPEN:0 "Выбрать область создания"
 CMP_MIL_ARMY_STATE_TARGET_TT:0 "Перейти в Центр целей и отметить свою область. Сборка и шаблоны создают новую армию в этой области; они не изменяют существующую армию."
