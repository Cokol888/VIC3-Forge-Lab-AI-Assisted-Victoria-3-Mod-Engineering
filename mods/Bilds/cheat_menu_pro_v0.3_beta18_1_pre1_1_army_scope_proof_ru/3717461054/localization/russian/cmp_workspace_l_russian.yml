 CMP_WS_POP_HELP_OVERVIEW:0 "#tooltip_header Население и общество 2.0#!\n$CMP_POP2_DESC$\n\n#BOLD Порядок работы#!\n1. Откройте «Цели» и выберите отмеченные свои, инкорпорированные либо отмеченные иностранные области.\n2. Выберите одну из четырёх вкладок населения.\n3. Настройте значение и запустите явную операцию.\n4. Проверьте результат в закреплённой нижней строке.\n\nЭлементы управления и результат остаются на месте; прокручивается только содержимое активной вкладки."
 CMP_WS_POP_HELP_POPULATION:0 "#tooltip_header Численность и грамотность#!\n$CMP_POP2_POP_DESC$\n\n#BOLD Добавить#!\n$CMP_POP2_TT_ADD$\n\n#BOLD Удалить#!\n$CMP_POP2_TT_REMOVE$\n\n#BOLD Грамотность#!\n$CMP_POP2_LITERACY_DESC$\n$CMP_POP2_TT_SET_LITERACY$"
 CMP_WS_POP_HELP_PROFESSIONS:0 "#tooltip_header Профессии и квалификации#!\n$CMP_POP2_PROF_DESC$\n\n#BOLD Создание группы#!\n$CMP_POP2_TT_SPAWN_PROF$\n\n#BOLD Установка квалификации#!\n$CMP_POP2_QUAL_DESC$\n$CMP_POP2_TT_APPLY_QUAL$"
 CMP_WS_POP_HELP_WELFARE:0 "#tooltip_header Благосостояние и политика#!\n$CMP_POP2_WELFARE_DESC$\n\n#BOLD Богатство#!\n$CMP_POP2_TT_SET_WEALTH$\n\n#BOLD Политическое состояние населения#!\nОперации с лоялистами и радикалами добавляют либо уменьшают выбранную долю в каждой целевой области. Нейтрализация очищает обе накопленные доли."
 CMP_WS_POP_HELP_SOCIETY:0 "#tooltip_header Общество#!\n$CMP_POP2_SOCIETY_DESC$\n\n#BOLD Миграция#!\n$CMP_POP2_TT_MIGRATION$\n\n#BOLD Доля работающих взрослых#!\n$CMP_POP2_TT_WORKFORCE$\n\n#BOLD Безопасная смена идентичности#!\n$CMP_POP2_TT_CONFIRM$\n$CMP_POP2_TT_ASSIMILATE$\n$CMP_POP2_TT_CONVERT$\n\nГотовые наборы сохраняют прежнюю игровую механику и выводят результат в нижней строке."
