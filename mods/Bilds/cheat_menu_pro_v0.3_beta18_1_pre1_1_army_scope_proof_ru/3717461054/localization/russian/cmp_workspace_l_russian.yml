 CMP_WS_DIP_BLOC_MEMBERSHIP_WARNING:0 "#R Прямое вступление обходит обычное приглашение, влияние, согласие и сроки ожидания. Оно доступно только для страны, которая сейчас не состоит ни в одном блоке. Проверьте обе цели и включите подтверждение.#!"
