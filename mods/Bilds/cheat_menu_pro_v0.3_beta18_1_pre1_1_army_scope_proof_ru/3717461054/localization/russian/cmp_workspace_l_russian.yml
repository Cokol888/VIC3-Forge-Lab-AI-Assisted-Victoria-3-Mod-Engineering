 CMP_WS_DIP_BLOC_DEFERRED:0 "#Y Пока отложены обычное приглашение и выход из блока, а также принципы и рычаги влияния. Принципы зависят от DLC, идентичности, слотов и сроков смены; влияние изменяется со временем. Для них ещё нет полного проверяемого контракта.#!"
 CMP_WS_DIP_HELP_TITLE:0 "Справка: дипломатия и суверенитет"
 CMP_WS_DIP_HELP_OVERVIEW_TT:0 "Открыть закрепляемый обзор целей, результатов и границ безопасности."
 CMP_WS_DIP_HELP_RELATIONS_TT:0 "Открыть справку по отношениям и обязательствам."
 CMP_WS_DIP_HELP_SUBJECTS_TT:0 "Открыть справку по направлению подчинения, иерархии и автономии."
 CMP_WS_DIP_HELP_TREATIES_TT:0 "Открыть справку по допустимости договоров и состояниям результата."
 CMP_WS_DIP_HELP_SOVEREIGNTY_TT:0 "Открыть справку по передаче областей и договорным портам."
 CMP_WS_DIP_HELP_BLOC_TT:0 "Открыть справку по сплочённости, принудительному вступлению и отложенным действиям."
 CMP_WS_DIP_HELP_OVERVIEW:0 "#tooltip_header Дипломатия и суверенитет 2.0#!\n\n#BOLD Порядок работы#!\n1. Отметьте нужную страну, область или блок держав в «Целях».\n2. Выберите одну из пяти вкладок.\n3. Выполните явное действие.\n4. Прочитайте результат в закреплённой нижней строке.\n\nПрокручивается только содержимое активной вкладки. Длинные пояснения находятся здесь; состояние цели и опасные предупреждения остаются видимыми."
 CMP_WS_DIP_HELP_RELATIONS:0 "#tooltip_header Отношения и обязательства#!\n\nДействия меняют двусторонние отношения с отмеченной страной на указанную величину. Максимум и минимум используют проверенные крупные шаги прежней реализации. Для обязательств явно выбирается, какая сторона должна другой."
 CMP_WS_DIP_HELP_SUBJECTS:0 "#tooltip_header Отношения подчинения#!\n\nДва направления намеренно разделены. Операция проверяет наличие цели, конфликтующего сюзерена и допустимость типа субъекта. Автономия требует существующих отношений подчинения; при освобождении сообщается об отсутствии нужной связи."
 CMP_WS_DIP_HELP_TREATIES:0 "#tooltip_header Двусторонние договоры#!\n\nПри создании используются игровые условия допустимости договора. При удалении ищется договор выбранного типа и выводится сообщение, если он отсутствует. Каждая строка меняет ровно один вид договора."
 CMP_WS_DIP_HELP_SOVEREIGNTY:0 "#tooltip_header Суверенитет#!\n\nДействия со своей областью передают отмеченную область игрока отмеченной стране. Действия с чужой областью передают её игроку. Варианты с инкорпорацией дополнительно инкорпорируют полученную область. Договорные порты нужно проверить на карте после игрового такта."
 CMP_WS_DIP_HELP_POWER_BLOC:0 "#tooltip_header Блок держав#!\n\n#BOLD Сплочённость#!\nЧетыре проверенных действия изменяют сплочённость отмеченного блока.\n\n#BOLD Принудительное вступление#!\nДва экспертных действия напрямую включают державу игрока или отмеченную страну в отмеченный блок. Это не приглашение: обычные влияние, согласие и сроки ожидания обходятся. Страна должна заранее находиться вне любого блока; после команды интерфейс проверяет фактическое членство и выводит отдельный результат. Подтверждение действует только на одно действие.\n\n#BOLD Отложено#!\nОбычные приглашение и выход требуют отдельного устойчивого сценария. Принципы зависят от Sphere of Influence, идентичности блока, числа слотов и срока смены. Влияние дрейфует еженедельно. Эти действия не появятся в рабочей области без проверки отрицательных исходов, игрового такта и сохранения/загрузки."
 CMP_WS_DIP_FOOTER_IDLE:0 "Выберите отмеченную страну и выполните одну явную дипломатическую операцию."
 CMP_WS_DIP_BLOC_FOOTER_IDLE:0 "Выберите отмеченный блок: измените сплочённость или подтвердите одно принудительное вступление."
