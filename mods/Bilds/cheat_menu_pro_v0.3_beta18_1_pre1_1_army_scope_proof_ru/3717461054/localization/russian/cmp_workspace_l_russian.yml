 CMP_WS_ACTIVE_INVALID:0 "#R Выбранная цель недоступна. Смените область действия или отметьте объект в игре.#!"
 CMP_WS_GROUPS_TITLE:0 "Постоянные группы стран"
 CMP_WS_GROUPS_DESC:0 "Добавьте или удалите отмеченную страну. Очищайте только ту группу, которая больше не нужна."
 CMP_WS_GROUP_A:0 "Добавить/убрать — группа A"
 CMP_WS_GROUP_B:0 "Добавить/убрать — группа B"
 CMP_WS_GROUP_C:0 "Добавить/убрать — группа C"
 CMP_WS_GROUP_TOGGLE_TT:0 "Добавить отмеченную страну в эту группу или удалить её из группы."
 CMP_WS_GROUP_CLEAR_TT:0 "Удалить из этой группы все страны."
 CMP_WS_CLEAR:0 "Очистить"
 CMP_WS_TARGET_NOTE:0 "Активная цель применяется в совместимых действиях экономики, населения, политики, армии и флота. Старое окно целей оставлено в файлах как аварийный запасной вариант, но интерфейс его больше не открывает."
