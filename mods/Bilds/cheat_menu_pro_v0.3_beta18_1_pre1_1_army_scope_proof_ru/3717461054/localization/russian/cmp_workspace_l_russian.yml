 CMP_WS_DIP_BLOC_JOIN_PLAYER:0 "Включить державу игрока"
 CMP_WS_DIP_BLOC_JOIN_PLAYER_TT:0 "Принудительно включить державу игрока в отмеченный блок. Обычные дипломатические требования обходятся; результат проверяется сразу."
