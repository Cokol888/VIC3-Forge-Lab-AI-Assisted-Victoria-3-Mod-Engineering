l_russian:
 CMP_NAVY18_MODE_NEW:0 "КОНСТРУКТОР ФЛОТА 2.0"
 CMP_NAVY18_MODE_EXISTING:0 "ФЛОТ"
 CMP_NAVY18_PORT_OPEN:0 "Выбрать портовую область"
 CMP_NAVY18_PORT_READY:0 "#P Портовая область выбрана#!"
 CMP_NAVY18_PORT_NONE:0 "#N Отметьте собственную область с портом#!"
 CMP_NAVY18_PORT_TT:0 "Новый флот создаётся отдельно в отмеченной собственной портовой области; при нескольких используется область с наибольшим ВВП."
 CMP_NAVY18_NEW_TITLE:0 "Конструктор флота 2.0"
 CMP_NAVY18_NEW_DESC:0 "Пять независимых строк. В каждой выберите любой доступный корпус из полного каталога и количество 0/1/3/5/10. Все ненулевые строки собираются в один новый флот."
 CMP_NAVY18_COMP2_ROW:0 "Строка состава"
 CMP_NAVY18_COMP2_SELECT_HULL:0 "Выбрать / изменить корпус"
 CMP_NAVY18_COMP2_NO_HULL:0 "Корпус не выбран"
 CMP_NAVY18_COMP2_BACK:0 "Вернуться к составу"
 CMP_NAVY18_COMP2_PICK_TITLE:0 "Выбор корпуса для строки"
 CMP_NAVY18_COMP2_PICK_DESC:0 "Доступны все 25 боевых корпусов. Закрытые технологиями варианты видны, но недоступны. Повтор одного корпуса в нескольких строках разрешён — количества суммируются."
 CMP_NAVY18_COMP2_READY:0 "#P Состав готов к созданию#!"
 CMP_NAVY18_COMP2_BAD:0 "#N Проверьте: порт, ненулевые строки, выбранные корпуса и технологии#!"
 CMP_NAVY18_COMP2_DUPLICATES:0 "Повтор корпуса в разных строках допустим: итоговое количество складывается."
 CMP_NAVY18_COMPOSITION:0 "Состав нового флота"
 CMP_NAVY18_CREATE:0 "СОЗДАТЬ ОДИН ФЛОТ"
 CMP_NAVY18_CREATE_TT:0 "Первая ненулевая строка создаёт новый флот; остальные строки добавляются в этот же точный флот внутри одной операции. Мгновенное создание использует штатный шаблон типа по умолчанию."
 CMP_NAVY18_CLEAR:0 "Сбросить состав"
 CMP_NAVY18_PRESETS:0 "Ролевые шаблоны состава"
 CMP_NAVY18_PRESET_TT:0 "Шаблон только заполняет строки лучшими доступными корпусами для текущей эпохи. Создание выполняется отдельной кнопкой."
 CMP_NAVY18_RESULT_CREATED:0 "#P Один смешанный флот создан#!"
 CMP_NAVY18_RESULT_FAIL:0 "#N Флот не создан: проверьте порт, строки состава и технологии#!"
 CMP_NAVY18_RESULT_PRESET:0 "#P Шаблон загружен — проверьте пять строк перед созданием#!"
 CMP_NAVY18_EXISTING_DESC:0 "Точный контекст флота подтверждён игровым тестом. Штатная карточка Victoria 3 остаётся основным мостом к существующему флоту; beta18 Final фиксирует проверенный точный флот, добавление кораблей и отсутствие скрытого резервного выбора."
 CMP_NAVY18_RUNTIME_NOTE:0 "beta18 Final: Fleet Composer 2.0 принят — пять произвольных строк собираются в один новый флот. Пользовательские Ship Templates по-прежнему применяются через штатный workflow Victoria 3."
 CMP_NAVY18_GROUP_COUNT:0 "Количество"
 CMP_NAVY18_INSTANT_DEFAULT_NOTE:0 "Мгновенное создание использует шаблон корпуса по умолчанию. Пользовательские шаблоны применяются через штатный Ship Designer и очередь строительства."
 CMP_NAVY18_NATIVE_TEMPLATE_NOTE:0 "Шаблонный маршрут: создайте шаблон в Ship Designer и используйте штатную очередь строительства нужного флота."
