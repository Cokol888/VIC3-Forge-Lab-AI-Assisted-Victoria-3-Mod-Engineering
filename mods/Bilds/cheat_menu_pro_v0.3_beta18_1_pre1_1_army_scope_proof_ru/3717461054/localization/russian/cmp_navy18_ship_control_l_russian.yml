l_russian:
 CMP_NAVY18_MODE_SHIPCTRL:0 "КОРАБЛИ"
 CMP_NAVY18_SHIPCTRL_TITLE:0 "Точный контроль кораблей"
 CMP_NAVY18_SHIPCTRL_DESC:0 "Выберите флот штатным механизмом Victoria 3, затем выберите конкретный корабль по позиции в текущем списке. После выбора точная метка хранится на объекте Ship и не зависит от повторного поиска флота."
 CMP_NAVY18_SHIPCTRL_ORDER_NOTE:0 "Позиции 1–100 сортируются по демонстрации силы среди неуничтоженных кораблей. После выбора метка закрепляется за конкретным кораблём; изменение порядка не меняет уже выбранную цель."
 CMP_NAVY18_SHIPCTRL_SELECT_FLEET_FIRST:0 "Сначала выберите флот через «Выбрать / изменить флот»."
 CMP_NAVY18_SHIPCTRL_PAGE:0 "Страница кораблей"
 CMP_NAVY18_SHIPCTRL_SLOT_TT:0 "Выбрать точный корабль в текущем порядке флота. Недоступные позиции означают, что во флоте меньше неуничтоженных кораблей."
 CMP_NAVY18_SHIPCTRL_SELECTED:0 "Выбранный корабль"
 CMP_NAVY18_SHIPCTRL_NONE:0 "Корабль не выбран"
 CMP_NAVY18_SHIPCTRL_LOST:0 "Выбранная цель больше не существует — выберите корабль заново."
 CMP_NAVY18_SHIPCTRL_TYPE:0 "Тип:"
 CMP_NAVY18_SHIPCTRL_STATUS:0 "Состояние"
 CMP_NAVY18_SHIPCTRL_FLAGSHIP:0 "#P Флагман#!"
 CMP_NAVY18_SHIPCTRL_NOT_FLAGSHIP:0 "Не флагман"
 CMP_NAVY18_SHIPCTRL_DAMAGED:0 "#N Повреждён#!"
 CMP_NAVY18_SHIPCTRL_HEALTHY:0 "#P Корпус исправен#!"
 CMP_NAVY18_SHIPCTRL_IN_PORT:0 "В порту"
 CMP_NAVY18_SHIPCTRL_AT_SEA:0 "В море"
 CMP_NAVY18_SHIPCTRL_IN_BATTLE:0 "#N В бою#!"
 CMP_NAVY18_SHIPCTRL_NOT_IN_BATTLE:0 "Вне боя"
 CMP_NAVY18_SHIPCTRL_HP_EXCELLENT:0 "Корпус: 75–100%"
 CMP_NAVY18_SHIPCTRL_HP_WORN:0 "Корпус: 50–75%"
 CMP_NAVY18_SHIPCTRL_HP_CRITICAL:0 "Корпус: 25–50%"
 CMP_NAVY18_SHIPCTRL_HP_NEAR_LOSS:0 "Корпус: менее 25%"
 CMP_NAVY18_SHIPCTRL_CREW_EXCELLENT:0 "Экипаж: 75–100%"
 CMP_NAVY18_SHIPCTRL_CREW_WORN:0 "Экипаж: 50–75%"
 CMP_NAVY18_SHIPCTRL_CREW_CRITICAL:0 "Экипаж: 25–50%"
 CMP_NAVY18_SHIPCTRL_CREW_NEAR_LOSS:0 "Экипаж: менее 25%"
 CMP_NAVY18_SHIPCTRL_SET_FLAGSHIP:0 "НАЗНАЧИТЬ ФЛАГМАНОМ"
 CMP_NAVY18_SHIPCTRL_UNSET_FLAGSHIP:0 "СНЯТЬ ФЛАГМАН"
 CMP_NAVY18_SHIPCTRL_FLAGSHIP_TT:0 "Изменяет флагман только для точно выбранного корабля. Корабль в бою или тип, которому запрещена роль флагмана, блокирует действие."
 CMP_NAVY18_SHIPCTRL_CLEAR:0 "Сбросить выбор корабля"
 CMP_NAVY18_SHIPCTRL_CLEAR_TT:0 "Удаляет временную точную метку корабля у флотов державы игрока."
 CMP_NAVY18_SHIPCTRL_RESULT_SELECTED:0 "#P Точный корабль выбран#!"
 CMP_NAVY18_SHIPCTRL_RESULT_FLAGSHIP_SET:0 "#P Корабль назначен флагманом#!"
 CMP_NAVY18_SHIPCTRL_RESULT_FLAGSHIP_UNSET:0 "#P Статус флагмана снят#!"
 CMP_NAVY18_SHIPCTRL_SCOPE_NOTE:0 "beta18 Final: точный выбор Ship и операции флагмана подтверждены полным регрессионным прогоном. Разрушающие операции с корпусом и экипажем по-прежнему не добавляются."
