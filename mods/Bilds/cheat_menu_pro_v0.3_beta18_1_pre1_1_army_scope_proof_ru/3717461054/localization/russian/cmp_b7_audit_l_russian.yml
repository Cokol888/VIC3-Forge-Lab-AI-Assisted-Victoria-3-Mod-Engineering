l_russian:
 CMP_B7_STATUS_OK: "Последнее действие: ПРИМЕНЕНО — нажмите, чтобы скрыть"
 CMP_B7_STATUS_NO_TARGET: "Последнее действие: НЕТ КОРРЕКТНОЙ ЦЕЛИ — нажмите, чтобы скрыть"
 CMP_B7_STATUS_SUBJECT_CONFLICT: "Последнее действие: У СУБЪЕКТА ДРУГОЙ СЮЗЕРЕН — нажмите, чтобы скрыть"
 CMP_B7_STATUS_SUBJECT_INVALID: "Последнее действие: ТИП СУБЪЕКТА ОТКЛОНЁН — нажмите, чтобы скрыть"
 CMP_B7_STATUS_TREATY_INVALID: "Последнее действие: ДОГОВОР ОТКЛОНЁН ПРАВИЛАМИ ИГРЫ — нажмите, чтобы скрыть"
 CMP_B7_STATUS_NO_TREATY: "Последнее действие: ПОДХОДЯЩИЙ ДОГОВОР НЕ НАЙДЕН — нажмите, чтобы скрыть"
 CMP_B7_STATUS_NOT_SUBJECT: "Последнее действие: НЕТ НУЖНЫХ ОТНОШЕНИЙ СУБЪЕКТА — нажмите, чтобы скрыть"
 CMP_B7_TT_STATUS_OK: "Скриптовое действие прошло проверки и было применено. Нажмите на строку, чтобы очистить статус."
 CMP_B7_TT_STATUS_NO_TARGET: "Не удалось определить отмеченную страну/область, требуемую операцией. Проверьте строку ЦЕЛИ."
 CMP_B7_TT_STATUS_SUBJECT_CONFLICT: "Страна уже является субъектом другого сюзерена. CMP больше не пытается молча перезаписать такую иерархию. Сначала освободите страну либо работайте с её текущим сюзереном."
 CMP_B7_TT_STATUS_SUBJECT_INVALID: "Victoria 3 отклонила запрошенный тип субъекта либо итоговая проверка иерархии/типа не совпала. В 1.13 типы субъектов зависят от признания, колониального и company-статуса."
 CMP_B7_TT_STATUS_TREATY_INVALID: "can_create_treaty вернул false для этого точного набора условий. Статья договора может быть недоступна, взаимоисключающей, уже существовать либо не пройти правила статьи/входных данных."
 CMP_B7_TT_STATUS_NO_TREATY: "При удалении ПКМ не найден договор с запрошенной статьёй между игроком и отмеченной страной."
 CMP_B7_TT_STATUS_NOT_SUBJECT: "Операция автономии/независимости требует, чтобы соответствующая страна была субъектом в ожидаемой иерархии."
 CMP_B7_TT_PROTECTORATE: "#BOLD Протекторат#!\nЛКМ: сделать отмеченную страну нашим протекторатом. ПКМ: сделать нас её протекторатом.\n\nCMP теперь проверяет итоговую иерархию и тип; ошибка отображается в строке статуса."
 CMP_B7_TT_PUPPET: "#BOLD Марионетка#!\nЛКМ: сделать отмеченную страну нашей марионеткой. ПКМ: сделать нас её марионеткой.\n\nНесовместимый тип субъекта больше не должен проходить как тихий no-op: результат проверяется."
 CMP_B7_TT_DOMINION: "#BOLD Доминион#!\nЛКМ: сделать отмеченную страну нашим доминионом. ПКМ: сделать нас её доминионом.\n\nРезультат сразу проверяется и показывается в строке статуса."
 CMP_B7_TT_VASSAL: "#BOLD Вассал#!\nЛКМ: сделать отмеченную страну нашим вассалом. ПКМ: сделать нас её вассалом.\n\nCMP проверяет итоговую иерархию/тип и сообщает об отказе."
 CMP_B7_TT_TRIBUTARY: "#BOLD Данник#!\nЛКМ: сделать отмеченную страну нашим данником. ПКМ: сделать нас её данником.\n\nЭтот тип обычно связан с непризнанным сюзереном; некорректный результат будет явно показан."
 CMP_B7_TT_COLONY: "#BOLD Колония#!\nЛКМ: сделать отмеченную страну нашей колонией. ПКМ: сделать нас её колонией.\n\nДля колониальных/company-стран действуют ограничения; CMP показывает отклонённый результат."
 CMP_B7_TT_CHARTERED_COMPANY: "#BOLD Чартерная компания#!\nЛКМ: сделать отмеченную страну нашей чартерной компанией. ПКМ: обратное направление.\n\nВ 1.13 ограничения company-country строгие; итоговый тип проверяется."
 CMP_B7_TT_CROWN_LAND: "#BOLD Земли Короны#!\nЛКМ: сделать отмеченную страну нашими землями Короны. ПКМ: обратное направление.\n\nCMP проверяет итоговую иерархию/тип и показывает отказ."
 CMP_B7_TT_AUTONOMY_INDEPENDENCE: "#BOLD Автономия / независимость#!\nЛКМ: снизить автономию отмеченного субъекта. ПКМ: повысить. Shift+ЛКМ: независимость игрока. Alt+ЛКМ: независимость отмеченного субъекта.\n\nЕсли требуемых отношений субъекта нет, причина отображается в строке статуса."
 CMP_B7_TT_TR_ALLIANCE: "#BOLD Союз#!\nЛКМ: создать союз на 99 лет. ПКМ: выйти из договоров с этой статьёй.\n\nСоздание проходит штатную проверку Victoria 3 can_create_treaty; отказ больше не является тихим."
 CMP_B7_TT_TR_DEFENSIVE_PACT: "#BOLD Оборонительный пакт#!\nЛКМ: создать на 99 лет. ПКМ: выйти из подходящего договора.\n\nСоздание проверяется через can_create_treaty."
 CMP_B7_TT_TR_GUARANTEE: "#BOLD Гарантия независимости#!\nЛКМ: создать направленную статью договора. ПКМ: удалить/выйти из соответствующего договора.\n\nСоздание проверяется через can_create_treaty."
 CMP_B7_TT_TR_SUPPORT: "#BOLD Поддержка независимости#!\nЛКМ: создать направленную статью договора. ПКМ: удалить/выйти из соответствующего договора.\n\nСоздание проверяется через can_create_treaty."
 CMP_B7_TT_TR_TREATY_PORT: "#BOLD Договорный порт#!\nЛКМ: отмеченная иностранная область -> договорный порт для нас. ПКМ: наша отмеченная область -> договорный порт для отмеченной страны.\n\nСтрана и область передаются в can_create_treaty; некорректный набор явно отмечается как отклонённый."
 CMP_B7_STATUS_STATE_TRANSFER_FAILED: "Последнее действие: ПЕРЕДАЧА ОБЛАСТИ НЕ ПОДТВЕРЖДЕНА — нажмите, чтобы скрыть"
 CMP_B7_STATUS_TREATY_PORT_ATTEMPTED: "Последнее действие: КОМАНДА ДОГОВОРНОГО ПОРТА ОТПРАВЛЕНА — проверьте карту после тика"
 CMP_B7_TT_STATUS_STATE_TRANSFER_FAILED: "CMP выполнил set_state_owner, но итоговая проверка владельца не подтвердила передачу. Проверьте ограничения области и лог игры."
 CMP_B7_TT_STATUS_TREATY_PORT_ATTEMPTED: "Прямой cede_treaty_port создаёт/передаёт договорный порт не так, как обычный set_state_owner, поэтому мгновенная проверка владельца всей области была бы неверной. Команда выполнена; проверьте порт после игрового тика."
 CMP_B7_TT_INCREASE_RELATIONS: "Повысить отношения с отмеченной страной. ЛКМ +20, Alt +1, Ctrl +50, Shift +1000. Результат операции отображается в строке статуса."
 CMP_B7_TT_DECREASE_RELATIONS: "Понизить отношения с отмеченной страной. ЛКМ -20, Alt -1, Ctrl -50, Shift -1000. Результат операции отображается в строке статуса."
 CMP_B7_TT_OBLIGATION: "Обязательство. ЛКМ: отмеченная страна должна игроку. ПКМ: игрок должен отмеченной стране. Требуется отмеченная страна; результат показывается в строке статуса."
 CMP_B7_TT_DIRECT_TREATY_PORT: "Прямой договорный порт. ЛКМ: получить порт из отмеченной иностранной области. ПКМ: предоставить порт отмеченной стране из нашей отмеченной области. Это не обычная передача всей области: после применения проверьте карту после игрового тика."
 CMP_B7_TT_CEDE_HOME_STATE: "Передать свою отмеченную область отмеченной стране. ЛКМ: передать. ПКМ: передать и сделать область инкорпорированной у получателя. CMP проверяет нового владельца после операции."
 CMP_B7_TT_TAKE_FOREIGN_STATE: "Забрать отмеченные области отмеченной страны. ЛКМ: передать игроку. ПКМ: передать и сделать инкорпорированными. CMP показывает, был ли найден и обработан хотя бы один подходящий state."
