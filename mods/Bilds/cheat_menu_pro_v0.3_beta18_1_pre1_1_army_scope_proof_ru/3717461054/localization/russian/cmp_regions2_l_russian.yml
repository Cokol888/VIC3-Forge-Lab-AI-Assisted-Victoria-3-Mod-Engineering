 CMP_RB2_HINT:0 "Для зданий ДОБАВИТЬ работает по принципу best-effort: перед каждым новым уровнем проверяется доступность строительства в области и лимит уровня/ресурсного потенциала. ЗАДАТЬ безопасно повышает уровень или оставляет его без изменений; понижение блокируется вместо пересоздания. УБРАТЬ удаляет здание целиком. Шаблон применяется отдельно к каждой целевой области и пропускает недоступные элементы с частичным результатом. Операции ресурсов сохраняют прежнюю семантику ДОБАВИТЬ/ЗАДАТЬ/ОЧИСТИТЬ."
