l_russian:
 CMP_ECO2_OPEN: "ЭКОНОМИКА 2.0"
 CMP_ECO2_OPEN_TT: "Открыть «Экономику 2.0»: понятные операции через единый контроллер целей."
 CMP_ECO2_TITLE: "Экономика 2.0"
 CMP_ECO2_DESC: "Управление экономикой страны по схеме: цель → параметр/операция → значение → результат. Старая B2 остаётся как режим «Эксперт / старый интерфейс»."
 CMP_ECO2_OPEN_TARGETS: "ЦЕЛИ"
 CMP_ECO2_TARGET_TT: "Открыть единый контроллер целей. «Экономика 2.0» поддерживает: Игрок, отмеченная страна и группы A/B/C."
 CMP_ECO2_TARGET_OK: "#p Выбрана корректная страновая цель.#!"
 CMP_ECO2_TARGET_BAD: "#n Для экономики нужна страновая цель: Игрок, отмеченная страна или группа A/B/C.#!"
