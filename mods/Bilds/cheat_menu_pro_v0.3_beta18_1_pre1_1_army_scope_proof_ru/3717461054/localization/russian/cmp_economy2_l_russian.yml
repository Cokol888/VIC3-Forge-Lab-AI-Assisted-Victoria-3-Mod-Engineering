 CMP_ECO2_DIRECT_DESC: "Казна и инвестфонд получают ДОБАВКУ в процентах от текущего лимита золотого резерва каждой целевой страны; это не установка абсолютного баланса."
 CMP_ECO2_TREASURY: "Казна"
