l_russian:
 CMP_NAVY18_MODE_LOGISTICS:0 "ЛОГИСТИКА"
 CMP_NAVY18_LOGISTICS_TITLE:0 "Модернизация и морская логистика"
 CMP_NAVY18_LOGISTICS_DESC:0 "Шаблоны и модернизация остаются штатной механикой Victoria 3. CMP открывает родной конструктор и карточку выбранного флота, но не подменяет выбор шаблона. Ниже можно мгновенно пополнить государственный резерв судов снабжения."
 CMP_NAVY18_RETROFIT_TITLE:0 "Шаблоны и модернизация"
 CMP_NAVY18_RETROFIT_STATUS:0 "#P Native bridge готов#! — пользовательские шаблоны создаются в штатном Конструкторе кораблей; модернизация выполняется через штатный список кораблей/выбор шаблона."
 CMP_NAVY18_RETROFIT_OPEN_DESIGNER:0 "ОТКРЫТЬ КОНСТРУКТОР КОРАБЛЕЙ"
 CMP_NAVY18_RETROFIT_OPEN_DESIGNER_TT:0 "Открывает штатный Ship Designer Victoria 3. Создайте или измените пользовательский шаблон нужного типа корабля."
 CMP_NAVY18_RETROFIT_OPEN_FLEET:0 "ОТКРЫТЬ ШТАТНУЮ КАРТОЧКУ ФЛОТА"
 CMP_NAVY18_RETROFIT_OPEN_FLEET_TT:0 "Открывает выбранный флот штатным интерфейсом Victoria 3. Далее используйте редактирование списка кораблей → изменить шаблон → модернизировать."
 CMP_NAVY18_RETROFIT_SELECT_FLEET:0 "#N Сначала выберите флот, если хотите перейти к его модернизации#!"
 CMP_NAVY18_RETROFIT_FLOW:0 "Маршрут: 1) создать/изменить шаблон → 2) открыть нужный флот → 3) выбрать корабли → 4) изменить шаблон → 5) модернизировать. CMP не вызывает RetrofitShips напрямую, пока не доказано безопасное связывание exact Ship CMP с native ShipSelection."
 CMP_NAVY18_SUPPLY_RESERVE_TITLE:0 "Государственный резерв судов снабжения"
 CMP_NAVY18_SUPPLY_RESERVE_DESC:0 "Эти кнопки изменяют резерв судов снабжения всей державы, а не состав конкретного флота. Используется документированный country-effect add_supply_ships."
 CMP_NAVY18_SUPPLY_MAINT_TITLE:0 "Обеспечение судов снабжения"
 CMP_NAVY18_SUPPLY_MAINT_GOOD:0 "#P Обеспечение судов снабжения: высокое (75%+)#!"
 CMP_NAVY18_SUPPLY_MAINT_MEDIUM:0 "#Y Обеспечение судов снабжения: среднее (25–74%)#!"
 CMP_NAVY18_SUPPLY_MAINT_BAD:0 "#N Обеспечение судов снабжения: низкое (<25%)#!"
 CMP_NAVY18_SUPPLY_ADD_TT:0 "Добавляет указанное количество судов снабжения в государственный резерв. Это чит-действие и не назначает суда конкретному формированию напрямую."
 CMP_NAVY18_SUPPLY_SELECTED_TITLE:0 "Снабжение выбранного формирования"
 CMP_NAVY18_SUPPLY_SELECTED_DESC:0 "Victoria 3 1.13.9 предоставляет num_assigned_supply_ships для MilitaryFormation. CMP показывает назначенное количество только как диагностику; прямую команду назначения судов формированию мы не придумываем."
 CMP_NAVY18_SUPPLY_NO_FLEET:0 "Флот не выбран — диагностика назначенных судов снабжения недоступна"
 CMP_NAVY18_SUPPLY_ASSIGNED_LABEL:0 "Назначено выбранному формированию:"
 CMP_NAVY18_SUPPLY_ASSIGNED_0:0 "0"
 CMP_NAVY18_SUPPLY_ASSIGNED_1:0 "1"
 CMP_NAVY18_SUPPLY_ASSIGNED_2:0 "2"
 CMP_NAVY18_SUPPLY_ASSIGNED_3:0 "3"
 CMP_NAVY18_SUPPLY_ASSIGNED_4:0 "4"
 CMP_NAVY18_SUPPLY_ASSIGNED_5:0 "5"
 CMP_NAVY18_SUPPLY_ASSIGNED_6_10:0 "6–10"
 CMP_NAVY18_SUPPLY_ASSIGNED_11_20:0 "11–20"
 CMP_NAVY18_SUPPLY_ASSIGNED_21_50:0 "21–50"
 CMP_NAVY18_SUPPLY_ASSIGNED_51_PLUS:0 "51+"
 CMP_NAVY18_SUPPLY_RESULT_PREFIX:0 "Последняя операция CMP:"
 CMP_NAVY18_SUPPLY_RESULT_1:0 "#P +1 судно снабжения#!"
 CMP_NAVY18_SUPPLY_RESULT_10:0 "#P +10 судов снабжения#!"
 CMP_NAVY18_SUPPLY_RESULT_50:0 "#P +50 судов снабжения#!"
 CMP_NAVY18_SUPPLY_RESULT_100:0 "#P +100 судов снабжения#!"
 CMP_NAVY18_LOGISTICS_SCOPE_NOTE:0 "beta18 Final: нативный маршрут модернизации и морская логистика подтверждены полным regression. Десантный помощник остаётся после beta18 Final; неподтверждённые прямые записи ShipTemplate не используются."
