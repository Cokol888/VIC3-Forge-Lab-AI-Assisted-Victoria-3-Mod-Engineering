l_russian:
 CMP_TC_OPEN:0 "ЦЕЛИ"
 CMP_TC_OPEN_TT:0 "#BOLD Единый контроллер целей#!\nВыбор активной цели для переработанных систем CMP и управление постоянными группами стран A/B/C."
 CMP_TC_TITLE:0 "Единый контроллер целей"
 CMP_TC_DESC:0 "Выберите один активный контекст цели. Недоступная кнопка означает, что соответствующая отметка или группа сейчас пуста."
 CMP_TC_ACTIVE:0 "АКТИВНАЯ ЦЕЛЬ"
 CMP_TC_PLAYER:0 "Игрок"
 CMP_TC_COUNTRY:0 "Отмеченная страна"
 CMP_TC_GROUP_A:0 "Группа A"
 CMP_TC_GROUP_B:0 "Группа B"
 CMP_TC_GROUP_C:0 "Группа C"
 CMP_TC_HOME:0 "Свои отмеченные области"
 CMP_TC_INCORP:0 "Инкорпорированные области"
 CMP_TC_FOREIGN:0 "Чужие отмеченные области"
 CMP_TC_CHARACTER:0 "Отмеченный персонаж"
 CMP_TC_FLEET:0 "Отмеченный флот"
 CMP_TC_BLOC:0 "Отмеченный блок"
 CMP_TC_TT_PLAYER:0 "Использовать страну игрока как активную цель."
 CMP_TC_TT_COUNTRY:0 "Требуется отмеченная страна."
 CMP_TC_TT_GROUP_A:0 "В постоянной группе A должна быть хотя бы одна страна."
 CMP_TC_TT_GROUP_B:0 "В постоянной группе B должна быть хотя бы одна страна."
 CMP_TC_TT_GROUP_C:0 "В постоянной группе C должна быть хотя бы одна страна."
 CMP_TC_TT_HOME:0 "Требуется хотя бы одна своя область, отмеченная указом CMP."
 CMP_TC_TT_INCORP:0 "Использовать все инкорпорированные области страны игрока."
 CMP_TC_TT_FOREIGN:0 "Требуется хотя бы одна отмеченная иностранная область."
 CMP_TC_TT_CHARACTER:0 "Требуется отмеченный персонаж."
 CMP_TC_TT_FLEET:0 "Требуется хотя бы один флот, выбранный через стандартный селектор флота CMP."
 CMP_TC_TT_BLOC:0 "Требуется отмеченный блок держав."
 CMP_TC_GROUPS:0 "ГРУППЫ СТРАН A / B / C"
 CMP_TC_GROUPS_DESC:0 "Сначала отметьте страну обычным способом, затем переключите её членство ниже. Одна страна может входить сразу в несколько групп. Группы сохраняются в сейве."
 CMP_TC_ADD_A:0 "Вкл/выкл A"
 CMP_TC_ADD_B:0 "Вкл/выкл B"
 CMP_TC_ADD_C:0 "Вкл/выкл C"
 CMP_TC_CLEAR_A:0 "Очистить A"
 CMP_TC_CLEAR_B:0 "Очистить B"
 CMP_TC_CLEAR_C:0 "Очистить C"
 CMP_TC_GROUP_TOGGLE_TT:0 "Добавляет текущую отмеченную страну в группу; если она уже там — удаляет её."
 CMP_TC_GROUP_CLEAR_TT:0 "Удаляет из этой постоянной группы все страны."
 CMP_TC_CLEAR_TRANSIENT:0 "Очистить временные отметки"
 CMP_TC_CLEAR_TRANSIENT_TT:0 "Очищает отмеченную страну, чужие области, персонажа, блок держав и списки выбранных армий/флотов. Указы-метки своих областей и постоянные группы A/B/C сохраняются."
 CMP_TC_ACTIVE_VALID:0 "#G Контекст цели корректен#!"
 CMP_TC_ACTIVE_INVALID:0 "#R Выбранная цель больше недоступна — выберите другую.#!"
 CMP_TC_FEEDBACK_SELECTED:0 "#G Активная цель изменена.#!"
 CMP_TC_FEEDBACK_ADDED:0 "#G Отмеченная страна добавлена в группу.#!"
 CMP_TC_FEEDBACK_REMOVED:0 "#Y Отмеченная страна удалена из группы.#!"
 CMP_TC_FEEDBACK_GROUP_CLEARED:0 "#Y Группа целей очищена.#!"
 CMP_TC_FEEDBACK_TRANSIENT_CLEARED:0 "#Y Временные отметки CMP очищены.#!"
 CMP_TC_FEEDBACK_NO_COUNTRY:0 "#R Для операции с группой нет обычной отмеченной страны.#!"
 CMP_TC_CORE_NOTE:0 "Ядро beta10: новые и переработанные системы могут использовать этот контекст цели. Старые страницы CMP переводятся на него поэтапно в следующих beta."
