l_russian:
 CMP_NAVY18_MODE_TRANSFER:0 "ПЕРЕДАЧА"
 CMP_NAVY18_TRANSFER_TITLE:0 "Передача кораблей другой державе"
 CMP_NAVY18_TRANSFER_DESC:0 "Получатель — текущая отмеченная страна. Точный корабль берётся из вкладки «Корабли». Для пакетной передачи добавляйте до 20 точных кораблей в список; они могут находиться в разных ваших флотах."
 CMP_NAVY18_TRANSFER_RECEIVER:0 "Получатель"
 CMP_NAVY18_TRANSFER_OPEN_TARGETS:0 "ЦЕЛИ / ПОЛУЧАТЕЛЬ"
 CMP_NAVY18_TRANSFER_RECEIVER_TT:0 "Чтобы выбрать получателя: щёлкните нужную страну правой кнопкой и используйте дипломатическое действие «Отметить страну». Затем вернитесь сюда. Получателю нужен хотя бы один порт."
 CMP_NAVY18_TRANSFER_RECEIVER_READY:0 "#P Отмеченная страна готова принять корабли#!"
 CMP_NAVY18_TRANSFER_RECEIVER_MISSING:0 "#N Получатель не выбран: отметьте другую страну#!"
 CMP_NAVY18_TRANSFER_RECEIVER_SELF:0 "#N Нельзя передавать корабли самому себе#!"
 CMP_NAVY18_TRANSFER_RECEIVER_NO_PORT:0 "#N У отмеченной страны нет порта#!"
 CMP_NAVY18_TRANSFER_EXACT_TITLE:0 "Точный корабль"
 CMP_NAVY18_TRANSFER_EXACT_READY:0 "#P Выбранный корабль доступен для передачи#!"
 CMP_NAVY18_TRANSFER_EXACT_BAD:0 "#N Выберите исправный корабль вне боя; флагман сначала нужно снять#!"
 CMP_NAVY18_TRANSFER_ADD_BATCH:0 "Добавить в список"
 CMP_NAVY18_TRANSFER_REMOVE_BATCH:0 "Убрать из списка"
 CMP_NAVY18_TRANSFER_BATCH_TT:0 "Список хранится на конкретных выбранных кораблях и сохраняется при переключении между вашими флотами. Максимум 20 кораблей."
 CMP_NAVY18_TRANSFER_BATCH_TITLE:0 "Пакет передачи"
 CMP_NAVY18_TRANSFER_BATCH_EMPTY:0 "Список передачи пуст"
 CMP_NAVY18_TRANSFER_BATCH_READY:0 "#P Список готов к пакетной передаче#!"
 CMP_NAVY18_TRANSFER_BATCH_INVALID:0 "#N В списке появился корабль в бою, флагман или недействительная цель#!"
 CMP_NAVY18_TRANSFER_BATCH_COUNT:0 "Кораблей в списке: "
 CMP_NAVY18_TRANSFER_CLEAR_BATCH:0 "Очистить список"
 CMP_NAVY18_TRANSFER_SINGLE:0 "ПЕРЕДАТЬ ТОЧНЫЙ КОРАБЛЬ"
 CMP_NAVY18_TRANSFER_BATCH:0 "ПЕРЕДАТЬ ВЕСЬ СПИСОК"
 CMP_NAVY18_TRANSFER_SINGLE_TT:0 "Передаёт только текущий выбранный корабль. Корабль в бою и флагман блокируются."
 CMP_NAVY18_TRANSFER_BATCH_ACTION_TT:0 "Передаёт все корабли из списка одной пакетной операцией, затем очищает временный флот передачи владения на стороне источника, как требует механизм Victoria 3 1.13."
 CMP_NAVY18_TRANSFER_WARNING:0 "#Y Передача меняет владельца корабля. Перед нажатием проверьте отмеченную страну и список. После пакетной передачи временный флот передачи владения у источника автоматически очищается.#!"
 CMP_NAVY18_TRANSFER_RESULT_ADDED:0 "#P Корабль добавлен в список передачи#!"
 CMP_NAVY18_TRANSFER_RESULT_REMOVED:0 "#P Корабль удалён из списка передачи#!"
 CMP_NAVY18_TRANSFER_RESULT_SINGLE:0 "#P Команда передачи точного корабля выполнена — проверьте флот получателя#!"
 CMP_NAVY18_TRANSFER_RESULT_BATCH:0 "#P Пакетная передача выполнена — проверьте флоты источника и получателя#!"
 CMP_NAVY18_TRANSFER_RESULT_CLEARED:0 "Список передачи очищен"
 CMP_NAVY18_TRANSFER_SCOPE_NOTE:0 "beta18 Final: одиночная и пакетная передача, включая несколько исходных флотов, блокировки боя/флагмана и очистку временного transfer-fleet, подтверждены полным regression."
