 CMP_ARMY_BUILDER_APPLY_TT: "Создаёт одну новую регулярную армию в отмеченной своей области. Кнопка доступна только после выбора открытого типа войск, количества и хотя бы одной отмеченной своей области. Если областей несколько, используется область с наибольшим ВВП."
 CMP_ARMY_BUILDER_LOCKED_TT: "Этот тип войск закрыт технологией. Сначала исследуйте требуемую технологию."
