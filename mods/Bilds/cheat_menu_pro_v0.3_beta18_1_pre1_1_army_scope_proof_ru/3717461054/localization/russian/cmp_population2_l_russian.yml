l_russian:
 CMP_POP2_TITLE:0 "Население и общество 2.0"
 CMP_POP2_DESC:0 "Крупный интерфейс для 2560×1080: выберите государственные области в «ЦЕЛИ», затем выполняйте явные операции без скрытых Shift/Alt/ПКМ."
 CMP_POP2_TARGETS:0 "Открыть ЦЕЛИ"
 CMP_POP2_TARGET_TT:0 "«Население 2.0» работает только с целями-областями: отмеченные свои, все инкорпорированные или отмеченные иностранные."
 CMP_POP2_TARGET_OK:0 "ЦЕЛЬ: ГОТОВА"
 CMP_POP2_TARGET_BAD:0 "НУЖНА ЦЕЛЬ-ОБЛАСТЬ"
 CMP_POP2_LEGACY:0 "Старый POP-интерфейс"
 CMP_POP2_LEGACY_TT:0 "Открывает оригинальную плотную страницу POP Cheat Menu Pro. Вернуться можно кнопкой «Население 2.0»."
 CMP_POP2_RETURN_NEW:0 "Население 2.0"
 CMP_POP2_TAB_POP:0 "Население"
 CMP_POP2_TAB_PROF:0 "Профессии"
 CMP_POP2_TAB_WELFARE:0 "Благосостояние"
 CMP_POP2_TAB_SOCIETY:0 "Общество"
 CMP_POP2_POP_TITLE:0 "Численность и грамотность"
 CMP_POP2_POP_DESC:0 "Количество применяется К КАЖДОЙ выбранной области. Добавление создаёт крестьян культуры и религии владельца области; удаление физически сокращает население."
 CMP_POP2_ADD:0 "Добавить население"
 CMP_POP2_REMOVE:0 "Удалить население"
 CMP_POP2_TT_ADD:0 "Создаёт выбранное число крестьян в каждой целевой области. Новая группа получает 80% грамотности и квалификацию крестьянина."
 CMP_POP2_TT_REMOVE:0 "УДАЛЯЕТ выбранное абсолютное число жителей из каждой целевой области через штатную механику удаления населения."
 CMP_POP2_LITERACY_TITLE:0 "Грамотность — точное значение"
 CMP_POP2_LITERACY_DESC:0 "Устанавливает выбранную грамотность всем группам населения в целевых областях. Это точная установка, а не временный модификатор."
 CMP_POP2_SET_LITERACY:0 "Установить грамотность"
 CMP_POP2_TT_SET_LITERACY:0 "Точно устанавливает уровень грамотности всех групп населения в выбранных областях."
 CMP_POP2_PROF_TITLE:0 "Профессии и кадровый резерв"
 CMP_POP2_PROF_DESC:0 "Выберите профессию и количество. Создание добавляет новую квалифицированную группу; существующие группы населения не принудительно переводятся на другое место работы."
 CMP_POP2_SPAWN_PROF:0 "Создать выбранную профессию"
 CMP_POP2_TT_SPAWN_PROF:0 "Создаёт выбранное количество работников этой профессии в каждой целевой области с 80% грамотности и 100% квалификацией выбранного типа."
 CMP_POP2_QUAL_TITLE:0 "Квалификации существующего населения"
 CMP_POP2_QUAL_DESC:0 "Профессия и квалификация — разные механики. Эта операция не меняет профессию: она задаёт долю квалифицированных для выбранной профессии."
 CMP_POP2_APPLY_QUAL:0 "Задать квалификацию"
 CMP_POP2_TT_APPLY_QUAL:0 "Устанавливает квалификацию выбранной профессии всем группам населения целевых областей."
 CMP_POP2_WELFARE_TITLE:0 "Благосостояние и политика"
 CMP_POP2_WELFARE_DESC:0 "Богатство — прямое состояние группы населения. Лоялисты и радикалы изменяются штатными эффектами области и обновляют политическое состояние населения."
 CMP_POP2_SET_WEALTH:0 "Установить богатство"
 CMP_POP2_TT_SET_WEALTH:0 "Точно устанавливает уровень богатства всех групп населения выбранных областей и обновляет лояльность."
 CMP_POP2_POLITICS_TITLE:0 "Лоялисты / радикалы"
 CMP_POP2_NEUTRALIZE:0 "Сбросить лоялистов и радикалов"
 CMP_POP2_TT_NEUTRALIZE:0 "Удаляет накопленные доли лоялистов и радикалов в выбранных областях."
 CMP_POP2_SOCIETY_TITLE:0 "Миграция, рабочая сила и идентичность"
 CMP_POP2_SOCIETY_DESC:0 "Миграция и доля работающих взрослых — постоянные модификаторы области «Население 2.0». Массовая смена культуры/религии требует отдельного подтверждения."
 CMP_POP2_MIGRATION_TITLE:0 "Привлекательность миграции"
 CMP_POP2_WORKFORCE_TITLE:0 "Доля работающих взрослых"
 CMP_POP2_CLEAR_SOC:0 "Сбросить миграцию и рабочую силу"
 CMP_POP2_TT_CLEAR_SOC:0 "Удаляет только модификаторы «Население 2.0»; прочие модификаторы игры и CMP не затрагиваются."
 CMP_POP2_IDENTITY_TITLE:0 "Массовая идентичность — разрушительная операция"
 CMP_POP2_CONFIRM:0 "Разрешить массовую смену культуры/религии"
 CMP_POP2_TT_CONFIRM:0 "Включает защитный флаг. Пока он не активен, кнопки ассимиляции и конверсии недоступны."
 CMP_POP2_ASSIMILATE:0 "Ассимилировать к владельцу"
 CMP_POP2_CONVERT_REL:0 "Обратить в гос. религию"
 CMP_POP2_TT_ASSIMILATE:0 "Меняет культуру всех групп населения выбранных областей на первую основную культуру владельца области."
 CMP_POP2_TT_CONVERT:0 "Меняет религию всех групп населения выбранных областей на государственную религию владельца области."
 CMP_POP2_PRESETS_TITLE:0 "Готовые пресеты"
 CMP_POP2_PRESET_INDUSTRIAL:0 "Промышленный резерв"
 CMP_POP2_PRESET_EDUCATED:0 "Образованный регион"
 CMP_POP2_PRESET_STABLE:0 "Стабилизировать"
 CMP_POP2_TT_PRESET_INDUSTRIAL:0 "На каждую область: +15 тыс. рабочих, +5 тыс. машинистов, +2,5 тыс. инженеров и +2,5 тыс. служащих."
 CMP_POP2_TT_PRESET_EDUCATED:0 "Грамотность 90% и 100% квалификации для служащих, инженеров и учёных."
 CMP_POP2_TT_PRESET_STABLE:0 "Обнуляет радикалов, добавляет 25% лоялистов и устанавливает +25% миграционной привлекательности «Население 2.0»."
 CMP_POP2_TT_GENERIC:0 "Население и общество 2.0"
 CMP_POP2_TT_AMOUNT:0 "Выбранное количество применяется к каждой целевой области."
 CMP_POP2_TT_LITERACY:0 "Выберите точную грамотность."
 CMP_POP2_TT_PROF:0 "Выберите профессию для создания или квалификации."
 CMP_POP2_TT_QUAL:0 "Выберите долю квалификации."
 CMP_POP2_TT_WEALTH:0 "Выберите точный базовый уровень богатства."
 CMP_POP2_TT_LOYALISTS:0 "Добавляет выбранную долю лоялистов в каждой целевой области."
 CMP_POP2_TT_RADICALS:0 "Добавляет выбранную долю радикалов в каждой целевой области."
 CMP_POP2_TT_RADICALS_DOWN:0 "Уменьшает радикалов на выбранную долю."
 CMP_POP2_TT_MIGRATION:0 "Заменяет только модификатор миграции «Население 2.0» выбранным значением."
 CMP_POP2_TT_WORKFORCE:0 "Заменяет только модификатор доли работающих взрослых «Население 2.0». Значение указано в процентных пунктах."
