 SKY_B5_TT_FX_1: "#BOLD Добавить лоялистов#!\n$SKY_LC$ +100%\n$SKY_SL$ +50%\n$SKY_AL$ +5%\n$SKY_CL$ 100% к нейтралу\n#lore Действует на текущих членов. Возможна проблема: может потребоваться несколько кликов.#!"
 SKY_B5_TT_FX_2: "#BOLD Добавить радикалов#!\n$SKY_LC$ +100%\n$SKY_SL$ +50%\n$SKY_AL$ +5%\n$SKY_CL$ 100% к нейтралу\n#lore Действует на текущих членов. Возможна проблема: может потребоваться несколько кликов.#!"
 SKY_B5_TT_FX_3: "#BOLD Принудить в/из правительства#!\n$SKY_LC$ Напрямую добавить текущую в правительство.\n$SKY_RC$ Напрямую вывести текущую из правительства."
 SKY_B5_TT_FX_4: "#BOLD Вступить/выйти из революции#!\n$SKY_LC$ Текущая присоединяется к текущей революции в этой стране.\n$SKY_RC$ Текущая покидает текущую революцию в этой стране.\n#lore Доступно только если в стране есть революционное или сепаратистское политическое движение. Если их несколько, используется текущая революция этой страны.#!"
 SKY_B5_TT_FX_5: "#BOLD Захват $concept_character$#!\n$SKY_LC$ Отмеченный $concept_character$ получает контроль над выбранной $concept_interest_group$, к которой он принадлежит.\n#lore Требуется отмеченный $concept_character$, который уже принадлежит выбранной IG.#!"
 SKY_B5_TT_FX_8: "#BOLD Создать лидера#!\n$SKY_LC$ Создать нового лидера $ideology_moderate$ и сразу передать ему выбранную IG.\n$SKY_SL$ Создать нового лидера $ideology_radical$ и сразу передать ему выбранную IG.\n$SKY_AL$ Создать нового лидера $ideology_communist$ и сразу передать ему выбранную IG.\n$SKY_CL$ Создать нового лидера $ideology_market_liberal$ и сразу передать ему выбранную IG."
 SKY_B5_TT_FX_9: "#BOLD Снять лидера#!\n$SKY_LC$ Удалить текущего действующего лидера."
