 SKY_1_2_B4_TT_SHIP_CONSTRUCTION_CAPACITY_DISABLED: "#BOLD Производственные мощности по строительству судов#!\n$SKY_line$\nЭта опция приводила к появлению большого количества очередей на строительство конвоев, которые нельзя было отменить, поэтому сейчас она отключена.\n\n$SKY_LC$ Сбросить связанные модификаторы.\n$SKY_RC$ Сбросить связанные модификаторы."
 SKY_1_2_B4_TT_SUPPLY_SHIP_RATIO_DISABLED: "#BOLD Коэффициент конвоя#!\n$SKY_line$\nЭта опция усиливала распределение заданий в очереди строительства конвоев, поэтому теперь она отключена.\n\n$SKY_LC$ Сбросить связанные модификаторы.\n$SKY_RC$ Сбросить связанные модификаторы."
 SKY_B6_TT_PRINCIPLE_NAVY: "#BOLD $principle_group_navy$#!\n\n$SKY_LC$ $SKY_R5_ADD_LV3$$principle_group_navy$\n$SKY_SL$ $SKY_R5_ADD_LV2$$principle_group_navy$\n$SKY_AL$ $SKY_R5_ADD_LV1$$principle_group_navy$\n$SKY_RC$ $SKY_R5_REMOVE_ALL_LV$\n\n#lore $principle_group_navy_desc$#!"
 SKY_B7_TT_SUBJECTS_LIBERTY_DESIRE: "#BOLD $concept_liberty_desire$ всех субъектов#!\n$SKY_line$\n$SKY_LC$ Все субъекты $SKY_SELF_COUNTRY$: -20 $concept_liberty_desire$\n$SKY_RC$ Все субъекты $SKY_SELF_COUNTRY$: +20 $concept_liberty_desire$\n$SKY_AL$ Все субъекты $SKY_SELF_COUNTRY$: -5 $concept_liberty_desire$\n$SKY_CL$ Если $SKY_MARKED_COUNTRY$ существует, все субъекты $SKY_TARGET_COUNTRY$: -20 $concept_liberty_desire$\n$SKY_SL$ Если $SKY_MARKED_COUNTRY$ существует, все субъекты $SKY_TARGET_COUNTRY$: +20 $concept_liberty_desire$"
 SKY_B7_TT_SUBJECTS_LIBERTY_MOD: "#BOLD $concept_liberty_desire$ $concept_modifier$ субъектов#!\n$SKY_line$\n$SKY_LC$ Добавить -20 $concept_liberty_desire$ $concept_modifier$ субъектов к $SKY_SELF_COUNTRY$.\n$SKY_SL$ Добавить +20 $concept_liberty_desire$ $concept_modifier$ субъектов к $SKY_SELF_COUNTRY$.\n$SKY_AL$ Добавить -5 $concept_liberty_desire$ $concept_modifier$ субъектов к $SKY_SELF_COUNTRY$.\n$SKY_CL$ Если $SKY_MARKED_COUNTRY$ существует, добавить -20 $concept_liberty_desire$ $concept_modifier$ субъектов к $SKY_TARGET_COUNTRY$.\n$SKY_RC$ Удалить $concept_liberty_desire$ $concept_modifier$ субъектов этой малой кнопки."
