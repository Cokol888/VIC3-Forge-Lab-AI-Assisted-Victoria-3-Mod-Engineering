 SKY_B1_TT_SUPER_RIGHT_CLICK: "#BOLD $SKY_B1_SUPER_RIGHT_CLICK$#!\n$SKY_line$\n$SKY_LC$ Открыть. \n$SKY_RC$ Закрыть. \N\N#LORE После активации не забудьте снять игру с паузы, это обновит состояние на следующий день. Затем щелкните правой кнопкой мыши на любой стране, чтобы увидеть дополнительные дипломатические действия, например #t $sakuya_superdip_humiliate_01$#!."
