 sakuya_superdip.3.t: "Сакуя убедила [SCOPE.sCountry('sakuya_superdip_target_country').GetName]'s [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]"
 sakuya_superdip.3.d: "На закрытой встрече Сакуя убедила [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] пересмотреть отношения с [SCOPE.sCountry('sakuya_superdip_actor_country').GetName]."
 sakuya_superdip.3.f: "К концу встречи, [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] уже убрала в ящик столешницы суровую записку, которую изначально подготовила, и попросила назначить следующую встречу. Сакуя просто спокойно закрыла карманные часы, словно всё было в порядке."
 sakuya_superdip.3.a: "Это хорошо."
