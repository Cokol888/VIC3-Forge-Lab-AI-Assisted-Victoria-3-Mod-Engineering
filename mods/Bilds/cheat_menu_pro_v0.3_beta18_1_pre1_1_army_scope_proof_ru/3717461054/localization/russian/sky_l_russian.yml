 SKY_B3_TT_GOODS_OBSESSION_SELECTED_CULTURE: "#BOLD Культурная одержимость: «Marked Culture»#!\n$SKY_line$\n#lore Требуется ровно 1 выбранный товар и ровно 1 отмеченный $concept_culture$.#!\n\n$SKY_LC$ Добавить привязку к выбранному товару в корзину $concept_culture$.\n$SKY_RC$ Удалить избранный товар из списка $concept_culture$.\N\NВы должны отметить $concept_culture$ во-первых. #LORE Не знаю, как отметить $concept_culture$? Открыть #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$, затем выберите культуру в $SKY_1_2_CULTURE_INDEX_TITLE$#!."
 SKY_B3_TT_GOODS_TABOO_SELECTED_CULTURE: "#BOLD Культурное табу: культура, подвергающаяся осуждению#!\n$SKY_line$\n#lore Требуется ровно 1 выбранный товар и ровно 1 отмеченный $concept_culture$.#!\n\n$SKY_LC$ Добавить табу на выбранный товар в список отмеченных $concept_culture$.\n$SKY_RC$ Снять запрет на выбранный товар из списка $concept_culture$.\N\NВы должны отметить $concept_culture$ во-первых. #LORE Не знаю, как отметить $concept_culture$? Открыть #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$, затем выберите культуру в $SKY_1_2_CULTURE_INDEX_TITLE$#!."
