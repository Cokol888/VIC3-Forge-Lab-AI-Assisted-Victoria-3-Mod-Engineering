 SKY_B8_TT_FAMOUS_CHARACTER: "#BOLD Призыв знаменитости#!\n\n$SKY_LC$ Вступает в страну игрока как агитатор\n$SKY_RC$ Становится правителем страны игрока\n$SKY_AL$ Вступает в страну игрока как генерал\n$SKY_SL$ Вступает в страну игрока как адмирал\n$SKY_line$\n#italic Одну и ту же фигуру можно призывать многократно. Роль зависит от способа клика.#!"
 SKY_ABOUT_WELCOME_1: "#BOLD Добро пожаловать!#!\nРад знакомству. Я Xier, разработчик Victoria 3 Cheat Menu Pro. Для меня честь встретить вас снова в Victoria 3. #BOLD QQ-группа:#! 734267077. Присоединяйтесь!"
 SKY_ABOUT_WELCOME_2: "#BOLD Что вы думаете об этом моде?#!\nЯ продолжаю его развивать. По сравнению с EU5 движок Victoria 3 выглядит похожим на прошлые игры, но на деле сильно отличается. В любом случае, желаю всем веселья! Встреча с вами правда радует меня."
 SKY_UPDATE_LOG_V1_TITLE: "#BOLD Заметки обновления $SKY_WINDOW_TITLE$ v1.0#!"
 SKY_UPDATE_LOG_V1_TEXT: "- Первый выпуск\n- Перенесена система панели навигации из EU5\n- 9 категорий функций, по 12 резервных кнопок в каждой\n- Страница О моде содержит журнал, настройки персонализации и сведения\n- Поддержана локализация на упрощённый китайский"
 SKY_SETTINGS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Настройки персонализации#!"
 SKY_SETTINGS_PLACEHOLDER: "Настройки персонализации в разработке. Следите за обновлениями.\nВ будущих версиях будут фон, смена темы интерфейса и другое."
 SKY_ABOUT_LINKS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Контакты#!"
 SKY_ABOUT_TEXT_1: "#BOLD Спасибо за использование $SKY_WINDOW_TITLE$!#!\nРад знакомству. Я Xier, разработчик из Пекина, сейчас живущий в Чехии. Если есть вопросы, свяжитесь со мной через QQ-группу или Discord-сервер. Если хотите поддержать Xier, поставьте лайк в Steam Workshop или пожертвуйте через ссылку спонсора выше.\nЭтот мод полностью бесплатен. Если вы получили его через платный канал, немедленно сообщите об этом. Xier будет очень благодарен!"
 SKY_ABOUT_TEXT_2: "#BOLD Совместимость#!\n$SKY_WINDOW_TITLE$ тщательно спроектирован для максимальной совместимости с другими модами. Однако из-за ограничений движка нужно изменить один системный GUI-файл, чтобы показывать интерфейс $concept_modifier$.\nДля максимально полного загрузки крупных модов рекомендуемый порядок: крупные моды, затем малые, затем UI-моды, и наконец $SKY_WINDOW_TITLE$. Так как позднее загруженные файлы перекрывают ранние, размещение $SKY_WINDOW_TITLE$ последним гарантирует приоритет его UI-правок над другими UI-модами.\nЕсли возникнут проблемы, свяжитесь через QQ или Discord. Я постараюсь помочь."
