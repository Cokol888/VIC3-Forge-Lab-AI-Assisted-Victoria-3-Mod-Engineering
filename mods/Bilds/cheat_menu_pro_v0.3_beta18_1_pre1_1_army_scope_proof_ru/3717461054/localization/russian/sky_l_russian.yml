 SKY_B3_TRAIT_GROUP_TT_GENERAL: "#BOLD Командир#!\n$SKY_line$\n$SKY_LC$ Добавить полный набор черт для военного командования.\n$SKY_RC$ Удалить этот набор черт.\n$SKY_line$\nУпор на армию, флот, местность, артиллерию, атаку, оборону, снабжение, грабежи и командование флотом."
 SKY_B3_TRAIT_GROUP_TT_EXECUTIVE: "#BOLD Управляющий $concept_company$#!\n$SKY_line$\n$SKY_LC$ Добавить полный набор черт для управления $concept_company$ и промышленностью.\n$SKY_RC$ Удалить этот набор черт.\n$SKY_line$\nУпор на производительность, управление, предпринимательство, инженерию и промышленное администрирование."
 SKY_B3_TRAIT_GROUP_TT_BAD_RULER: "#BOLD Плохой правитель#!\n$SKY_line$\n$SKY_LC$ Добавить полный набор черт для губительного правителя.\n$SKY_RC$ Удалить этот набор черт.\n$SKY_line$\nВключает высокомерие, гнев, жестокость, роскошь, мошенничество, зависимости, некомпетентность и другие вредные привычки власти."
 SKY_B3_TRAIT_GROUP_TT_AGITATOR: "#BOLD Агитатор#!\n$SKY_line$\n$SKY_LC$ Добавить полный набор черт для политической агитации.\n$SKY_RC$ Удалить этот набор черт.\n$SKY_line$\nУпор на харизму, привлекательность, политическую организацию, речи, агитацию и общественные движения."
 SKY_B3_TRAIT_GROUP_TT_RULER: "#BOLD Правитель#!\n$SKY_line$\n$SKY_LC$ Добавить полный набор черт для управления страной.\n$SKY_RC$ Удалить этот набор черт.\n$SKY_line$\nУпор на дипломатию, администрацию, колонии, политическую организацию, престиж и государственное управление."
 SKY_B3_TRAIT_GROUP_TT_ALL_ROUNDER: "#BOLD Универсал#!\n$SKY_line$\n$SKY_LC$ Добавить полный набор широко полезных черт.\n$SKY_RC$ Удалить этот набор черт.\n$SKY_line$\nСочетает полезные стороны для правления, компаний, политики, дипломатии, армии и флота."

