 SKY_B4_TT_WAR_SELECT_WAR: "#BOLD Выбрать войну#!\n\n$SKY_LC$ Выбрать войну с участием игрока\n$SKY_RC$ Выбрать войну с участием отмеченной страны\n$SKY_line$\n#italic Открыть список войн для выбора.#!"
 SKY_B4_TT_WAR_CLEAR_SEL: "#BOLD Снять выбор#!\n\n$SKY_LC$ Очистить выбранные $concept_diplomatic_play_short$ и войну\n$SKY_line$\n#italic Кнопка недоступна, если не выбрана $concept_diplomatic_play_short$ или война.#!"
 SKY_B4_EVT_SELECT_DP_DESC: "Выберите из списка $concept_diplomatic_play$, связанную с этой страной."
 SKY_B4_EVT_SELECT_DP_DESC_EMPTY: "#n Сейчас нет $concept_diplomatic_play$, связанной с этой страной.#!"
 SKY_B4_EVT_SELECT_DP_DESC_SELECTED: "#lore Статус: $concept_diplomatic_play_short$ уже выбрана. Новый выбор заменит текущий.#!"
 SKY_B4_EVT_SELECT_DP_DESC_HINT: "#lore Выберите $concept_diplomatic_play_short$ для будущих действий.#!"
 SKY_B4_EVT_SELECT_WAR_DESC: "Выберите из списка войну с участием этой страны."
