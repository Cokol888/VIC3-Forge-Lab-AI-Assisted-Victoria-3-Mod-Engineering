 SKY_B6_POPMIG_TT_SAME_CULTURE_REV: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nПереместить население $SKY_SELF_COUNTRY$, принадлежащее к основным культурам $SKY_MARKED_COUNTRY$, в $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, распределить по инкорпорированным $concept_state$s страны цели.\n$SKY_AL$ 5%, распределить по инкорпорированным $concept_state$s страны цели.\n$SKY_CL$ 50%, распределить по инкорпорированным $concept_state$s страны цели.\n$SKY_SL$ 33%, переместить в отмеченные $concept_state$s страны цели.\n$SKY_RC$ 100%, распределить по инкорпорированным $concept_state$s страны цели."
 SKY_B6_POPMIG_TT_NON_PRIMARY: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nПереместить население неосновной культуры $SKY_SELF_COUNTRY$ в $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, распределить по инкорпорированным $concept_state$s страны цели.\n$SKY_AL$ 5%, распределить по инкорпорированным $concept_state$s страны цели.\n$SKY_CL$ 50%, распределить по инкорпорированным $concept_state$s страны цели.\n$SKY_SL$ 33%, переместить в отмеченные $concept_state$s страны цели.\n$SKY_RC$ 100%, распределить по инкорпорированным $concept_state$s страны цели."
 SKY_B6_POPMIG_TT_NON_PRIMARY_REV: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Переместить 20% населения неосновной культуры $SKY_MARKED_COUNTRY$ в отмеченные $concept_state$s $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_POINT: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Переместить 20% населения отмеченных $concept_state$s $SKY_MARKED_COUNTRY$ в отмеченные $concept_state$s $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n Рекомендуется, чтобы обе стороны отметили только один штат. Если отмечено несколько, скрипт случайно выберет подходящую цель.#!"
 SKY_B6_POPMIG_TT_POINT_REV: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Переместить 20% населения отмеченных $concept_state$s $SKY_SELF_COUNTRY$ в отмеченные $concept_state$s $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n Рекомендуется, чтобы обе стороны отметили только один штат. Если отмечено несколько, скрипт случайно выберет подходящую цель.#!"
 SKY_B6_POPMIG_TT_LOW_ACCEPTANCE: "#BOLD $SKY_B6_POPMIG_LOW_ACCEPTANCE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nПереместить население двух низших уровней принятия $SKY_SELF_COUNTRY$ в $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, распределить по инкорпорированным $concept_state$s страны цели.\n$SKY_AL$ 5%, распределить по инкорпорированным $concept_state$s страны цели.\n$SKY_CL$ 50%, распределить по инкорпорированным $concept_state$s страны цели.\n$SKY_SL$ 33%, переместить в отмеченные $concept_state$s страны цели.\n$SKY_RC$ 100%, распределить по инкорпорированным $concept_state$s страны цели.\n\nСначала нужно отметить страну. $SKY_SL$ также требует хотя бы один $concept_state$ в этой стране."
