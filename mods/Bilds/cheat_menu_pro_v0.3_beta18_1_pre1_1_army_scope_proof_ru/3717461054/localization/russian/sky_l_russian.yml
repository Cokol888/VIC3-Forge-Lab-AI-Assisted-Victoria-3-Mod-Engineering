 SKY_B2_ECON_TT_MARKED_FINE: "#BOLD $SKY_MARKED_COUNTRY$#!\n$SKY_line$\n$SKY_LC$ Применить такое же значение.\n$SKY_SL$ Применить большее значение.\n$SKY_AL$ Применить малое значение.\n$SKY_CL$ Применить противоположное значение.\n$SKY_RC$ Применить противоположное значение.\n$SKY_line$\n#lore Сначала отметьте целевую страну.#!"
