 SKY_B5_TT_LOBBY_DISBAND: "#BOLD Распустить $concept_political_lobby_short$#!\n\n$SKY_LC$ Распустить текущее выбранное $concept_political_lobby_short$\n$SKY_SL$ Распустить все $concept_political_lobby_short$s в этой стране\n$SKY_AL$ Распустить все $concept_political_lobby_short$s в отмеченной стране\n$SKY_line$\n#italic Это $concept_political_lobby_short$ исчезнет навсегда. Shift/Alt не требуют выбранного $concept_political_lobby_short$.#!"
 SKY_B5_TT_LOBBY_IG_JOIN: "#BOLD Вступить/выйти из $concept_political_lobby_short$#!\n\n$SKY_LC$ Выбранная $concept_interest_group$ вступает в выбранное $concept_political_lobby_short$\n$SKY_RC$ Выбранная $concept_interest_group$ выходит из выбранного $concept_political_lobby_short$\n$SKY_SL$ Все $concept_interest_group$s этой страны вступают в выбранное $concept_political_lobby_short$\n$SKY_CL$ Удалить всех членов выбранного $concept_political_lobby_short$\n$SKY_line$\n#italic Если $concept_political_lobby_short$ принадлежит иностранной стране, автоматически используется соответствующая $concept_interest_group$ этой страны.\nЛКМ/ПКМ требуют выбранные $concept_interest_group$ и $concept_political_lobby_short$.#!"
 SKY_B5_TT_LOBBY_CREATE: "#BOLD Создать $concept_political_lobby_short$#!\n\n$SKY_LC$ Создать в этой стране $concept_political_lobby_short$ за страну цель\n$SKY_RC$ Создать в этой стране $concept_political_lobby_short$ против страны цели\n$SKY_SL$ Создать в стране цели $concept_political_lobby_short$ за игрока\n$SKY_AL$ Создать в стране цели $concept_political_lobby_short$ против игрока\n$SKY_line$\n#italic Требуется отмеченная страна цель. Если $concept_interest_group$ выбрана, она станет начальным членом.#!"
 SKY_B5_TT_LOBBY_LEVERAGE: "#BOLD $country_lobby_leverage_generation_mult$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ -100%\n$SKY_RC$ Очистить $concept_modifier$\n$SKY_line$\n#italic Влияет на скорость создания $concept_power_bloc_leverage$ всеми $concept_political_lobby_short$s в этой стране.#!\n$SKY_stackable$"
