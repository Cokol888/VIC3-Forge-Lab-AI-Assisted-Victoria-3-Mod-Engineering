 notification_sakuya_superdip_annex_country_toast_desc: "После того как Сакуя убедила его, [SCOPE.sCountry('target').GetRuler.GetFullName] подписал [SCOPE.sCountry('actor').GetCapital.GetCityHubName] Договор в [SCOPE.sCountry('target').GetCapital.GetCityHubName], и [SCOPE.sCountry('target').GetName] и [SCOPE.sCountry('actor').GetName] наконец завершили процесс объединения."
