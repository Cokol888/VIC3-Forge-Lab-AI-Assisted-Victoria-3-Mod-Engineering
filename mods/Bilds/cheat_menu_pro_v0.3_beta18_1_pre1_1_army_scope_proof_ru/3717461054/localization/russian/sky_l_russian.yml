 notification_sakuya_superdip_force_join_power_bloc_toast_desc: "[SCOPE.sCountry('target').GetRuler.GetFullName] после встречи признал, что объяснение Сакуи относительно международной обстановки было ясным и от него было трудно отказаться. [SCOPE.sCountry('target').GetName] затем присоединился к $concept_power_bloc$ что [SCOPE.sCountry('actor').GetName] принадлежит."
