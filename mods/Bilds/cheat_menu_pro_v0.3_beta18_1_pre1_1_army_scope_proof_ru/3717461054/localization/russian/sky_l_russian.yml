SKY_1_1_SP_GUIDE_BTN1: "$SKY_DEFAULT_TITLE$!\nПеред началом Xier объяснит клики по кнопкам. #P ЛКМ#! по кнопке добавляет эффект. Наведите мышь на кнопку, чтобы увидеть детали. Если эффект является $concept_modifier$, #N ПКМ#! удалит этот $concept_modifier$. Большинство кнопок поддерживает сочетания клавиш. Зажмите клавишу и нажмите ЛКМ.\N@innovation!Обычно #p ЛКМ#! дает полезное и разумное значение по мнению $xier$. #BLUE Shift#! дает значение в сто раз или еще выше. #COLOR:{0.3686,0.3961,0.7216} Alt#! дает малое значение для точной настройки. #GOLD Ctrl#! обычно дает обратный эффект."
SKY_1_1_SP_GUIDE_BTN2: "Большинство функций отметки #BOLD поддерживает только одну цель#!. Это также верно для товаров и компаний на этой странице. Ползунок первой страницы меняет доход. #I Нажмите#! ползунок, выберите значение, затем нажмите кнопку подтверждения ниже. Чтобы убрать модификатор, #N нажмите ПКМ#! или поставьте ползунок на #n 0#!."
SKY_1_1_SP_GUIDE_BTN3: "Для внутренних или изгнанных персонажей нажмите ПКМ по персонажу и выберите #yellow $sakuya_mark_character$#! во всплывающем меню. Для чужих персонажей сначала отметьте страну, затем найдите #YELLOW $SKY_B3_CHAR_MARK_OPEN$#! на этой странице и выберите нужного персонажа во всплывающем событии."
SKY_1_1_SP_GUIDE_BTN4: "#yellow $SKY_B4_TAKE_MARKED_NAVY_SHIPS$#! и #yellow $SKY_1_1_B4_BTN_DESTROY_SHIPS$#! требуют отмеченного флота. Зажмите #BLUE Shift#! и нажмите #yellow $SKY_R4_MARK_ARMY$#!, чтобы выбрать флот через событие.\NПри начале дип. игры или войны проверьте, законна ли военная цель. Если условия не выполнены, действие может не сработать. Такое бывает и в других функциях $CMP$."
SKY_1_1_SP_GUIDE_BTN5: "Как и другие системы отметки в $CMP$, отмеченная в $SKY_B5_SUBSEC_1$ $concept_interest_group$ используется другими опциями. Выбранная группа интересов подсветит функции, которым нужна отмеченная группа, например смену группы интересов у $sakuya_mark_character$. Обычно лучше выбирать только одну $concept_interest_group$."
SKY_1_1_SP_GUIDE_BTN6: "Нажмите ПКМ по вашему региону и выберите #yellow $decree_sakuya_mark_state$#!, чтобы отметить нужный $state$. Также можно выбрать #yellow $decree_sakuya_mark_state$#! ниже в #i $concept_political_lens$#! и $mm_issue_decree_interaction$, чтобы удобнее отмечать на карте. Для чужого региона нажмите ПКМ по целевой стране и выберите #yellow $sakuya_mark_foreign_state$#!.\N#T #N Настоятельно рекомендуется отмечать только одно место за раз!#!#!"
SKY_1_1_SP_GUIDE_BTN6_tab4: "После выбора категории здания в селекторе зданий текущее выбранное здание появится слева внизу меню. Сначала выберите целевой $state$ через $decree_sakuya_mark_state$, затем задайте значение ползунком и нажмите #yellow $SKY_B6_BUILD_ADD_BUILDING$#!. Уровень #n 0#! очистит это здание или ресурсный потенциал. Успех зависит от #N технологий#! и других условий игрока или целевой страны.\NКатегории $SKY_B6_BUILD_CAT_RESOURCE$ и $SKY_B6_BUILD_CAT_AGRICULTURE$ также поддерживают #yellow $SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL$#!."
SKY_1_1_SP_GUIDE_BTN6_tab5: "\NНа этой странице все модификаторы действуют на $concept_buildings$, кроме #yellow $SKY_B6_RESERVED_BUILD_R2_C1$#! и #yellow $SKY_B6_RESERVED_BUILD_R2_C2$#!, которые действуют на $state$. Нужно нажать измененные $concept_buildings$, чтобы увидеть нужный $concept_modifier$."
SKY_1_1_SP_GUIDE_BTN7: "\NНажмите ПКМ по стране и выберите #yellow $sakuya_mark_country$#!, чтобы отметить ее. Также можно выбрать #yellow $sakuya_mark_country$#! ниже в #i $concept_diplomatic_lens$#! и $concept_diplomatic_actions$, чтобы удобнее отмечать на карте."
 SKY_1_1_SP_GUIDE_BTN8: "\N\N#yellow $SKY_BTN8_TAB_TECHNOLOGY$#! собирает $concept_technology$-связанные модификаторы; используйте вкладки выше для переключения между $production$, $military$, и $society$. Большинство кнопок соответствуют стандартным правилам для больших и маленьких кнопок, а щелчок правой кнопкой мыши сбрасывает соответствующее $concept_modifier$.\N\Nи #yellow $SKY_BTN8_TAB_CULTURE$#!, нажмите #yellow $SKY_B8_CULTURE_MARK$#! открыть $SKY_1_2_CULTURE_INDEX_TITLE$#!. Выберите цель $concept_culture$ в $concept_culture$ селектор, а затем использовать его для $concept_primary_cultures$, $concept_homelands$, а также другие функции, связанные с культурой."
SKY_1_1_SP_GUIDE_BTN9: "\nПопробуйте навести мышь на большой заголовок $CMP$ на одну секунду...?\n@innovation!Разные обои показывают разное содержимое."
SKY_1.1_CLOSE: "Нажмите, чтобы закрыть."
SKY_B4_TT_JOIN_WAR_INITIATOR_SIDE: "#tooltip_header Вступить в войну#!\n\nДобавить страну на сторону инициатора выбранной войны.\nСначала выберите войну.\n$SKY_line$\n$SKY_LC$ Игрок вступает за инициатора\n$SKY_RC$ Отмеченная страна вступает за инициатора\n$SKY_SL$ Игрок выходит, если возможно\n$SKY_AL$ Отмеченная страна выходит, если возможно"
SKY_B4_TT_JOIN_WAR_TARGET_SIDE: "#tooltip_header Вступить за цель#!\n\nДобавить страну на сторону цели выбранной войны.\nСначала выберите войну.\n$SKY_line$\n$SKY_LC$ Игрок вступает за цель\n$SKY_RC$ Отмеченная страна вступает за цель"
SKY_1_1_START_BUTTON_GUIDE: "Нажмите кнопку слева или #p G#!, чтобы открыть #gold $CMP$#!!"
