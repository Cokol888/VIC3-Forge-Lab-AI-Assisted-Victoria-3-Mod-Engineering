 sakuya_superdip_humiliate_01: "Пусть Сакуя унизит эту страну."
 sakuya_superdip_humiliate_01_action_name: "Пусть Сакуя унизит эту страну."
 sakuya_superdip_humiliate_01_desc: "Вы отправите Сакуя отобедать с послом этой страны от имени наших правителей."
 sakuya_superdip_humiliation_pact_01: "$humiliation$"
 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "Сакуя унижает целевую страну, устраивая крайне неуместный дипломатический ужин, что наносит ущерб её репутации на международной арене. Срок действия: 5 лет."
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] подвергается унижению со стороны Сакуи, которую послал [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]. Срок действия: 5 лет."
 sakuya_superdip_humiliation_pact_01_effect_desc_global: "Заключить договор об унижении Сакуи"
 sakuya_superdip_humiliation_pact_01_effect_desc_first: "[COUNTRY.GetNameNoFlag] поставит Сакую в неловкое положение [TARGET_COUNTRY.GetName] в течение 5 лет"
 sakuya_superdip_humiliation_pact_01_effect_desc_third: "[COUNTRY.GetName] поставит Сакую в неловкое положение [TARGET_COUNTRY.GetName] в течение 5 лет"
 sakuya_superdip.1.t: "Сакуя выступает на дипломатическом обеде!"
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName] погружается в хаос, когда Сакуя вступает в драку с сотрудниками [SCOPE.sCountry('sakuya_superdip_target_country').GetName] во время ужина."
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] попытался обрушить на Сакую скамейку, но она ловко отскочила в сторону, схватила кусок торта со стола и швырнула его в [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]голова. \N\N\"#lore Старый дурак... Ты пытался устроить мне засаду? #!\""
 sakuya_superdip.1.a: "Хорошая ругань!"
 sakuya_superdip.1.b: "Я добавлю несколько проклятий..."
 sakuya_superdip.1.c: "Сакуя-сэнсэй, не делайте этого..."
 sakuya_superdip.1.c_desc: "После [SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName] Сделав все возможное, чтобы остановить её, Сакуя Изаёи на время отложила свои серебряные ножи, а затем сделала глоток вина, выглядя как всегда невозмутимой."
 notification_sakuya_superdip_humiliation_toast_name: "Сакуя с презрением унизила [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "Сакуя передала правителю [SCOPE.sCountry('target').GetName], [SCOPE.sCountry('target').GetRuler.GetFullName], дипломатическую ноту удивительной культурной утонченности. По какой-то причине они сочли ее #BOLD оскорблением#!. Их грубость нас позабавила; они же выглядели весьма недовольными. Дипломатические отношения между [SCOPE.sCountry('actor').GetName] и [SCOPE.sCountry('target').GetName], похоже, ухудшились."
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "Сакуя говорит:\NТвоя мама была хомячком,\Nа от твоего отца пахнет бузиной!"
 sakuya_superdip_insult_02: "Сакуя говорит:\NСудный день наступил!\NСлуги Люцифера бродят по земле—\NО, нет, это всего лишь представитель вашей страны."
 sakuya_superdip_insult_03: "Сакуя говорит:\NБолее того, я считаю, что ваш капитал должен быть уничтожен!"
 sakuya_superdip_insult_04: "Сакуя говорит:\NКогда будущие поколения будут писать историю нашего времени,\Nони будут смотреть на тебя с той смесью жалости и отвращения, которую называют состраданием."
 sakuya_superdip_insult_05: "Сакуя говорит:\NМой последний визит в туалет оказался гораздо приятнее, чем ужин с вашим послом."
 sakuya_superdip_insult_06: "Сакуя говорит:\NОй, смотри.\NЗдесь есть кое-что по-настоящему отвратительное."
 sakuya_superdip_insult_07: "Сакуя говорит:\NВаша кровь сделает землю, которую я заберу у вас, ещё более плодородной."
 sakuya_superdip_insult_08: "Сакуя говорит:\NСкучным дипломатическим мероприятиям всегда нужен какой-нибудь скандал, чтобы оживить обстановку.\NА ты, мой друг, — самый лучший сом из всех!"
 sakuya_superdip_insult_09: "Сакуя говорит:\NПочему в вашей стране всегда все так ужасно?\NПодозреваю, что виноваты в этом вы все."
 sakuya_superdip_insult_10: "Сакуя говорит:\NВ этой замечательной игре, в которую мы играем,\Nты всего лишь пешка."
 sakuya_superdip_insult_11: "Сакуя говорит:\NО твоих проступках ходят слухи от Ирландии до Катая."
 sakuya_superdip_insult_12: "Сакуя говорит:\NУ твоего правителя ум как у спелого банана,\Nно проявляет настоящий гений в публичном испражнении."
 sakuya_superdip_insult_13: "Сакуя говорит:\NПусть твое небо наполнится кометами."
 sakuya_superdip_insult_14: "Сакуя говорит:\NНи одна карта не может быть произведением искусства\Nпока ваша страна входит в этот список."
 sakuya_superdip_insult_15: "Сакуя говорит:\NЯ не понимаю, почему вам нравится выставлять себя дураком на дипломатических ужинах.\NВы ищете смысл,\Nили просто развлекать публику?"
