 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Цель: наши основные культуры#!\n\n$SKY_LC$ Если страна отмечена: добавить все основные культуры страны цели к нашим основным культурам\n$SKY_RC$ Если у нас отмечен $concept_state$: добавить культуры родины этого $concept_state$ к нашим основным культурам\n$SKY_SL$ Если страна отмечена и у страны цели есть отмеченный $concept_state$: добавить культуры родины этого $concept_state$ к нашим основным культурам\n$SKY_CL$ Если $concept_character$ отмечен: добавить культуру персонажа к нашим основным культурам"
 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Цель: основные культуры страны цели#!\n\n$SKY_LC$ Если страна отмечена: добавить все наши основные культуры к основным культурам страны цели\n$SKY_RC$ Если у нас отмечен $concept_state$: добавить культуры родины этого $concept_state$ к основным культурам страны цели\n$SKY_SL$ Если у страны цели есть отмеченный $concept_state$: добавить культуры родины этого $concept_state$ к основным культурам страны цели\n$SKY_CL$ Если $concept_character$ отмечен: добавить культуру персонажа к основным культурам страны цели"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Цель: наши основные культуры#!\n\n$SKY_LC$ Если страна отмечена: убрать все основные культуры страны цели из наших основных культур\n$SKY_RC$ Если у нас отмечен $concept_state$: убрать культуры родины этого $concept_state$ из наших основных культур\n$SKY_SL$ Если страна отмечена и у страны цели есть отмеченный $concept_state$: убрать культуры родины этого $concept_state$ из наших основных культур\n$SKY_CL$ Если $concept_character$ отмечен: убрать культуру персонажа из наших основных культур\n$SKY_line$\n#n Внимание: последняя основная культура страны не удаляется. Не оставляйте страну без основной культуры, иначе сохранение может быть повреждено.#!"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Цель: основные культуры страны цели#!\n\n$SKY_LC$ Если страна отмечена: убрать все наши основные культуры из основных культур страны цели\n$SKY_RC$ Если у нас отмечен $concept_state$: убрать культуры родины этого $concept_state$ из основных культур страны цели\n$SKY_SL$ Если у страны цели есть отмеченный $concept_state$: убрать культуры родины этого $concept_state$ из основных культур страны цели\n$SKY_CL$ Если $concept_character$ отмечен: убрать культуру персонажа из основных культур страны цели\n$SKY_line$\n#n Внимание: последняя основная культура страны не удаляется. Не оставляйте страну без основной культуры, иначе сохранение может быть повреждено.#!"
