 SKY_B6_BUILD_TT_CAT_URBAN: "#BOLD Городские#!\n\n$SKY_LC$ Показать фабрики и прочие обычные городские здания\n$SKY_RC$ Показать городские центры, особые здания, чудеса и монументы"
 SKY_B6_BUILD_SELECTED_TITLE: "Выбранное\nздание"
 SKY_B6_BUILD_SELECTED_NONE: "Не выбрано"
 SKY_B6_BUILD_TT_CONFIRM: "#BOLD Разместить здание#!\n\n$SKY_LC$ Применить текущее изменение уровня здания к отмеченным штатам игрока\n$SKY_RC$ Если страна отмечена и имеет отмеченные иностранные штаты, применить изменение к ним\n$SKY_line$\n#lore 0 удаляет здание. Положительные значения добавляют уровни. Если у целевого штата нет этого здания, оно создаётся сразу на соответствующем уровне.#!"
 SKY_B6_BUILD_APPLY_SEC: "#T #COLOR:{0.7275,0.6333,0.4529,1} Разместить здание#!"
 SKY_B6_BUILD_APPLY_RESOURCE_SEC: "#T #COLOR:{0.7275,0.6333,0.4529,1} Здание и потенциальные ресурсы#!"
 SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL: "Добавить потенц. ресурсы"
 SKY_B6_BUILD_TT_RESOURCE_POTENTIAL: "#BOLD Добавить потенциальные ресурсы#!\n\n$SKY_LC$ Добавить в отмеченные штаты игрока потенциальные ресурсы, соответствующие выбранному зданию\n$SKY_RC$ Если страна отмечена и имеет отмеченные иностранные штаты, применить к ним\n$SKY_line$\n#lore Уровень 0 удаляет. Положительные уровни добавляют или повышают текущую величину. Сельхозздания пока поддерживают только добавление и удаление.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1: "#BOLD $concept_throughput$ выбранного здания#!\n\n#lore Сначала выберите здание в $SKY_BTN6_SEC$-$SKY_BTN6_TAB3$ и отметьте хотя бы 1 $concept_state$.#!\n#lore Если текущее здание не поддерживает это, используйте общий $concept_throughput$ справа внизу.#!\n#lore Сейчас поддерживается: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Очистить эту группу, включая кнопку + справа\n#lore Складывается с кнопкой большого шага справа.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1_PLUS: "#BOLD $concept_throughput$ выбранного здания: большой шаг#!\n\n#lore Отдельная группа от обычной кнопки слева, может складываться. Очистка слева очистит и это.#!\n#lore Сейчас поддерживается: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
 SKY_B6_RESERVED_BUILD_R1_C2: "Вход выбранного здания"
 SKY_B6_TT_RESERVED_BUILD_R1_C2: "#BOLD Вход выбранного здания#!\n\n#lore Действует на текущее выбранное здание в отмеченных штатах игрока.#!\n#lore Положительные действия снижают потребность здания в товарах.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Очистить эту группу"
 SKY_B6_RESERVED_BUILD_R1_C3: "Мин. зарплата выбранного здания"
 SKY_B6_TT_RESERVED_BUILD_R1_C3: "#BOLD Мин. зарплата выбранного здания#!\n\n#lore Действует на текущее выбранное здание в отмеченных штатах игрока.#!\n#lore Положительные действия снижают целевую зарплату здания.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Очистить эту группу"
 SKY_B6_TT_RESERVED_BUILD_R2_C1: "#BOLD Размер персонала выбранного здания#!\n\n#lore Срабатывает по типу выбранного здания и действует на отмеченные штаты игрока.#!\n#lore Положительные действия снижают стандартный размер персонала.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Очистить эту группу"
 SKY_B6_TT_RESERVED_BUILD_R2_C2: "#BOLD Условия труда выбранного здания#!\n\n#lore Действует на соответствующее здание в отмеченных штатах игрока.#!\n#lore Положительные действия снижают модификатор условий труда здания.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Очистить эту группу"
 SKY_B6_TT_RESERVED_BUILD_R2_C3: "#BOLD Общий $concept_throughput$ выбранного здания#!\n\n#lore Напрямую действует на текущее выбранное здание в отмеченных штатах игрока.#!\n#lore Если особый $concept_throughput$ слева сверху не покрывает текущее здание, используйте этот.#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Очистить эту группу, включая кнопку + справа"
 SKY_B6_TT_RESERVED_BUILD_R2_C3_PLUS: "#BOLD Общий $concept_throughput$ выбранного здания: большой шаг#!\n\n#lore Отдельная группа от обычной кнопки слева, может складываться. ПКМ слева тоже очистит это.#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
