 SKY_1_2_B7_TT_ACQUIRE_TREATY_PORT_DISABLED: "#BOLD $SKY_B7_ACQUIRE_TREATY_PORT$#!\n$SKY_line$\nСначала необходимо выбрать либо один из наших штатов, либо один из зарубежных штатов.\n\nСделать один из наших штатов иностранным государством $concept_treaty_port$: выберите один из наших штатов, примите #T $decree_sakuya_mark_state$#! указ, затем воспользуйтесь #T $sakuya_mark_country$#! дипломатические меры в отношении целевой страны.\n\nЧтобы получить $concept_treaty_port$ из другой страны: щелкните правой кнопкой мыши по нужной стране, выберите #T $sakuya_mark_country$#! в разделе «Дипломатические действия», затем выберите #T $sakuya_mark_foreign_state$#!."
 SKY_1_2_B7_TT_CEDE_HOME_STATE_DISABLED: "#BOLD $SKY_B7_CEDE_HOME_STATE$#!\n$SKY_line$\nВыберите один из наших штатов и примите #T $decree_sakuya_mark_state$#! указом об этом; затем воспользуйтесь #T $sakuya_mark_country$#! дипломатические меры в отношении целевой страны."
 SKY_1_2_B7_TT_TAKE_FOREIGN_STATE_DISABLED: "#BOLD $SKY_B7_TAKE_FOREIGN_STATE$#!\n$SKY_line$\nВам необходимо указать как страну, так и иностранное государство, расположенное на территории этой страны.\n\nЩелкните правой кнопкой мыши по стране, которую хотите отметить, и выберите #T $sakuya_mark_country$#! в разделе «Дипломатические действия», затем выберите #T $sakuya_mark_foreign_state$#!."
