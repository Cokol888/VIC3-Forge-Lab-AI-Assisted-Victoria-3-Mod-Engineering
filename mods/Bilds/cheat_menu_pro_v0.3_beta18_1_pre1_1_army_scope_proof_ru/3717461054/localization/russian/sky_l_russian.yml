 SKY_B8_TT_RECOGNIZED: "#BOLD Признание#!\n\n$SKY_LC$ Сделать $SKY_SELF_COUNTRY$ признанной страной\n$SKY_RC$ Сделать $SKY_SELF_COUNTRY$ непризнанной страной\n$SKY_SL$ Сделать $SKY_MARKED_COUNTRY$ признанной страной\n$SKY_CL$ Сделать $SKY_MARKED_COUNTRY$ непризнанной страной\n$SKY_line$\n#italic Если страна не отмечена, Shift/Ctrl не сработает.#!"
 SKY_B8_TT_REGENCY: "#BOLD Регентство#!\n\n$SKY_LC$ Добавить регентство в $SKY_SELF_COUNTRY$\n$SKY_RC$ Убрать регентство из $SKY_SELF_COUNTRY$\n$SKY_SL$ Добавить регентство в $SKY_MARKED_COUNTRY$\n$SKY_CL$ Убрать регентство из $SKY_MARKED_COUNTRY$\n$SKY_line$\n#italic Только для стран с монархическим законом. Если страна не отмечена, Shift/Ctrl не сработает.#!"
 SKY_B8_TT_COLONIAL: "#BOLD Колониальный статус#!\n\n$SKY_LC$ Задать $SKY_SELF_COUNTRY$ как колониальную страну\n$SKY_SL$ Задать $SKY_MARKED_COUNTRY$ как колониальную страну\n$SKY_line$\n#italic Принудительно меняет статус страны. Если страна не отмечена, Shift не сработает.#!"
 SKY_B8_TT_RETIRE: "#BOLD Принудительная отставка#!\n\n$SKY_LC$ Немедленно отправить отмеченного $concept_character$ в отставку.\n$SKY_line$\n#italic Сначала нужно отметить персонажа.#!"
 SKY_B8_TT_MARTYR_EXILE: "#BOLD Изгнание мученика#!\n\n$SKY_LC$ Изгнать текущего отмеченного $concept_character$ как политического мученика.\n$SKY_line$\n#italic Персонаж будет изгнан и оставит дома эффект политического мученика. Убедитесь, что персонаж выбран.#!"
 SKY_B8_TT_DISINHERIT: "#BOLD Лишить наследства#!\n\n$SKY_LC$ Лишить наследства текущего отмеченного $concept_character$.\n$SKY_line$\n#italic Сначала нужно отметить персонажа. Обычно имеет смысл только для целей с системой наследования.#!"
 SKY_B8_TT_LAWSET_LIBERAL: "#BOLD Либеральная страна#!\n\n$SKY_LC$ $SKY_SELF_COUNTRY$ принимает полный либеральный набор законов\n$SKY_RC$ $SKY_MARKED_COUNTRY$ принимает полный либеральный набор законов\n$SKY_line$\n#italic Мгновенно меняет все связанные законы страны. Если страна не отмечена, ПКМ не сработает.#!"
 SKY_B8_TT_LAWSET_FASCIST: "#BOLD Фашистская страна#!\n\n$SKY_LC$ Перевести $SKY_SELF_COUNTRY$ на полный набор фашистских законов\n$SKY_RC$ Перевести $SKY_MARKED_COUNTRY$ на полный набор фашистских законов\n$SKY_line$\n#italic Если страна не отмечена, ПКМ не сработает.#!"
 SKY_B8_TT_LAWSET_GDP: "#BOLD Ориентация на ВВП#!\n\n$SKY_LC$ Перевести $SKY_SELF_COUNTRY$ на набор законов под ВВП\n$SKY_RC$ Перевести $SKY_MARKED_COUNTRY$ на набор законов под ВВП\n$SKY_line$\n#italic Если страна не отмечена, ПКМ не сработает.#!"
 SKY_B8_TT_LAWSET_SOL: "#BOLD Ориентация на SoL#!\n\n$SKY_LC$ Перевести $SKY_SELF_COUNTRY$ на набор законов под SoL\n$SKY_RC$ Перевести $SKY_MARKED_COUNTRY$ на набор законов под SoL\n$SKY_line$\n#italic Если страна не отмечена, ПКМ не сработает.#!"
 SKY_B8_TT_LAWSET_COMMUNIST: "#BOLD Коммунизм#!\n\n$SKY_LC$ Перевести $SKY_SELF_COUNTRY$ на полный набор коммунистических законов\n$SKY_RC$ Перевести $SKY_MARKED_COUNTRY$ на полный набор коммунистических законов\n$SKY_line$\n#italic Если страна не отмечена, ПКМ не сработает.#!"
 SKY_B8_TT_LAWSET_SHIT: "#BOLD Антиутопия#!\n\n$SKY_LC$ Перевести $SKY_SELF_COUNTRY$ на полный антиутопический набор законов\n$SKY_RC$ Перевести $SKY_MARKED_COUNTRY$ на полный антиутопический набор законов\n$SKY_line$\n#italic Тянет страну в самый тёмный век и лишает всех прав. Если страна не отмечена, ПКМ не сработает.#!"
 SKY_B8_TT_HOW_DARE_U: "#BOLD HOW DARE U#!\n\n$SKY_LC$ Применить крайне мощный военный модификатор к $SKY_SELF_COUNTRY$\n$SKY_AL$ Применить крайне мощный военный модификатор к $SKY_MARKED_COUNTRY$\n$SKY_SL$ Применить отрицательную версию к $SKY_SELF_COUNTRY$\n$SKY_CL$ Применить отрицательную версию к $SKY_MARKED_COUNTRY$\n$SKY_RC$ Очистить модификаторы этой кнопки\n$SKY_line$\n#italic Положит. версия: 3 армейских, 3 морских, 2 боевых и 2 престижных модификатора. Kill rate 99999. Отрицат. версия ставит военные значения на -999 и обращает престиж в +90%. Если страна не отмечена, Alt/Ctrl не сработает.#!"
 SKY_B8_TT_DOOMFALL: "#BOLD Падение рока#!\n\n$SKY_LC$ Заложить экономическую и революционную бомбу в $SKY_MARKED_COUNTRY$ и сразу вычесть деньги на 1000% лимита казны\n$SKY_AL$ То же для $SKY_SELF_COUNTRY$ и сразу вычесть деньги на 1000% лимита казны\n$SKY_RC$ Очистить модификаторы этой кнопки\n$SKY_line$\n#italic Упор на радикализм, революцию, хаос и застой. Строительная мощность напрямую -99999. Если страна не отмечена, ЛКМ не сработает.#!"
 SKY_B8_TT_SOCIAL_COLLAPSE: "#BOLD Крах общества#!\n\n$SKY_LC$ Погрузить $SKY_MARKED_COUNTRY$ в институциональный, демографический и социальный крах\n$SKY_AL$ Применить то же к $SKY_SELF_COUNTRY$\n$SKY_RC$ Очистить модификаторы этой кнопки\n$SKY_line$\n#italic Упор на распад легитимности, лоялистов, миграции, волнений и лимитов соц. институтов. Уровень жизни напрямую -19. Если страна не отмечена, ЛКМ не сработает.#!"
