 SKY_B4_EVT_SELECT_WAR_DESC_HINT: "#lore Выберите войну для будущих действий.#!"
 SKY_B4_WG_TT_conquer_state: "#tooltip_header $war_goal_conquer_state_type_name$#!\n\n$SKY_LC$ Выбрать это дипломатическое требование\n$SKY_RC$ Снять выбор\n$SKY_line$\n#lore Если в стране цели отмечен какой-либо $concept_state$, он станет целью в первую очередь. Если страна цель объявляет войну игроку, сначала используется отмеченный $concept_state$ игрока на его территории.#!"
 SKY_B4_WG_TT_return_state: "#tooltip_header $war_goal_return_state_type_name$#!\n\n$SKY_LC$ Выбрать это дипломатическое требование\n$SKY_RC$ Снять выбор\n$SKY_line$\n#lore Если в стране цели отмечен какой-либо $concept_state$, он станет целью в первую очередь. Если страна цель объявляет войну игроку, сначала используется отмеченный $concept_state$ игрока на его территории.#!"
 SKY_B4_WG_TT_take_treaty_port: "#tooltip_header $war_goal_take_treaty_port_type_name$#!\n\n$SKY_LC$ Выбрать это дипломатическое требование\n$SKY_RC$ Снять выбор\n$SKY_line$\n#lore Если в стране цели отмечен какой-либо $concept_state$, он станет целью в первую очередь. Если страна цель объявляет войну игроку, сначала используется отмеченный $concept_state$ игрока на его территории.#!"
