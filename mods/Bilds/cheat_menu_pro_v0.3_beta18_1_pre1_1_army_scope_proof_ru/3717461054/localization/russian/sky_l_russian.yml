 SKY_B1_TT_CONSTRUCTION_PERCENT_TBC: "#BOLD Быстрое строительство +#!\n$SKY_line$\nЭта функция в настоящее время недоступна. Воспользуйтесь кнопкой «Строительные мощности», расположенной рядом."
 SKY_B1_TT_FAST_CONSTRUCTION_LIMIT: "#BOLD Мощность строительства и распределение частных построек #!\n$SKY_line$\n$SKY_LC$ Мощность строительства +9999999. \n$SKY_CL$ Распределение частных построек +1000%. \n$SKY_RC$ Распределение частного строительства #n - #!10000%."
 SKY_B1_TT_TREASURY_CAP_QUICK: "#BOLD $concept_gold_reserves$#!\n$SKY_line$\n$SKY_LC$ Увеличьте @money!на 100% от верхней границы $concept_gold_reserves$. \n$SKY_SL$ Увеличьте @money!на 20 % от верхней границы $concept_gold_reserves$. \n$SKY_AL$ Уменьшить @money!на 100 % от верхнего предела $concept_gold_reserves$. \n$SKY_CL$ $SKY_MARKED_COUNTRY$Уменьшить @money!на 100 % от верхнего предела $concept_gold_reserves$. \n$SKY_RC$ Увеличить @money!на 99,999% от верхнего предела $concept_gold_reserves$. \n$SKY_line$\nБолее подробные настройки можно сделать на странице \"Экономика\"."
 SKY_B1_TT_BIRTH_RATE_V2: "#BOLD $SKY_B1_R2_C2$#!\n$SKY_line$\n$SKY_LC$ +100% за 1 год. \n$SKY_SL$ +3000% за 1 год. \n$SKY_AL$ +5%. \n$SKY_CL$ #n - #!100% на 1 год. \n$SKY_RC$ Чисто. \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_BIRTH_RATE_PLUS: "#BOLD $SKY_B1_R2_C2$ + #!\n$SKY_line$\n$SKY_LC$ +500% за 1 год. \n$SKY_SL$ #n - #!2000% за 1 год. \n$SKY_AL$ #n - #!20% на 1 год. \n$SKY_CL$ +10000%, длится 1 год. \n$SKY_RC$ +99999% на 1 месяц. \n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_INTEGRATE_ALL: "#BOLD Объединенные Штаты#!\n$SKY_line$\n$SKY_LC$ Включить все $SKY_SELF_COUNTRY$ государства.\n$SKY_SL$ Скорость инкорпорации +100%.\n$SKY_AL$ Скорость усвоения +5 %.\n$SKY_CL$ Скорость инкорпорации #n -#!100%.\n$SKY_RC$ Сбросить модификатор скорости инкорпорации.\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_CLEAN_POLLUTION: "#BOLD Борьба с загрязнением окружающей среды#!\n$SKY_line$\n$SKY_LC$ Сократить загрязнение во всех $SKY_SELF_COUNTRY$ государства.\n$SKY_SL$ Влияние загрязнения #n -#!100%.\n$SKY_AL$ Влияние загрязнения #n -#!5%.\n$SKY_CL$ Влияние загрязнения +100 %.\n$SKY_RC$ Сбросить модификатор воздействия загрязнения.\n$SKY_line$\n$SKY_stackable$"
 SKY_B1_TT_THROUGHPUT_ALL: "#BOLD Пропускная способность#!\n$SKY_line$\n$SKY_LC$ Все $SKY_SELF_COUNTRY$ на 20 %.\n$SKY_SL$ Все $SKY_SELF_COUNTRY$ на 1000 %.\n$SKY_AL$ Все $SKY_SELF_COUNTRY$ на 5 %.\n$SKY_CL$ Все $SKY_SELF_COUNTRY$ государства #n -#!20%.\n$SKY_RC$ Понятно.\n$SKY_line$\n$SKY_stackable$"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_BREAK_FREE: "#T $ai_strategy_subject_break_free$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ изменит свою стратегию на выбранную в данный момент.\N\N#lore $SKY_TARGET_COUNTRY$ хочет обрести независимость от своего $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_STRENGTHEN_SELF: "#T $ai_strategy_subject_strengthen_self$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ изменит свою стратегию на выбранную в данный момент.\N\N#lore $SKY_TARGET_COUNTRY$ хочет увеличить $concept_autonomy$ и снизить зависимость от своего $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_MAINTAIN_AUTONOMY: "#T $ai_strategy_subject_maintain_autonomy$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ изменит свою стратегию на выбранную в данный момент.\N\N#lore $SKY_TARGET_COUNTRY$ хочет сохранить свой нынешний $concept_autonomy$ в рамках своей $concept_overlord$.#!"
 SKY_B7_TT_AI_STRATEGY_SUBJECT_OVERLORD_COMPLIANCE: "#T $ai_strategy_subject_overlord_compliance$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ изменит свою стратегию на выбранную в данный момент.\N\N#lore $SKY_TARGET_COUNTRY$ хочет более тесной интеграции со своими $concept_overlord$ и будем неукоснительно следовать его указаниям.#!"
