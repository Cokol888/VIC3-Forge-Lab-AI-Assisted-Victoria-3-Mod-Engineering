l_russian:
 CMP_FLEET_TITLE: "Конструктор флота (Tech & Res)"
 CMP_FLEET_DESC: "Добавляет проверенные корабли Tech & Res 1.13 только в один явно выбранный флот. Выбор цели и выполнение операции разделены."
 CMP_FLEET_TARGET_TITLE: "Целевой флот"
 CMP_FLEET_TARGET_OK: "#P Целевой флот готов#!"
 CMP_FLEET_TARGET_NO: "#N Сначала выберите один свой флот#!"
 CMP_FLEET_MARK: "Выбрать флот…"
 CMP_FLEET_MARK_TT: "Открывает постоянный список ваших флотов прямо в рабочей области. Выбор устанавливает цель, но сам по себе ничего не изменяет."
 CMP_FLEET_SHIP_TITLE: "Тип корабля"
 CMP_FLEET_SHIP_MODERN_DESTROYER: "Современный эсминец"
 CMP_FLEET_SHIP_MODERN_CRUISER: "Современный крейсер"
 CMP_FLEET_SHIP_MODERN_BATTLESHIP: "Современный линкор"
 CMP_FLEET_SHIP_NUCLEAR_CARRIER: "Современный авианосец"
 CMP_FLEET_SHIP_NUCLEAR_SUBMARINE: "Современная подлодка"
 CMP_FLEET_SHIP_LOCKED_TT: "Кнопка доступна только после исследования технологии, которая открывает этот тип корабля в Tech & Res."
 CMP_FLEET_AMOUNT_TITLE: "Добавить кораблей"
 CMP_FLEET_AMOUNT_1: "+1"
 CMP_FLEET_AMOUNT_3: "+3"
 CMP_FLEET_AMOUNT_5: "+5"
 CMP_FLEET_AMOUNT_10: "+10"
 CMP_FLEET_APPLY: "ДОБАВИТЬ КОРАБЛИ"
 CMP_FLEET_APPLY_TT: "Создаёт выбранный тип корабля прямо в отмеченном флоте. Перед каждой партией эффект повторно проверяет требуемую технологию."
 CMP_FLEET_CLEAR: "Сбросить настройки"
 CMP_FLEET_RESULT_OK: "#P Корабли созданы в выбранном флоте#!"
 CMP_FLEET_RESULT_PRESET: "#P Флотский пресет добавлен#!"
 CMP_FLEET_RESULT_FAIL: "#N Действие отклонено: проверьте цель, бой и технологии#!"
 CMP_FLEET_PRESETS: "Быстрые пресеты флота"
 CMP_FLEET_PRESET_ESCORT: "Эскортная группа"
 CMP_FLEET_PRESET_ESCORT_TT: "6 современных эсминцев + 2 современных крейсера. Нужны «Современная морская доктрина» и «Современные линкоры»."
 CMP_FLEET_PRESET_BATTLE: "Боевая группа"
 CMP_FLEET_PRESET_BATTLE_TT: "4 современных эсминца + 3 современных крейсера + 2 современных линкора."
 CMP_FLEET_PRESET_CARRIER: "Авианосная группа"
 CMP_FLEET_PRESET_CARRIER_TT: "4 современных эсминца + 2 современных крейсера + 1 современный авианосец."
 CMP_FLEET_PRESET_SUB: "Подводная группа"
 CMP_FLEET_PRESET_SUB_TT: "5 современных подлодок. Требуется технология «Ядерная подводная лодка»."
 CMP_TASKFORCE_TITLE: "Десантная оперативная группа"
 CMP_TASKFORCE_DESC: "Берёт выбранное выше количество морской пехоты, добавляет лучшие доступные проверенные корабли поддержки в отмеченный флот и создаёт полностью морскую пехоту в отмеченной портовой области."
 CMP_TASKFORCE_READY: "#P Флот + порт + морпехи + морская технология: ГОТОВО#!"
 CMP_TASKFORCE_NOT_READY: "#N Нужны отмеченный флот, отмеченная портовая область, количество морпехов и подходящая морская технология#!"
 CMP_TASKFORCE_PREPARE: "ПОДГОТОВИТЬ ДЕСАНТНУЮ ГРУППУ"
 CMP_TASKFORCE_PREPARE_TT: "Добавляет доступные корабли поддержки, затем создаёт выбранное соединение морской пехоты. Автоматическое прикрепление армии к флоту намеренно не выполняется: в документированном API скриптов 1.13 нет подтверждённого безопасного эффекта привязки."
 CMP_TASKFORCE_RESULT: "#P Флот и морпехи подготовлены — прикрепите соединение морпехов к флоту через обычный интерфейс игры#!"
 CMP_FLEET_RUNTIME_NOTE: "Бета 17 использует только проверенные современные корпуса Tech & Res. Ванильные корпуса 1.13 не добавляются наугад без их актуальных условий разблокировки."
 CMP_MIL_TARGET_FLEET_SELECT: "Выбрать / изменить флот…"
 CMP_MIL_TARGET_FLEET_SELECT_TT: "Открывает список собственных флотов. Строка использует штатный выбор Victoria 3; источником цели CMP становится текущее выбранное военное формирование, без собственной метки выбора."
 CMP_MIL_TARGET_FLEET_CLEAR: "Очистить цель"
 CMP_MIL_TARGET_FLEET_CLEAR_TT: "Удаляет точную цель флота и совместимый старый маркер. Настройки кораблей не сбрасываются."
 CMP_MIL_TARGET_FLEET_READY: "#P Флот выбран — настройте действие ниже#!"
 CMP_MIL_TARGET_FLEET_BLOCKED: "#N Флот выбран, но все его корабли сейчас в бою#!"
 CMP_MIL_TARGET_FLEET_NONE: "#N Флот не выбран#!"
 CMP_MIL_TARGET_FLEET_PICKER_TITLE: "Выбор целевого флота"
 CMP_MIL_TARGET_FLEET_PICKER_DESC: "Выбор pre2.3 использует штатную систему Victoria 3. Нажмите строку флота: игра выбирает формирование, а CMP читает текущий выбранный флот напрямую."
 CMP_MIL_TARGET_FLEET_PICKER_EMPTY: "#N У страны сейчас нет доступных флотов. Создайте флот через обычный военный интерфейс игры.#!"
 CMP_MIL_TARGET_FLEET_ENTRY_TT: "Выбрать этот флот штатным механизмом Victoria 3. Нажатие не создаёт корабли и не меняет состав."
 CMP_MIL_TARGET_FLEET_NAME_TT: "Название флота, выбранного штатным механизмом Victoria 3. Зелёная линия — операция допустима; красная — операция заблокирована из-за боя."
 CMP_MIL_TARGET_FLEET_SCOPE_PROBE_TT:0 "Жёлтый индикатор: MilitaryFormation.MakeScope успешно проходит в ScriptedGui с always=yes."
 CMP_MIL_TARGET_FLEET_DIAG_CLICK_OK:0 "#P Обработчик формирования получил выбор#!"
 CMP_MIL_TARGET_FLEET_DIAG_CLICK_WAIT:0 "#N Обработчик ещё не получил выбор#!"
 CMP_MIL_TARGET_FLEET_DIAG_MARKER_OK:0 "#P Точная метка записана#!"
 CMP_MIL_TARGET_FLEET_DIAG_MARKER_WAIT:0 "#N Точная метка не записана#!"
 CMP_MIL_NATIVE_FLEET_NAME_TT:0 "Текущий GetSelectedFormation показан только как наблюдаемый штатный контекст Victoria 3. pre2.4 не создаёт собственную постоянную цель."
 CMP_MIL_NATIVE_FLEET_ARMY_SELECTED:0 "#N Выбрана армия, а не флот#!"
 CMP_MIL_NATIVE_FLEET_READY_TT:0 "Выбран собственный флот и операция может выполняться непосредственно над ним."
 CMP_MIL_NATIVE_FLEET_BATTLE_TT:0 "Добавление кораблей заблокировано: один или несколько кораблей выбранного флота сейчас участвуют в бою."
 CMP_MIL_NATIVE_PICKER_DESC:0 "Нажмите строку флота: CMP откроет штатную карточку именно этой MilitaryFormation. Жёлтая полоса справа доказывает чистый MakeScope→ScriptedGui, синяя — доступ к владельцу объекта. Статус сверху лишь наблюдает GetSelectedFormation."
 CMP_MIL_NATIVE_SELECTION_OK:0 "#P GetSelectedFormation: выбран флот#!"
 CMP_MIL_NATIVE_SELECTION_WAIT:0 "#N GetSelectedFormation: флот не выбран#!"
 CMP_MIL_NATIVE_ROOT_OK:0 "#P Выбранный MilitaryFormation проходит root-probe#!"
 CMP_MIL_NATIVE_ROOT_WAIT:0 "#N Выбранный MilitaryFormation пока не доказан#!"
 CMP_MIL_NATIVE_ROW_TT:0 "Открыть штатную карточку этого флота через InformationPanelBar. Это не записывает CMP-marker."
 CMP_FLEET_APPLY_NATIVE_TT:0 "Добавляет выбранный тип и количество кораблей непосредственно в текущий флот Victoria 3. Собственная CMP-метка цели и повторный поиск флота не используются."
 CMP_FLEET_APPLY_NATIVE_NO_TARGET_TT:0 "Сначала выберите собственный флот. Если выбрана армия или ничего не выбрано, действие недоступно."


 CMP_MIL_TARGET_FLEET_OWNER_PROBE_TT:0 "Синий индикатор: тот же MilitaryFormation ROOT успешно разрешает owner = державе игрока."
