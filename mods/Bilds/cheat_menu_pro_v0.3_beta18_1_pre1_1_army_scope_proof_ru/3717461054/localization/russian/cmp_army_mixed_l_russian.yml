l_russian:
 CMP_ARMY_MIXED_TITLE:0 "Смешанные шаблоны армии (по технологиям)"
 CMP_ARMY_MIXED_DESC:0 "Выберите состав на 50 батальонов. Для каждой роли автоматически используется лучший поддерживаемый тип юнита, технология которого изучена."
 CMP_ARMY_MIXED_BALANCED:0 "Баланс 50"
 CMP_ARMY_MIXED_BALANCED_TT:0 "25 пехоты / 15 артиллерии / 10 мобильных батальонов. Нужен хотя бы один открытый тип артиллерии и мобильных войск."
 CMP_ARMY_MIXED_INFANTRY:0 "Пехотная 50"
 CMP_ARMY_MIXED_INFANTRY_TT:0 "35 пехоты / 10 артиллерии / 5 мобильных батальонов. Консервативный пехотный состав."
 CMP_ARMY_MIXED_BREAKTHROUGH:0 "Прорыв 50"
 CMP_ARMY_MIXED_BREAKTHROUGH_TT:0 "20 пехоты / 15 артиллерии / 15 мобильных батальонов. Больше огневой мощи и мобильности."
 CMP_ARMY_MIXED_ARMOR:0 "Бронеудар 50"
 CMP_ARMY_MIXED_ARMOR_TT:0 "15 пехоты / 10 артиллерии / 25 мобильных батальонов. Требует «Мобильную броню»; поздние Tech & Res машины выбираются автоматически после изучения."
 CMP_ARMY_MIXED_CREATE:0 "СОЗДАТЬ ШАБЛОН"
 CMP_ARMY_MIXED_CREATE_TT:0 "Создаёт одну новую регулярную армию в отмеченной области игрока. Если отмечено несколько областей, используется область с наибольшим ВВП."
 CMP_ARMY_MIXED_CLEAR:0 "Сброс шаблона"
 CMP_ARMY_MIXED_RESULT_OK:0 "Армия по шаблону создана"
 CMP_ARMY_MIXED_RESULT_FAIL:0 "Шаблон не создан — проверьте цель и технологии"
 CMP_ARMY_MIXED_NOTE:0 "Шаблоны — удобные стартовые составы, а не заявление об оптимальной боевой мете."
