 SKY_B5_TT_LOBBY_DISBAND: "#BOLD Disolver $concept_political_lobby_short$#!\n\n$SKY_LC$ Disuelve el $concept_political_lobby_short$ seleccionado actual\n$SKY_SL$ Disuelve todos los $concept_political_lobby_short$s en este país\n$SKY_AL$ Disuelve todos los $concept_political_lobby_short$s en el país marcado\n$SKY_line$\n#italic Este $concept_political_lobby_short$ desaparecerá de forma permanente. Shift/Alt no requieren seleccionar un $concept_political_lobby_short$.#!"
 SKY_B5_TT_LOBBY_IG_JOIN: "#BOLD Entrar/salir de $concept_political_lobby_short$#!\n\n$SKY_LC$ El $concept_interest_group$ seleccionado entra en el $concept_political_lobby_short$ seleccionado\n$SKY_RC$ El $concept_interest_group$ seleccionado sale del $concept_political_lobby_short$ seleccionado\n$SKY_SL$ Todos los $concept_interest_group$s de este país entran en el $concept_political_lobby_short$ seleccionado\n$SKY_CL$ Quita todos los miembros del $concept_political_lobby_short$ seleccionado\n$SKY_line$\n#italic Si el $concept_political_lobby_short$ pertenece a un país extranjero, se usa automáticamente el $concept_interest_group$ correspondiente en ese país.\nClic izq./clic der. requieren tener seleccionados un $concept_interest_group$ y un $concept_political_lobby_short$.#!"
 SKY_B5_TT_LOBBY_CREATE: "#BOLD Crear $concept_political_lobby_short$#!\n\n$SKY_LC$ Crea un $concept_political_lobby_short$ pro-país objetivo en este país\n$SKY_RC$ Crea un $concept_political_lobby_short$ anti-país objetivo en este país\n$SKY_SL$ Crea un $concept_political_lobby_short$ pro-jugador en el país objetivo\n$SKY_AL$ Crea un $concept_political_lobby_short$ anti-jugador en el país objetivo\n$SKY_line$\n#italic Requiere un país objetivo marcado. Si hay un $concept_interest_group$ seleccionado, se usa como miembro inicial.#!"
 SKY_B5_TT_LOBBY_LEVERAGE: "#BOLD $country_lobby_leverage_generation_mult$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ -100%\n$SKY_RC$ Limpiar $concept_modifier$\n$SKY_line$\n#italic Afecta a la velocidad de generación de $concept_power_bloc_leverage$ de todos los $concept_political_lobby_short$s en este país.#!\n$SKY_stackable$"
