 SKY_B3_TRAIT_GROUP_TT_ALL_ROUNDER: "#BOLD Polivalente#!\n$SKY_line$\n$SKY_LC$ Anade un conjunto completo de rasgos de utilidad general.\n$SKY_RC$ Elimina este conjunto de rasgos.\n$SKY_line$\nCombina fortalezas comunes para gobierno, companias, politica, diplomacia, ejercito y armada."

