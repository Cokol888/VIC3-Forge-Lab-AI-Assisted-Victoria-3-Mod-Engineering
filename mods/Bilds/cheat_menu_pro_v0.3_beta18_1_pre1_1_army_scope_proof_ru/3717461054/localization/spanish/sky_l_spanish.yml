 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Objetivo: nuestras culturas primarias#!\n\n$SKY_LC$ Si hay país marcado: añade todas las culturas primarias del país objetivo a nuestras culturas primarias\n$SKY_RC$ Si tenemos un $concept_state$ marcado: añade las culturas patrias de ese $concept_state$ a nuestras culturas primarias\n$SKY_SL$ Si hay país marcado y el país objetivo tiene un $concept_state$ marcado: añade las culturas patrias de ese $concept_state$ a nuestras culturas primarias\n$SKY_CL$ Si hay un $concept_character$ marcado: añade la cultura de ese personaje a nuestras culturas primarias"
 SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_ADD_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Objetivo: culturas primarias del país objetivo#!\n\n$SKY_LC$ Si hay país marcado: añade todas nuestras culturas primarias a las culturas primarias del país objetivo\n$SKY_RC$ Si tenemos un $concept_state$ marcado: añade las culturas patrias de ese $concept_state$ a las culturas primarias del país objetivo\n$SKY_SL$ Si el país objetivo tiene un $concept_state$ marcado: añade las culturas patrias de ese $concept_state$ a las culturas primarias del país objetivo\n$SKY_CL$ Si hay un $concept_character$ marcado: añade la cultura de ese personaje a las culturas primarias del país objetivo"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n@information!#bold Objetivo: nuestras culturas primarias#!\n\n$SKY_LC$ Si hay país marcado: quita todas las culturas primarias del país objetivo de nuestras culturas primarias\n$SKY_RC$ Si tenemos un $concept_state$ marcado: quita las culturas patrias de ese $concept_state$ de nuestras culturas primarias\n$SKY_SL$ Si hay país marcado y el país objetivo tiene un $concept_state$ marcado: quita las culturas patrias de ese $concept_state$ de nuestras culturas primarias\n$SKY_CL$ Si hay un $concept_character$ marcado: quita la cultura de ese personaje de nuestras culturas primarias\n$SKY_line$\n#n Advertencia: esto no quitará la última cultura primaria de un país. No dejes ningún país sin cultura primaria, o el guardado puede dañarse.#!"
 SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY_TARGET_TT: "#BOLD $SKY_B3_COUNTRY_CULTURE_REMOVE_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n@information!#bold Objetivo: culturas primarias del país objetivo#!\n\n$SKY_LC$ Si hay país marcado: quita todas nuestras culturas primarias de las culturas primarias del país objetivo\n$SKY_RC$ Si tenemos un $concept_state$ marcado: quita las culturas patrias de ese $concept_state$ de las culturas primarias del país objetivo\n$SKY_SL$ Si el país objetivo tiene un $concept_state$ marcado: quita las culturas patrias de ese $concept_state$ de las culturas primarias del país objetivo\n$SKY_CL$ Si hay un $concept_character$ marcado: quita la cultura de ese personaje de las culturas primarias del país objetivo\n$SKY_line$\n#n Advertencia: esto no quitará la última cultura primaria de un país. No dejes ningún país sin cultura primaria, o el guardado puede dañarse.#!"
