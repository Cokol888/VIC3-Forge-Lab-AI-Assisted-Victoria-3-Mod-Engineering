 SKY_B7_TT_AI_STRATEGY_RESOURCE_EXPANSION: "#T $ai_strategy_resource_expansion$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ quiere invertir en explotar recursos naturales.#!"
 SKY_B7_TT_AI_STRATEGY_INDUSTRIAL_EXPANSION: "#T $ai_strategy_industrial_expansion$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ quiere construir una base industrial urbana.#!"
 SKY_B7_TT_AI_STRATEGY_PLACATE_POPULATION: "#T $ai_strategy_placate_population$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ quiere asegurar estabilidad nacional y social manteniendo impuestos bajos y suficiente comida para la gente.#!"
 SKY_B7_TT_AI_STRATEGY_COLONIAL_EXTRACTION: "#T $ai_strategy_colonial_extraction$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore Como país colonial, $SKY_TARGET_COUNTRY$ intenta extraer y exportar materias primas por orden de su señor colonial.#!"
 SKY_B7_TT_AI_STRATEGY_MONTENEGRO_ADMIN: "#T $ai_strategy_montenegro_admin$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ quiere mantener el suministro de bienes básicos en su territorio.#!"
 SKY_B7_TT_AI_STRATEGY_CONSERVATIVE_AGENDA: "#T $ai_strategy_conservative_agenda$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ tiene metas conservadoras prudentes y reforma despacio.#!"
 SKY_B7_TT_AI_STRATEGY_REACTIONARY_AGENDA: "#T $ai_strategy_reactionary_agenda$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ busca aumentar el poder de terratenientes y clero y promover sus metas reformistas.#!"
 SKY_B7_TT_AI_STRATEGY_PROGRESSIVE_AGENDA: "#T $ai_strategy_progressive_agenda$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ busca aumentar el poder de la intelligentsia y magnates industriales y promover sus reformas.#!"
 SKY_B7_TT_AI_STRATEGY_EGALITARIAN_AGENDA: "#T $ai_strategy_egalitarian_agenda$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ busca aumentar el poder de populistas y movimiento obrero y promover sus reformas.#!"
 SKY_B7_TT_AI_STRATEGY_NATIONALIST_AGENDA: "#T $ai_strategy_nationalist_agenda$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ busca aumentar el poder de nacionalistas y militares y promover sus reformas.#!"
 SKY_B7_TT_AI_STRATEGY_MAINTAIN_MANDATE_OF_HEAVEN: "#T $ai_strategy_maintain_mandate_of_heaven$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ intenta conservar su gobierno preservando el Mandato del Cielo.#!"
