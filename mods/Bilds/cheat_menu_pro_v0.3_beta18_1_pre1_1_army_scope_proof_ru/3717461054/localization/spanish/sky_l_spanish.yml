 notification_sakuya_superdip_annex_country_toast_name: "[SCOPE.sCountry('actor').GetName] unificado [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_annex_country_toast_desc: "Tras la insistencia de Sakuya, [SCOPE.sCountry('target').GetRuler.GetFullName] firmó el [SCOPE.sCountry('actor').GetCapital.GetCityHubName] Tratado en [SCOPE.sCountry('target').GetCapital.GetCityHubName], y [SCOPE.sCountry('target').GetName] y [SCOPE.sCountry('actor').GetName] por fin lograron su unificación."
