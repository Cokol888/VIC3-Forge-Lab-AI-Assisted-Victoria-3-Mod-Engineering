 SKY_B6_POPMIG_TT_TO_STATE_REV: "#BOLD $SKY_B6_POPMIG_TO_STATE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Mueve el 20% de la población de $SKY_SELF_COUNTRY$ a $concept_state$s marcados de $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\nRequiere marcar un país y al menos un $concept_state$ marcado en ese país."
 SKY_B6_POPMIG_TT_SAME_CULTURE: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Mueve el 20% de la población de $SKY_MARKED_COUNTRY$ que pertenece a culturas primarias de $SKY_SELF_COUNTRY$ a $concept_state$s marcados de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_SAME_CULTURE_REV: "#BOLD $SKY_B6_POPMIG_SAME_CULTURE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nMueve la población de $SKY_SELF_COUNTRY$ que pertenece a culturas primarias de $SKY_MARKED_COUNTRY$ a $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, distribuida a $concept_state$s incorporados del país objetivo.\n$SKY_AL$ 5%, distribuida a $concept_state$s incorporados del país objetivo.\n$SKY_CL$ 50%, distribuida a $concept_state$s incorporados del país objetivo.\n$SKY_SL$ 33%, movida a $concept_state$s marcados del país objetivo.\n$SKY_RC$ 100%, distribuida a $concept_state$s incorporados del país objetivo."
 SKY_B6_POPMIG_TT_NON_PRIMARY: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nMueve población de cultura no primaria de $SKY_SELF_COUNTRY$ a $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, distribuida a $concept_state$s incorporados del país objetivo.\n$SKY_AL$ 5%, distribuida a $concept_state$s incorporados del país objetivo.\n$SKY_CL$ 50%, distribuida a $concept_state$s incorporados del país objetivo.\n$SKY_SL$ 33%, movida a $concept_state$s marcados del país objetivo.\n$SKY_RC$ 100%, distribuida a $concept_state$s incorporados del país objetivo."
 SKY_B6_POPMIG_TT_NON_PRIMARY_REV: "#BOLD $SKY_B6_POPMIG_NON_PRIMARY$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Mueve el 20% de la población de cultura no primaria de $SKY_MARKED_COUNTRY$ a $concept_state$s marcados de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%"
 SKY_B6_POPMIG_TT_POINT: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_THEY_WE$\n\n$SKY_LC$ Mueve el 20% de la población en $concept_state$s marcados de $SKY_MARKED_COUNTRY$ a $concept_state$s marcados de $SKY_SELF_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n Se recomienda que ambos lados marquen solo un estado. Si hay varios marcados, el script elegirá al azar un objetivo válido.#!"
 SKY_B6_POPMIG_TT_POINT_REV: "#BOLD $SKY_B6_POPMIG_POINT$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\n$SKY_LC$ Mueve el 20% de la población en $concept_state$s marcados de $SKY_SELF_COUNTRY$ a $concept_state$s marcados de $SKY_MARKED_COUNTRY$.\n$SKY_AL$ 5%\n$SKY_CL$ 50%\n$SKY_SL$ 75%\n$SKY_RC$ 100%\n\n#n Se recomienda que ambos lados marquen solo un estado. Si hay varios marcados, el script elegirá al azar un objetivo válido.#!"
 SKY_B6_POPMIG_TT_LOW_ACCEPTANCE: "#BOLD $SKY_B6_POPMIG_LOW_ACCEPTANCE$#!$SKY_B6_POPMIG_TT_WE_THEY$\n\nMueve la población en los dos niveles de aceptación más bajos de $SKY_SELF_COUNTRY$ a $SKY_MARKED_COUNTRY$.\n$SKY_LC$ 20%, distribuida a $concept_state$s incorporados del país objetivo.\n$SKY_AL$ 5%, distribuida a $concept_state$s incorporados del país objetivo.\n$SKY_CL$ 50%, distribuida a $concept_state$s incorporados del país objetivo.\n$SKY_SL$ 33%, movida a $concept_state$s marcados del país objetivo.\n$SKY_RC$ 100%, distribuida a $concept_state$s incorporados del país objetivo.\n\nRequiere marcar un país primero. $SKY_SL$ también requiere al menos un $concept_state$ marcado en ese país."
