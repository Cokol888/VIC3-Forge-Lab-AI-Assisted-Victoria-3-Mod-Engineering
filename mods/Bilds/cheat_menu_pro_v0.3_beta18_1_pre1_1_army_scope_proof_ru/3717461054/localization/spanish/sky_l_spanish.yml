 SKY_B3_CHAR_TT_FX_SET_RULER: "#BOLD Fijar gobernante#!\n\n$SKY_LC$ Transferir al país marcado y luego fijar como gobernante\n$SKY_RC$ Transferir a nuestro país y luego fijar como gobernante\n$SKY_AL$ Fijar directamente como gobernante en el país actual del $concept_character$"
 SKY_B3_CHAR_TT_FX_SET_HEIR: "#BOLD Fijar heredero#!\n\n$SKY_LC$ Fijar como heredero del país marcado\n$SKY_RC$ Fijar como nuestro heredero\n$SKY_AL$ Fijar como heredero en el país actual del $concept_character$\n$SKY_line$\n#italic El país objetivo debe tener sistema sucesorio y gobernante.#!"
 SKY_B3_CHAR_TT_FX_IMMORTAL: "#BOLD Inmortal#!\n\n$SKY_LC$ Activar inmortalidad\n$SKY_RC$ Desactivar inmortalidad"
 SKY_B3_CHAR_TT_FX_CHANGE_CULTURE: "#BOLD Cambiar $concept_culture$#!\n\n$SKY_LC$ Cambiar a la primera $concept_culture$ primaria de $SKY_SELF_COUNTRY$\n$SKY_RC$ Cambiar a la primera $concept_culture$ primaria del país marcado\n$SKY_AL$ Cambiar a la primera $concept_culture$ primaria del país natal del $concept_character$"
 SKY_B3_CHAR_TT_FX_CHANGE_RELIGION: "#BOLD Cambiar religión#!\n\n$SKY_LC$ Cambiar a nuestra religión estatal\n$SKY_RC$ Cambiar a la religión estatal del país marcado\n$SKY_AL$ Cambiar a la religión estatal del país natal del $concept_character$"
 SKY_B3_CHAR_TT_FX_SET_HOME_COUNTRY: "#BOLD Cambiar país natal#!\n\n$SKY_LC$ Cambiar a nuestro país\n$SKY_RC$ Cambiar al país marcado"
 SKY_B3_CHAR_TT_FX_SET_ADULT: "#BOLD Hacer adulto#!\n\n$SKY_LC$ Fija al $concept_character$ marcado actual como adulto.\n$SKY_line$\n#italic Si el objetivo ya es adulto, el botón no estará disponible y el efecto no se ejecutará de nuevo.#!"
 SKY_B3_CHAR_TT_FX_SET_NOBLE: "#BOLD Hacer noble#!\n\n$SKY_LC$ Fija al $concept_character$ marcado actual como noble.\n$SKY_RC$ Intenta quitar el estado noble del $concept_character$ marcado actual.\n$SKY_line$\n#italic Clic izq. solo se ejecuta si el objetivo no es noble. Clic der. solo se ejecuta si el objetivo ya es noble.#!"
