SKY_1_1_SP_GUIDE_BTN1: "$SKY_DEFAULT_TITLE$!\nAntes de empezar, permite que Xier explique la lógica de los clics. #P Clic izquierdo#! en un botón para añadir un efecto. Pasa el cursor sobre un botón para ver sus detalles. Si el efecto añadido es un $concept_modifier$, puedes hacer #N clic derecho#! para eliminar ese $concept_modifier$. La mayoría de botones admiten combinaciones de teclas. Mantén pulsada una tecla y luego haz clic izquierdo en el botón.\N@innovation!En general, #p clic izquierdo#! usa un valor que $xier$ considera útil y razonable. #BLUE Shift#! da un valor cien veces mayor o incluso más. #COLOR:{0.3686,0.3961,0.7216} Alt#! da un valor menor para ajustes precisos. #GOLD Ctrl#! suele aplicar el efecto opuesto."
SKY_1_1_SP_GUIDE_BTN2: "La mayoría de funciones de marcado #BOLD solo admiten un objetivo a la vez#!. Esto también se aplica al marcado de bienes y compañías de esta página. El deslizador de la primera página puede ajustar los ingresos. #I Haz clic#! en el deslizador para elegir el valor necesario y luego pulsa el botón de confirmación inferior para completar la operación. Para eliminar un modificador, haz #N clic derecho#! sobre él, o ajusta el deslizador a #n 0#!."
SKY_1_1_SP_GUIDE_BTN3: "Para personajes nacionales o en exilio, haz clic derecho sobre el personaje y selecciona #yellow $sakuya_mark_character$#! en el menú emergente para marcarlo. Para personajes extranjeros, marca primero el país objetivo, luego busca #YELLOW $SKY_B3_CHAR_MARK_OPEN$#! en esta página y selecciona el personaje que quieras marcar en el evento emergente."
SKY_1_1_SP_GUIDE_BTN4: "#yellow $SKY_B4_TAKE_MARKED_NAVY_SHIPS$#! y #yellow $SKY_1_1_B4_BTN_DESTROY_SHIPS$#! requieren marcar primero una flota. Mantén #BLUE Shift#! y haz clic en #yellow $SKY_R4_MARK_ARMY$#! para seleccionar una flota que marcar mediante el evento emergente.\NAl iniciar una jugada diplomática o una guerra, debes confirmar que el objetivo de guerra sea válido. Si no se cumplen las condiciones, la operación puede fallar. También existen casos similares en otras funciones de $CMP$."
SKY_1_1_SP_GUIDE_BTN5: "Como otros sistemas de marcado de $CMP$, el $concept_interest_group$ marcado en $SKY_B5_SUBSEC_1$ será usado por otras opciones de modificación. El grupo de interés seleccionado iluminará algunas funciones que requieren marcar primero un grupo de interés, como cambiar el grupo de interés de $sakuya_mark_character$. En la mayoría de casos se recomienda seleccionar solo un $concept_interest_group$."
SKY_1_1_SP_GUIDE_BTN6: "Haz clic derecho en un estado que poseas y selecciona #yellow $decree_sakuya_mark_state$#! en el menú para marcar el $state$ que quieras ajustar. También puedes seleccionar #yellow $decree_sakuya_mark_state$#! bajo #i $concept_political_lens$#! y $mm_issue_decree_interaction$ abajo, para marcar más fácilmente en el mapa. Para marcar un estado extranjero, haz clic derecho en el país objetivo y selecciona #yellow $sakuya_mark_foreign_state$#!.\N#T #N Se recomienda encarecidamente marcar solo un lugar a la vez.#!#!"
SKY_1_1_SP_GUIDE_BTN6_tab4: "Tras seleccionar la categoría de edificio que quieras ajustar en el selector de edificios, el edificio seleccionado actualmente aparecerá en la parte inferior izquierda del menú. Primero selecciona el $state$ objetivo con $decree_sakuya_mark_state$, luego usa el deslizador para ajustar el valor deseado y haz clic en #yellow $SKY_B6_BUILD_ADD_BUILDING$#!. Elegir el nivel #n 0#! eliminará este edificio o potencial de recurso. Que los edificios y potenciales de recurso se añadan con éxito depende de la #N tecnología#! y otras condiciones del jugador o país objetivo.\NLos edificios de las categorías $SKY_B6_BUILD_CAT_RESOURCE$ y $SKY_B6_BUILD_CAT_AGRICULTURE$ también admiten #yellow $SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL$#!."
SKY_1_1_SP_GUIDE_BTN6_tab5: "\NEn esta página, todos los modificadores apuntan a $concept_buildings$, excepto #yellow $SKY_B6_RESERVED_BUILD_R2_C1$#! y #yellow $SKY_B6_RESERVED_BUILD_R2_C2$#!, cuyos modificadores apuntan al $state$. Debes hacer clic en los $concept_buildings$ modificados antes de ver el $concept_modifier$ correspondiente."
SKY_1_1_SP_GUIDE_BTN7: "\NHaz clic derecho en el país que quieras marcar y selecciona #yellow $sakuya_mark_country$#! para marcarlo. También puedes seleccionar #yellow $sakuya_mark_country$#! bajo #i $concept_diplomatic_lens$#! y $concept_diplomatic_actions$ abajo, para marcar más fácilmente en el mapa."
 SKY_1_1_SP_GUIDE_BTN8: "\N\N#yellow $SKY_BTN8_TAB_TECHNOLOGY$#! reúne $concept_technology$modificadores relacionados; utiliza las pestañas de arriba para cambiar entre $production$, $military$, y $society$. La mayoría de los botones siguen las reglas estándar para botones grandes y pequeños, y al hacer clic con el botón derecho se borra el correspondiente $concept_modifier$.\N\Ny #yellow $SKY_BTN8_TAB_CULTURE$#!, haz clic en #yellow $SKY_B8_CULTURE_MARK$#! para abrir $SKY_1_2_CULTURE_INDEX_TITLE$#!. Selecciona un destino $concept_culture$ en el $concept_culture$ selector, y luego utilízalo para $concept_primary_cultures$, $concept_homelands$, y otras funciones culturales."
SKY_1_1_SP_GUIDE_BTN9: "\nPrueba a pasar el cursor sobre el gran título de $CMP$ durante un segundo...?\n@innovation!Distintos fondos muestran distintos contenidos."
SKY_1.1_CLOSE: "Haz clic para cerrar."
