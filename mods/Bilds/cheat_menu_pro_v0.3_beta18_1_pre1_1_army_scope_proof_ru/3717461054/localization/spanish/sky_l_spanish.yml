 SKY_1_2_B7_TT_ACQUIRE_TREATY_PORT_DISABLED: "#BOLD $SKY_B7_ACQUIRE_TREATY_PORT$#!\n$SKY_line$\nPrimero debes seleccionar uno de nuestros estados o un estado extranjero.\n\nConvertir uno de nuestros estados en un país extranjero $concept_treaty_port$: elige uno de nuestros estados, promulga la #T $decree_sakuya_mark_state$#! decreto, y luego utiliza el #T $sakuya_mark_country$#! medidas diplomáticas dirigidas al país en cuestión.\n\nPara obtener un $concept_treaty_port$ desde otro país: haz clic con el botón derecho del ratón en el país de destino y selecciona #T $sakuya_mark_country$#! en «Acciones diplomáticas», y luego selecciona #T $sakuya_mark_foreign_state$#!."
 SKY_1_2_B7_TT_CEDE_HOME_STATE_DISABLED: "#BOLD $SKY_B7_CEDE_HOME_STATE$#!\n$SKY_line$\nSelecciona uno de nuestros estados y promulga la #T $decree_sakuya_mark_state$#! marcarlo; a continuación, utiliza el #T $sakuya_mark_country$#! medidas diplomáticas dirigidas al país en cuestión."
 SKY_1_2_B7_TT_TAKE_FOREIGN_STATE_DISABLED: "#BOLD $SKY_B7_TAKE_FOREIGN_STATE$#!\n$SKY_line$\nDebes seleccionar tanto un país como una región dentro de ese país.\n\nHaz clic con el botón derecho del ratón en el país que quieras marcar y selecciona #T $sakuya_mark_country$#! en «Acciones diplomáticas», y luego selecciona #T $sakuya_mark_foreign_state$#!."
