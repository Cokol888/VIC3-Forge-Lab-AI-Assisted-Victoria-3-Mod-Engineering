 SKY_B8_TT_FAMOUS_CHARACTER: "#BOLD Invocar personaje famoso#!\n\n$SKY_LC$ Se une al país del jugador como agitador\n$SKY_RC$ Se vuelve gobernante del país del jugador\n$SKY_AL$ Se une al país del jugador como general\n$SKY_SL$ Se une al país del jugador como almirante\n$SKY_line$\n#italic La misma figura puede invocarse repetidamente. El rol exacto depende del método de clic.#!"
 SKY_ABOUT_WELCOME_1: "#BOLD ¡Bienvenido!#!\nEncantado de verte. Soy Xier, desarrollador de Victoria 3 Cheat Menu Pro. Es un honor volver a verte en Victoria 3. #BOLD Grupo QQ:#! 734267077. ¡Únete!"
 SKY_ABOUT_WELCOME_2: "#BOLD ¿Qué opinas de este mod?#!\nLo sigo desarrollando continuamente. Comparado con EU5, el motor de Victoria 3 parece similar al de títulos anteriores, pero en realidad es muy distinto. En todo caso, ¡espero que todos se diviertan! Conocerlos me hace muy feliz."
 SKY_UPDATE_LOG_V1_TITLE: "#BOLD Notas de actualización de $SKY_WINDOW_TITLE$ v1.0#!"
 SKY_UPDATE_LOG_V1_TEXT: "- Versión inicial publicada\n- Sistema de barra de navegación portado desde EU5\n- 9 categorías de funciones, cada una con 12 botones reservados\n- La página Acerca de incluye registro, ajustes de personalización e información\n- Admite localización en chino simplificado"
 SKY_SETTINGS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Ajustes de personalización#!"
 SKY_SETTINGS_PLACEHOLDER: "Los ajustes de personalización están en desarrollo. Mantente atento.\nFuturas versiones admitirán personalización de fondo, cambio de tema de interfaz y más."
 SKY_ABOUT_LINKS_TITLE: "#BOLD;COLOR:{0.639,0.581,0.492,1} Contacto#!"
 SKY_ABOUT_TEXT_1: "#BOLD ¡Gracias por usar $SKY_WINDOW_TITLE$!#!\nEncantado de verte. Soy Xier, desarrollador de Pekín y actualmente vivo en Chequia. Si tienes preguntas, contáctame por el grupo QQ o el servidor Discord. Si quieres apoyar a Xier, puedes dar like en Steam Workshop o donar mediante el enlace de patrocinio de arriba.\nEste mod es totalmente gratis. Si lo obtuviste por algún canal de pago, repórtalo de inmediato. ¡Xier te lo agradecerá mucho!"
 SKY_ABOUT_TEXT_2: "#BOLD Notas de compatibilidad#!\n$SKY_WINDOW_TITLE$ ha sido diseñado con cuidado para maximizar la compatibilidad con otros mods. Sin embargo, por limitaciones del motor, necesita modificar un archivo GUI del sistema como compromiso para mostrar la interfaz de $concept_modifier$.\nPara que los mods grandes carguen lo más completos posible, el orden recomendado es: mods grandes primero, luego mods pequeños, luego mods de UI y finalmente $SKY_WINDOW_TITLE$. Como el juego usa los archivos cargados después para sobrescribir los anteriores, poner $SKY_WINDOW_TITLE$ al final asegura que sus cambios de UI sobrescriban otros mods de UI.\nSi encuentras problemas al usarlo, contáctame por el grupo QQ o Discord. Haré lo posible por ayudar."
