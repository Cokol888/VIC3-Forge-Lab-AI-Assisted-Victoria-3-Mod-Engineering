 SKY_B3_CHAR_TT_FX_TRANSFER: "#BOLD Transferir#!\n\n$SKY_LC$ Transferir a nuestro país y fijar como agitador\n$SKY_RC$ Transferir al país marcado y fijar como agitador\n$SKY_CL$ Transferir a nuestro país y fijar como general\n$SKY_line$\n#italic Durante la transferencia, intenta conservar el tipo de $concept_interest_group$ original del $concept_character$ y sincronizarlo con el $concept_interest_group$ correspondiente en el país objetivo, reduciendo la invalidación del $concept_character$.#!\n#lore Si quieres convertirlo luego en gobernante, líder de $concept_interest_group$, etc., se recomienda traer primero al $concept_character$ a nuestro país como agitador y luego usar los botones cercanos de rol y efectos de $concept_character$. Si luego hay demasiados agitadores, también puedes usar el botón cercano para quitar su rol de agitador.#!"
