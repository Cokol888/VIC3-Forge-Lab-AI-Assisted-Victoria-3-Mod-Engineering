 SKY_B3_TT_GOODS_OBSESSION_SELECTED_CULTURE: "#BOLD Obsesión cultural: cultura marcada#!\n$SKY_line$\n#lore Requiere exactamente 1 producto seleccionado y exactamente 1 marcado $concept_culture$.#!\n\n$SKY_LC$ Añade la obsesión por el producto seleccionado al carrito $concept_culture$.\n$SKY_RC$ Elimina la selección del producto marcado $concept_culture$.\N\NDebes marcar una $concept_culture$ primero. #LORE No sé muy bien cómo marcar un $concept_culture$? Abrir #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$, y luego selecciona una cultura en $SKY_1_2_CULTURE_INDEX_TITLE$#!."
 SKY_B3_TT_GOODS_TABOO_SELECTED_CULTURE: "#BOLD Tabú cultural: una cultura marcada#!\n$SKY_line$\n#lore Requiere exactamente 1 producto seleccionado y exactamente 1 marcado $concept_culture$.#!\n\n$SKY_LC$ Añadir un tabú sobre el producto seleccionado a los marcados $concept_culture$.\n$SKY_RC$ Eliminar el tabú sobre el producto seleccionado de la lista marcada $concept_culture$.\N\NDebes marcar una $concept_culture$ primero. #LORE No sé muy bien cómo marcar un $concept_culture$? Abrir #T $SKY_TEST_BTN_8$#! -> $concept_culture$ -> $SKY_B8_CULTURE_MARK$, y luego selecciona una cultura en $SKY_1_2_CULTURE_INDEX_TITLE$#!."
