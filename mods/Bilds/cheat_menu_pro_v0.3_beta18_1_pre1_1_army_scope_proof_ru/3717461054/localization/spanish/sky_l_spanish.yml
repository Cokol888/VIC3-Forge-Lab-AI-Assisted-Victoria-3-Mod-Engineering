 notification_sakuya_superdip_force_join_power_bloc_toast_name: "[SCOPE.sCountry('target').GetName] se ha unido a nuestro Power Bloc"
 notification_sakuya_superdip_force_join_power_bloc_toast_desc: "[SCOPE.sCountry('target').GetRuler.GetFullName] reconoció tras la reunión que la explicación de Sakuya sobre la situación internacional era clara y difícil de rebatir. [SCOPE.sCountry('target').GetName] luego se unió a la $concept_power_bloc$ que [SCOPE.sCountry('actor').GetName] a quien pertenece."
 notification_sakuya_superdip_force_join_power_bloc_toast_tooltip: "#header $notification_sakuya_superdip_force_join_power_bloc_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_force_join_power_bloc_toast_desc$"
 sakuya_superdip.3.t: "Sakuya convenció [SCOPE.sCountry('sakuya_superdip_target_country').GetName]'s [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]"
 sakuya_superdip.3.d: "En una reunión privada, Sakuya convenció [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] reconsiderar las relaciones con [SCOPE.sCountry('sakuya_superdip_actor_country').GetName]."
 sakuya_superdip.3.f: "Al finalizar la reunión, [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] Ya había devuelto la nota severa que había preparado inicialmente al cajón y había pedido que se concertara la próxima reunión. Sakuya se limitó a cerrar el reloj de bolsillo con calma, como si todo fuera como debía ser."
 sakuya_superdip.3.a: "Eso está bien."
