 SKY_B6_BUILD_TT_CAT_URBAN: "#BOLD Urbano#!\n\n$SKY_LC$ Muestra fábricas y otros edificios urbanos ordinarios\n$SKY_RC$ Muestra centros urbanos, edificios especiales, maravillas y monumentos"
 SKY_B6_BUILD_SELECTED_TITLE: "Edificio\nseleccionado"
 SKY_B6_BUILD_SELECTED_NONE: "Nada seleccionado"
 SKY_B6_BUILD_TT_CONFIRM: "#BOLD Colocar edificio#!\n\n$SKY_LC$ Aplica el cambio de nivel de edificio actual a estados marcados del jugador\n$SKY_RC$ Si hay país marcado y ese país tiene estados extranjeros marcados, aplica el cambio de nivel actual a esos estados\n$SKY_line$\n#lore 0 elimina el edificio. Valores positivos añaden niveles. Si el estado objetivo no tiene este edificio, se creará directamente al nivel correspondiente.#!"
 SKY_B6_BUILD_APPLY_SEC: "#T #COLOR:{0.7275,0.6333,0.4529,1} Colocar edificio#!"
 SKY_B6_BUILD_APPLY_RESOURCE_SEC: "#T #COLOR:{0.7275,0.6333,0.4529,1} Colocar edificio y añadir recursos potenciales#!"
 SKY_B6_BUILD_ADD_RESOURCE_POTENTIAL: "Añadir recursos potenciales"
 SKY_B6_BUILD_TT_RESOURCE_POTENTIAL: "#BOLD Añadir recursos potenciales#!\n\n$SKY_LC$ Añade recursos potenciales correspondientes al edificio seleccionado a estados marcados del jugador\n$SKY_RC$ Si hay país marcado y ese país tiene estados extranjeros marcados, aplica a esos estados\n$SKY_line$\n#lore Nivel 0 los elimina. Niveles positivos añaden o elevan el valor actual. Los edificios agrícolas ahora solo admiten añadir y quitar.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1: "#BOLD $concept_throughput$ del edificio seleccionado#!\n\n#lore Primero selecciona un edificio en $SKY_BTN6_SEC$-$SKY_BTN6_TAB3$ y marca al menos 1 $concept_state$.#!\n#lore Si el edificio actual no admite esto, usa el botón genérico de $concept_throughput$ abajo a la derecha.#!\n#lore Admitidos ahora: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Limpia este grupo, incluido el botón + de la derecha\n#lore Puede acumularse con el botón de paso grande a la derecha.#!"
 SKY_B6_TT_RESERVED_BUILD_R1_C1_PLUS: "#BOLD $concept_throughput$ del edificio seleccionado: paso grande#!\n\n#lore Grupo independiente del botón normal izquierdo y puede acumularse. Limpiar el lado izquierdo también limpiará esto.#!\n#lore Admitidos ahora: $SKY_B6_RESERVED_BUILD_SUPPORTED$#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
 SKY_B6_RESERVED_BUILD_R1_C2: "Demanda de entrada del edificio seleccionado"
 SKY_B6_TT_RESERVED_BUILD_R1_C2: "#BOLD Demanda de entrada del edificio seleccionado#!\n\n#lore Se aplica al edificio seleccionado actual en estados marcados del jugador.#!\n#lore Las operaciones positivas reducen la demanda de bienes de entrada del edificio.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Limpia este grupo"
 SKY_B6_RESERVED_BUILD_R1_C3: "Salario mínimo del edificio seleccionado"
 SKY_B6_TT_RESERVED_BUILD_R1_C3: "#BOLD Salario mínimo del edificio seleccionado#!\n\n#lore Se aplica al edificio seleccionado actual en estados marcados del jugador.#!\n#lore Las operaciones positivas reducen el salario objetivo del edificio.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Limpia este grupo"
 SKY_B6_TT_RESERVED_BUILD_R2_C1: "#BOLD Tamaño de empleados del edificio seleccionado#!\n\n#lore Tiene efecto según el tipo de edificio seleccionado y se aplica a estados marcados del jugador.#!\n#lore Las operaciones positivas reducen el tamaño de empleados por defecto.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Limpia este grupo"
 SKY_B6_TT_RESERVED_BUILD_R2_C2: "#BOLD Condiciones laborales del edificio seleccionado#!\n\n#lore Se aplica al edificio correspondiente en estados marcados del jugador.#!\n#lore Las operaciones positivas reducen el modificador de condiciones laborales del edificio.#!\n\n$SKY_LC$ #n -#!20%\n$SKY_SL$ #n -#!20000%\n$SKY_AL$ #n -#!5%\n$SKY_CL$ +20%\n$SKY_line$\n$SKY_RC$ Limpia este grupo"
 SKY_B6_TT_RESERVED_BUILD_R2_C3: "#BOLD $concept_throughput$ genérico del edificio seleccionado#!\n\n#lore Se aplica directamente al edificio seleccionado actual en estados marcados del jugador.#!\n#lore Cuando el $concept_throughput$ exclusivo de arriba a la izquierda no cubra el edificio actual, usa este.#!\n\n$SKY_LC$ +20%\n$SKY_CL$ +10%\n$SKY_SL$ +50%\n$SKY_AL$ +75%\n$SKY_line$\n$SKY_RC$ Limpia este grupo, incluido el botón + de la derecha"
 SKY_B6_TT_RESERVED_BUILD_R2_C3_PLUS: "#BOLD $concept_throughput$ genérico del edificio seleccionado: paso grande#!\n\n#lore Grupo independiente del botón normal izquierdo y puede acumularse. Clic der. en el lado izquierdo también limpiará esto.#!\n\n$SKY_LC$ +100%\n$SKY_SL$ +1000%\n$SKY_CL$ #n -#!20%\n$SKY_AL$ +10000%\n$SKY_RC$ +5%"
