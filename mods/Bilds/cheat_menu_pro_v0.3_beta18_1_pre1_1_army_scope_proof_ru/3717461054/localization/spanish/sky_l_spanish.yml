 SKY_B8_TT_RECOGNIZED: "#BOLD Reconocido#!\n\n$SKY_LC$ Hacer que $SKY_SELF_COUNTRY$ sea un país reconocido\n$SKY_RC$ Hacer que $SKY_SELF_COUNTRY$ sea un país no reconocido\n$SKY_SL$ Hacer que $SKY_MARKED_COUNTRY$ sea un país reconocido\n$SKY_CL$ Hacer que $SKY_MARKED_COUNTRY$ sea un país no reconocido\n$SKY_line$\n#italic Si no hay país marcado, Shift/Ctrl no surtirá efecto.#!"
 SKY_B8_TT_REGENCY: "#BOLD Regencia#!\n\n$SKY_LC$ Añadir regencia a $SKY_SELF_COUNTRY$\n$SKY_RC$ Quitar regencia de $SKY_SELF_COUNTRY$\n$SKY_SL$ Añadir regencia a $SKY_MARKED_COUNTRY$\n$SKY_CL$ Quitar regencia de $SKY_MARKED_COUNTRY$\n$SKY_line$\n#italic Solo se aplica a países con ley monárquica. Si no hay país marcado, Shift/Ctrl no surtirá efecto.#!"
 SKY_B8_TT_COLONIAL: "#BOLD Estado colonial#!\n\n$SKY_LC$ Fijar $SKY_SELF_COUNTRY$ como país colonial\n$SKY_SL$ Fijar $SKY_MARKED_COUNTRY$ como país colonial\n$SKY_line$\n#italic Cambia forzosamente el estado del país. Si no hay país marcado, Shift no surtirá efecto.#!"
 SKY_B8_TT_RETIRE: "#BOLD Retiro forzado#!\n\n$SKY_LC$ Retira de inmediato al $concept_character$ marcado actual.\n$SKY_line$\n#italic Requiere marcar primero un personaje.#!"
 SKY_B8_TT_MARTYR_EXILE: "#BOLD Exilio mártir#!\n\n$SKY_LC$ Exilia al $concept_character$ marcado actual como mártir político.\n$SKY_line$\n#italic El objetivo será exiliado y dejará en casa el impacto de un mártir político. Asegúrate de seleccionar un personaje.#!"
 SKY_B8_TT_DISINHERIT: "#BOLD Desheredar#!\n\n$SKY_LC$ Deshereda al $concept_character$ marcado actual.\n$SKY_line$\n#italic Requiere marcar primero un personaje. Normalmente solo tiene sentido para objetivos con sistema sucesorio.#!"
 SKY_B8_TT_LAWSET_LIBERAL: "#BOLD País liberal#!\n\n$SKY_LC$ Hace que $SKY_SELF_COUNTRY$ adopte todo el conjunto legal liberal\n$SKY_RC$ Hace que $SKY_MARKED_COUNTRY$ adopte todo el conjunto legal liberal\n$SKY_line$\n#italic Esta operación cambia al instante todas las leyes relevantes del país. Si no hay país marcado, clic der. no surtirá efecto.#!"
 SKY_B8_TT_LAWSET_FASCIST: "#BOLD País fascista#!\n\n$SKY_LC$ Cambia $SKY_SELF_COUNTRY$ al conjunto legal fascista completo\n$SKY_RC$ Cambia $SKY_MARKED_COUNTRY$ al conjunto legal fascista completo\n$SKY_line$\n#italic Si no hay país marcado, clic der. no surtirá efecto.#!"
 SKY_B8_TT_LAWSET_GDP: "#BOLD Orientado a PIB#!\n\n$SKY_LC$ Cambia $SKY_SELF_COUNTRY$ al conjunto legal orientado a PIB\n$SKY_RC$ Cambia $SKY_MARKED_COUNTRY$ al conjunto legal orientado a PIB\n$SKY_line$\n#italic Si no hay país marcado, clic der. no surtirá efecto.#!"
 SKY_B8_TT_LAWSET_SOL: "#BOLD Orientado a SoL#!\n\n$SKY_LC$ Cambia $SKY_SELF_COUNTRY$ al conjunto legal orientado a SoL\n$SKY_RC$ Cambia $SKY_MARKED_COUNTRY$ al conjunto legal orientado a SoL\n$SKY_line$\n#italic Si no hay país marcado, clic der. no surtirá efecto.#!"
 SKY_B8_TT_LAWSET_COMMUNIST: "#BOLD Comunismo#!\n\n$SKY_LC$ Cambia $SKY_SELF_COUNTRY$ al conjunto legal comunista completo\n$SKY_RC$ Cambia $SKY_MARKED_COUNTRY$ al conjunto legal comunista completo\n$SKY_line$\n#italic Si no hay país marcado, clic der. no surtirá efecto.#!"
 SKY_B8_TT_LAWSET_SHIT: "#BOLD Distopía#!\n\n$SKY_LC$ Cambia $SKY_SELF_COUNTRY$ al conjunto legal distópico completo\n$SKY_RC$ Cambia $SKY_MARKED_COUNTRY$ al conjunto legal distópico completo\n$SKY_line$\n#italic Arrastra el país a la edad más oscura y quita todos los derechos. Si no hay país marcado, clic der. no surtirá efecto.#!"
 SKY_B8_TT_HOW_DARE_U: "#BOLD HOW DARE U#!\n\n$SKY_LC$ Aplica un modificador militar extremadamente potente a $SKY_SELF_COUNTRY$\n$SKY_AL$ Aplica un modificador militar extremadamente potente a $SKY_MARKED_COUNTRY$\n$SKY_SL$ Aplica la versión negativa a $SKY_SELF_COUNTRY$\n$SKY_CL$ Aplica la versión negativa a $SKY_MARKED_COUNTRY$\n$SKY_RC$ Limpia los modificadores relacionados con este botón\n$SKY_line$\n#italic La versión positiva contiene 3 modificadores de ejército, 3 de armada, 2 de combate y 2 de prestigio. Kill rate es 99999. La versión negativa fija valores militares en -999 y revierte el prestigio a +90%. Si no hay país marcado, Alt/Ctrl no surtirá efecto.#!"
 SKY_B8_TT_DOOMFALL: "#BOLD Caída fatal#!\n\n$SKY_LC$ Planta una bomba económica y revolucionaria en $SKY_MARKED_COUNTRY$ y resta dinero igual al 1000% de su límite de tesorería\n$SKY_AL$ Aplica el mismo efecto a $SKY_SELF_COUNTRY$ y resta dinero igual al 1000% de su límite de tesorería\n$SKY_RC$ Limpia los modificadores relacionados con este botón\n$SKY_line$\n#italic Se centra en radicalismo, revolución, caos y estancamiento. La capacidad de construcción se fija directamente en -99999. Si no hay país marcado, clic izq. no surtirá efecto.#!"
 SKY_B8_TT_SOCIAL_COLLAPSE: "#BOLD Colapso social#!\n\n$SKY_LC$ Lanza $SKY_MARKED_COUNTRY$ a un colapso institucional, demográfico y de orden social\n$SKY_AL$ Aplica el mismo estado a $SKY_SELF_COUNTRY$\n$SKY_RC$ Limpia los modificadores relacionados con este botón\n$SKY_line$\n#italic Se centra en decadencia total de legitimidad, lealistas, migración, agitación y topes de instituciones sociales. El nivel de vida se fija directamente en -19. Si no hay país marcado, clic izq. no surtirá efecto.#!"
