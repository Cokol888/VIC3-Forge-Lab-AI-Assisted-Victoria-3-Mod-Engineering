 SKY_B7_TT_AI_STRATEGY_RESTORE_NATURAL_BORDERS: "#T $ai_strategy_restore_natural_borders$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ busca expandir su territorio central hasta las fronteras naturales del Rin.#!"
 SKY_B7_TT_AI_STRATEGY_PRUSSIA_OF_THE_BALKANS: "#T $ai_strategy_prussia_of_the_balkans$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ intentará reconstruir un imperio búlgaro desde el mar Negro hasta los mares Jónico y Egeo, y crear un ejército mediante tecnología, fuerza y números capaz de defender su independencia, intereses y ambiciones.#!"
 SKY_B7_TT_SPECIAL_CLAUSE_UNLOCK: "#BOLD Interruptor de cláusula de cooperación#!\n$SKY_line$\n$SKY_LC$ Activa $sakuya_b7_special_cooperation_clause$ en la interfaz de negociación. \n$SKY_RC$ Quita esta variable y vuelve a ocultar $sakuya_b7_special_cooperation_clause$\n$SKY_line$\n#lore $sakuya_b7_special_cooperation_clause$ no da efecto real. Solo da a $SKY_TARGET_COUNTRY$ aceptación muy alta, facilitando la firma forzada.#!"
