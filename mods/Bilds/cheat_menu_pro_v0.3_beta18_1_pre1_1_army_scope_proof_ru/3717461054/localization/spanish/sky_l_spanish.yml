 SKY_B7_TT_AI_STRATEGY_UNIFY_CHINA: "#T $ai_strategy_unify_china$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ quiere unir los señores de la guerra chinos bajo su bandera.#!"
 SKY_B7_TT_AI_STRATEGY_SOCIALISM_IN_ONE_COUNTRY: "#T $ai_strategy_socialism_in_one_country$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ quiere desarrollar una economía socialista madura mientras contiene fuerzas capitalistas.#!"
 SKY_B7_TT_AI_STRATEGY_WORLD_REVOLUTION: "#T $ai_strategy_world_revolution$#!\n$SKY_LC$ $SKY_TARGET_COUNTRY$ cambiará su estrategia a la seleccionada.\N\N#lore $SKY_TARGET_COUNTRY$ busca exportar la revolución por el mundo y hacer que otros países se unan a su causa.#!"
