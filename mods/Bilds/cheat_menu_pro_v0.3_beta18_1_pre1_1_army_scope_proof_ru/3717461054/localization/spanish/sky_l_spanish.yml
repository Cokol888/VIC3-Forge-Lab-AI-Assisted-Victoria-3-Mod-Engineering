 sakuya_superdip_humiliate_01: "Deja que Sakuya humille a este país."
 sakuya_superdip_humiliate_01_action_name: "Deja que Sakuya humille a este país."
 sakuya_superdip_humiliate_01_desc: "Enviarás a Sakuya a cenar con el embajador de este país en nombre de nuestros gobernantes."
 sakuya_superdip_humiliation_pact_01: "$humiliation$"
 sakuya_superdip_humiliation_pact_01_action_name: "$humiliation_action_name$"
 sakuya_superdip_humiliation_pact_01_desc: "Sakuya humilla al país destinatario mediante una cena diplomática sumamente inapropiada, dañando así su reputación en la escena internacional. Duración: 5 años."
 sakuya_superdip_humiliation_pact_01_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] es humillado por Sakuya, a quien envió [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]. Duración: 5 años."
 sakuya_superdip_humiliation_pact_01_effect_desc_global: "Establecer el pacto de humillación de Sakuya"
 sakuya_superdip_humiliation_pact_01_effect_desc_first: "[COUNTRY.GetNameNoFlag] hace que Sakuya se avergüence [TARGET_COUNTRY.GetName] durante 5 años"
 sakuya_superdip_humiliation_pact_01_effect_desc_third: "[COUNTRY.GetName] hace que Sakuya se avergüence [TARGET_COUNTRY.GetName] durante 5 años"
 sakuya_superdip.1.t: "Sakuya habla en una cena diplomática."
 sakuya_superdip.1.d: "[SCOPE.sCountry('sakuya_superdip_target_country').GetCapital.GetCityHubName] se ve sumido en el caos cuando Sakuya empieza a pelearse con los funcionarios de [SCOPE.sCountry('sakuya_superdip_target_country').GetName] durante la cena."
 sakuya_superdip.1.f: "[SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName] Intentó lanzarle un banco a Sakuya, pero ella se apartó con agilidad, cogió un trozo de tarta de la mesa y se lo tiró a la cara [SCOPE.sCountry('sakuya_superdip_target_country').GetRuler.GetFullName]la cabeza de... \N\N\"#lore Viejo tonto... ¿Intentabas tenderme una emboscada? #!\""
 sakuya_superdip.1.a: "¡Buena regañina!"
 sakuya_superdip.1.b: "Voy a intervenir con algunas maldiciones..."
 sakuya_superdip.1.c: "Sakuya-sensei, no hagas esto..."
 sakuya_superdip.1.c_desc: "Después de [SCOPE.sCountry('sakuya_superdip_actor_country').GetRuler.GetFullName] Aunque hizo todo lo posible por detenerla, Sakuya Izayoi guardó momentáneamente sus cuchillos de plata y, a continuación, dio un sorbo de vino, con su habitual serenidad."
 notification_sakuya_superdip_humiliation_toast_name: "Sakuya fue humillada con desprecio [SCOPE.sCountry('target').GetName]"
 notification_sakuya_superdip_humiliation_toast_desc: "Sakuya entregó una nota diplomática de notable refinamiento cultural al gobernante de [SCOPE.sCountry('target').GetName], [SCOPE.sCountry('target').GetRuler.GetFullName]. Por alguna razón, la interpretaron como un #BOLD insulto#!. Su vulgaridad nos pareció divertida; ellos parecían bastante disgustados. Las relaciones diplomáticas entre [SCOPE.sCountry('actor').GetName] y [SCOPE.sCountry('target').GetName] parecen haberse deteriorado."
 notification_sakuya_superdip_humiliation_toast_tooltip: "#header $notification_sakuya_superdip_humiliation_toast_name$#!\n$TOOLTIP_DELIMITER$\n$notification_sakuya_superdip_humiliation_toast_desc$"
 sakuya_superdip_insult_01: "Sakuya dice:\NTu madre era un hámster,\N¡Y tu padre huele a bayas de saúco!"
 sakuya_superdip_insult_02: "Sakuya dice:\N¡El día del juicio final está a la vuelta de la esquina!\NLos secuaces de Lucifer deambulan por la tierra—\NOh, no, solo es el representante de tu país."
 sakuya_superdip_insult_03: "Sakuya dice:\N¡Además, creo que hay que acabar con vuestro capital!"
 sakuya_superdip_insult_04: "Sakuya dice:\NCuando las generaciones futuras escriban la historia de nuestra época,\Nte mirarán con esa mezcla de lástima y repugnancia que se llama compasión."
 sakuya_superdip_insult_05: "Sakuya dice:\NMi última visita al baño fue mucho más agradable que la cena con vuestro embajador."
 sakuya_superdip_insult_06: "Sakuya dice:\NOh, mira.\NPor aquí hay cosas muy picantes."
 sakuya_superdip_insult_07: "Sakuya dice:\NTu sangre enriquecerá aún más la tierra que te arranco."
 sakuya_superdip_insult_08: "Sakuya dice:\NLas aburridas reuniones diplomáticas siempre necesitan un pez gato para animarlas.\N¡Y tú, amigo mío, eres el mejor bagre de todos!"
 sakuya_superdip_insult_09: "Sakuya dice:\N¿Por qué las cosas en tu país son siempre tan horribles?\NSospecho que la culpa es de todos vosotros."
 sakuya_superdip_insult_10: "Sakuya dice:\NEn este gran juego al que jugamos,\NNo eres más que un peón."
 sakuya_superdip_insult_11: "Sakuya dice:\NLas historias de tus fechorías se cuentan desde Irlanda hasta Cathay."
 sakuya_superdip_insult_12: "Sakuya dice:\NTu gobernante tiene la capacidad de razonamiento de un plátano maduro,\Npero demuestra ser un auténtico genio en lo que se refiere a hacer sus necesidades en público."
 sakuya_superdip_insult_13: "Sakuya dice:\NQue tu cielo se llene de cometas."
 sakuya_superdip_insult_14: "Sakuya dice:\NNingún mapa puede ser una obra de arte\Nsiempre y cuando tu país figure en la lista."
 sakuya_superdip_insult_15: "Sakuya dice:\NNo entiendo por qué te gusta hacer el tonto en las cenas diplomáticas.\N¿Estás buscando un sentido a tu vida?\N¿o simplemente entretener al público?"
