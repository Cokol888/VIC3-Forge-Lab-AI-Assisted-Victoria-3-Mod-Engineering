 SKY_B5_TT_FX_8: "#BOLD Crear nuevo líder#!\n$SKY_LC$ Genera un nuevo líder $ideology_moderate$ y le entrega directamente el IG seleccionado.\n$SKY_SL$ Genera un nuevo líder $ideology_radical$ y le entrega directamente el IG seleccionado.\n$SKY_AL$ Genera un nuevo líder $ideology_communist$ y le entrega directamente el IG seleccionado.\n$SKY_CL$ Genera un nuevo líder $ideology_market_liberal$ y le entrega directamente el IG seleccionado."
 SKY_B5_TT_FX_9: "#BOLD Destituir líder#!\n$SKY_LC$ Quita al líder titular actual."
